                      </tr>
                      {expandedRow === t.id && (
                        <tr className="bg-gray-900/40">
                          <td colSpan="8" className="px-4 py-4">
                            <div className="space-y-1.5">
                              {allDays.map(d => {
                                const dp = t.progress?.[d.key];
                                const isDone = dp?.completed;
                                const isUnlocked = isDayUnlocked(t, d.key);
                                return (
                                  <div key={d.key} className="flex items-center gap-3 text-xs">
                                    <span className={`w-5 h-5 rounded flex items-center justify-center ${isDone ? 'bg-emerald-500/20 text-emerald-400' : isUnlocked ? 'bg-gray-800 text-gray-300' : 'bg-gray-800/50 text-gray-600'}`}>
                                      {isDone ? <Icon.Check width={11} height={11}/> : isUnlocked ? d.day : <Icon.Lock width={10} height={10}/>}
                                    </span>
                                    <span className="text-gray-400 w-20">{d.monthName}</span>
                                    <span className="text-gray-400 w-16">{d.phaseName}</span>
                                    <span className="text-gray-300 w-16">第{d.day}天</span>
                                    {d.shift && <span className={`px-1.5 py-0.5 rounded text-xs ${getShiftStyle(d.shift).bg} ${getShiftStyle(d.shift).text}`}>{d.shift}</span>}
                                    <span className="text-gray-500 flex-1 truncate">{d.items.map(i => i.content).join(' / ')}</span>
                                    {dp?.completedAt && <span className="text-gray-600">{new Date(dp.completedAt).toLocaleDateString('zh-CN')}</span>}
                                  </div>
                                );
                              })}
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============ Region Manager Dashboard ============
function RegionDashboardView({ trainees, stores, config, workHours, subAreas }) {
  const today = localDateStr(new Date().toISOString());
  const yesterday = yesterdayStr();
  const [filterArea, setFilterArea] = useState('');
  const [showAllIncomplete, setShowAllIncomplete] = useState(false);

  const visibleTrainees = useMemo(() => {
    if (!filterArea) return trainees;
    return trainees.filter(t => (t.area || '000') === filterArea);
  }, [trainees, filterArea]);

  const stats = useMemo(() => {
    const total = visibleTrainees.length;
    const progressList = visibleTrainees.map(t => calcProgress(t));
    const inProgress = progressList.filter(p => p.percent > 0 && p.percent < 100).length;
    const completed = visibleTrainees.filter(t => isCertified(t)).length;
    const notStarted = visibleTrainees.filter(t => !isCertified(t) && calcProgress(t).percent === 0).length;
    const avgProgress = total > 0 ? Math.round(progressList.reduce((s, p) => s + p.percent, 0) / total) : 0;
    let checkedYesterday = 0;
    visibleTrainees.forEach(t => {
      const progress = t.progress || {};
      let hasYesterday = false;
      Object.values(progress).forEach(day => {
        Object.values(day.items || {}).forEach(item => {
          if (item.checked && item.checkedAt && localDateStr(item.checkedAt) === yesterday) hasYesterday = true;
        });
        if (day.completed && day.completedAt && localDateStr(day.completedAt) === yesterday) hasYesterday = true;
      });
      if (hasYesterday) checkedYesterday++;
    });
    return { total, inProgress, completed, notStarted, avgProgress, checkedYesterday, uncheckedYesterday: total - checkedYesterday };
  }, [visibleTrainees, today]);

  const areaStats = useMemo(() => {
    return config.filter(c => c.role === 'area' && (!subAreas || subAreas.includes(c.id))).map(c => {
      const list = trainees.filter(t => (t.area || '000') === c.id);
      const total = list.length;
      const completed = list.filter(t => isCertified(t)).length;
      const inProgress = list.filter(t => !isCertified(t) && calcProgress(t).percent > 0).length;
      const completionRate = total > 0 ? Math.round((completed / total) * 100) : 0;
      return { ...c, total, avg: completionRate, completed, inProgress };
    });
  }, [trainees, config, subAreas]);

  const incompleteList = useMemo(() => {
    return visibleTrainees
      .filter(t => calcProgress(t).percent < 100 && getCurrentDay(t) !== null) // 已完成/已认证人员不显示
      .map(t => ({ ...t, _progress: calcProgress(t), _streak: calcNoCheckInStreak(t, today), _certs: countCerts(t) }))
      .filter(t => t._streak.days > 0) // 排除今日已打卡人员，避免影响分析
      .sort((a, b) => {
        // 优先按连续未打卡天数从大到小排；天数相同再按区域排序
        const daysDiff = b._streak.days - a._streak.days;
        if (daysDiff !== 0) return daysDiff;
        const areaA = a.area || '000';
        const areaB = b.area || '000';
        if (areaA !== areaB) return areaA.localeCompare(areaB, undefined, { numeric: true });
        return a._progress.percent - b._progress.percent;
      });
  }, [visibleTrainees, today]);

  const storeRanking = useMemo(() => {
    const map = {};
    visibleTrainees.forEach(t => { if (t.store) map[t.store] = (map[t.store] || 0) + 1; });
    return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 10);
  }, [visibleTrainees]);

  const phaseDist = useMemo(() => {
    const phases = { '第一阶段': 0, '第二阶段': 0, '第三阶段': 0, '第四阶段': 0, '已完成': 0 };
    visibleTrainees.forEach(t => {
      const prog = calcProgress(t);
      if (prog.percent === 100) { phases['已完成']++; return; }
      const cd = getCurrentDay(t);
      if (cd && phases[cd.phaseName] !== undefined) phases[cd.phaseName]++;
      else phases['已完成']++;
    });
    return Object.entries(phases).filter(([k, v]) => v > 0);
  }, [visibleTrainees]);

  const hourWarnings = useMemo(() => {
    return visibleTrainees
      .map(t => {
        const h = workHours?.[t.empId]?.hours;
        const w = getWorkHoursWarning(t, h);
        return w ? { ...t, _warning: w, _progress: calcProgress(t) } : null;
      })
      .filter(Boolean)
      .sort((a, b) => b._warning.hours - a._warning.hours);
  }, [visibleTrainees, workHours]);


  const yesterdayAndTodayStats = useMemo(() => {
    const yesterdayChecked = [];
    const yesterdayUnchecked = [];
    const todayChecked = [];
    visibleTrainees.forEach(t => {
      const areaCfg = config.find(c => c.id === (t.area || '000'));
      const areaName = areaCfg?.name?.replace('区域带训追踪系统', '') || (t.area || '000');
      let yHas = false; let yLast = ''; let tHas = false; let tLast = '';
      const progress = t.progress || {};
      Object.values(progress).forEach(day => {
        Object.values(day.items || {}).forEach(item => {
          if (item.checked && item.checkedAt) {
            const d = localDateStr(item.checkedAt);
            if (d === yesterday) { yHas = true; if (item.checkedAt > yLast) yLast = item.checkedAt; }
            else if (d === today) { tHas = true; if (item.checkedAt > tLast) tLast = item.checkedAt; }
          }
        });
        // 仅确认完成但没有勾选项的不算打卡，因此 completedAt 不再作为打卡依据
      });
      const baseEntry = { ...t, areaName };
      if (yHas) yesterdayChecked.push({ ...baseEntry, lastTime: yLast });
      else {
        // 已完成全部带训的人员不再出现在未打卡列表中
        if (getCurrentDay(t) === null) return;
        const streak = calcNoCheckInStreak(t, today);
        yesterdayUnchecked.push({ ...baseEntry, streakDays: streak.days, streakLabel: streak.label });
      }
      if (tHas) todayChecked.push({ ...baseEntry, lastTime: tLast });
    });
    yesterdayChecked.sort((a, b) => (b.lastTime || '').localeCompare(a.lastTime || ''));
    yesterdayUnchecked.sort((a, b) => b.streakDays - a.streakDays);
    todayChecked.sort((a, b) => (b.lastTime || '').localeCompare(a.lastTime || ''));
    return { yesterdayChecked, yesterdayUnchecked, todayChecked };
  }, [visibleTrainees, yesterday, today, config]);

  const certRanking = useMemo(() => {
    return visibleTrainees
      .map(t => ({ ...t, _certs: countCerts(t), _progress: calcProgress(t) }))
      .sort((a, b) => b._certs - a._certs)
      .slice(0, 10);
  }, [visibleTrainees]);

  const conclusion = useMemo(() => {
    if (areaStats.length === 0) return '暂无区域数据';
    const activeAreas = areaStats.filter(a => a.total > 0);
    if (activeAreas.length === 0) return '暂无学员数据';
    const lowestArea = [...activeAreas].sort((a, b) => a.avg - b.avg)[0];
    const worstStreak = yesterdayAndTodayStats.yesterdayUnchecked[0];
    const parts = [];
    parts.push(`当前共 ${stats.total} 名学员，平均进度 ${stats.avgProgress}%。`);
    if (lowestArea) parts.push(`${lowestArea.name.replace('区域带训追踪系统', '')}平均进度最低（${lowestArea.avg}%），需重点关注。`);
    if (worstStreak) parts.push(`昨日有 ${yesterdayAndTodayStats.yesterdayUnchecked.length} 人未打卡，${worstStreak.name}已连续${worstStreak.streakDays}天未打卡。`);
    return parts.join('');
  }, [stats, areaStats, yesterdayAndTodayStats]);

  const StatCard = ({ label, value, sub, color = 'indigo' }) => {
    const colorClass = {
      white: 'text-white',
      emerald: 'text-emerald-400',
      amber: 'text-amber-400',
      gray: 'text-gray-400',
      indigo: 'text-indigo-400',
      sky: 'text-sky-400'
    }[color] || 'text-indigo-400';
    return (
      <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
        <p className="text-xs text-gray-500 mb-1">{label}</p>
        <p className={`text-2xl font-bold ${colorClass}`}>{value}</p>
        {sub && <p className="text-xs text-gray-600 mt-1">{sub}</p>}
      </div>
    );
  };

  return (
    <div className="p-5 space-y-5 overflow-y-auto h-[calc(100vh-60px)]">
      {/* Filter + Conclusion */}
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-gray-900/50 border border-gray-800 rounded-xl p-4">
        <div>
          <h2 className="text-base font-bold text-white">大区汇总看板</h2>
          <p className="text-xs text-gray-500 mt-1">{conclusion}</p>
        </div>
        <div className="flex items-center gap-2">
          <span className="text-xs text-gray-500">数据范围</span>
          <select value={filterArea} onChange={e => setFilterArea(e.target.value)} className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-300">
            <option value="">全部区域</option>
            {config.filter(c => c.role === 'area' && (!subAreas || subAreas.includes(c.id))).map(c => <option key={c.id} value={c.id}>{c.name.replace('区域带训追踪系统', '')}</option>)}
          </select>
        </div>
      </div>

      {/* Top Stats */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <StatCard label="学员总数" value={stats.total} color="white"/>
        <StatCard label="昨日已打卡" value={stats.checkedYesterday} sub={`未打卡 ${stats.uncheckedYesterday}`} color="emerald"/>
        <StatCard label="带训中" value={stats.inProgress} color="amber"/>
        <StatCard label="已完成" value={stats.completed} color="emerald"/>
        <StatCard label="未开始" value={stats.notStarted} color="gray"/>
        <StatCard label="平均进度" value={`${stats.avgProgress}%`} color="indigo"/>
        <StatCard label="覆盖区域" value={areaStats.filter(a => a.total > 0).length} sub={`共 ${areaStats.length} 个区域`} color="sky"/>
      </div>

      {/* 工时预警 */}
      <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
        <h3 className="text-sm font-medium text-gray-300 mb-3 flex items-center gap-2"><Icon.Clock/> 工时预警</h3>
        {hourWarnings.length === 0 ? (
          <p className="text-sm text-gray-500 text-center py-4">暂无工时预警</p>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs text-gray-500 border-b border-gray-800">
                  <th className="text-left px-3 py-2 font-medium">区域</th>
                  <th className="text-left px-3 py-2 font-medium">学员</th>
                  <th className="text-left px-3 py-2 font-medium">门店</th>
                  <th className="text-left px-3 py-2 font-medium">用工类型</th>
                  <th className="text-left px-3 py-2 font-medium">当前工时 / 上限</th>
                  <th className="text-left px-3 py-2 font-medium">带训进度</th>
                </tr>
              </thead>
              <tbody>
                {hourWarnings.map(t => {
                  const areaCfg = config.find(c => c.id === (t.area || '000'));
                  return (
                    <tr key={t.id} className="border-b border-yellow-500/10 bg-yellow-500/5">
                      <td className="px-3 py-2 text-xs text-gray-400">{areaCfg?.name?.replace('区域带训追踪系统', '') || t.area || '000'}</td>
                      <td className="px-3 py-2 text-white font-medium">{t.name}</td>
                      <td className="px-3 py-2 text-xs text-gray-400">{t.store}</td>
                      <td className="px-3 py-2 text-xs text-yellow-300">{t._warning.isPartTime ? '兼职' : '全职'}</td>
                      <td className="px-3 py-2 text-xs text-yellow-300 tabular-nums">{t._warning.hours} / {t._warning.limit}h</td>
                      <td className="px-3 py-2 text-xs text-gray-400">{t._progress.percent}%</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        {/* Area Progress */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
          <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2"><Icon.TrendUp/> 各小区进度对比</h3>
          <div className="space-y-3">
            {areaStats.filter(a => a.total > 0).length === 0 ? (
              <p className="text-sm text-gray-500 text-center py-4">暂无区域数据</p>
            ) : areaStats.filter(a => a.total > 0).map(a => (
              <div key={a.id} className="flex items-center gap-3">
                <span className="text-xs text-gray-400 w-24 truncate" title={a.name}>{a.name.replace('区域带训追踪系统', '')}</span>
                <div className="flex-1 h-6 bg-gray-800 rounded-md overflow-hidden relative">
                  <div className="h-full bg-indigo-500 progress-bar-fill rounded-md flex items-center justify-end pr-2" style={{width: `${Math.max(a.avg, 5)}%`}}>
                    <span className="text-xs font-bold text-white">{a.avg}%</span>
                  </div>
                </div>
                <span className="text-xs text-gray-500 w-16 text-right">{a.completed}/{a.total}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Phase Distribution */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
          <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2"><Icon.Dashboard/> 带训阶段分布</h3>
          <div className="space-y-3">
            {phaseDist.length === 0 ? (
              <p className="text-sm text-gray-500 text-center py-4">暂无数据</p>
            ) : phaseDist.map(([phase, count]) => {
              const max = Math.max(...phaseDist.map(p => p[1]));
              const width = (count / max) * 100;
              const colors = { '第一阶段': 'bg-blue-500', '第二阶段': 'bg-purple-500', '第三阶段': 'bg-amber-500', '第四阶段': 'bg-red-500', '已完成': 'bg-emerald-500' };
              return (
                <div key={phase} className="flex items-center gap-3">
                  <span className="text-xs text-gray-400 w-16 text-right">{phase}</span>
                  <div className="flex-1 h-6 bg-gray-800 rounded-md overflow-hidden relative">
                    <div className={`h-full ${colors[phase] || 'bg-gray-500'} progress-bar-fill rounded-md flex items-center justify-end pr-2`} style={{width: `${Math.max(width, 8)}%`}}>
                      <span className="text-xs font-bold text-white">{count}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Incomplete List */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 lg:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-sm font-medium text-gray-300 flex items-center gap-2"><Icon.User/> 未完成人员汇总</h3>
            <button onClick={() => setShowAllIncomplete(!showAllIncomplete)} className="text-xs text-indigo-400 hover:text-indigo-300">
              {showAllIncomplete ? '收起' : `展开全部 (${incompleteList.length})`}
            </button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs text-gray-500 border-b border-gray-800">
                  <th className="text-left px-3 py-2 font-medium">区域</th>
                  <th className="text-left px-3 py-2 font-medium">学员</th>
                  <th className="text-left px-3 py-2 font-medium">门店</th>
                  <th className="text-left px-3 py-2 font-medium">雇佣性质</th>
                  <th className="text-left px-3 py-2 font-medium">当前阶段</th>
                  <th className="text-left px-3 py-2 font-medium">进度</th>
                  <th className="text-left px-3 py-2 font-medium">工时</th>
                  <th className="text-left px-3 py-2 font-medium">证书数</th>
                  <th className="text-left px-3 py-2 font-medium">未打卡</th>
                  <th className="text-left px-3 py-2 font-medium">备注</th>
                </tr>
              </thead>
              <tbody>
                {(showAllIncomplete ? incompleteList : incompleteList.slice(0, 10)).map(t => {
                  const areaCfg = config.find(c => c.id === (t.area || '000'));
                  const cd = getCurrentDay(t);
                  return (
                    <tr key={t.id} className="border-b border-gray-800/50">
                      <td className="px-3 py-2 text-xs text-gray-400">{areaCfg?.name?.replace('区域带训追踪系统', '') || t.area || '000'}</td>
                      <td className="px-3 py-2 text-white font-medium">{t.name}</td>
                      <td className="px-3 py-2 text-xs text-gray-400">{t.store}</td>
                      <td className="px-3 py-2 text-xs text-gray-300">{isPartTime(t) ? '兼职' : '全职'}</td>
                      <td className="px-3 py-2 text-xs text-gray-400">{cd ? `${cd.monthName} · ${cd.phaseName}` : '已完成'}</td>
                      <td className="px-3 py-2">
                        <div className="flex items-center gap-2">
                          <div className="w-20 h-1.5 bg-gray-800 rounded-full overflow-hidden">
                            <div className={`h-full progress-bar-fill rounded-full ${t._progress.percent < 30 ? 'bg-red-500' : 'bg-indigo-500'}`} style={{width: `${t._progress.percent}%`}}></div>
                          </div>
                          <span className={`text-xs ${t._progress.percent < 30 ? 'text-red-400' : 'text-gray-400'}`}>{t._progress.percent}%</span>
                        </div>
                      </td>
                      <td className="px-3 py-2 text-xs text-gray-400 tabular-nums">{t.empId && workHours?.[t.empId] != null ? `${workHours[t.empId].hours}h` : '—'}</td>
                      <td className="px-3 py-2 text-xs text-amber-300/80 tabular-nums">{t._certs || 0}</td>
                      <td className="px-3 py-2"><span className="text-xs px-1.5 py-0.5 rounded bg-rose-500/15 text-rose-400">{t._streak.label}</span></td>
                      <td className="px-3 py-2 text-xs text-amber-300/80 max-w-[180px] truncate" title={t.note || ''}>{t.note || '—'}</td>
                    </tr>
                  );
                })}
                {incompleteList.length === 0 && <tr><td colSpan="10" className="text-center text-gray-500 py-6">暂无数据</td></tr>}
              </tbody>
            </table>
          </div>
        </div>

        {/* Store Ranking */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 lg:col-span-2">
          <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2"><Icon.Store/> 门店学员分布 TOP10</h3>
          <div className="space-y-3">
            {storeRanking.length === 0 ? (
              <p className="text-sm text-gray-500 text-center py-4">暂无数据</p>
            ) : storeRanking.map(([store, count], idx) => {
              const max = storeRanking[0][1];
              const width = (count / max) * 100;
              return (
                <div key={store} className="flex items-center gap-3">
                  <span className="text-xs text-gray-500 w-5">{idx + 1}</span>
                  <span className="text-xs text-gray-400 w-28 truncate" title={store}>{store}</span>
                  <div className="flex-1 h-5 bg-gray-800 rounded-md overflow-hidden relative">
                    <div className="h-full bg-sky-500 progress-bar-fill rounded-md flex items-center justify-end pr-2" style={{width: `${Math.max(width, 5)}%`}}>
                      <span className="text-xs font-bold text-white">{count}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Row 1: 昨日已打卡 | 今日已打卡 | 昨日未打卡 */}
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:col-span-2">
        {/* Yesterday's Check-in */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
          <h3 className="text-sm font-medium text-gray-300 mb-3 flex items-center gap-2"><Icon.Calendar/> 昨日已打卡 ({yesterdayAndTodayStats.yesterdayChecked.length})</h3>
          <div className="max-h-64 overflow-y-auto pr-1">
            {yesterdayAndTodayStats.yesterdayChecked.length === 0 ? (
              <p className="text-sm text-gray-500 text-center py-4">昨日暂无人打卡</p>
            ) : (
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-xs text-gray-500 border-b border-gray-800">
                    <th className="text-left px-2 py-1.5 font-medium">学员/门店/区域</th>
                    <th className="text-left px-2 py-1.5 font-medium w-16">工时</th>
                    <th className="text-left px-2 py-1.5 font-medium w-14">证书</th>
                    <th className="text-left px-2 py-1.5 font-medium w-20">时间</th>
                  </tr>
                </thead>
                <tbody>
                  {yesterdayAndTodayStats.yesterdayChecked.map(t => (
                    <tr key={t.id} className="border-b border-gray-800/50">
                      <td className="px-2 py-2">
                        <div className="flex items-center gap-2 min-w-0">
                          <span className="text-sm text-gray-300 font-medium">{t.name}</span>
                          <span className="text-xs text-gray-600 truncate">{t.store}</span>
                          <span className="text-xs text-indigo-400/80">{t.areaName}</span>
                        </div>
                      </td>

function WorkHoursImportModal({ trainees, onClose, onImported }) {
  const [parseResult, setParseResult] = useState(null); // {rows, matched, unmatched, invalid, total}
  const [importing, setImporting] = useState(false);
  const [importDone, setImportDone] = useState(false);
  const [errMsg, setErrMsg] = useState('');
  const [fileName, setFileName] = useState('');

  const downloadTemplate = () => {
    const ws = XLSX.utils.aoa_to_sheet([
      ['姓名', '工号', '工时'],
      ['张三（示例，可删）', '10086', 120],
      ['李四（示例，可删）', '10087', 96.5]
    ]);
    ws['!cols'] = [{ wch: 22 }, { wch: 14 }, { wch: 10 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '工时表');
    XLSX.writeFile(wb, '工时导入模板.xlsx');
  };

  const normKey = (k) => String(k || '').replace(/[\s:：()（）]/g, '');

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setErrMsg(''); setImportDone(false); setParseResult(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { defval: '' });

        // 找到工号/工时列（兼容"员工工号""累计工时(h)"等表头写法）
        let idKey = null, nameKey = null, hoursKey = null;
        if (json.length > 0) {
          for (const k of Object.keys(json[0])) {
            const nk = normKey(k);
            if (!idKey && /工号|员工号|empid/i.test(nk)) idKey = k;
            else if (!hoursKey && /工时/.test(nk)) hoursKey = k;
            else if (!nameKey && /姓名|名字/.test(nk)) nameKey = k;
          }
        }
        if (!idKey || !hoursKey) {
          setErrMsg('表格里找不到「工号」和「工时」列，请按模板格式填写（表头必须是：姓名、工号、工时）');
          return;
        }

        // 学员工号索引（去重：同工号多行取最后一行）
        const byEmp = new Map(trainees.filter(t => (t.empId || '').trim()).map(t => [String(t.empId).trim(), t]));
        const rowsMap = new Map(); // emp_id -> row
        const unmatched = [], invalid = [];
        for (const r of json) {
          const empId = String(r[idKey] ?? '').trim();
          const nameRaw = nameKey ? String(r[nameKey] ?? '').trim() : '';
          const hoursRaw = String(r[hoursKey] ?? '').trim();
          if (!empId && !hoursRaw) continue; // 空行跳过
          const hours = parseFloat(hoursRaw);
          if (!empId) { invalid.push({ empId: '(空)', name: nameRaw, hours: hoursRaw, reason: '工号为空' }); continue; }
          if (isNaN(hours) || hours < 0) { invalid.push({ empId, name: nameRaw, hours: hoursRaw, reason: '工时不是有效数字' }); continue; }
          if (!byEmp.has(empId)) { unmatched.push({ empId, name: nameRaw, hours: hoursRaw }); continue; }
          rowsMap.set(empId, { emp_id: empId, hours, name: byEmp.get(empId).name, updated_at: Date.now() });
        }
        setFileName(file.name);
        setParseResult({
          rows: [...rowsMap.values()],
          matched: rowsMap.size,
          unmatched, invalid,
          total: rowsMap.size + unmatched.length + invalid.length
        });
      } catch (err) {
        setErrMsg('文件解析失败：' + (err.message || '请确认是 .xlsx / .xls / .csv 文件'));
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  const doImport = async () => {
    if (!parseResult || parseResult.rows.length === 0) return;
    setImporting(true); setErrMsg('');
    try {
      await sbUpsertWorkHours(parseResult.rows.map(({ name, ...r }) => r));
      setImportDone(true);
      if (onImported) onImported();
    } catch (err) {
      setErrMsg('导入失败：' + (err.message || '请检查网络后重试'));
    } finally {
      setImporting(false);
    }
  };

  return (
    <Modal open={true} onClose={onClose} title="导入工时数据">
      <div className="space-y-4">
        {/* 步骤说明 */}
        <div className="bg-gray-800/50 border border-gray-700 rounded-lg p-3 text-xs text-gray-400 leading-relaxed">
          <p><span className="text-indigo-300 font-medium">①</span> 下载模板，按格式填写（或用你自己的表，表头含 <span className="text-white">姓名、工号、工时</span> 即可，姓名列仅作核对）</p>
          <p className="mt-1"><span className="text-indigo-300 font-medium">②</span> 上传表格，系统按工号自动匹配学员</p>
          <p className="mt-1"><span className="text-indigo-300 font-medium">③</span> 确认无误后导入，工时为<span className="text-white">覆盖更新</span>，导入后全员可见</p>
        </div>

        {/* 操作区 */}
        <div className="flex gap-3">
          <button onClick={downloadTemplate}
            className="flex items-center gap-2 px-4 py-2.5 rounded-lg border border-gray-600 text-gray-300 hover:text-white hover:border-gray-400 text-sm font-medium transition">
            <Icon.Download width={15} height={15}/> 下载模板
          </button>
          <label className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition cursor-pointer">
            <Icon.Upload width={15} height={15}/> 选择工时表格
            <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} className="hidden"/>
          </label>
        </div>

        {errMsg && (
          <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300">{errMsg}</div>
        )}

        {/* 解析结果 */}
        {parseResult && !importDone && (
          <div className="border border-gray-700 rounded-lg overflow-hidden">
            <div className="bg-gray-800/70 px-4 py-2.5 text-xs text-gray-400 flex items-center justify-between">
              <span className="truncate">📄 {fileName}</span>
              <span>共识别 {parseResult.total} 行</span>
            </div>
            <div className="p-4 space-y-3 text-sm">
              <div className="flex items-center gap-4">
                <span className="text-emerald-300">✓ 可导入：{parseResult.matched} 人</span>
                {parseResult.unmatched.length > 0 && <span className="text-amber-300">⚠ 未匹配：{parseResult.unmatched.length} 人</span>}
                {parseResult.invalid.length > 0 && <span className="text-red-300">✗ 格式错误：{parseResult.invalid.length} 行</span>}
              </div>

              {parseResult.unmatched.length > 0 && (
                <div className="bg-amber-500/5 border border-amber-500/20 rounded-lg p-3">
                  <p className="text-xs text-amber-300 font-medium mb-2">以下工号在系统里没找到对应学员（已跳过）：</p>
                  <div className="max-h-32 overflow-y-auto scrollbar-thin text-xs text-gray-400 space-y-1">
                    {parseResult.unmatched.map((u, i) => (
                      <div key={i} className="flex justify-between">
                        <span>工号 {u.empId} {u.name && <span className="text-gray-600">（{u.name}）</span>}</span>
                        <span>工时 {u.hours}</span>
                      </div>
                    ))}
                  </div>
                  <p className="text-[11px] text-gray-500 mt-2">提示：可能是工号填错，或该学员档案里没录工号</p>
                </div>
              )}

              {parseResult.invalid.length > 0 && (
                <div className="bg-red-500/5 border border-red-500/20 rounded-lg p-3">
                  <p className="text-xs text-red-300 font-medium mb-2">以下行格式有误（已跳过）：</p>
                  <div className="max-h-24 overflow-y-auto scrollbar-thin text-xs text-gray-400 space-y-1">
                    {parseResult.invalid.map((u, i) => (
                      <div key={i}>工号 {u.empId} — {u.reason}</div>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex justify-end gap-3 pt-1">
                <button onClick={onClose} className="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 text-sm transition">取消</button>
                <button onClick={doImport} disabled={importing || parseResult.matched === 0}
                  className="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium transition">
                  {importing ? '导入中...' : `确认导入 ${parseResult.matched} 人的工时`}
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 导入成功 */}
        {importDone && (
          <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-lg p-4 text-center">
            <p className="text-emerald-300 font-medium">🎉 导入成功！已更新 {parseResult.matched} 名学员的工时</p>
            <p className="text-xs text-gray-400 mt-1">各门店登录后即可看到最新工时数据</p>
            <button onClick={onClose} className="mt-3 px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium transition">完成</button>
          </div>
        )}
      </div>
    </Modal>
  );
}

function SyncModal({ data, syncStatus, lastSyncTime, setLastSyncTime, onClose, onImport, isRemoteUpdate }) {
  const [status, setStatus] = useState({ type: '', msg: '' });
  const [busy, setBusy] = useState(false);
  const fileInputRef = useRef(null);

  const showStatus = (type, msg) => {
    setStatus({ type, msg });
    setTimeout(() => setStatus({ type: '', msg: '' }), 3000);
  };

  // Export to file (backup)
  const handleExport = () => {
    try {
      const jsonStr = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const date = new Date().toISOString().slice(0, 10);
      a.download = `带训数据_${date}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showStatus('success', '数据已导出为文件');
    } catch(e) {
      showStatus('error', '导出失败：' + e.message);
    }
  };

  // Import from file (backup)
  const handleFileImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setBusy(true);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.trainees || !Array.isArray(parsed.trainees)) {
          showStatus('error', '文件格式不正确');
          setBusy(false);
          return;
        }
        onImport(parsed);
        showStatus('success', `导入成功！已导入 ${parsed.trainees.length} 名学员数据`);
      } catch(err) {
        showStatus('error', '文件解析失败：' + err.message);
      }
      setBusy(false);
      e.target.value = '';
    };
    reader.onerror = () => {
      showStatus('error', '文件读取失败');
      setBusy(false);
    };
    reader.readAsText(file);
  };

  // Force push to cloud
  const handleForceSync = async () => {
    setBusy(true);
    try {
      const ts = Date.now();
      const ok = await sbForcePush(data, ts);
      if (ok) {
        showStatus('success', '数据已推送到云端');
        setLastSyncTime(ts);
      } else {
        showStatus('error', _lastPushErrorMsg || '推送失败，请稍后重试');
      }
    } catch(e) {
      showStatus('error', '推送失败：' + e.message);
    }
    setBusy(false);
  };

  // Force pull from cloud
  const handleForcePull = async () => {
    setBusy(true);
    try {
      const remote = await sbFetchAll();
      if (remote && remote.trainees && remote.trainees.length > 0) {
        isRemoteUpdate.current = true;
        setData(prevData => {
          const mergedResult = mergeTrainees(prevData.trainees, remote.trainees, prevData._deletedIds || [], []);
          const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: Date.now() });
          saveData(newData);
          return newData;
        });
        showStatus('success', `已从云端拉取 ${remote.trainees.length} 名学员数据`);
      } else {
        showStatus('success', '当前已是最新数据，无需更新');
      }
      setLastSyncTime(Date.now());
    } catch(e) {
      showStatus('error', '拉取失败：' + e.message);
    }
    setBusy(false);
  };

  const statusConfig = {
    connected: { color: 'bg-emerald-400', text: '已连接', textColor: 'text-emerald-300', bgColor: 'bg-emerald-500/10', borderColor: 'border-emerald-500/20' },
    connecting: { color: 'bg-amber-400', text: '连接中...', textColor: 'text-amber-300', bgColor: 'bg-amber-500/10', borderColor: 'border-amber-500/20' },
    error: { color: 'bg-red-400', text: '连接失败', textColor: 'text-red-300', bgColor: 'bg-red-500/10', borderColor: 'border-red-500/20' },
  };
  const sc = statusConfig[syncStatus] || statusConfig.connecting;

  const lastSyncText = lastSyncTime
    ? new Date(lastSyncTime).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    : '等待同步...';

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className="bg-gray-900 border border-gray-700 rounded-2xl w-[480px] max-w-[92vw] max-h-[88vh] overflow-y-auto scrollbar-thin shadow-2xl fade-in">
        {/* Header */}
        <div className="flex items-center justify-between px-5 py-4 border-b border-gray-800">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl bg-indigo-500/15 flex items-center justify-center">
              <Icon.Cloud width={18} height={18} className="text-indigo-400"/>
            </div>
            <div>
              <h3 className="text-base font-bold text-white">实时数据同步</h3>
              <p className="text-xs text-gray-500">所有打开此网页的用户自动同步</p>
            </div>
          </div>
          <button onClick={onClose} className="text-gray-500 hover:text-white transition p-1">
            <Icon.Close width={18} height={18}/>
          </button>
        </div>

        {/* Status */}
        {status.msg && (
          <div className={`mx-5 mt-3 px-4 py-2.5 rounded-lg text-sm flex items-center gap-2 ${
            status.type === 'success' ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-red-500/10 text-red-300 border border-red-500/20'
          }`}>
            {status.type === 'success' ? <Icon.Check width={14} height={14}/> : <Icon.Close width={14} height={14}/>}
            {status.msg}
          </div>
        )}

        <div className="p-5 space-y-5">
          {/* Sync Status Card */}
          <div className={`rounded-xl p-4 border ${sc.bgColor} ${sc.borderColor}`}>
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2.5">
                <span className={`w-3 h-3 rounded-full ${sc.color} ${syncStatus === 'connecting' ? 'animate-pulse' : ''}`}></span>
                <span className={`text-sm font-medium ${sc.textColor}`}>{sc.text}</span>
              </div>
              <span className="text-xs text-gray-500">{data.trainees.length} 名学员</span>
            </div>
            <div className="text-xs text-gray-500">
              上次同步：{lastSyncText}
            </div>
          </div>

          {/* Feature List */}
          <div className="space-y-2.5">
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>店长打勾后，数据<span className="text-emerald-300">自动上传</span>到云端</span>
            </div>
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>老大这边<span className="text-emerald-300">自动刷新</span>看到最新数据</span>
            </div>
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>无需手动操作，打开网页即<span className="text-emerald-300">自动同步</span></span>
            </div>
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>每个学员数据<span className="text-emerald-300">独立合并</span>，不会互相覆盖</span>
            </div>
          </div>

          {/* Force Sync Buttons */}
          <div className="flex gap-2">
            <button
              onClick={handleForcePull}
              disabled={busy}
              className="flex-1 py-2.5 rounded-lg text-sm font-medium text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 disabled:opacity-50 transition flex items-center justify-center gap-2"
            >
              <Icon.Download width={14} height={14}/> 从云端拉取
            </button>
            <button
              onClick={handleForceSync}
              disabled={busy || syncStatus !== 'connected'}
              className="flex-1 py-2.5 rounded-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 transition flex items-center justify-center gap-2"
            >
              <Icon.RefreshCw width={14} height={14}/> 推送到云端
            </button>
          </div>

          {/* Divider */}
          <div className="border-t border-gray-800"></div>

          {/* File Backup */}
          <div>
            <div className="flex items-center gap-2 mb-2">
              <Icon.Download width={14} height={14} className="text-amber-400"/>
              <h4 className="text-sm font-semibold text-white">文件备份</h4>
            </div>
            <p className="text-xs text-gray-500 mb-3">导出数据文件作为备份，或从备份恢复</p>
            <div className="flex gap-2">
              <button
                onClick={handleExport}
                className="flex-1 py-2.5 rounded-lg text-xs font-medium text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 transition flex items-center justify-center gap-1.5"
              >
                <Icon.Download width={12} height={12}/> 导出备份
              </button>
              <button
                onClick={() => fileInputRef.current?.click()}
                disabled={busy}
                className="flex-1 py-2.5 rounded-lg text-xs font-medium text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 transition flex items-center justify-center gap-1.5"
              >
                <Icon.Upload width={12} height={12}/> 导入恢复
              </button>
              <input
                ref={fileInputRef}
                type="file"
                accept=".json,application/json"
                onChange={handleFileImport}
                className="hidden"
              />
            </div>
          </div>

          {/* Info */}
          <div className="bg-gray-800/50 rounded-lg p-3 text-xs text-gray-500 leading-relaxed">
            <p className="text-gray-400 font-medium mb-1">使用说明</p>
            <p>1. 所有打开此网页的用户自动进入同一个同步房间</p>
            <p>2. 任何人修改数据后，自动推送云端，其他人2秒内收到</p>
            <p>3. 推送前自动合并云端数据，不会覆盖别人的修改</p>
            <p>4. 如果同步不及时，点击「从云端拉取」手动刷新</p>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============ Login Screen ============
function LoginScreen({ onLogin }) {
  const [account, setAccount] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const pwdRef = useRef(null);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    const cfg = AREA_MAP[account.trim()];
    if (!cfg) {
      setError('账号或密码错误');
      setPassword('');
      pwdRef.current && pwdRef.current.focus();
      return;
    }
    setLoading(true);
    try {
      // Supabase Auth: sign in with the account's bound email
      const { error } = await supabase.auth.signInWithPassword({
        email: `${cfg.id}@dxtrain.local`,
        password
      });
      if (error) throw error;
      onLogin({ id: cfg.id, name: cfg.name, role: cfg.role });
    } catch(e) {
      console.warn('[Auth] Login error:', e.message);
      setError('账号或密码错误');
      setPassword('');
      pwdRef.current && pwdRef.current.focus();
    }
    setLoading(false);
  };

  return (
    <div className="min-h-screen bg-gray-950 flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl fade-in">
        <div className="flex items-center gap-3 mb-6">
          <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center">
            <Icon.Award width={24} height={24} className="text-white"/>
          </div>
          <div>
            <h1 className="text-lg font-bold text-white">带训追踪系统</h1>
            <p className="text-xs text-gray-500">请输入账号密码登录</p>
          </div>
        </div>
        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">账号</label>
            <input
              type="text"
              value={account}
              onChange={e => setAccount(e.target.value)}
              placeholder="如 000"
              autoFocus
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500"
            />
          </div>
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">密码</label>
            <input
              ref={pwdRef}
              type="password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              placeholder="请输入密码"
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500"
            />
          </div>
          {error && <p className="text-xs text-red-400">{error}</p>}
          <button
            type="submit"
            disabled={loading || !account.trim() || !password}
            className={`w-full py-2.5 rounded-lg text-sm font-medium text-white transition ${loading || !account.trim() || !password ? 'bg-indigo-600/50 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500'}`}
          >
            {loading ? '登录中...' : '登录'}
          </button>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(loadData);
  const [currentUser, setCurrentUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('training_tracker_user') || 'null'); }
    catch(e) { return null; }
  });
  const [view, setView] = useState('tracker');
  const [selectedId, setSelectedId] = useState(null);
  const [dashboardUnlocked, setDashboardUnlocked] = useState(false);
  const [showPwdModal, setShowPwdModal] = useState(false);
  const [showSyncModal, setShowSyncModal] = useState(false);
  const [showHoursModal, setShowHoursModal] = useState(false);
  const [showAdminPwdModal, setShowAdminPwdModal] = useState(false);
  const [pendingAdminAction, setPendingAdminAction] = useState(null); // 'import_hours' | 'export_empids'
  const [workHours, setWorkHours] = useState(() => loadWorkHoursCache());
  const [syncStatus, setSyncStatus] = useState('connecting');
  const [lastSyncTime, setLastSyncTime] = useState(null);
  const [pushStatus, setPushStatus] = useState({ type: '', msg: '' });
  const isRemoteUpdate = useRef(false);
  const sbReady = useRef(false);
  const prevDataRef = useRef(null);

  // 拉取云端工时表（登录/打开页面时 + 每 5 分钟 + 切回页面时自动刷新）
  const refreshWorkHours = useCallback(async () => {
    try {
      if (!(await _sbHasSession())) return;
      const map = await sbFetchWorkHours();
      setWorkHours(map);
      saveWorkHoursCache(map);
    } catch(e) { /* 工时拉取失败不打扰主流程 */ }
  }, []);

  useEffect(() => {
    refreshWorkHours();
    const t = setInterval(() => {
      if (document.visibilityState === 'visible') refreshWorkHours();
    }, 5 * 60 * 1000);
    const onVis = () => { if (document.visibilityState === 'visible') refreshWorkHours(); };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      clearInterval(t);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [currentUser, refreshWorkHours]);

  // Save to localStorage + push changed rows to Supabase
  useEffect(() => {
    saveData(data);
    if (!isRemoteUpdate.current && sbReady.current && currentUser) {
      const ts = Date.now();
      sbPushData(data, prevDataRef.current || { trainees: [] }, ts);
      setLastSyncTime(ts);
    }
    prevDataRef.current = data;
    isRemoteUpdate.current = false;
  }, [data]);

  // Initialize Supabase sync
  useEffect(() => {
    initSupabaseSync();

    // Validate session on startup — if expired, force re-login
    supabase.auth.getSession().then(({ data: sd }) => {
      if (!sd.session) {
        localStorage.removeItem('training_tracker_user');
        setCurrentUser(null);
      }
    });

    const unsubUpdate = sbOnUpdate((remoteData, remoteTs) => {
      // Merge remote into local — preserves local-only entries (pushed later)
      isRemoteUpdate.current = true;
      setData(prevData => {
        const mergedResult = mergeTrainees(prevData.trainees, remoteData.trainees || [], prevData._deletedIds || [], remoteData._deletedIds || []);
        const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: remoteTs });
        saveData(newData);
        return newData;
      });
      setLastSyncTime(remoteTs || Date.now());
    });

    const unsubStatus = sbOnStatus((status) => {
      setSyncStatus(status);
    });

    const unsubPushStatus = sbOnPushStatus((status, msg) => {
      setPushStatus({ type: status, msg });
      if (status === 'success') {
        setTimeout(() => setPushStatus({ type: '', msg: '' }), 2000);
      }
    });

    // After 1.5s, mark sync ready and push local data if it has content
    // (remote data should have been fetched and merged by now)
    const initTimer = setTimeout(() => {
      sbReady.current = true;
      const localData = loadData();
      // Only push if local has trainees (skip if empty/new device)
      if (localData.trainees && localData.trainees.length > 0) {
        const ts = Date.now();
        sbPushData(localData, prevDataRef.current || { trainees: [] }, ts);
        setLastSyncTime(ts);
      }
    }, 1500);

    // Poll remote data every 30min (1800s). Supabase has no practical rate limit —
    // one SELECT per poll is trivially cheap even for 2000+ stores.
    const pollTimer = setInterval(async () => {
      if (document.visibilityState !== 'visible') return; // don't poll in background
      try {
        const remote = await sbFetchAll();
        if (!remote.trainees || remote.trainees.length === 0) return;
        isRemoteUpdate.current = true;
        setData(prevData => {
          const mergedResult = mergeTrainees(prevData.trainees, remote.trainees, prevData._deletedIds || [], []);
          const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: Date.now() });
          saveData(newData);
          return newData;
        });
        setLastSyncTime(Date.now());
      } catch(e) { /* errors surfaced via status listeners */ }
    }, 1800000);

    // When tab becomes visible again, sync immediately
    const onVisibility = () => {
      if (document.visibilityState !== 'visible') return;
      (async () => {
        try {
          const remote = await sbFetchAll();
          if (!remote.trainees || remote.trainees.length === 0) return;
          isRemoteUpdate.current = true;
          setData(prevData => {
            const mergedResult = mergeTrainees(prevData.trainees, remote.trainees, prevData._deletedIds || [], []);
            const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: Date.now() });
            saveData(newData);
            return newData;
          });
          setLastSyncTime(Date.now());
        } catch(e) {}
      })();
    };
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      clearTimeout(initTimer);
      clearInterval(pollTimer);
      document.removeEventListener('visibilitychange', onVisibility);
      unsubUpdate();
      unsubStatus();
      unsubPushStatus();
    };
  }, []);

  // After login, pull remote data immediately (no 30min wait)
  const lastUserRef = useRef(null);
  useEffect(() => {
    if (!currentUser || currentUser === lastUserRef.current) return;
    lastUserRef.current = currentUser;
    (async () => {
      try {
        const remote = await sbFetchAll();
        if (!remote.trainees || remote.trainees.length === 0) return;
        isRemoteUpdate.current = true;
        setData(prevData => {
          const mergedResult = mergeTrainees(prevData.trainees, remote.trainees, prevData._deletedIds || [], []);
          const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: Date.now() });
          saveData(newData);
          return newData;
        });
        setLastSyncTime(Date.now());
      } catch(e) {}
    })();
  }, [currentUser]);

  const visibleTrainees = useMemo(() => {
    if (!currentUser) return [];
    if (currentUser.role === 'manager') {
      // 大区经理只能看到自己名下小区(subAreas)的学员
      const cfg = AREA_MAP[currentUser.id];
      const subs = (cfg && cfg.subAreas) || [];
      if (subs.length === 0) return [];
      return data.trainees.filter(t => subs.includes(t.area || '000'));
    }
    return data.trainees.filter(t => (t.area || '000') === currentUser.id);
  }, [data.trainees, currentUser]);

  const stores = useMemo(() => {
    const set = new Set(visibleTrainees.map(t => t.store).filter(Boolean));
    return Array.from(set).sort();
  }, [visibleTrainees]);

  // Auto-select first trainee (from visible list)
  useEffect(() => {
    if (!selectedId && visibleTrainees.length > 0) {
      setSelectedId(visibleTrainees[0].id);
    }
  }, [visibleTrainees, selectedId]);

  // Update document title when logged in
  useEffect(() => {
    if (currentUser) {
      document.title = currentUser.name;
    } else {
      document.title = '带训追踪系统 - 登录';
    }
  }, [currentUser]);

  const handleLogin = (user) => {
    localStorage.setItem('training_tracker_user', JSON.stringify(user));
    setCurrentUser(user);
    setView(user.role === 'manager' ? 'region_dashboard' : 'tracker');
    setDashboardUnlocked(user.role === 'manager');
  };

  const handleLogout = () => {
    supabase.auth.signOut().catch(() => {});
    localStorage.removeItem('training_tracker_user');
    setCurrentUser(null);
    setView('tracker');
    setSelectedId(null);
    setDashboardUnlocked(false);
  };

  // 导出所有区域「正在带训」学员的工号表（已认证/已完成全部带训天的不导出）
  const handleExportEmpIds = () => {
    const list = data.trainees
      .filter(t => getCurrentDay(t) !== null)
      .sort((a, b) => {
        const aa = a.area || '000', bb = b.area || '000';
        if (aa !== bb) return aa.localeCompare(bb, undefined, { numeric: true });
        return String(a.store || '').localeCompare(String(b.store || ''), 'zh');
      });
    const aoa = [['工号', '姓名', '门店', '区域', '带训进度', '备注']];
    for (const t of list) {
      const cfg = AREA_MAP[t.area || '000'];
      const areaName = cfg ? cfg.name.replace('区域带训追踪系统', '') : (t.area || '000');
      const prog = calcProgress(t);
      aoa.push([
        t.empId || '',
        t.name || '',
        t.store || '',
        areaName,
        prog.percent + '%',
        t.empId ? '' : '工号未填，请补录'
      ]);
    }
    if (list.length === 0) { alert('当前没有正在带训的学员，无需导出'); return; }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 14 }, { wch: 12 }, { wch: 22 }, { wch: 10 }, { wch: 10 }, { wch: 20 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '带训学员工号');
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    XLSX.writeFile(wb, `带训学员工号表_${stamp}.xlsx`);
  };

  const handleAddTrainee = (trainee) => {
    const newTrainee = {
      id: genId(),
      ...trainee,
      area: currentUser?.role === 'area' ? currentUser.id : (trainee.area || '000'),
      progress: {},
      createdAt: new Date().toISOString(),
      _updatedAt: Date.now()
    };
    setData(d => ({ ...d, trainees: [...d.trainees, newTrainee] }));
    setSelectedId(newTrainee.id);
  };

  const handleEditTrainee = (id, updates) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.map(t => t.id === id ? { ...t, ...updates, area: t.area || '000', _updatedAt: Date.now() } : t)
    }));
  };

  const handleDeleteTrainee = (id) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.filter(t => t.id !== id),
      _deletedIds: [...new Set([...(d._deletedIds || []), id])]
    }));
    if (selectedId === id) setSelectedId(null);
  };

  const handleUpdateProgress = (id, progress) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.map(t => t.id === id ? { ...t, progress, _updatedAt: Date.now() } : t)
    }));
  };

  const handleImportData = (imported) => {
    const stamped = normalizeData({
      trainees: (imported.trainees || []).map(t => ({ ...t, _updatedAt: t._updatedAt || Date.now() })),
      _deletedIds: imported._deletedIds || []
    });
    setData(stamped);
    setSelectedId(stamped.trainees.length > 0 ? stamped.trainees[0].id : null);
  };

  // Not logged in: show full-screen login
  if (!currentUser) {
    return <LoginScreen onLogin={handleLogin} />;
  }

  const isManager = currentUser.role === 'manager';

  return (
    <div className="min-h-screen bg-gray-950">
      {/* Header */}
      <header className="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-lg border-b border-gray-800">
        <div className="flex items-center justify-between px-5 h-[60px]">
          <div className="flex items-center gap-6">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center">
                <Icon.Award width={18} height={18} className="text-white"/>
              </div>
              <div>
                <h1 className="text-base font-bold text-white leading-tight">{currentUser.name}</h1>
                <p className="text-xs text-gray-500 leading-tight">
                  {isManager ? '大区汇总看板 · 全区域数据总览' : '区域带训进度管理'}
                </p>
              </div>
            </div>
            <nav className="flex items-center gap-1">
              {!isManager && (
                <button
                  onClick={() => setView('tracker')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'tracker' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
                >
                  <Icon.Calendar width={16} height={16}/> 带训追踪
                </button>
              )}
              <button
                onClick={() => {
                  if (dashboardUnlocked) {
                    setView(isManager ? 'region_dashboard' : 'dashboard');
                  } else {
                    setShowPwdModal(true);
                  }
                }}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'dashboard' || view === 'region_dashboard' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
              >
                <Icon.Dashboard width={16} height={16}/> 管理看板
              </button>
              {currentUser.id === '000' && (
                <button
                  onClick={() => { setPendingAdminAction('import_hours'); setShowAdminPwdModal(true); }}
                  className="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition text-gray-400 hover:text-white hover:bg-gray-800"
                >
                  <Icon.Clock width={16} height={16}/> 导入工时
                </button>
              )}
              {currentUser.id === '000' && (
                <button
                  onClick={() => { setPendingAdminAction('export_empids'); setShowAdminPwdModal(true); }}
                  className="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition text-gray-400 hover:text-white hover:bg-gray-800"
                  title="导出所有区域正在带训学员的工号表（已认证不导出）"
                >
                  <Icon.Download width={16} height={16}/> 导出工号
                </button>
              )}
              <button
                onClick={() => setShowSyncModal(true)}
                className="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition text-gray-400 hover:text-white hover:bg-gray-800"
              >
                <Icon.Cloud width={16} height={16}/> 数据同步
                <span className={`w-2 h-2 rounded-full ${pushStatus.type === 'pushing' ? 'bg-blue-400 animate-pulse' : pushStatus.type === 'error' ? 'bg-red-400' : syncStatus === 'connected' ? 'bg-emerald-400' : syncStatus === 'error' ? 'bg-red-400' : 'bg-amber-400 animate-pulse'}`}></span>
                {pushStatus.type === 'pushing' && <span className="text-xs text-blue-300">同步中...</span>}
                {pushStatus.type === 'error' && <span className="text-xs text-red-300">推送失败</span>}
              </button>
            </nav>
          </div>
          <div className="flex items-center gap-3">
            <span className="text-xs text-gray-500">{visibleTrainees.length} 名学员</span>
            <span className="text-xs text-gray-700">|</span>
            <span className="text-xs text-gray-500">{stores.length} 家门店</span>
            <span className="text-xs text-gray-700">|</span>
            <button
              onClick={handleLogout}
              className="text-xs text-gray-400 hover:text-white transition flex items-center gap-1"
            >
              <Icon.LogOut width={12} height={12}/> 退出
            </button>
          </div>
        </div>
      </header>

      {/* Content */}
      {view === 'tracker' && !isManager && (
        <TrackerView
          trainees={visibleTrainees}
          selectedId={selectedId}
          onSelectTrainee={setSelectedId}
          onAddTrainee={handleAddTrainee}
          onEditTrainee={handleEditTrainee}
          onDeleteTrainee={handleDeleteTrainee}
          onUpdateProgress={handleUpdateProgress}
          stores={stores}
          workHours={workHours}
        />
      )}
      {view === 'dashboard' && !isManager && (
        <DashboardView trainees={visibleTrainees} stores={stores} workHours={workHours} onUpdateNote={(id, note) => handleEditTrainee(id, { note })} />
      )}
      {view === 'region_dashboard' && isManager && (
        <RegionDashboardView trainees={visibleTrainees} stores={stores} config={AREA_CONFIG} workHours={workHours} subAreas={currentUser?.role === 'manager' ? (AREA_MAP[currentUser.id]?.subAreas || []) : null} />
      )}

      {/* 密码弹窗 */}
      {showPwdModal && (
        <PasswordModal
          onSuccess={() => {
            setDashboardUnlocked(true);
            setShowPwdModal(false);
            setView(isManager ? 'region_dashboard' : 'dashboard');
          }}
          onClose={() => setShowPwdModal(false)}
        />
      )}

      {/* 管理员操作密码验证（导入工时 / 导出工号） */}
      {showAdminPwdModal && (
        <PasswordModal
          password={ADMIN_PASSWORD}
          title="管理员操作验证"
          description="请输入密码后继续"
          onSuccess={() => {
            setShowAdminPwdModal(false);
            if (pendingAdminAction === 'import_hours') setShowHoursModal(true);
            else if (pendingAdminAction === 'export_empids') handleExportEmpIds();
            setPendingAdminAction(null);
          }}
          onClose={() => { setShowAdminPwdModal(false); setPendingAdminAction(null); }}
        />
      )}

      {/* 工时导入弹窗（仅 000 账号） */}
      {showHoursModal && (
        <WorkHoursImportModal
          trainees={data.trainees}
          onClose={() => setShowHoursModal(false)}
          onImported={refreshWorkHours}
        />
      )}

      {/* 数据同步弹窗 */}
      {showSyncModal && (
        <SyncModal
          data={data}
          syncStatus={syncStatus}
          lastSyncTime={lastSyncTime}
          setLastSyncTime={setLastSyncTime}
          onClose={() => setShowSyncModal(false)}
          onImport={handleImportData}
          isRemoteUpdate={isRemoteUpdate}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
