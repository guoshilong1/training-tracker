// ============ Storage ============
const STORAGE_KEY = 'training_tracker_data_v2';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return normalizeData(parsed);
    }
  } catch(e) {}
  // First-time: return empty — will be populated by cloud sync
  return { trainees: [], _deletedIds: [] };
}

// Normalize legacy data: ensure every trainee has an area field (default '000')
function normalizeData(data) {
  if (!data || typeof data !== 'object') return { trainees: [], _deletedIds: [] };
  return {
    ...data,
    trainees: (data.trainees || []).map(t => ({ ...t, area: t.area || '000' }))
  };
}

// Merge trainees at progress-day level (prevents data loss from concurrent edits)
// Merge day-level progress: preserve checked items and completed status from BOTH sides
function mergeDayProgress(lProgress, rProgress) {
  const allDays = new Set([...Object.keys(lProgress || {}), ...Object.keys(rProgress || {})]);
  const merged = {};
  for (const day of allDays) {
    const lp = lProgress?.[day] || {};
    const rp = rProgress?.[day] || {};

    // Per-day timestamp: newer side wins for completion status
    const lTs = lp._updatedAt || 0;
    const rTs = rp._updatedAt || 0;
    const newer = rTs >= lTs ? rp : lp;
    const older = rTs >= lTs ? lp : rp;

    const dayMerged = {};

    // 1) Completion status comes from the newer side (so unchecking can propagate)
    if (newer.completed) {
      dayMerged.completed = true;
      dayMerged.completedAt = newer.completedAt || new Date().toISOString();
      dayMerged.masterSignature = newer.masterSignature || '';
      dayMerged.signatureAt = newer.signatureAt || new Date().toISOString();
    }

    // 2) Merge item-level checks: union of all checked items from BOTH sides
    const items = {};
    const allItemKeys = new Set([...Object.keys(lp.items || {}), ...Object.keys(rp.items || {})]);
    for (const idx of allItemKeys) {
      const li = lp.items?.[idx] || {};
      const ri = rp.items?.[idx] || {};
      if (li.checked || ri.checked) {
        items[idx] = {
          checked: true,
          checkedAt: li.checkedAt || ri.checkedAt || new Date().toISOString(),
          choice: li.choice || ri.choice || undefined
        };
      }
    }
    dayMerged.items = items;

    // 3) Merge training time: keep the newer side's value if either side has one
    if (newer.trainingTime || older.trainingTime) {
      dayMerged.trainingTime = newer.trainingTime || older.trainingTime;
    }

    // 4) Preserve any other fields from the newer side
    for (const k of Object.keys(newer)) {
      if (!(k in dayMerged)) dayMerged[k] = newer[k];
    }
    // 5) Keep the newer _updatedAt so subsequent merges compare correctly
    dayMerged._updatedAt = Math.max(lTs, rTs);

    merged[day] = dayMerged;
  }
  return merged;
}

function mergeTrainees(localTrainees, remoteTrainees, localDeletedIds, remoteDeletedIds) {
  // Union of all deleted IDs — once deleted, stays deleted across all devices
  const deletedIds = new Set([...(localDeletedIds || []), ...(remoteDeletedIds || [])]);

  // Filter out deleted trainees from both sides BEFORE merging
  const localFiltered = localTrainees.filter(t => !deletedIds.has(t.id));
  const remoteFiltered = remoteTrainees.filter(t => !deletedIds.has(t.id));

  const localMap = new Map(localFiltered.map(t => [t.id, t]));
  const remoteMap = new Map(remoteFiltered.map(t => [t.id, t]));
  const result = [];
  const allIds = new Set([...localMap.keys(), ...remoteMap.keys()]);
  for (const id of allIds) {
    const lt = localMap.get(id);
    const rt = remoteMap.get(id);
    if (!lt) { result.push(rt); continue; }
    if (!rt) { result.push(lt); continue; }
    // Base: take newer version for basic info (name, store, route, master, etc.)
    const lTs = lt._updatedAt || 0;
    const rTs = rt._updatedAt || 0;
    const base = rTs >= lTs ? Object.assign({}, rt) : Object.assign({}, lt);
    // Merge progress at item/day level — both sides' checked items & completed days are preserved
    base.progress = mergeDayProgress(lt.progress, rt.progress);
    base._updatedAt = Math.max(lTs, rTs);
    result.push(base);
  }
  return { trainees: result, deletedIds: [...deletedIds] };
}

// Check whether a Supabase session exists (skip sync when logged out)
async function _sbHasSession() {
  try {
    const { data } = await supabase.auth.getSession();
    return !!(data && data.session);
  } catch(e) { return false; }
}

// Fetch all non-deleted trainees from Supabase
async function sbFetchAll() {
  const { data, error } = await supabase
    .from('trainees')
    .select('*')
    .eq('deleted', false)
    .order('updated_at', { ascending: false });
  if (error) throw error;
  return { trainees: (data || []).map(rowToTrainee), _deletedIds: [] };
}

// Upsert specific trainees (batch 100 per request)
async function sbUpsertTrainees(trainees, ts) {
  if (!trainees || trainees.length === 0) return true;
  const rows = trainees.map(t => traineeToRow({ ...t, _updatedAt: t._updatedAt || ts || Date.now() }));
  for (let i = 0; i < rows.length; i += 100) {
    const { error } = await supabase
      .from('trainees')
      .upsert(rows.slice(i, i + 100), { onConflict: 'id' });
    if (error) throw error;
  }
  return true;
}

// Soft-delete trainees (mark deleted=true so Realtime/poll never resurrects them)
async function sbSoftDeleteTrainees(ids, ts) {
  if (!ids || ids.length === 0) return true;
  const { error } = await supabase
    .from('trainees')
    .update({ deleted: true, updated_at: ts || Date.now() })
    .in('id', ids);
  if (error) throw error;
  return true;
}

// Debounced push: diff prev vs new, upsert changed rows + soft-delete removed ones
function sbPushData(newData, prevData, ts) {
  if (_sbPushing) return false;
  if (_sbSaveTimer) clearTimeout(_sbSaveTimer);
  _sbSaveTimer = setTimeout(async () => {
    try {
      await _sbDoPush(newData, prevData, ts);
    } catch(e) {
      _sbNotifyPushStatus('error', e.message || '推送失败');
    }
  }, 1000);
  return true;
}

async function _sbDoPush(newData, prevData, ts) {
  if (_sbPushing) return false;
  if (!(await _sbHasSession())) return false; // logged out — nothing to push
  _sbPushing = true;
  _sbNotifyPushStatus('pushing', '');
  const pushTs = ts || Date.now();
  try {
    const prevTrainees = prevData?.trainees || [];
    const newTrainees = newData?.trainees || [];
    const prevMap = new Map(prevTrainees.map(t => [t.id, t]));
    const newMap = new Map(newTrainees.map(t => [t.id, t]));

    // Changed or added: in new but not in prev, or _updatedAt differs
    const changed = [];
    for (const t of newTrainees) {
      const p = prevMap.get(t.id);
      if (!p || (p._updatedAt || 0) !== (t._updatedAt || 0)) changed.push(t);
    }
    // Deleted: in prev but not in new
    const deletedIds = [];
    for (const t of prevTrainees) {
      if (!newMap.has(t.id)) deletedIds.push(t.id);
    }

    if (changed.length > 0) await sbUpsertTrainees(changed, pushTs);
    if (deletedIds.length > 0) await sbSoftDeleteTrainees(deletedIds, pushTs);

    if (changed.length === 0 && deletedIds.length === 0) {
      _sbPushing = false;
      _sbNotifyPushStatus('success', '已同步到云端');
      return true;
    }
    console.log('[Supabase] Pushed', changed.length, 'changed,', deletedIds.length, 'deleted');
    _sbPushing = false;
    _sbNotifyPushStatus('success', '已同步到云端');
    return true;
  } catch(e) {
    console.warn('[Supabase] Push error:', e.message);
    _sbPushing = false;
    _sbNotifyPushStatus('error', '推送失败: ' + e.message);
    return false;
  }
}

async function sbForcePush(data, ts) {
  // Force push: upsert all trainees + soft-delete tracked deleted IDs
  const pushTs = ts || Date.now();
  await sbUpsertTrainees(data.trainees || [], pushTs);
  if (data._deletedIds && data._deletedIds.length > 0) {
    await sbSoftDeleteTrainees(data._deletedIds, pushTs);
  }
  return true;
}

// Init: fetch remote, auto-migrate localStorage → Supabase on first run, then merge
async function initSupabaseSync() {
  _sbNotifyStatus('connecting');
  try {
    if (!(await _sbHasSession())) {
      // Not logged in yet — wait for login before touching the cloud
      _sbNotifyStatus('connected');
      return;
    }
    const remote = await sbFetchAll();
    const local = loadData();
    const remoteEmpty = !remote.trainees || remote.trainees.length === 0;

    if (remoteEmpty && local.trainees.length > 0) {
      // First migration: push all local data to cloud
      console.log('[Supabase] Migrating', local.trainees.length, 'local trainees to cloud...');
      await sbUpsertTrainees(local.trainees, Date.now());
      const migrated = await sbFetchAll();
      _sbListeners.forEach(cb => cb(migrated, Date.now()));
      _sbNotifyStatus('connected');
      return;
    }

    if (remote.trainees.length > 0) {
      // Merge remote into local (local-only entries are kept and pushed later)
      _sbListeners.forEach(cb => cb(remote, Date.now()));
    }
    _sbNotifyStatus('connected');
  } catch(e) {
    console.warn('[Supabase] Init error:', e.message);
    _sbNotifyStatus('error');
  }
}

// ============ Progress Calculation ============
function calcProgress(trainee) {
  const allDays = getAllDays(trainee.route, trainee.subRoute);
  const total = allDays.length || 0;
  if (total === 0) return { completed: 0, total: 0, percent: 0, remaining: 0 };
  let completed = 0;
  const progress = trainee.progress || {};
  for (const day of allDays) {
    const dp = progress[day.key];
    if (dp && dp.completed) completed++;
  }
  return {
    completed,
    total,
    percent: Math.min(100, Math.round((completed / total) * 100)),
    remaining: Math.max(0, total - completed)
  };
}

function getCurrentDay(trainee) {
  const allDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  const progress = trainee.progress || {};
  for (const day of allDays) {
    const dp = progress[day.key];
    if (!dp || !dp.completed) return day;
  }
  return null; // All completed
}

function isCertified(trainee) { return getCurrentDay(trainee) === null; }

function isDayUnlocked(trainee, dayKey) {
  const allDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  const idx = allDays.findIndex(d => d.key === dayKey);
  if (idx === 0) return true;
  const progress = trainee.progress || {};
  const prevDay = allDays[idx - 1];
  const prevProgress = progress[prevDay.key];
  return prevProgress && prevProgress.completed;
}

function isPartTime(trainee) { return trainee.route === 'part_time'; }
function getWorkHoursLimit(trainee) { return isPartTime(trainee) ? 300 : 500; }
function getWorkHoursThreshold(trainee) { return isPartTime(trainee) ? 200 : 300; }
function getWorkHoursWarning(t, hours) {
  if (hours == null || Number.isNaN(Number(hours))) return null;
  const limit = getWorkHoursLimit(t);
  const threshold = getWorkHoursThreshold(t);
  if (hours > threshold) {
    return { limit, threshold, hours: Number(hours), remaining: Math.max(0, limit - hours), isPartTime: isPartTime(t) };
  }
  return null;
}

function countCerts(trainee) {
  const allDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  const progress = trainee.progress || {};
  let n = 0;
  for (const day of allDays) {
    const dp = progress[day.key];
    // 认证类项目必须等本天“确认完成”后才计证（兼职三选一不能只选就计）
    if (!dp || !dp.items || !dp.completed) continue;
    day.items.forEach((item, idx) => {
      const type = getItemType(item.content);
      if (type === 'cert' && dp.items[idx]) {
        if (item.choices) {
          if (dp.items[idx].choice) n++;
        } else if (dp.items[idx].checked) {
          n++;
        }
      }
    });
  }
  return n;
}

// ============ Modal ============
function Modal({ open, onClose, title, children, maxWidth = 'max-w-lg' }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose}></div>
      <div className={`relative w-full ${maxWidth} bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl fade-in`}>
        <div className="flex items-center justify-between px-6 py-4 border-b border-gray-800">
          <h2 className="text-lg font-semibold text-white">{title}</h2>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition">
            <Icon.Close/>
          </button>
        </div>
        <div className="p-6 max-h-[70vh] overflow-y-auto scrollbar-thin">
          {children}
        </div>
      </div>
    </div>
  );
}

function TraineeModal({ open, onClose, onSave, editing, stores }) {
  const [name, setName] = useState('');
  const [store, setStore] = useState('');
  const [route, setRoute] = useState('front_to_back');
  const [subRoute, setSubRoute] = useState('');
  const [startDate, setStartDate] = useState('');
  const [master, setMaster] = useState('');
  const [empId, setEmpId] = useState('');

  const selectedRoute = useMemo(() => TRAINING_DATA.routes.find(r => r.id === route), [route]);
  const hasSubRoutes = !!selectedRoute?.subRoutes;

  useEffect(() => {
    if (editing) {
      setName(editing.name || '');
      setStore(editing.store || '');
      setRoute(editing.route || 'front_to_back');
      setSubRoute(editing.subRoute || '');
      setStartDate(editing.startDate || '');
      setMaster(editing.master || '');
      setEmpId(editing.empId || '');
    } else {
      setName(''); setStore(''); setRoute('front_to_back'); setSubRoute('');
      const today = new Date().toISOString().slice(0, 10);
      setStartDate(today); setMaster(''); setEmpId('');
    }
  }, [editing, open]);

  // Auto-select first sub-route when switching to part_time
  useEffect(() => {
    if (hasSubRoutes) {
      if (!subRoute || !selectedRoute.subRoutes.find(s => s.id === subRoute)) {
        setSubRoute(selectedRoute.subRoutes[0].id);
      }
    } else {
      setSubRoute('');
    }
  }, [route, hasSubRoutes, selectedRoute, subRoute]);

  const handleSave = () => {
    if (!name.trim()) { alert('请输入学员姓名'); return; }
    if (!store.trim()) { alert('请输入门店'); return; }
    if (hasSubRoutes && !subRoute) { alert('请选择兼职子路线（前厅兼职/后厨兼职）'); return; }
    onSave({
      ...(editing || {}),
      name: name.trim(),
      store: store.trim(),
      route,
      subRoute: hasSubRoutes ? subRoute : '',
      startDate,
      master: master.trim(),
      empId: empId.trim()
    });
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? '编辑学员' : '新增学员'}>
      <div className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-gray-300 mb-1.5">学员姓名 <span className="text-red-400">*</span></label>

            className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white placeholder-gray-500"
            placeholder="请输入学员姓名"/>
        </div>
        <div>
          <label className="block text-sm font-medium text-gray-300 mb-1.5">门店 <span className="text-red-400">*</span></label>
          <input type="text" value={store} onChange={e=>setStore(e.target.value)} list="store-list"
            className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white placeholder-gray-500"
            placeholder="如：太原万达店"/>
          <datalist id="store-list">
            {stores.map(s => <option key={s} value={s} />)}
          </datalist>
        </div>
        <div>
          <label className="block text-sm font-medium text-gray-300 mb-1.5">工号 <span className="text-xs text-gray-500 font-normal">（用于匹配工时，建议填写）</span></label>
          <input type="text" value={empId} onChange={e=>setEmpId(e.target.value)}
            className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white placeholder-gray-500 tabular-nums"
            placeholder="如：10086"/>
        </div>
        <div>
          <label className="block text-sm font-medium text-gray-300 mb-1.5">带训路线 <span className="text-red-400">*</span></label>
          <div className="grid grid-cols-3 gap-3">
            {TRAINING_DATA.routes.map(r => (
              <button key={r.id} onClick={()=>setRoute(r.id)}
                className={`px-4 py-3 rounded-lg border text-left transition ${route===r.id ? 'border-indigo-500 bg-indigo-500/10 text-indigo-300' : 'border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600'}`}>
                <div className="font-medium">{r.name}</div>
                <div className="text-xs mt-0.5 opacity-70">{r.description}</div>
              </button>
            ))}
          </div>
        </div>
        {hasSubRoutes && (
          <div>
            <label className="block text-sm font-medium text-gray-300 mb-1.5">兼职岗位 <span className="text-red-400">*</span></label>
            <div className="grid grid-cols-2 gap-3">
              {selectedRoute.subRoutes.map(s => (
                <button key={s.id} onClick={()=>setSubRoute(s.id)}
                  className={`px-4 py-3 rounded-lg border text-left transition ${subRoute===s.id ? 'border-indigo-500 bg-indigo-500/10 text-indigo-300' : 'border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600'}`}>
                  <div className="font-medium">{s.name}</div>
                  <div className="text-xs mt-0.5 opacity-70">{s.description}</div>
                </button>
              ))}
            </div>
          </div>
        )}
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-gray-300 mb-1.5">入职/开始日期</label>
            <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}

          </div>
          <div>
            <label className="block text-sm font-medium text-gray-300 mb-1.5">带训师傅</label>
            <input type="text" value={master} onChange={e=>setMaster(e.target.value)}
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white placeholder-gray-500"
              placeholder="师傅姓名"/>
          </div>
        </div>
        <div className="flex justify-end gap-3 pt-2">
          <button onClick={onClose} className="px-4 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition">取消</button>
          <button onClick={handleSave} className="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">保存</button>
        </div>
      </div>
    </Modal>
  );
}

// ============ Day Card ============
function DayCard({ day, dayProgress, unlocked, onToggleItem, onCompleteDay, trainee }) {
  const [expanded, setExpanded] = useState(true);
  const [masterName, setMasterName] = useState(dayProgress?.masterSignature || trainee?.master || '');
  // 带训次数（1-3），兼容旧数据：如果只有 trainingTime 单字段，按 1 次处理
  const initialCount = (dayProgress?.trainingTimes && dayProgress.trainingTimes.length > 0)
    ? Math.min(3, Math.max(1, dayProgress.trainingTimes.length))
    : (dayProgress?.trainingTime ? 1 : 1);
  const [sessionCount, setSessionCount] = useState(initialCount);
  const initialTimes = (dayProgress?.trainingTimes && dayProgress.trainingTimes.length > 0)
    ? [...dayProgress.trainingTimes]
    : (dayProgress?.trainingTime ? [dayProgress.trainingTime] : ['']);
  const [trainingTimes, setTrainingTimes] = useState(initialTimes);
  React.useEffect(() => {
    setMasterName(dayProgress?.masterSignature || trainee?.master || '');
    const tps = (dayProgress?.trainingTimes && dayProgress.trainingTimes.length > 0)
      ? [...dayProgress.trainingTimes]
      : (dayProgress?.trainingTime ? [dayProgress.trainingTime] : ['']);
    const cnt = Math.min(3, Math.max(1, tps.length || 1));
    setTrainingTimes(tps);
    setSessionCount(cnt);
  }, [dayProgress?.masterSignature, trainee?.master, dayProgress?.trainingTime, dayProgress?.trainingTimes]);
  const shiftStyle = getShiftStyle(day.shift);
  const isCompleted = dayProgress?.completed;
  const checkedItems = dayProgress?.items || {};
  const allItemsChecked = day.items.length > 0 && day.items.every((item, i) => {
    const state = checkedItems[i] || {};
    if (item.choices) return !!state.choice;
    return !!state.checked;
  });
  const anyTimeFilled = trainingTimes.some(t => t && t.trim());
  const handleSessionCountChange = (n) => {
    const newCount = Math.min(3, Math.max(1, n));
    setSessionCount(newCount);
    // 调整 times 数组长度
    setTrainingTimes(prev => {
      const next = [...prev];
      while (next.length < newCount) next.push('');
      next.length = newCount;
      return next;
    });
  };
  const handleTimeChange = (idx, val) => {
    setTrainingTimes(prev => prev.map((t, i) => i === idx ? val : t));
  };

  return (
    <div className={`day-card rounded-xl border ${isCompleted ? 'border-emerald-500/30 bg-emerald-500/5' : unlocked ? 'border-gray-700 bg-gray-900/50' : 'border-gray-800 bg-gray-900/20 opacity-60'} overflow-hidden`}>
      {/* Day Header */}
      <div className="flex items-center gap-3 px-4 py-3 border-b border-gray-800/50">
        <div className={`flex items-center justify-center w-9 h-9 rounded-lg font-bold text-sm ${isCompleted ? 'bg-emerald-500/20 text-emerald-400' : unlocked ? 'bg-gray-800 text-gray-300' : 'bg-gray-800/50 text-gray-600'}`}>
          {isCompleted ? <Icon.Check/> : !unlocked ? <Icon.Lock/> : day.day}
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-sm font-medium text-white">第{day.day}天</span>
            {day.shift && (
              <span className={`text-xs px-2 py-0.5 rounded-full ${shiftStyle.bg} ${shiftStyle.text} border ${shiftStyle.border}`}>
                {day.shift}
              </span>
            )}
            {isCompleted && (
              <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                已完成
              </span>
            )}
            {dayProgress?.masterSignature && (
              <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 flex items-center gap-1">
                <Icon.User width={11} height={11}/> {dayProgress.masterSignature}

        </div>
        {unlocked && day.items.length > 0 && (

            <span className={`inline-block transition-transform ${expanded ? 'rotate-0' : '-rotate-90'}`}><Icon.ChevronDown/></span>

              <span className="text-xs text-gray-500 flex-shrink-0">师傅签名</span>
              <input
                type="text"
                value={masterName}
                onChange={(e) => setMasterName(e.target.value)}
                placeholder="当天负责师傅姓名 *必填"
                disabled={isCompleted}
                className={`flex-1 bg-gray-800 rounded-lg px-3 py-1.5 text-sm text-white placeholder-gray-600 focus:outline-none ${isCompleted ? 'border border-gray-700 opacity-70' : !masterName.trim() ? 'border border-red-500/50' : 'border border-gray-700'}`}
              />
              {dayProgress?.signatureAt && (
                <span className="text-xs text-gray-500 flex-shrink-0">{new Date(dayProgress.signatureAt).toLocaleString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
              )}
            </div>
            {/* 今日带训次数选择 */}
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs text-gray-500 flex-shrink-0">今日带训次数</span>
              <div className="inline-flex rounded-lg overflow-hidden border border-gray-700">
                {[1, 2, 3].map(n => (
                  <button
                    key={n}
                    type="button"
                    disabled={isCompleted}
                    onClick={() => handleSessionCountChange(n)}
                    className={`px-3 py-1 text-xs font-medium transition ${sessionCount === n ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400 hover:text-white'} ${isCompleted ? 'opacity-60 cursor-not-allowed' : ''}`}
                  >{n}次</button>
                ))}
              </div>
              {dayProgress?.trainingTimes && dayProgress.trainingTimes.length > 0 && (
                <span className="text-xs text-gray-500 flex-shrink-0">
                  已填 {dayProgress.trainingTimes.filter(t => t).join(' / ')}
                </span>
              )}
              {!dayProgress?.trainingTimes && dayProgress?.trainingTime && (
                <span className="text-xs text-gray-500 flex-shrink-0">已填 {dayProgress.trainingTime}</span>
              )}
            </div>
            {/* 各次带训时间输入框 */}
            <div className="space-y-1.5">
              {Array.from({ length: sessionCount }).map((_, idx) => (
                <div key={idx} className="flex items-center gap-2">
                  <span className="text-xs text-gray-500 flex-shrink-0 w-12">第{idx + 1}次</span>
                  <input
                    type="time"
                    value={trainingTimes[idx] || ''}
                    onChange={(e) => handleTimeChange(idx, e.target.value)}
                    placeholder="如 09:00"
                    disabled={isCompleted}
                    className={`flex-1 bg-gray-800 rounded-lg px-3 py-1.5 text-sm text-white placeholder-gray-600 focus:outline-none ${isCompleted ? 'border border-gray-700 opacity-70' : !trainingTimes[idx] ? 'border border-red-500/50' : 'border border-gray-700'}`}
                  />
                </div>
              ))}
            </div>
            {!isCompleted ? (
              <button
                onClick={() => {
                  const filled = trainingTimes.filter(t => t && t.trim());
                  onCompleteDay(day.key, masterName, filled);
                }}
                disabled={!allItemsChecked || !masterName.trim() || !anyTimeFilled}
                className={`w-full py-2.5 rounded-lg font-medium text-sm transition ${allItemsChecked && masterName.trim() && anyTimeFilled ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-gray-800 text-gray-500 cursor-not-allowed'}`}
              >
                {allItemsChecked ? (masterName.trim() && anyTimeFilled ? '✓ 确认完成本天带训' : '请填写师傅签名和至少一次带训时间') : `需完成全部 ${day.items.length} 项后才能解锁下一天`}
              </button>
            ) : (
              <div className="w-full py-2.5 rounded-lg font-medium text-sm bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-center flex items-center justify-center gap-1.5">
                <Icon.Check width={14} height={14}/> 本天带训已完成（不可撤回）
              </div>
            )}
          </div>
        </div>
      )}

      {!unlocked && (
        <div className="px-4 py-3 text-sm text-gray-600 flex items-center gap-2">
          <Icon.Lock/> 完成前一天后自动解锁
        </div>
      )}
    </div>
  );
}

// ============ Trainee Tracker View ============
function TrackerView({ trainees, onSelectTrainee, selectedId, onAddTrainee, onEditTrainee, onDeleteTrainee, onUpdateProgress, stores, workHours }) {
  const [search, setSearch] = useState('');
  const [filterStore, setFilterStore] = useState('');
  const [filterRoute, setFilterRoute] = useState('');
  const [certFilter, setCertFilter] = useState('incomplete'); // 'incomplete' | 'completed'
  const [showModal, setShowModal] = useState(false);
  const [editingTrainee, setEditingTrainee] = useState(null);

  // Refs for auto-scrolling to "next day to learn" when user switches trainee
  const dayRefs = useRef({});
  const prevSelectedIdRef = useRef(null);

  const selected = trainees.find(t => t.id === selectedId);

  // Auto-scroll to current day when user actively switches trainee (skip initial auto-select)
  useEffect(() => {
    if (selectedId && prevSelectedIdRef.current !== null && selectedId !== prevSelectedIdRef.current) {
      const targetKey = currentDay?.key;
      const el = targetKey ? dayRefs.current[targetKey] : null;
      if (el) {
        setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
      }
    }
    prevSelectedIdRef.current = selectedId;
  }, [selectedId, currentDay]);

  const certCounts = useMemo(() => {
    const incomplete = trainees.filter(t => getCurrentDay(t) !== null).length;
    return { incomplete, completed: trainees.length - incomplete };
  }, [trainees]);

  const filtered = useMemo(() => {
    const list = trainees.filter(t => {
      if (search && !t.name.includes(search) && !t.store.includes(search)) return false;
      if (filterStore && t.store !== filterStore) return false;
      if (filterRoute && t.route !== filterRoute) return false;
      const isCompleted = getCurrentDay(t) === null;
      if (certFilter === 'completed' && !isCompleted) return false;
      if (certFilter === 'incomplete' && isCompleted) return false;
      return true;
    });
    // 工时预警置顶，再按工时降序
    list.sort((a, b) => {
      const hoursA = (a.empId && workHours?.[a.empId]?.hours) || 0;
      const hoursB = (b.empId && workHours?.[b.empId]?.hours) || 0;
      const warningA = !!getWorkHoursWarning(a, hoursA);
      const warningB = !!getWorkHoursWarning(b, hoursB);
      if (warningA && !warningB) return -1;
      if (!warningA && warningB) return 1;
      return hoursB - hoursA;
    });
    return list;
  }, [trainees, search, filterStore, filterRoute, certFilter, workHours]);

  const handleSave = (data) => {
    if (editingTrainee) {
      onEditTrainee(editingTrainee.id, data);
    } else {
      onAddTrainee(data);
    }
    setEditingTrainee(null);
  };

  const handleToggleItem = (dayKey, itemIdx, checked, choice) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    dayProg.items = { ...dayProg.items };
    const prev = { ...(dayProg.items[itemIdx] || {}) };
    if (checked) {
      prev.checked = true;
      prev.checkedAt = new Date().toISOString();
      if (choice) prev.choice = choice;
    } else {
      delete prev.checked;
      delete prev.checkedAt;
      delete prev.choice;
    }
    dayProg.items[itemIdx] = prev;
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  const handleCompleteDay = (dayKey, masterSignature, trainingTimesInput) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    if (dayProg.completed) return; // cannot undo
    const sig = (masterSignature || selected.master || '').trim();
    // trainingTimesInput 可能是数组（多次带训）或字符串（兼容旧数据）
    const times = Array.isArray(trainingTimesInput)
      ? trainingTimesInput.filter(t => t && t.trim()).map(t => t.trim())
      : (trainingTimesInput ? [trainingTimesInput.trim()] : []);
    if (!sig || times.length === 0) {
      alert('请填写师傅签名和至少一次带训时间后再确认完成');
      return;
    }
    dayProg.completed = true;
    dayProg.completedAt = new Date().toISOString();
    dayProg.masterSignature = sig;
    dayProg.signatureAt = new Date().toISOString();
    dayProg.trainingTimes = times;
    // 兼容旧数据：保留单个 trainingTime 字段（取最早一次）
    dayProg.trainingTime = times[0];
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  const allDays = selected ? getAllDays(selected.route, selected.subRoute).filter(d => d.items.length > 0) : [];
  const currentDay = selected ? getCurrentDay(selected) : null;
  const progressInfo = selected ? calcProgress(selected) : null;

  return (
    <div className="flex h-[calc(100vh-60px)]">
      {/* Sidebar - Trainee List */}
      <div className="w-72 flex-shrink-0 border-r border-gray-800 bg-gray-900/30 flex flex-col">
        <div className="p-3 border-b border-gray-800 space-y-2">
          <button
            onClick={() => { setEditingTrainee(null); setShowModal(true); }}
            className="w-full flex items-center justify-center gap-2 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition"
          >
            <Icon.Plus width={16} height={16}/> 新增学员
          </button>
          <div className="relative">
            <Icon.Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" />
            <input
              type="text" value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="搜索姓名/门店..."
              className="w-full bg-gray-800 border border-gray-700 rounded-lg pl-9 pr-3 py-2 text-sm text-white placeholder-gray-500"
            />
          </div>
          <div className="flex gap-2">
            <div className="relative flex-1">
              <select value={filterStore} onChange={e=>setFilterStore(e.target.value)}
                className="w-full h-9 appearance-none bg-gray-800 border border-gray-700 hover:border-gray-600 rounded-lg pl-3 pr-8 text-xs text-gray-300 transition cursor-pointer">
                <option value="">全部门店</option>
                {stores.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <Icon.ChevronDown className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none" width={14} height={14}/>
            </div>
            <div className="relative flex-1">
              <select value={filterRoute} onChange={e=>setFilterRoute(e.target.value)}
                className="w-full h-9 appearance-none bg-gray-800 border border-gray-700 hover:border-gray-600 rounded-lg pl-3 pr-8 text-xs text-gray-300 transition cursor-pointer">
                <option value="">全部路线</option>
                {TRAINING_DATA.routes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
              </select>
              <Icon.ChevronDown className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none" width={14} height={14}/>
            </div>
          </div>
        </div>

        {/* Certification filter tabs */}
        <div className="px-3 pb-2 border-b border-gray-800">
          <div className="flex bg-gray-800/50 rounded-lg p-1 gap-1">
            <button
              onClick={() => setCertFilter('incomplete')}
              className={`flex-1 py-1.5 text-xs font-medium rounded-md transition flex items-center justify-center gap-1 ${
                certFilter === 'incomplete' ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-400 hover:text-white hover:bg-gray-800'
              }`}
            >
              未认证
              <span className={`text-[10px] px-1 py-0.5 rounded-full ${certFilter === 'incomplete' ? 'bg-white/20' : 'bg-gray-700 text-gray-400'}`}>
                {certCounts.incomplete}
              </span>
            </button>
            <button
              onClick={() => setCertFilter('completed')}
              className={`flex-1 py-1.5 text-xs font-medium rounded-md transition flex items-center justify-center gap-1 ${
                certFilter === 'completed' ? 'bg-emerald-600 text-white shadow-sm' : 'text-gray-400 hover:text-white hover:bg-gray-800'
              }`}
            >
              已认证
              <span className={`text-[10px] px-1 py-0.5 rounded-full ${certFilter === 'completed' ? 'bg-white/20' : 'bg-gray-700 text-gray-400'}`}>
                {certCounts.completed}
              </span>
            </button>
          </div>
        </div>

        <div className="flex-1 overflow-y-auto scrollbar-thin p-2 space-y-1">
          {filtered.length === 0 ? (
            <div className="text-center text-gray-500 text-sm py-8">暂无学员数据</div>
          )           : filtered.map(t => {
            const prog = calcProgress(t);
            const certified = isCertified(t);
            const displayPercent = certified ? 100 : prog.percent;
            const displayCompleted = certified ? prog.total : prog.completed;
            const route = TRAINING_DATA.routes.find(r => r.id === t.route);
            const isSelected = t.id === selectedId;
            const warning = getWorkHoursWarning(t, workHours?.[t.empId]?.hours);
            return (
              <button
                key={t.id}
                onClick={() => onSelectTrainee(t.id)}
                className={`group w-full text-left p-3 rounded-lg transition ${isSelected ? 'bg-indigo-600/20 border border-indigo-500/40' : warning ? 'bg-yellow-500/25 border border-yellow-500/50 hover:bg-yellow-500/35' : 'hover:bg-gray-800/50 border border-transparent'}`}
              >
                  <div className="flex items-center justify-between">
                  <span className="text-sm font-medium text-white">{t.name}</span>
                  <div className="flex items-center gap-1">
                    <span className="text-xs text-gray-500">{getRouteName(t.route, t.subRoute)}</span>
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        if (confirm(`确认删除学员「${t.name}」？此操作不可撤销。`)) {
                          onDeleteTrainee(t.id);
                        }
                      }}
                      className="p-1.5 rounded-md text-gray-600 hover:text-red-400 hover:bg-red-500/10 transition"
                      title="删除学员"
                    >
                      <Icon.Trash width={13} height={13}/>
                    </button>
                  </div>
                </div>
                <div className="flex items-center gap-2 mt-1 text-xs text-gray-500">
                  <Icon.Store/> {t.store}
                  {t.master && <><span className="text-gray-700">·</span><Icon.User/> {t.master}</>}
                  {t.empId && workHours?.[t.empId] != null && (
                    <span className={`ml-auto text-[10px] px-1.5 py-0.5 rounded border tabular-nums whitespace-nowrap ${warning ? 'bg-yellow-500/25 text-yellow-200 border-yellow-500/50' : 'bg-amber-500/10 text-amber-300 border-amber-500/20'}`}>⏱ {workHours[t.empId].hours}工时</span>
                  )}
                </div>
                <div className="mt-2 flex items-center gap-2">
                  <div className="flex-1 h-5 bg-gray-800 rounded-full overflow-hidden relative">
                    <div className={`h-full progress-bar-fill rounded-full flex items-center justify-end pr-2 ${displayPercent === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}`} style={{width: `${Math.max(displayPercent, 6)}%`}}>
                      {displayPercent >= 35 && prog.total > 0 && (
                        <span className="text-[10px] font-medium text-white/90 tabular-nums">{displayCompleted}/{prog.total}</span>
                      )}
                      {displayPercent === 100 && prog.total === 0 && (
                        <span className="text-[10px] font-medium text-white/90 tabular-nums">已认证</span>
                      )}
                    </div>
                    {displayPercent < 35 && prog.total > 0 && (
                      <span className="absolute inset-y-0 right-2 flex items-center text-[10px] text-gray-500 tabular-nums">{displayCompleted}/{prog.total}</span>
                    )}
                  </div>
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Main Content - Training Calendar */}
      <div className="flex-1 overflow-y-auto scrollbar-thin">
        {!selected ? (
          <div className="flex items-center justify-center h-full text-gray-500">
            <div className="text-center">
              <Icon.Calendar width={48} height={48} className="mx-auto mb-3 opacity-30"/>
              <p className="text-lg">请从左侧选择学员</p>
              <p className="text-sm mt-1">或点击「新增学员」开始带训追踪</p>
            </div>
          </div>
        ) : (
          <div className="max-w-3xl mx-auto p-6">
            {/* Trainee Info Header */}
            <div className="bg-gray-900/50 border border-gray-800 rounded-2xl p-5 mb-5">
              <div className="flex items-start justify-between">
                <div>
                  <div className="flex items-center gap-3">
                    <h2 className="text-xl font-bold text-white">{selected.name}</h2>
                    <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-400 border border-indigo-500/30">
                      {getRouteName(selected.route, selected.subRoute)}
                    </span>
                  </div>
                  <div className="flex items-center gap-4 mt-2 text-sm text-gray-400">
                    <span className="flex items-center gap-1"><Icon.Store/> {selected.store}</span>
                    {selected.master && <span className="flex items-center gap-1"><Icon.User/> 师傅: {selected.master}</span>}
                    {selected.startDate && <span className="flex items-center gap-1"><Icon.Calendar width={14} height={14}/> 入职: {selected.startDate}</span>}
                    {selected.empId && <span className="flex items-center gap-1 tabular-nums"><Icon.IdCard width={14} height={14}/> 工号: {selected.empId}</span>}
                    {selected.empId && workHours?.[selected.empId] != null && (
                      <span className="flex items-center gap-1 px-2 py-0.5 rounded-md bg-amber-500/10 border border-amber-500/25 text-amber-300 tabular-nums">
                        <Icon.Clock width={14} height={14}/> 累计工时: <span className="font-semibold">{workHours[selected.empId].hours}</span>
                      </span>
                    )}
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={() => { setEditingTrainee(selected); setShowModal(true); }} className="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white transition">
                    <Icon.Edit/>
                  </button>
                  <button onClick={() => {
                    if (confirm(`确认删除学员「${selected.name}」？此操作不可撤销。`)) {
                      onDeleteTrainee(selected.id);
                    }
                  }} className="p-2 rounded-lg bg-gray-800 hover:bg-red-500/20 text-gray-400 hover:text-red-400 transition">
                    <Icon.Trash/>
                  </button>
                </div>
              </div>

              {/* Progress Summary */}
              {progressInfo && (
                <div className="mt-4 grid grid-cols-4 gap-3">
                  <div className="bg-gray-800/40 rounded-lg p-3">
                    <div className="text-xs text-gray-500">总进度</div>
                    <div className="text-2xl font-bold text-white mt-1">{progressInfo.percent}%</div>
                  </div>
                  <div className="bg-gray-800/40 rounded-lg p-3">
                    <div className="text-xs text-gray-500">已完成</div>
                    <div className="text-2xl font-bold text-emerald-400 mt-1">{progressInfo.completed}<span className="text-sm text-gray-600">/{progressInfo.total}</span></div>
                  </div>
                  <div className="bg-gray-800/40 rounded-lg p-3">
                    <div className="text-xs text-gray-500">当前阶段</div>
                    <div className="text-sm font-medium text-amber-400 mt-1.5">
                      {currentDay ? `${currentDay.monthName} · ${currentDay.phaseName}` : '全部完成'}
                    </div>
                  </div>
                  <div className="bg-gray-800/40 rounded-lg p-3">
                    <div className="text-xs text-gray-500">剩余天数</div>
                    <div className="text-2xl font-bold text-indigo-400 mt-1">{Math.max(0, progressInfo.total - progressInfo.completed)}</div>
                  </div>
                </div>
              )}
            </div>

            {/* Day Cards */}
            <div className="space-y-3">
              {allDays.map((day, idx) => {
                const unlocked = isDayUnlocked(selected, day.key);
                const dayProgress = selected.progress?.[day.key];
                const isCurrent = currentDay?.key === day.key;
                return (
                  <div
                    key={selected.id + '_' + day.key}
                    ref={(el) => { dayRefs.current[day.key] = el; }}
                  >
                    {isCurrent && (
                      <div className="flex items-center gap-2 px-1 mb-2 text-xs text-amber-400">
                        <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                        当前带训进度
                      </div>
                    )}
                    <DayCard
                      key={selected.id + '_' + day.key}
                      day={day}
                      dayProgress={dayProgress}
                      unlocked={unlocked}
                      onToggleItem={handleToggleItem}
                      onCompleteDay={handleCompleteDay}
                      trainee={selected}
                    />
                  </div>
                );
              })}

              {!currentDay && progressInfo?.percent === 100 && (
                <div className="text-center py-8">
                  <div className="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                    <Icon.Award/> 全部带训已完成！
                  </div>
                </div>
              )}
            </div>

            {/* Notes */}
            <div className="mt-6 p-4 bg-gray-900/30 border border-gray-800 rounded-xl text-xs text-gray-500 leading-relaxed">
              <div className="font-medium text-gray-400 mb-1">带训说明</div>
              <div>• 学习不可跳跃，完成当天全部项目后自动解锁下一天</div>
              <div>• 绿色=学习 蓝色=练习 黄色=工作站认证 红色=岗位认证</div>
              <div>• 员工当天休息，学习任务自动顺延</div>
              <div>• 工作站认证未通过者需持续练习，通过后方可进入下一阶段</div>
            </div>
          </div>
        )}
      </div>

      <TraineeModal
        open={showModal}
        onClose={() => setShowModal(false)}
        onSave={handleSave}
        editing={editingTrainee}
        stores={stores}
      />
    </div>
  );
}

// ============ Dashboard View ============
function localDateStr(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function timeStr(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function daysBetween(dateStrA, dateStrB) {
  const a = new Date(dateStrA + 'T00:00:00');
  const b = new Date(dateStrB + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function calcNoCheckInStreak(t, today) {
  const dates = new Set();
  const progress = t.progress || {};
  Object.values(progress).forEach(day => {
    Object.values(day.items || {}).forEach(item => {
      if (item.checked && item.checkedAt) dates.add(localDateStr(item.checkedAt));
    });
    if (day.completed && day.completedAt) dates.add(localDateStr(day.completedAt));
  });

  if (dates.size === 0) {
    if (t.startDate) {
      const days = Math.max(1, daysBetween(t.startDate, today));
      return { days, label: `连续${days}天未打卡` };
    }
    return { days: 9999, label: '从未打卡' };
  }

  const sorted = [...dates].sort();
  const lastDate = sorted[sorted.length - 1];
  if (lastDate >= today) return { days: 0, label: '今日已打卡' };
  const days = daysBetween(lastDate, today);
  return { days, label: `连续${days}天未打卡` };
}

function DashboardView({ trainees, stores, workHours, onUpdateNote }) {
  const [filterStore, setFilterStore] = useState('');
  const [filterRoute, setFilterRoute] = useState('');
  const [sortBy, setSortBy] = useState('progress');
  const [expandedRow, setExpandedRow] = useState(null);

  const filtered = useMemo(() => {
    let list = trainees.filter(t => {
      if (filterStore && t.store !== filterStore) return false;
      if (filterRoute && t.route !== filterRoute) return false;
      return true;
    });
    list = list
      .filter(t => !isCertified(t)) // 看板明细只显示未完成（未认证）学员
      .map(t => ({ ...t, _progress: calcProgress(t), _currentDay: getCurrentDay(t) }));
    if (sortBy === 'progress') list.sort((a, b) => b._progress.percent - a._progress.percent);
    else if (sortBy === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
    else if (sortBy === 'store') list.sort((a, b) => a.store.localeCompare(b.store));
    return list;
  }, [trainees, filterStore, filterRoute, sortBy]);

  const stats = useMemo(() => {
    const total = trainees.length;
    const inProgress = trainees.filter(t => {
      const p = calcProgress(t);
      return p.completed > 0 && p.percent < 100;
    }).length;
    const completed = trainees.filter(t => isCertified(t)).length;
    const notStarted = trainees.filter(t => !isCertified(t) && calcProgress(t).completed === 0).length;
    const avgProgress = total > 0 ? Math.round(trainees.reduce((sum, t) => sum + calcProgress(t).percent, 0) / total) : 0;
    return { total, inProgress, completed, notStarted, avgProgress };
  }, [trainees]);

  // Group by store (total includes certified trainees; completion rate = certified / total)
  const storeStats = useMemo(() => {
    const map = {};
    trainees.forEach(t => {
      if (!map[t.store]) map[t.store] = { store: t.store, total: 0, certified: 0, inProgress: 0 };
      const certified = isCertified(t);
      const p = calcProgress(t);
      map[t.store].total++;
      if (certified) map[t.store].certified++;
      else if (p.completed > 0) map[t.store].inProgress++;
    });
    return Object.values(map).map(s => ({ ...s, completionRate: s.total > 0 ? Math.round((s.certified / s.total) * 100) : 0 }));
  }, [trainees]);

  // Phase distribution
  const phaseDist = useMemo(() => {
    const dist = {};
    trainees.forEach(t => {
      const cd = getCurrentDay(t);
      const phase = cd ? cd.phaseName : '已完成';
      dist[phase] = (dist[phase] || 0) + 1;
    });
    return Object.entries(dist).sort((a, b) => {
      const order = ['第一阶段', '第二阶段', '第三阶段', '第四阶段', '已完成'];
      return order.indexOf(a[0]) - order.indexOf(b[0]);
    });
  }, [trainees]);

  // Yesterday & today check-in stats (dashboard shows both)
  const yesterdayAndTodayStats = useMemo(() => {
    const yesterday = yesterdayStr();
    const today = localDateStr(new Date().toISOString());
    const yesterdayChecked = [];
    const yesterdayUnchecked = [];
    const todayChecked = [];
    trainees.forEach(t => {
      // Yesterday
      let yCount = 0;
      let yLastTime = '';
      let yCompletedDay = false;
      // Today
      let tCount = 0;
      let tLastTime = '';
      let tCompletedDay = false;
      const progress = t.progress || {};
      Object.values(progress).forEach(day => {
        Object.values(day.items || {}).forEach(item => {
          if (item.checked && item.checkedAt) {
            const d = localDateStr(item.checkedAt);
            if (d === yesterday) {
              yCount++;
              if (item.checkedAt > yLastTime) yLastTime = item.checkedAt;
            } else if (d === today) {
              tCount++;
              if (item.checkedAt > tLastTime) tLastTime = item.checkedAt;
            }
          }
        });
        if (day.completed && day.completedAt) {
          const d = localDateStr(day.completedAt);
          if (d === yesterday) {
            yCompletedDay = true;
            if (day.completedAt > yLastTime) yLastTime = day.completedAt;
          } else if (d === today) {
            tCompletedDay = true;
            if (day.completedAt > tLastTime) tLastTime = day.completedAt;
          }
        }
      });
      const baseEntry = { id: t.id, name: t.name, store: t.store, note: t.note || '', empId: t.empId, route: t.route, subRoute: t.subRoute };
      const yEntry = { ...baseEntry, count: yCount, lastTime: yLastTime, completedDay: yCompletedDay };
      const tEntry = { ...baseEntry, count: tCount, lastTime: tLastTime, completedDay: tCompletedDay };
      // 已打卡必须以至少勾选1项为准，仅确认完成但没勾选项不算打卡
      if (yCount > 0) yesterdayChecked.push(yEntry);
      else {
        // 已完成全部带训的人员不再出现在未打卡列表中
        if (getCurrentDay(t) === null) return;
        const streak = calcNoCheckInStreak(t, today);
        yesterdayUnchecked.push({ ...yEntry, streakDays: streak.days, streakLabel: streak.label });
      }
      if (tCount > 0) todayChecked.push(tEntry);
    });
    yesterdayChecked.sort((a, b) => b.count - a.count);
    yesterdayUnchecked.sort((a, b) => b.streakDays - a.streakDays);
    todayChecked.sort((a, b) => b.count - a.count);
    return { yesterdayChecked, yesterdayUnchecked, todayChecked, yesterday, today };
  }, [trainees]);

  const hourWarnings = useMemo(() => {
    return trainees
      .map(t => {
        const h = workHours?.[t.empId]?.hours;
        const w = getWorkHoursWarning(t, h);
        return w ? { ...t, _warning: w, _progress: calcProgress(t) } : null;
      })
      .filter(Boolean)
      .sort((a, b) => b._warning.hours - a._warning.hours);
  }, [trainees, workHours]);


  return (
    <div className="overflow-y-auto scrollbar-thin h-[calc(100vh-60px)]">
      <div className="max-w-6xl mx-auto p-6">
        {/* Stats Cards */}
        <div className="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6">
          <div className="bg-gradient-to-br from-indigo-600/20 to-indigo-700/5 border border-indigo-500/20 rounded-xl p-4">
            <div className="text-xs text-indigo-300/70">学员总数</div>
            <div className="text-3xl font-bold text-white mt-1">{stats.total}</div>
          </div>
          <div className="bg-gradient-to-br from-emerald-500/20 to-emerald-600/5 border border-emerald-500/20 rounded-xl p-4">
            <div className="text-xs text-emerald-300/70">昨日已打卡</div>
            <div className="text-3xl font-bold text-emerald-400 mt-1">
              {yesterdayAndTodayStats.yesterdayChecked.length}
              <span className="text-sm text-gray-500 font-normal">/{stats.total}</span>
            </div>
          </div>
          <div className="bg-gradient-to-br from-rose-500/15 to-rose-600/5 border border-rose-500/20 rounded-xl p-4">
            <div className="text-xs text-rose-300/70">昨日未打卡</div>
            <div className="text-3xl font-bold text-rose-400 mt-1">
              {yesterdayAndTodayStats.yesterdayUnchecked.length}
              <span className="text-sm text-gray-500 font-normal">/{stats.total}</span>
            </div>
          </div>
          <div className="bg-gradient-to-br from-amber-500/20 to-amber-600/5 border border-amber-500/20 rounded-xl p-4">
            <div className="text-xs text-amber-300/70">带训中</div>
            <div className="text-3xl font-bold text-amber-400 mt-1">{stats.inProgress}</div>
          </div>
          <div className="bg-gradient-to-br from-gray-600/20 to-gray-700/5 border border-gray-500/20 rounded-xl p-4">
            <div className="text-xs text-gray-400">未开始</div>
            <div className="text-3xl font-bold text-gray-300 mt-1">{stats.notStarted}</div>
          </div>
          <div className="bg-gradient-to-br from-purple-600/20 to-purple-700/5 border border-purple-500/20 rounded-xl p-4">
            <div className="text-xs text-purple-300/70">平均进度</div>
            <div className="text-3xl font-bold text-purple-400 mt-1">{stats.avgProgress}%</div>
          </div>
        </div>

        {/* 工时预警 */}
        {hourWarnings.length > 0 && (
          <div className="bg-yellow-500/5 border border-yellow-500/20 rounded-xl p-4 mb-6">
            <h3 className="text-sm font-medium text-yellow-300 mb-3 flex items-center gap-2"><Icon.Clock/> 工时预警</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 max-h-64 overflow-y-auto scrollbar-thin pr-1">
              {hourWarnings.map(t => (
                <div key={t.id} className="flex items-center justify-between bg-gray-900/50 border border-yellow-500/15 rounded-lg px-3 py-2">
                  <div className="min-w-0">
                    <div className="flex items-center gap-2">
                      <span className="text-sm text-white font-medium">{t.name}</span>
                      <span className="text-[10px] px-1.5 py-0.5 rounded bg-yellow-500/15 text-yellow-300">{t._warning.isPartTime ? '兼职' : '全职'}</span>
                    </div>
                    <div className="text-xs text-gray-500 truncate">{t.store} · 进度 {t._progress.percent}%</div>
                  </div>
                  <div className="text-right flex-shrink-0">
                    <div className="text-sm font-bold text-yellow-300 tabular-nums">{t._warning.hours}h</div>
                    <div className="text-[10px] text-gray-500">上限 {t._warning.limit}h</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Yesterday + Today Check-in Panel */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-5 mb-6">
          <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2">
            <Icon.Clock/> 昨日带训打卡 · {yesterdayAndTodayStats.yesterday}
          </h3>
          {/* Row 1: 昨日已打卡 | 今日已打卡 */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
            {/* Checked yesterday */}
            <div>
              <div className="text-xs font-medium text-emerald-400 mb-2 flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                昨日已打卡（{yesterdayAndTodayStats.yesterdayChecked.length}人）
              </div>
              <div className="space-y-1.5 max-h-56 overflow-y-auto scrollbar-thin pr-1">
                {yesterdayAndTodayStats.yesterdayChecked.length === 0 ? (
                  <div className="text-xs text-gray-600 py-3 text-center border border-dashed border-gray-800 rounded-lg">昨天还没有人打卡</div>
                ) : yesterdayAndTodayStats.yesterdayChecked.map(p => (
                  <div key={p.id} className="flex items-center justify-between bg-emerald-500/5 border border-emerald-500/20 rounded-lg px-3 py-2">
                    <div className="flex items-center gap-2 min-w-0">
                      <span className="text-sm text-white font-medium">{p.name}</span>
                      <span className="text-xs text-gray-500 truncate">{p.store}</span>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      {p.empId && workHours?.[p.empId] != null && <span className="text-xs text-amber-300/80 tabular-nums">⏱ {workHours[p.empId].hours}h</span>}
                      <span className="text-xs px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300">{countCerts(p)}证</span>
                      <span className="text-xs px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300">勾了{p.count}项</span>
                      {p.lastTime && <span className="text-xs text-gray-500">{timeStr(p.lastTime)}</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
            {/* Checked today */}
            <div>
              <div className="text-xs font-medium text-sky-400 mb-2 flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-sky-500 inline-block"></span>
                今日已打卡（{yesterdayAndTodayStats.todayChecked.length}人）
              </div>
              <div className="space-y-1.5 max-h-56 overflow-y-auto scrollbar-thin pr-1">
                {yesterdayAndTodayStats.todayChecked.length === 0 ? (
                  <div className="text-xs text-gray-600 py-3 text-center border border-dashed border-gray-800 rounded-lg">今天还没有人打卡</div>
                ) : yesterdayAndTodayStats.todayChecked.map(p => (
                  <div key={p.id} className="flex items-center justify-between bg-sky-500/5 border border-sky-500/20 rounded-lg px-3 py-2">
                    <div className="flex items-center gap-2 min-w-0">
                      <span className="text-sm text-white font-medium">{p.name}</span>
                      <span className="text-xs text-gray-500 truncate">{p.store}</span>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      {p.empId && workHours?.[p.empId] != null && <span className="text-xs text-amber-300/80 tabular-nums">⏱ {workHours[p.empId].hours}h</span>}
                      <span className="text-xs px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300">{countCerts(p)}证</span>
                      <span className="text-xs px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300">勾了{p.count}项</span>
                      {p.lastTime && <span className="text-xs text-gray-500">{timeStr(p.lastTime)}</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          {/* Row 2: 昨日未打卡 */}
          <div>
            <div className="text-xs font-medium text-rose-400 mb-2 flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>
              昨日未打卡（{yesterdayAndTodayStats.yesterdayUnchecked.length}人）
            </div>
            <div className="space-y-1.5 max-h-56 overflow-y-auto scrollbar-thin pr-1">
              {yesterdayAndTodayStats.yesterdayUnchecked.length === 0 ? (
                <div className="text-xs text-gray-600 py-3 text-center border border-dashed border-gray-800 rounded-lg">昨天全员已打卡 👍</div>
              ) : yesterdayAndTodayStats.yesterdayUnchecked.map(p => (
                <div key={p.id} className="flex items-center gap-2 bg-rose-500/5 border border-rose-500/15 rounded-lg px-3 py-2">
                  <div className="flex items-center gap-2 min-w-0 flex-1">
                    <span className="text-sm text-gray-300 font-medium">{p.name}</span>
                    <span className="text-xs text-gray-600 truncate">{p.store}</span>
                  </div>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    {p.empId && workHours?.[p.empId] != null && <span className="text-xs text-amber-300/80 tabular-nums">⏱ {workHours[p.empId].hours}h</span>}
                    <span className="text-xs px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300">{countCerts(p)}证</span>
                  </div>
                  <input
                    type="text"
                    defaultValue={p.note}
                    onBlur={e => onUpdateNote && onUpdateNote(p.id, e.target.value.trim())}
                    placeholder="备注原因"
                    className="w-28 md:w-48 bg-gray-800/60 border border-gray-700 rounded px-2 py-1 text-xs text-gray-300 placeholder-gray-600 focus:border-rose-400/50 focus:outline-none"
                  />
                  <span className="text-xs px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 flex-shrink-0">{p.streakLabel}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Charts Row */}
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
          {/* Store Progress */}
          <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-5">
            <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2">
              <Icon.Store/> 各门店带训进度
            </h3>
            {storeStats.length === 0 ? (
              <div className="text-center text-gray-500 text-sm py-6">暂无数据</div>
            ) : (
              <div className="space-y-3">
                {storeStats.map(s => (
                  <div key={s.store}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-sm text-gray-300">{s.store}</span>
                      <span className="text-xs text-gray-500">总人数 {s.total} 人 · 已认证 {s.certified} 人 · 完成率 {s.completionRate}%</span>
                    </div>
                    <div className="h-2.5 bg-gray-800 rounded-full overflow-hidden">
                      <div className="h-full bg-gradient-to-r from-indigo-500 to-indigo-400 progress-bar-fill rounded-full" style={{width: `${s.completionRate}%`}}></div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Phase Distribution */}
          <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-5">
            <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2">
              <Icon.TrendUp/> 带训阶段分布
            </h3>
            {phaseDist.length === 0 ? (
              <div className="text-center text-gray-500 text-sm py-6">暂无数据</div>
            ) : (
              <div className="space-y-2">
                {phaseDist.map(([phase, count]) => {
                  const max = Math.max(...phaseDist.map(p => p[1]));
                  const width = (count / max) * 100;
                  const colors = {
                    '第一阶段': 'bg-blue-500',
                    '第二阶段': 'bg-purple-500',
                    '第三阶段': 'bg-amber-500',
                    '第四阶段': 'bg-red-500',
                    '已完成': 'bg-emerald-500'
                  };
                  return (
                    <div key={phase} className="flex items-center gap-3">
                      <span className="text-xs text-gray-400 w-16 text-right">{phase}</span>
                      <div className="flex-1 h-6 bg-gray-800 rounded-md overflow-hidden relative">
                        <div className={`h-full ${colors[phase] || 'bg-gray-500'} progress-bar-fill rounded-md flex items-center justify-end pr-2`} style={{width: `${Math.max(width, 8)}%`}}>
                          <span className="text-xs font-bold text-white">{count}</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>

        {/* Detailed Table */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl overflow-hidden">
          <div className="flex items-center justify-between p-4 border-b border-gray-800">
            <h3 className="text-sm font-medium text-gray-300 flex items-center gap-2">
              <Icon.Dashboard/> 学员带训明细
            </h3>
            <div className="flex items-center gap-2">
              <select value={filterStore} onChange={e=>setFilterStore(e.target.value)}
                className="bg-gray-800 border border-gray-700 rounded-lg px-2 py-1.5 text-xs text-gray-300">
                <option value="">全部门店</option>
                {stores.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <select value={filterRoute} onChange={e=>setFilterRoute(e.target.value)}
                className="bg-gray-800 border border-gray-700 rounded-lg px-2 py-1.5 text-xs text-gray-300">
                <option value="">全部路线</option>
                {TRAINING_DATA.routes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
              </select>
              <select value={sortBy} onChange={e=>setSortBy(e.target.value)}
                className="bg-gray-800 border border-gray-700 rounded-lg px-2 py-1.5 text-xs text-gray-300">
                <option value="progress">按进度排序</option>
                <option value="name">按姓名排序</option>
                <option value="store">按门店排序</option>
              </select>
            </div>
          </div>

          <div className="overflow-x-auto scrollbar-thin">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs text-gray-500 border-b border-gray-800">
                  <th className="text-left px-4 py-3 font-medium">学员</th>
                  <th className="text-left px-4 py-3 font-medium">门店</th>
                  <th className="text-left px-4 py-3 font-medium">路线</th>
                  <th className="text-left px-4 py-3 font-medium">师傅</th>
                  <th className="text-left px-4 py-3 font-medium">当前阶段</th>
                  <th className="text-left px-4 py-3 font-medium">进度</th>
                  <th className="text-left px-4 py-3 font-medium">完成/总天数</th>
                  <th className="text-left px-4 py-3 font-medium">最近完成</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr>
                    <td colSpan="8" className="text-center text-gray-500 py-8">暂无数据</td>

                ) : filtered.map(t => {
                  const route = TRAINING_DATA.routes.find(r => r.id === t.route);
                  const prog = t._progress;
                  const cd = t._currentDay;
                  const allDays = getAllDays(t.route, t.subRoute).filter(d => d.items.length > 0);
                  // Find last completed day
                  let lastCompleted = null;
                  for (const d of allDays) {
                    const dp = t.progress?.[d.key];
                    if (dp?.completed) lastCompleted = dp;
                  }
                  const statusColor = prog.percent === 100 ? 'text-emerald-400' : prog.completed > 0 ? 'text-amber-400' : 'text-gray-500';
                  return (
                    <React.Fragment key={t.id}>
                      <tr className="border-b border-gray-800/50 hover:bg-gray-800/30 transition cursor-pointer" onClick={() => setExpandedRow(expandedRow === t.id ? null : t.id)}>
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-2">
                            <span className="text-white font-medium">{t.name}</span>
                            {expandedRow === t.id ? <Icon.ChevronDown width={12} height={12} className="text-gray-500"/> : <Icon.ChevronRight width={12} height={12} className="text-gray-500"/>}
                          </div>
                        </td>
                        <td className="px-4 py-3 text-gray-400">{t.store}</td>
                        <td className="px-4 py-3"><span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400">{getRouteName(t.route, t.subRoute)}</span></td>
                        <td className="px-4 py-3 text-gray-400">{t.master || '-'}</td>
                        <td className="px-4 py-3 text-gray-400 text-xs">
                          {cd ? `${cd.monthName} · ${cd.phaseName} · 第${cd.day}天` : '已完成'}
                        </td>
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-2">
                            <div className="w-24 h-1.5 bg-gray-800 rounded-full overflow-hidden">
                              <div className={`h-full progress-bar-fill rounded-full ${prog.percent === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}`} style={{width: `${prog.percent}%`}}></div>
                            </div>
                            <span className={`text-xs font-medium ${statusColor}`}>{prog.percent}%</span>
                          </div>
                        </td>
                        <td className="px-4 py-3 text-gray-400 tabular-nums text-xs">{prog.completed}/{prog.total}</td>
                        <td className="px-4 py-3 text-gray-500 text-xs">
                          {lastCompleted ? new Date(lastCompleted.completedAt).toLocaleDateString('zh-CN') : '-'}
