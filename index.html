<style>
/* ==================== 移动端 / 折叠屏自适应 ==================== */
/* 顶栏实际高度由脚本写入 --tt-hdr，内容区高度全部按它计算：
   展开折叠屏、横竖屏切换、微信内置浏览器地址栏收起，都能自动跟着变。
   三档：≤639 单屏手机（两行顶栏 + 列表抽屉）；640~1023 折叠屏展开/平板（单行顶栏 + 窄侧栏双栏）；≥1024 桌面原样 */
:root { --tt-hdr: 60px; }

.tt-h-app {
  height: calc(100vh - var(--tt-hdr, 60px));
  height: calc(100dvh - var(--tt-hdr, 60px));
}
.tt-frame {
  height: calc(100vh - 84px);
  height: calc(100dvh - var(--tt-hdr, 60px) - 24px);
}

/* 桌面端顶栏高度保持原样（原 h-[60px] 已由本类接管） */
.tt-hdr-row { height: 60px; }

/* 顶栏单行：导航横向可滚，绝不换行挤压 */
.tt-nav { scrollbar-width: none; -ms-overflow-style: none; }

/* 手机端学员列表入口条：默认隐藏，仅单屏手机显示 */

/* ---------- 640~1023：折叠屏展开 / 平板（单行顶栏 + 窄侧栏双栏） ---------- */
@media (max-width: 1023px) {
  :root { --tt-hdr: 58px; }

  .tt-hdr-row {

    padding-right: 12px !important;

  .tt-hl { flex: 1 1 auto !important; min-width: 0 !important; gap: 8px !important; }

  .tt-logo-name { font-size: 14px !important; max-width: 7em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tt-logo-sub { display: none !important; }

  .tt-hl { order: 1 !important; }
  .tt-nav {
    order: 2 !important;
    flex: 1 1 auto !important;
    min-width: 0 !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    -webkit-overflow-scrolling: touch;
    gap: 2px !important;
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 12px), transparent 100%);
    mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 12px), transparent 100%);
  }
  .tt-nav > button {
    flex: 0 0 auto !important;
    white-space: nowrap;
    padding: 7px 10px !important;
    font-size: 13px !important;
    gap: 5px !important;
  }
  .tt-hr { order: 3 !important; margin-left: auto; flex-shrink: 0 !important; gap: 8px !important; }
  .tt-hide-sm { display: none !important; }
  .tt-stat { display: none !important; }

  /* 详情区留白收紧 */
  .tt-detail { padding: 16px !important; }
  .tt-detail-head { flex-wrap: wrap; row-gap: 10px; }
  .tt-detail-head > div:first-child { flex: 1 1 auto; min-width: 0; }

  .tt-actions button { white-space: nowrap; }
  .tt-meta { flex-wrap: wrap !important; row-gap: 6px !important; column-gap: 12px !important; }
}

/* 折叠屏展开 / 平板：侧栏收窄，仍然并排 */
@media (min-width: 640px) and (max-width: 1023px) {
  .tt-side { width: 260px !important; }

/* ---------- ≤639：单屏手机（两行顶栏 + 列表抽屉） ---------- */
@media (max-width: 639px) {
  :root { --tt-hdr: 96px; }

  }

  .tt-side-mask {
    position: fixed;

  }

  .tt-mbar {

  }

  .tt-detail { padding: 10px !important; }

  .grid-cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
}

@media (max-width: 767px) {
  .grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }

const STORAGE_KEY = 'training_tracker_data_v2';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return normalizeData(parsed);
    }
  } catch(e) {}
  // First-time: return empty — will be populated by cloud sync
  return { trainees: [], _deletedIds: [] };
}

// Normalize legacy data: ensure every trainee has an area field (default '000')
function normalizeData(data) {
  if (!data || typeof data !== 'object') return { trainees: [], _deletedIds: [] };

    ...data,
    trainees: (data.trainees || []).map(t => ({ ...t, area: t.area || '000' }))
  };
}

// DB row → trainee object
function rowToTrainee(row) {
  let subRoute = row.sub_route || row.progress?._meta?.subRoute || '';
  // 兼容旧数据：subRoute 未单独持久化时，从 progress 的 day key 反推
  if (!subRoute && row.route === 'part_time' && row.progress) {
    const keys = Object.keys(row.progress).filter(k => k.startsWith('part_time_'));
    if (keys.length > 0) {
      const m = keys[0].match(/^part_time_(.+?)_\d+-\d+-\d+$/);
      if (m) subRoute = m[1];
    }
  }
  return {
    id: row.id,
    name: row.name,
    store: row.store,
    route: row.route,
    subRoute: subRoute || '',
    startDate: row.start_date,
    master: row.master,
    area: row.area || '000',
    note: row.note || '',
    empId: row.emp_id || '',
    pastHours: Number(row.progress?._meta?.pastHours) || 0,
    progress: row.progress || {},
    createdAt: row.created_at || new Date().toISOString(),
    _updatedAt: row.updated_at || 0
  };
}

// trainee object → DB row
function traineeToRow(t) {
  // 数据库暂无 sub_route 列，先把 subRoute 存进 progress._meta，保证多设备同步不丢
  const progress = { ...(t.progress || {}) };
  progress._meta = { ...(progress._meta || {}), subRoute: t.subRoute || '', pastHours: Number(t.pastHours) || 0 };
  return {
    id: t.id,
    name: t.name || '',
    store: t.store || '',
    route: t.route || 'front_to_back',
    start_date: t.startDate || '',
    master: t.master || '',
    area: t.area || '000',
    note: t.note || '',
    emp_id: t.empId || '',
    progress: progress,
    deleted: false,
    updated_at: t._updatedAt || Date.now()
  };
}

// Merge trainees at progress-day level (prevents data loss from concurrent edits)
// Merge day-level progress: preserve checked items and completed status from BOTH sides
function mergeDayProgress(lProgress, rProgress) {
  const allDays = new Set([...Object.keys(lProgress || {}), ...Object.keys(rProgress || {})]);
  const merged = {};
  for (const day of allDays) {
    // _meta 是进度元数据（subRoute / 离职标记等），不参与 day 级合并
    if (day === '_restDays') { merged._restDays = Array.from(new Set([...(lProgress?._restDays || []), ...(rProgress?._restDays || [])])).sort(); continue; }
    if (day === '_phaseSign') {
      const ls = lProgress?._phaseSign || {}, rs = rProgress?._phaseSign || {};
      const ps = {};
      for (const pk of new Set([...Object.keys(ls), ...Object.keys(rs)])) {
        const lv = ls[pk] || {}, rv = rs[pk] || {};
        const one = {};
        for (const role of ['student', 'manager']) {
          const a = lv[role], b = rv[role];
          if (!a) one[role] = b;
          else if (!b) one[role] = a;
          else one[role] = ((Date.parse(b.at || 0) || 0) >= (Date.parse(a.at || 0) || 0)) ? b : a;
        }
        ps[pk] = one;
      }
      merged._phaseSign = ps; continue;
    }
    if (day === '_meta') {
      const lm = lProgress?._meta || {};
      const rm = rProgress?._meta || {};
      const lmTs = lm.resignedAt || '';
      const rmTs = rm.resignedAt || '';
      // last-write-wins：按 resignedAt 时间戳比较，新的赢。
      // 不能简单 spread（remote 永远赢）——否则"恢复在职"会被其他设备的旧 resigned:true 覆盖。
      let winner;
      if (!lmTs && !rmTs) winner = { ...lm, ...rm };
      else if (rmTs >= lmTs) winner = { ...lm, ...rm };
      else winner = { ...rm, ...lm };
      merged._meta = winner;
      continue;
    }
    const lp = lProgress?.[day] || {};
    const rp = rProgress?.[day] || {};

    // Per-day timestamp: newer side wins for completion status
    const lTs = lp._updatedAt || 0;
    const rTs = rp._updatedAt || 0;
    const newer = rTs >= lTs ? rp : lp;
    const older = rTs >= lTs ? lp : rp;

    const dayMerged = {};

    // 1) Completion status comes from the newer side (so unchecking can propagate)
    if (newer.completed) {
      dayMerged.completed = true;
      dayMerged.completedAt = newer.completedAt || new Date().toISOString();
      dayMerged.masterSignature = newer.masterSignature || '';
      dayMerged.signatureAt = newer.signatureAt || new Date().toISOString();
    }

    // 2) Merge item-level checks: newer operation wins (check OR uncheck)
    //    每个勾选项带时间戳，最后操作的设备说了算；
    //    取消勾选会留下 checked:false 的痕迹（tombstone），确保取消也能同步
    const items = {};
    const allItemKeys = new Set([...Object.keys(lp.items || {}), ...Object.keys(rp.items || {})]);
    for (const idx of allItemKeys) {
      const li = lp.items?.[idx] || {};
      const ri = rp.items?.[idx] || {};
      const lTs = li.checkedAt || '';
      const rTs = ri.checkedAt || '';
      const winner = (rTs >= lTs) ? ri : li;
      // 保留痕迹（即使 checked:false），否则下次合并时另一台设备的旧勾选会复活
      const itemMerged = {
        checked: !!winner.checked,
        checkedAt: winner.checkedAt || new Date().toISOString(),
        choice: winner.choice || undefined
      };
      // 刻意练习打卡记录：按 drillIdx + date 取并集，不能整条丢弃。
      // 同一天若两侧都有记录，取操作时间(at)较新的一条；撤销用 deleted 墓碑传播。
      const ldr = li.drillRecords || {};
      const rdr = ri.drillRecords || {};
      const drillIdxs = new Set([...Object.keys(ldr), ...Object.keys(rdr)]);
      if (drillIdxs.size > 0) {
        const dm = {};
        for (const dk of drillIdxs) {
          const byDate = {};
          const allRec = [...(ldr[dk] || []), ...(rdr[dk] || [])];
          for (const r of allRec) {
            if (!r || !DRILL_DATE_RE.test(r.date || '')) continue;
            const prev = byDate[r.date];
            if (!prev) { byDate[r.date] = r; continue; }
            // deleted 墓碑优先；同类则取 at 较新者
            const rScore = (r.deleted ? 1e13 : 0) + (Date.parse(r.at || 0) || 0);
            const pScore = (prev.deleted ? 1e13 : 0) + (Date.parse(prev.at || 0) || 0);
            if (rScore >= pScore) byDate[r.date] = r;
          }
          dm[dk] = Object.keys(byDate).sort().map(k => byDate[k]);
        }
        itemMerged.drillRecords = dm;
      }
      items[idx] = itemMerged;
    }
    dayMerged.items = items;

    // 3) Merge training time: keep the newer side's value if either side has one
    if (newer.trainingTime || older.trainingTime) {
      dayMerged.trainingTime = newer.trainingTime || older.trainingTime;
    }

    // 3b) Merge delay marker by delayAt timestamp (last write wins, supports undo via future ts)
    if (lp.delayAt || rp.delayAt || lp.delayDates || rp.delayDates) {
      const winner = (rp.delayAt || '') >= (lp.delayAt || '') ? rp : lp;
      if (winner.delayAt) {
        dayMerged.delayed = !!winner.delayed;
        dayMerged.delayAt = winner.delayAt;
        dayMerged.delayNote = winner.delayNote || '';
      }
      // 历史延迟日期：双方并集，再按较新一侧的当前状态修正（撤销则移除当天，标记则补上）
      const dset = new Set([...(lp.delayDates || []), ...(rp.delayDates || [])]);
      if (winner.delayAt) {
        const ds = localDateStr(winner.delayAt);
        if (winner.delayed) dset.add(ds); else dset.delete(ds);
      }
      if (dset.size > 0) dayMerged.delayDates = [...dset].sort();
    }

    // 3c) Merge rest marker by restAt timestamp (same last-write-wins semantics)
    if (lp.restAt || rp.restAt || lp.restDates || rp.restDates) {
      const winner = (rp.restAt || '') >= (lp.restAt || '') ? rp : lp;
      if (winner.restAt) {
        dayMerged.rest = !!winner.rest;
        dayMerged.restAt = winner.restAt;
      }
      // 历史休息日期：双方并集，再按较新一侧的当前状态修正
      const rset = new Set([...(lp.restDates || []), ...(rp.restDates || [])]);
      if (winner.restAt) {
        const ds = localDateStr(winner.restAt);
        if (winner.rest) rset.add(ds); else rset.delete(ds);
      }
      if (rset.size > 0) dayMerged.restDates = [...rset].sort();
    }

    // 4) Preserve any other fields from the newer side
    for (const k of Object.keys(newer)) {
      if (!(k in dayMerged)) dayMerged[k] = newer[k];
    }
    // 5) Keep the newer _updatedAt so subsequent merges compare correctly
    dayMerged._updatedAt = Math.max(lTs, rTs);

    merged[day] = dayMerged;
  }
  return merged;
}

function mergeTrainees(localTrainees, remoteTrainees, localDeletedIds, remoteDeletedIds) {
  // Union of all deleted IDs — once deleted, stays deleted across all devices
  const deletedIds = new Set([...(localDeletedIds || []), ...(remoteDeletedIds || [])]);

  // Filter out deleted trainees from both sides BEFORE merging
  const localFiltered = localTrainees.filter(t => !deletedIds.has(t.id));
  const remoteFiltered = remoteTrainees.filter(t => !deletedIds.has(t.id));

  const localMap = new Map(localFiltered.map(t => [t.id, t]));
  const remoteMap = new Map(remoteFiltered.map(t => [t.id, t]));
  const result = [];
  const allIds = new Set([...localMap.keys(), ...remoteMap.keys()]);
  for (const id of allIds) {
    const lt = localMap.get(id);
    const rt = remoteMap.get(id);
    if (!lt) { result.push(rt); continue; }
    if (!rt) { result.push(lt); continue; }
    // Base: take newer version for basic info (name, store, route, master, etc.)
    const lTs = lt._updatedAt || 0;
    const rTs = rt._updatedAt || 0;
    const base = rTs >= lTs ? Object.assign({}, rt) : Object.assign({}, lt);
    // Merge progress at item/day level — both sides' checked items & completed days are preserved
    base.progress = mergeDayProgress(lt.progress, rt.progress);
    base._updatedAt = Math.max(lTs, rTs);
    result.push(base);
  }
  return { trainees: result, deletedIds: [...deletedIds] };
}

// Upsert specific trainees (batch 100 per request)
async function sbUpsertTrainees(trainees, ts) {
  if (!trainees || trainees.length === 0) return true;
  let list = trainees;
  const areaId = _sbWritableArea();
  if (areaId) {
    list = trainees.filter(t => String(t.area || '') === areaId);
    if (list.length < trainees.length) {
      console.log('[Supabase] 跳过', trainees.length - list.length, '条非本区域学员（当前账号', areaId, '无写入权限，不影响本区域同步）');
    }
    if (list.length === 0) return true;
  }
  const rows = list.map(t => traineeToRow({ ...t, _updatedAt: t._updatedAt || ts || Date.now() }));
  for (let i = 0; i < rows.length; i += 100) {
    const { error } = await supabase
      .from('trainees')
      .upsert(rows.slice(i, i + 100), { onConflict: 'id' });
    if (error) throw error;
  }
  return true;
}

// Soft-delete trainees (mark deleted=true so Realtime/poll never resurrects them)
async function sbSoftDeleteTrainees(ids, ts) {
  if (!ids || ids.length === 0) return true;
  const { error } = await supabase
    .from('trainees')
    .update({ deleted: true, updated_at: ts || Date.now() })
    .in('id', ids);
  if (error) throw error;
  return true;
}

let _sbRealtimeTimer = null;
let _sbRealtimeChannel = null;

// Subscribe to realtime changes. When any trainee row changes, debounce-pull latest data.
function sbSubscribeRealtime(onChange) {
  if (!supabase?.channel) {
    console.warn('[Supabase Realtime] client does not support channels');
    return null;
  }
  try {
    _sbRealtimeChannel = supabase
      .channel('trainees-changes')
      .on(
        'postgres_changes',
        { event: '*', schema: 'public', table: 'trainees' },
        (payload) => {
          const id = (payload.new && payload.new.id) || (payload.old && payload.old.id);
          console.log('[Supabase Realtime] event:', payload.eventType, id);
          if (_sbRealtimeTimer) clearTimeout(_sbRealtimeTimer);
          _sbRealtimeTimer = setTimeout(() => {
            try { onChange(); } catch(e) {}
          }, 1200);
        }
      )
      .subscribe((status) => {
        console.log('[Supabase Realtime] status:', status);
      });
    return () => {
      if (_sbRealtimeTimer) clearTimeout(_sbRealtimeTimer);
      if (_sbRealtimeChannel) {
        supabase.removeChannel(_sbRealtimeChannel).catch(() => {});
        _sbRealtimeChannel = null;
      }
    };
  } catch(e) {
    console.warn('[Supabase Realtime] subscribe failed:', e.message);
    return null;
  }
}

// Debounced push: diff prev vs new, upsert changed rows + soft-delete removed ones
function sbPushData(newData, prevData, ts) {
  if (_sbPushing) return false;
  if (_sbSaveTimer) clearTimeout(_sbSaveTimer);
  _sbSaveTimer = setTimeout(async () => {
    try {
      await _sbDoPush(newData, prevData, ts);
    } catch(e) {
      _sbNotifyPushStatus('error', e.message || '推送失败');
    }
  }, 1000);
  return true;
}

async function _sbDoPush(newData, prevData, ts) {
  if (_sbPushing) return false;
  if (!(await _sbHasSession())) return false; // logged out — nothing to push
  _sbPushing = true;
  _sbNotifyPushStatus('pushing', '');
  const pushTs = ts || Date.now();
  try {
    const prevTrainees = prevData?.trainees || [];
    const newTrainees = newData?.trainees || [];
    const prevMap = new Map(prevTrainees.map(t => [t.id, t]));
    const newMap = new Map(newTrainees.map(t => [t.id, t]));

    // Changed or added: in new but not in prev, or _updatedAt differs
    const changed = [];
    for (const t of newTrainees) {
      const p = prevMap.get(t.id);
      if (!p || (p._updatedAt || 0) !== (t._updatedAt || 0)) changed.push(t);
    }
    // Deleted: in prev but not in new
    const deletedIds = [];
    for (const t of prevTrainees) {
      if (!newMap.has(t.id)) deletedIds.push(t.id);
    }

    if (changed.length > 0) await sbUpsertTrainees(changed, pushTs);
    if (deletedIds.length > 0) await sbSoftDeleteTrainees(deletedIds, pushTs);

    if (changed.length === 0 && deletedIds.length === 0) {
      _sbPushing = false;
      _sbNotifyPushStatus('success', '已同步到云端');
      return true;
    }
    console.log('[Supabase] Pushed', changed.length, 'changed,', deletedIds.length, 'deleted');
    _sbPushing = false;
    _sbNotifyPushStatus('success', '已同步到云端');
    return true;
  } catch(e) {
    console.warn('[Supabase] Push error:', e.message);
    _sbPushing = false;
    _sbNotifyPushStatus('error', '推送失败: ' + e.message);
    return false;
  }
}

async function sbForcePush(data, ts) {
  // Force push: upsert all trainees + soft-delete tracked deleted IDs
  const pushTs = ts || Date.now();
  await sbUpsertTrainees(data.trainees || [], pushTs);
  if (data._deletedIds && data._deletedIds.length > 0) {
    await sbSoftDeleteTrainees(data._deletedIds, pushTs);
  }
  return true;
}

// Init: fetch remote, auto-migrate localStorage → Supabase on first run, then merge
async function initSupabaseSync() {
  _sbNotifyStatus('connecting');
  try {
    if (!(await _sbHasSession())) {
      // Not logged in yet — wait for login before touching the cloud
      _sbNotifyStatus('connected');
      return;
    }
    const remote = await sbFetchAll();
    const local = loadData();
    const remoteEmpty = !remote.trainees || remote.trainees.length === 0;

    if (remoteEmpty && local.trainees.length > 0) {
      // First migration: push all local data to cloud
      console.log('[Supabase] Migrating', local.trainees.length, 'local trainees to cloud...');
      await sbUpsertTrainees(local.trainees, Date.now());
      const migrated = await sbFetchAll();
      _sbListeners.forEach(cb => cb(migrated, Date.now()));
      _sbNotifyStatus('connected');
      return;
    }

    if (remote.trainees.length > 0) {
      // Merge remote into local (local-only entries are kept and pushed later)
      _sbListeners.forEach(cb => cb(remote, Date.now()));
    }
    _sbNotifyStatus('connected');
  } catch(e) {
    console.warn('[Supabase] Init error:', e.message);
    _sbNotifyStatus('error');
  }
}

// ============ Progress Calculation ============
function calcProgress(trainee) {
  const allDays = getAllDays(trainee.route, trainee.subRoute);
  const total = allDays.length || 0;
  if (total === 0) return { completed: 0, total: 0, percent: 0, remaining: 0 };
  let completed = 0;
  const progress = trainee.progress || {};
  for (const day of allDays) {
    const dp = progress[day.key];
    if (dp && dp.completed) completed++;
  }
  return {
    completed,
    total,
    percent: Math.min(100, Math.round((completed / total) * 100)),
    remaining: Math.max(0, total - completed)
  };
}

function getCurrentDay(trainee) {
  const allDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  const progress = trainee.progress || {};
  for (const day of allDays) {
    const dp = progress[day.key];
    if (!dp || !dp.completed) return day;
  }
  return null; // All completed
}


// ===== 阶段时限：每阶段 7 天学习 + 7 天刻意练习/认证（自然日） =====
function fmtLocalDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDaysStr(ds, n) {
  const d = new Date(ds + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return fmtLocalDate(d);
}
function getStageRule(routeId) {
  const r = TRAINING_DATA.routes.find(x => x.id === routeId);
  return (r && r.stageRule) ? r.stageRule : null;
}
// 自由学习路线（师傅带教/门店主管）：数据里写了 stageRule 即为自由线
// 按阶段聚合展示、阶段内自由勾选，无「第X天」；阶段之间按顺序递进：上一阶段全部项目完成才解锁下一阶段
function isFreeLearnRoute(trainee) { return !!getStageRule(trainee && trainee.route); }
function getPhaseWindow(trainee, allDays, phaseIndex) {
  if (!trainee || !allDays || !allDays.length) return null;
  const rule = getStageRule(trainee.route);
  if (!rule) return null;
  const phaseDays = allDays.filter(d => d.phaseIndex === phaseIndex);
  if (!phaseDays.length) return null;
  const prog = trainee.progress || {};
  // 起点 = 本阶段第一个勾选项的时间（checkedAt）；未勾选任何项则尚未开始计时。
  // 不再用入职日期 startDate，也不再依赖上一阶段的完成时间——自由学习各阶段独立起算。
  let firstCheckedAt = '';
  phaseDays.forEach(d => {
    const its = (prog[d.key] && prog[d.key].items) || {};
    Object.keys(its).forEach(k => {
      const st = its[k] || {};
      if ((st.checked || st.choice) && st.checkedAt && (!firstCheckedAt || st.checkedAt < firstCheckedAt)) {
        firstCheckedAt = st.checkedAt;
      }
    });
  });
  if (!firstCheckedAt) return { phaseName: phaseDays[0].phaseName, rule, notStarted: true };
  const start = localDateStr(firstCheckedAt);
  const learnEnd = addDaysStr(start, rule.learnDays - 1);
  const isLearn = d => d.items.some(it => getItemType(it.content) === 'learn');
  const isDrill = d => d.items.some(it => ['practice', 'cert', 'final_cert'].indexOf(getItemType(it.content)) >= 0);
  const learnDays = phaseDays.filter(isLearn);
  const drillDays = phaseDays.filter(isDrill);
  const isDone = d => !!(prog[d.key] && prog[d.key].completed);
  const lastDone = list => {
    const arr = list.slice().reverse().find(d => prog[d.key] && prog[d.key].completedAt);
    return arr ? localDateStr(prog[arr.key].completedAt) : '';
  };
  const learnDone = learnDays.length ? learnDays.every(isDone) : true;
  const drillDone = drillDays.length ? drillDays.every(isDone) : true;
  const done = learnDone && drillDone;
  const learnCompletedAt = lastDone(learnDays) || (learnDays.length ? '' : start);
  const practiceStart = addDaysStr(start, rule.learnDays);
  const practiceEnd = addDaysStr(start, rule.learnDays + rule.practiceDays - 1);
  const today = fmtLocalDate(new Date());
  const learnLeft = Math.max(0, daysBetween(today, learnEnd));
  const practiceLeft = Math.max(0, daysBetween(today, practiceEnd));
  const learnOverdueDays = !learnDone ? Math.max(0, daysBetween(learnEnd, today)) : 0;
  const practiceOverdueDays = !drillDone ? Math.max(0, daysBetween(practiceEnd, today)) : 0;
  const learnLateDays = learnCompletedAt ? Math.max(0, daysBetween(learnEnd, learnCompletedAt)) : 0;
  return {
    phaseName: phaseDays[0].phaseName, rule, start, learnEnd, practiceStart, practiceEnd,
    learnDone, drillDone, done, learnLeft, practiceLeft,
    learnOverdue: learnOverdueDays > 0, learnOverdueDays,
    practiceOverdue: practiceOverdueDays > 0, practiceOverdueDays, learnLateDays
  };
}
// 阶段递进锁：第一阶段直接开放；上一阶段【全部项目】（学习 + 刻意练习 + 认证）勾完，才开放下一阶段。
// 既有 day.completed 兜底（兼容历史数据），也逐项核对勾选状态，防止只勾部分项却误解锁。
function phaseHasDrills(allDays, phaseIndex) {
  return allDays.some(d => d.phaseIndex === phaseIndex && d.items.some(it => it.drills && it.drills.length));
}
function getPhaseSign(trainee, phaseIndex) {
  const prog = (trainee && trainee.progress) || {};
  return (prog._phaseSign && prog._phaseSign[phaseIndex]) || {};
}
function phaseSigned(trainee, phaseIndex) {
  const s = getPhaseSign(trainee, phaseIndex);
  return !!(s.student && s.student.at && s.manager && s.manager.at);
}
function phaseAnyCheckin(trainee, prevDays) {
  const prog = (trainee && trainee.progress) || {};
  return prevDays.some(d => {
    const its = ((prog[d.key] || {}).items) || {};
    return Object.keys(its).some(k => its[k] && its[k].drillRecords && Object.keys(its[k].drillRecords).length > 0);
  });
}
function isPhaseUnlocked(trainee, allDays, phaseIndex) {
  if (!trainee || !allDays || !allDays.length) return false;
  if (phaseIndex <= 0) return true;
  const prevDays = allDays.filter(d => d.phaseIndex === phaseIndex - 1 && d.items.length > 0);
  if (!prevDays.length) return true;
  const prog = trainee.progress || {};
  const allChecked = prevDays.every(d => {
    const dp = prog[d.key] || {};
    if (dp.completed) return true; // 兼容历史：整段已完成即视为达标
    return d.items.every((it, i) => {
      const st = (dp.items || {})[i] || {};
      return it.choices ? !!st.choice : !!st.checked;
    });
  });
  if (!allChecked) return false;
  // 有练习动作的阶段：全部项目达标 + 学员/上级两级账号确认齐全，才解锁下一阶段。
  // 兼容：老数据没有任何打卡记录时，不强制两级确认（避免历史学员被卡住）。
  if (phaseHasDrills(allDays, phaseIndex - 1) && phaseAnyCheckin(trainee, prevDays)) {
    return phaseSigned(trainee, phaseIndex - 1);
  }
  return true;
}
function getStageDeadlineStatus(trainee) {
  if (!trainee || !trainee.route) return null;
  const allDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  if (!allDays.length) return null;
  const cur = getCurrentDay(trainee);
  const pi = cur ? cur.phaseIndex : allDays[allDays.length - 1].phaseIndex;
  const w = getPhaseWindow(trainee, allDays, pi);
  if (!w || w.notStarted || w.done) return null;
  if (w.learnOverdue) return { label: '学习超期' + w.learnOverdueDays + '天', level: 'bad' };
  if (w.practiceOverdue) return { label: '练习超期' + w.practiceOverdueDays + '天', level: 'bad' };
  if (w.learnLateDays > 0) return { label: '学习超期完成', level: 'warn' };
  if (!w.learnDone) return { label: '学习剩' + w.learnLeft + '天', level: w.learnLeft <= 2 ? 'warn' : 'ok' };
  return { label: '练习剩' + w.practiceLeft + '天', level: 'ok' };
}

// ===== 刻意练习打卡：补记留痕 / 两级账号确认 / 自然日连续校验 =====
const DRILL_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function getDrillRecords(trainee, dayKey, itemIdx, drillIdx) {
  const prog = (trainee && trainee.progress) || {};
  const st = ((prog[dayKey] || {}).items || {})[itemIdx] || {};
  const raw = (st.drillRecords && st.drillRecords[drillIdx]) || [];
  // 过滤撤销墓碑：撤销记录保留在进度里，确保跨设备合并时能传播"已撤销"状态
  return raw.filter(r => r && !r.deleted);
}
function getRestDays(trainee) {
  const prog = (trainee && trainee.progress) || {};
  return Array.isArray(prog._restDays) ? prog._restDays : [];
}
// 自然日连续校验：相邻两次打卡之间，只要日历日期不逐日相连 → 判定断档
// 规则：第一阶段(phaseIndex=0)允许断档；第二、三阶段(phaseIndex>0)只认日期连续，不按排班表豁免休息日
// restDays 参数保留兼容旧数据（休息日仅作备注，不参与连续判定）
function isContinuityRequired(phaseIndex) { return phaseIndex !== 0; }
function drillContinuity(records, restDays, phaseIndex) {
  const required = isContinuityRequired(phaseIndex);
  const dates = (records || []).map(r => r.date).filter(DRILL_DATE_RE.test.bind(DRILL_DATE_RE)).sort();
  if (dates.length < 2) return { required, broken: false, gapDays: 0, gaps: [] };
  const gaps = [];
  for (let i = 1; i < dates.length; i++) {
    let miss = 0, d = addDaysStr(dates[i - 1], 1);
    while (d < dates[i]) { miss++; d = addDaysStr(d, 1); }
    if (miss > 0) gaps.push({ from: dates[i - 1], to: dates[i], days: miss });
  }
  return { required, broken: required && gaps.length > 0, gapDays: gaps.reduce((s, g) => s + g.days, 0), gaps };
}
function getDrillStat(trainee, dayKey, itemIdx, drillIdx, need, phaseIndex) {
  const raw = getDrillRecords(trainee, dayKey, itemIdx, drillIdx);
  const uniq = {};
  raw.forEach(r => { if (r && DRILL_DATE_RE.test(r.date)) uniq[r.date] = r; });
  const list = Object.keys(uniq).sort().map(k => uniq[k]);
  const makeupCount = list.filter(r => r.makeup).length;
  return {
    records: list, doneCount: list.length, need: need, reached: list.length >= need,
    makeupCount: makeupCount, continuity: drillContinuity(list, getRestDays(trainee), phaseIndex)
  };
}
// 某练习项（item）的所有 drill 是否全部达标
function isPracticeItemReached(trainee, day, itemIdx, item) {
  if (!item.drills || !item.drills.length) return true;
  return item.drills.every((d, di) => {
    const raw = getDrillRecords(trainee, day.key, itemIdx, di);
    const uniq = {}; raw.forEach(r => { if (r && DRILL_DATE_RE.test(r.date)) uniq[r.date] = 1; });
    return Object.keys(uniq).length >= d.count;
  });
}
function getPhasePracticeStat(trainee, allDays, phaseIndex) {
  let total = 0, reached = 0, makeup = 0, broken = 0;
  allDays.filter(d => d.phaseIndex === phaseIndex).forEach(d => {
    d.items.forEach((it, idx) => {
      if (!it.drills || !it.drills.length) return;
      it.drills.forEach((dr, di) => {
        const s = getDrillStat(trainee, d.key, idx, di, dr.count, phaseIndex);
        total++; if (s.reached) reached++; makeup += s.makeupCount; if (s.continuity.broken) broken++;
      });
    });
  });
  return { total, reached, makeup, broken, pct: total ? Math.round(reached / total * 100) : 0 };
}

function isCertified(trainee) { return getCurrentDay(trainee) === null; }

// 已离职判定：存在 progress._meta.resigned === true 即视为离职。
// 离职数据存 _meta（随 progress JSON 同步落库），不占用 DB 独立列。
function isResigned(trainee) {
  return !!(trainee && trainee.progress && trainee.progress._meta && trainee.progress._meta.resigned);
}
// 离职时间戳（ISO 字符串），用于 _meta 合并时 last-write-wins 比较
function getResignedAt(trainee) {
  return (trainee && trainee.progress && trainee.progress._meta && trainee.progress._meta.resignedAt) || '';
}
// 统一"指定日期 ds 是否算已打卡"判定（推送 notify-unchecked.js 与大区看板共用同一口径）。
// 规则：学员当日（ds）有以下任一动作即视为"已打卡"：
//   1) 勾选学习项：day.items 中任一 item.checked === true 且 checkedAt 落在 ds
//      （checked=false 即"已撤回"，不计）
//   2) 点延迟：day.delayed === true && delayAt 落在 ds，或 delayDates 含 ds
//   3) 点休息：day.rest === true && restAt 落在 ds，或 restDates 含 ds
//   4) 完成带训日：day.completed === true && completedAt 落在 ds
//      （"仅完成没勾选"也算打卡，例如系统自动勾完或事后补打卡）
// 也不做跨天补登（昨日判定只看昨日动作）。
function isCheckedOnDate(trainee, ds) {
  const progress = trainee.progress || {};
  for (const day of Object.values(progress)) {
    if (!day || day._meta) continue;
    const items = day.items || {};
    for (const item of Object.values(items)) {
      if (item.checked === true && item.checkedAt && localDateStr(item.checkedAt) === ds) return true;
    }
    if (Array.isArray(day.restDates) && day.restDates.includes(ds)) return true;
    if (day.rest === true && day.restAt && localDateStr(day.restAt) === ds) return true;
    if (Array.isArray(day.delayDates) && day.delayDates.includes(ds)) return true;
    if (day.delayed === true && day.delayAt && localDateStr(day.delayAt) === ds) return true;
    if (day.completed && day.completedAt && localDateStr(day.completedAt) === ds) return true;
  }
  return false;
}
// "昨日是否算已打卡"：复用 isCheckedOnDate(yesterday)，顶部卡片与下方列表共用，避免两处口径不一致。
function isYesterdayCheckedTrainee(t, yesterday) {
  return isCheckedOnDate(t, yesterday);
}

// 获取学员认证（全部带训完成）的时间戳：取所有完成天中最晚的 completedAt
function getCertifiedAt(trainee) {
  const progress = trainee.progress || {};
  let latest = '';
  Object.values(progress).forEach(day => {
    if (day.completed && day.completedAt && day.completedAt > latest) latest = day.completedAt;
  });
  return latest;
}

// 是否本月认证（晋升）：认证时间在当月内；无时间戳视为历史认证，不计入本月
function isCertifiedThisMonth(trainee) {
  if (!isCertified(trainee)) return false;
  const at = getCertifiedAt(trainee);
  if (!at) return false;
  const d = new Date(at);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

function isDayUnlocked(trainee, dayKey) {
  if (isFreeLearnRoute(trainee)) return true; // 师傅带教/门店主管：按天不锁；阶段递进由 isPhaseUnlocked 控制
  const allDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  const idx = allDays.findIndex(d => d.key === dayKey);
  if (idx === 0) return true;
  const progress = trainee.progress || {};
  const prevDay = allDays[idx - 1];
  const prevProgress = progress[prevDay.key];
  return prevProgress && prevProgress.completed;
}

function isPartTime(trainee) { return trainee.route === 'part_time'; }
function getWorkHoursLimit(trainee) { return isPartTime(trainee) ? 300 : 500; }
function getWorkHoursThreshold(trainee) { return isPartTime(trainee) ? 200 : 300; }
function getWorkHoursWarning(t, hours) {
  if (hours == null || Number.isNaN(Number(hours))) return null;
  const limit = getWorkHoursLimit(t);
  const threshold = getWorkHoursThreshold(t);
  if (hours > threshold) {
    return { limit, threshold, hours: Number(hours), remaining: Math.max(0, limit - hours), isPartTime: isPartTime(t) };
  }
  return null;
}

function countCerts(trainee) {
  const allDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  const progress = trainee.progress || {};
  let n = 0;
  for (const day of allDays) {
    const dp = progress[day.key];
    // 认证类项目必须等本天“确认完成”后才计证（兼职三选一不能只选就计）
    if (!dp || !dp.items || !dp.completed) continue;
    day.items.forEach((item, idx) => {
      const type = getItemType(item.content);
      if (type === 'cert' && dp.items[idx]) {
        if (item.choices) {
          if (dp.items[idx].choice) n++;
        } else if (dp.items[idx].checked) {
          n++;
        }
      }
    });
  }
  return n;
}
