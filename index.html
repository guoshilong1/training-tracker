              placeholder="如 000"
              autoFocus
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500"
            />
          </div>
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">密码</label>
            <input
              ref={pwdRef}
              type="password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              placeholder="请输入密码"
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500"
            />
          </div>
          {error && <p className="text-xs text-red-400">{error}</p>}
          <button
            type="submit"
            disabled={loading || !account.trim() || !password}
            className={`w-full py-2.5 rounded-lg text-sm font-medium text-white transition ${loading || !account.trim() || !password ? 'bg-indigo-600/50 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500'}`}
          >
            {loading ? '登录中...' : '登录'}
          </button>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(loadData);
  const [currentUser, setCurrentUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('training_tracker_user') || 'null'); }
    catch(e) { return null; }
  });
  const [view, setView] = useState('tracker');
  const [selectedId, setSelectedId] = useState(null);
  const [dashboardUnlocked, setDashboardUnlocked] = useState(false);
  const [showPwdModal, setShowPwdModal] = useState(false);
  const [showSyncModal, setShowSyncModal] = useState(false);
  const [syncStatus, setSyncStatus] = useState('connecting');
  const [lastSyncTime, setLastSyncTime] = useState(null);
  const [pushStatus, setPushStatus] = useState({ type: '', msg: '' });
  const isRemoteUpdate = useRef(false);
  const ghReady = useRef(false);

  // Save to localStorage + push to GitHub
  useEffect(() => {
    saveData(data);
    if (!isRemoteUpdate.current && ghReady.current) {
      const ts = Date.now();
      ghPushData(data, ts);
      setLastSyncTime(ts);
    }
    isRemoteUpdate.current = false;
  }, [data]);

  // Initialize GitHub Issues API sync
  useEffect(() => {
    initGitHubSync();

    const unsubUpdate = ghOnUpdate((remoteData, remoteTs) => {
      // Always merge when remote data changed — no timestamp comparison (immune to clock skew)
      isRemoteUpdate.current = true;
      setData(prevData => {
        const mergedResult = mergeTrainees(prevData.trainees, remoteData.trainees || [], prevData._deletedIds, remoteData._deletedIds);
        const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: remoteTs });
        saveData(newData);
        return newData;
      });
      setLastSyncTime(remoteTs || Date.now());
    });

    const unsubStatus = ghOnStatus((status) => {
      setSyncStatus(status);
    });

    const unsubPushStatus = ghOnPushStatus((status, msg) => {
      setPushStatus({ type: status, msg });
      if (status === 'success') {
        setTimeout(() => setPushStatus({ type: '', msg: '' }), 2000);
      }
    });

    // After 1.5s, mark GitHub as ready and push local data if it has content
    // (remote data should have been fetched and merged by now)
    const initTimer = setTimeout(() => {
      ghReady.current = true;
      const localData = loadData();
      // Only push if local has trainees (skip if empty/new device)
      if (localData.trainees && localData.trainees.length > 0) {
        const ts = Date.now();
        ghPushData(localData, ts);
        setLastSyncTime(ts);
      }
    }, 1500);

    // Poll remote data every 1.5s (near real-time sync)
    const pollTimer = setInterval(() => {
      ghFetchData().catch(() => {}); // Errors are handled by status listeners
    }, 1500);

    return () => {
      clearTimeout(initTimer);
      clearInterval(pollTimer);
      unsubUpdate();
      unsubStatus();
      unsubPushStatus();
    };
  }, []);

  const visibleTrainees = useMemo(() => {
    if (!currentUser) return [];
    if (currentUser.role === 'manager') return data.trainees;
    return data.trainees.filter(t => (t.area || '000') === currentUser.id);
  }, [data.trainees, currentUser]);

  const stores = useMemo(() => {
    const set = new Set(visibleTrainees.map(t => t.store).filter(Boolean));
    return Array.from(set).sort();
  }, [visibleTrainees]);

  // Auto-select first trainee (from visible list)
  useEffect(() => {
    if (!selectedId && visibleTrainees.length > 0) {
      setSelectedId(visibleTrainees[0].id);
    }
  }, [visibleTrainees, selectedId]);

  // Update document title when logged in
  useEffect(() => {
    if (currentUser) {
      document.title = currentUser.name;
    } else {
      document.title = '带训追踪系统 - 登录';
    }
  }, [currentUser]);

  const handleLogin = (user) => {
    localStorage.setItem('training_tracker_user', JSON.stringify(user));
    setCurrentUser(user);
    setView(user.role === 'manager' ? 'region_dashboard' : 'tracker');
    setDashboardUnlocked(user.role === 'manager');
  };

  const handleLogout = () => {
    localStorage.removeItem('training_tracker_user');
    setCurrentUser(null);
    setView('tracker');
    setSelectedId(null);
    setDashboardUnlocked(false);
  };

  const handleAddTrainee = (trainee) => {
    const newTrainee = {
      id: genId(),
      ...trainee,
      area: currentUser?.role === 'area' ? currentUser.id : (trainee.area || '000'),
      progress: {},
      createdAt: new Date().toISOString(),
      _updatedAt: Date.now()
    };
    setData(d => ({ ...d, trainees: [...d.trainees, newTrainee] }));
    setSelectedId(newTrainee.id);
  };

  const handleEditTrainee = (id, updates) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.map(t => t.id === id ? { ...t, ...updates, area: t.area || '000', _updatedAt: Date.now() } : t)
    }));
  };

  const handleDeleteTrainee = (id) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.filter(t => t.id !== id),
      _deletedIds: [...new Set([...(d._deletedIds || []), id])]
    }));
    if (selectedId === id) setSelectedId(null);
  };

  const handleUpdateProgress = (id, progress) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.map(t => t.id === id ? { ...t, progress, _updatedAt: Date.now() } : t)
    }));
  };

  const handleImportData = (imported) => {
    const stamped = normalizeData({
      trainees: (imported.trainees || []).map(t => ({ ...t, _updatedAt: t._updatedAt || Date.now() })),
      _deletedIds: imported._deletedIds || []
    });
    setData(stamped);
    setSelectedId(stamped.trainees.length > 0 ? stamped.trainees[0].id : null);
  };

  // Not logged in: show full-screen login
  if (!currentUser) {
    return <LoginScreen onLogin={handleLogin} />;
  }

  const isManager = currentUser.role === 'manager';

  return (
    <div className="min-h-screen bg-gray-950">
      {/* Header */}
      <header className="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-lg border-b border-gray-800">
        <div className="flex items-center justify-between px-5 h-[60px]">
          <div className="flex items-center gap-6">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center">
                <Icon.Award width={18} height={18} className="text-white"/>
              </div>
              <div>
                <h1 className="text-base font-bold text-white leading-tight">{currentUser.name}</h1>
                <p className="text-xs text-gray-500 leading-tight">
                  {isManager ? '大区汇总看板 · 全区域数据总览' : '区域带训进度管理'}
                </p>
              </div>
            </div>
            <nav className="flex items-center gap-1">
              {!isManager && (
                <button
                  onClick={() => setView('tracker')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'tracker' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
                >
                  <Icon.Calendar width={16} height={16}/> 带训追踪
                </button>
              )}
              <button
                onClick={() => {
                  if (dashboardUnlocked) {
                    setView(isManager ? 'region_dashboard' : 'dashboard');
                  } else {
                    setShowPwdModal(true);
                  }
                }}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'dashboard' || view === 'region_dashboard' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
              >
                <Icon.Dashboard width={16} height={16}/> 管理看板
              </button>
              <button
                onClick={() => setShowSyncModal(true)}
                className="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition text-gray-400 hover:text-white hover:bg-gray-800"
              >
                <Icon.Cloud width={16} height={16}/> 数据同步
                <span className={`w-2 h-2 rounded-full ${pushStatus.type === 'pushing' ? 'bg-blue-400 animate-pulse' : pushStatus.type === 'error' ? 'bg-red-400' : syncStatus === 'connected' ? 'bg-emerald-400' : syncStatus === 'error' ? 'bg-red-400' : 'bg-amber-400 animate-pulse'}`}></span>
                {pushStatus.type === 'pushing' && <span className="text-xs text-blue-300">同步中...</span>}
                {pushStatus.type === 'error' && <span className="text-xs text-red-300">推送失败</span>}
              </button>
            </nav>
          </div>
          <div className="flex items-center gap-3">
            <span className="text-xs text-gray-500">{visibleTrainees.length} 名学员</span>
            <span className="text-xs text-gray-700">|</span>
            <span className="text-xs text-gray-500">{stores.length} 家门店</span>
            <span className="text-xs text-gray-700">|</span>
            <button
              onClick={handleLogout}
              className="text-xs text-gray-400 hover:text-white transition flex items-center gap-1"
            >
              <Icon.LogOut width={12} height={12}/> 退出
            </button>
          </div>
        </div>
      </header>

      {/* Content */}
      {view === 'tracker' && !isManager && (
        <TrackerView
          trainees={visibleTrainees}
          selectedId={selectedId}
          onSelectTrainee={setSelectedId}
          onAddTrainee={handleAddTrainee}
          onEditTrainee={handleEditTrainee}
          onDeleteTrainee={handleDeleteTrainee}
          onUpdateProgress={handleUpdateProgress}
          stores={stores}
        />
      )}
      {view === 'dashboard' && !isManager && (
        <DashboardView trainees={visibleTrainees} stores={stores} />
      )}
      {view === 'region_dashboard' && isManager && (
        <RegionDashboardView trainees={data.trainees} stores={stores} config={AREA_CONFIG} />
      )}

      {/* 密码弹窗 */}
      {showPwdModal && (
        <PasswordModal
          onSuccess={() => {
            setDashboardUnlocked(true);
            setShowPwdModal(false);
            setView(isManager ? 'region_dashboard' : 'dashboard');
          }}
          onClose={() => setShowPwdModal(false)}
        />
      )}

      {/* 数据同步弹窗 */}
      {showSyncModal && (
        <SyncModal
          data={data}
          syncStatus={syncStatus}
          lastSyncTime={lastSyncTime}
          setLastSyncTime={setLastSyncTime}
          onClose={() => setShowSyncModal(false)}
          onImport={handleImportData}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
