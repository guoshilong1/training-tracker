<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>带训驾驶舱 · 新版看板原型</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="training-data.js"></script>
<style>
:root{
  --bg:#0a0b0f; --panel:#141620; --panel2:#1b1e2b; --line:#262a38;
  --txt:#e8eaf2; --txt2:#9096ad; --txt3:#5f6580;
  --indigo:#5b6cff; --emerald:#22c98a; --amber:#f0a92a; --red:#f05252; --sky:#38a8f0; --purple:#9b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding:16px}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{font-size:17px;font-weight:600;letter-spacing:.5px}
.brand small{display:block;font-size:11px;color:var(--txt3);font-weight:400;letter-spacing:0}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;border:1px solid}
.badge.live{color:var(--emerald);border-color:rgba(34,201,138,.35);background:rgba(34,201,138,.1)}
.badge.demo{color:var(--amber);border-color:rgba(240,169,42,.35);background:rgba(240,169,42,.1)}
.spacer{flex:1}
.btn{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
.btn:hover{border-color:#3a4055;background:#222636}
.btn.pri{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.pri:hover{background:#4a5ae8}
select.btn{padding-right:26px;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%239096ad' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 9px center}

/* ---------- 区块 ---------- */
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.sec-h h2{font-size:14px;font-weight:600}
.sec-h .hint{font-size:12px;color:var(--txt3)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

/* ---------- KPI 卡 ---------- */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--indigo))}
.kpi .lb{font-size:12px;color:var(--txt2)}
.kpi .vl{font-size:30px;font-weight:600;margin:5px 0 2px;letter-spacing:-.5px}
.kpi .sub{font-size:11.5px;color:var(--txt3)}
.kpi .sub b{font-weight:500}

/* ---------- 通用面板 ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-h h3{font-size:13px;font-weight:600}
.cnt{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--txt2)}

/* ---------- 待办清单 ---------- */
.plist{display:flex;flex-direction:column;gap:7px;max-height:270px;overflow-y:auto}
.prow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;background:var(--panel2);border-left:3px solid var(--c,var(--line))}
.prow .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;background:rgba(255,255,255,.07)}
.prow .info{flex:1;min-width:0}
.prow .nm{font-size:13px;font-weight:500}
.prow .meta{font-size:11.5px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tag{font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.empty{padding:22px 10px;text-align:center;color:var(--txt3);font-size:12.5px}

/* ---------- 趋势图 ---------- */
.spark{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.spark .bar{flex:1;border-radius:3px 3px 0 0;min-height:3px;position:relative;background:var(--indigo);opacity:.85;transition:.15s}
.spark .bar:hover{opacity:1}
.spark .bar.zero{background:#333849}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--txt3);margin-top:6px}

/* ---------- 门店榜 ---------- */
.rowe{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid rgba(38,42,56,.6)}
.rowe:last-child{border-bottom:0}
.rank{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;background:rgba(255,255,255,.06);color:var(--txt2)}
.rank.top{background:rgba(34,201,138,.16);color:var(--emerald)}
.rank.bot{background:rgba(240,82,82,.16);color:var(--red)}
.rowe .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{flex:0 0 84px;height:6px;border-radius:3px;background:#242835;overflow:hidden}
.mini i{display:block;height:100%;border-radius:3px}
.pc{flex:0 0 46px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
.num{flex:0 0 40px;text-align:right;font-size:11.5px;color:var(--txt3);font-variant-numeric:tabular-nums}

/* ---------- 表格 ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--txt3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
td{padding:9px 10px;border-bottom:1px solid rgba(38,42,56,.5);vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.025)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar-cell{display:flex;align-items:center;gap:7px;min-width:100px}
.bar-sm{flex:1;height:5px;border-radius:3px;background:#242835;overflow:hidden;min-width:36px}
.bar-sm i{display:block;height:100%;border-radius:3px}
.pill{display:inline-block;padding:1.5px 7px;border-radius:5px;font-size:11px;white-space:nowrap}

/* ---------- 其他 ---------- */
.loading{padding:60px;text-align:center;color:var(--txt3)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--txt3);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.note{background:rgba(91,108,255,.08);border:1px solid rgba(91,108,255,.25);border-radius:9px;padding:10px 13px;font-size:12px;color:#b9c0e8;margin-bottom:16px}

@media(max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3,.g2{grid-template-columns:1fr}
}
@media(max-width:640px){
  .wrap{padding:11px}
  .g4{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi{padding:12px}
  .kpi .vl{font-size:24px}
  .brand small{display:none}
  .desktop-only{display:none}
  .sec-h .hint{display:none}
}
@media(min-width:641px){ .mobile-only{display:none} }

@media print{
  body{background:#fff;color:#000}
  .no-print{display:none!important}
  .panel,.kpi{border-color:#d5d9e2;background:#fff;break-inside:avoid}
  .kpi .vl,.prow .nm,.brand,.sec-h h2,.panel-h h3{color:#000}
  .kpi .lb,.kpi .sub,.prow .meta,.sec-h .hint,.num{color:#666}
  .prow{background:#f5f6f9;border-left-color:#999}
  .rowe{border-bottom-color:#e3e6ee}
  .rank,.pill{background:#eee}
  .bar-sm i,.mini i{filter:saturate(1.4)}
  .spark .bar{background:#4a5ae8!important}
  table{border:1px solid #d5d9e2}
  th{background:#f0f2f6;border-color:#d5d9e2}
  td{border-color:#e8ebf1}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar no-print">
    <div class="brand">带训驾驶舱<small id="brandSub">新版看板原型</small></div>
    <span id="dataBadge" class="badge demo">加载中</span>
    <div class="spacer"></div>
    <select id="areaSel" class="btn"><option value="">全部区域</option></select>
    <select id="storeSel" class="btn"><option value="">全部门店</option></select>
    <button class="btn" onclick="exportImage()">导出长图</button>
    <button class="btn" onclick="exportPdf()">导出 PDF</button>

  </div>

  <div id="root">
    <div class="loading">正在读取数据…</div>
  </div>

</div>

<script>
/* ==================================================================
   带训驾驶舱 v2 原型
   数据：直连 Supabase（沿用生产同域名登录态），无登录态时降级为演示数据
   口径：与生产 index.html 完全一致（复制自其工具函数，逐行对齐）
   ================================================================== */

const SB_URL = 'https://ltjmbmgofjqeezoskqrc.supabase.co';
const SB_KEY = 'sb_publishable_KrCOzlUPTcrb8S4-ajTjww_EhKibtaC';

const AREA_NAMES = {'000':'郭士龙区域','001':'李澳区域','002':'韩福亮区域','003':'王萌区域','004':'徐誌良区域','005':'郜一鸣区域','006':'李万玲区域','007':'江秀丽区域','666':'白高朋大区'};
const areaName = id => AREA_NAMES[String(id)] || String(id || '-');

/* ---------- 工具函数：与生产一致 ---------- */
function localDateStr(iso){
  const d = new Date(iso);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateStrOf(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function getAllDaysSafe(route,sub){ try{ return (typeof getAllDays==='function'? getAllDays(route,sub):null)||[] }catch(e){ return [] } }

function calcProgress(t){
  const allDays = getAllDaysSafe(t.route,t.subRoute);
  const total = allDays.length||0;
  if(!total) return {completed:0,total:0,percent:0,remaining:0};
  let c=0; const pg=t.progress||{};
  for(const d of allDays){ const dp=pg[d.key]; if(dp&&dp.completed) c++; }
  return {completed:c,total,percent:Math.min(100,Math.round(c/total*100)),remaining:Math.max(0,total-c)};
}
function getCurrentDay(t){
  const allDays = getAllDaysSafe(t.route,t.subRoute).filter(d=>d.items&&d.items.length>0);
  const pg=t.progress||{};
  for(const d of allDays){ const dp=pg[d.key]; if(!dp||!dp.completed) return d; }
  return null;
}
function isCertified(t){ return getCurrentDay(t)===null; }
function isResigned(t){ return !!(t&&t.progress&&t.progress._meta&&t.progress._meta.resigned); }
function getCertifiedAt(t){
  let latest=''; Object.values(t.progress||{}).forEach(d=>{ if(d.completed&&d.completedAt&&d.completedAt>latest) latest=d.completedAt; });
  return latest;
}
function isCertifiedThisMonth(t){
  if(!isCertified(t)) return false;
  const at=getCertifiedAt(t); if(!at) return false;
  const d=new Date(at), n=new Date();
  return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
}
function isCheckedOnDate(t,ds){
  const pg=t.progress||{};
  for(const day of Object.values(pg)){
    if(!day||day._meta) continue;
    for(const it of Object.values(day.items||{})){
      if(it.checked===true&&it.checkedAt&&localDateStr(it.checkedAt)===ds) return true;
    }
    if(Array.isArray(day.restDates)&&day.restDates.includes(ds)) return true;
    if(day.rest===true&&day.restAt&&localDateStr(day.restAt)===ds) return true;
    if(Array.isArray(day.delayDates)&&day.delayDates.includes(ds)) return true;
    if(day.delayed===true&&day.delayAt&&localDateStr(day.delayAt)===ds) return true;
    if(day.completed&&day.completedAt&&localDateStr(day.completedAt)===ds) return true;
  }
  return false;
}
function isPartTime(t){ return t.route==='part_time'; }
function getWorkHoursLimit(t){ return isPartTime(t)?300:500; }
function getWorkHoursThreshold(t){ return isPartTime(t)?200:300; }
function getWorkHoursWarning(t,hours){
  if(hours==null||Number.isNaN(Number(hours))) return null;
  const limit=getWorkHoursLimit(t), th=getWorkHoursThreshold(t);
  if(hours>th) return {limit,threshold:th,hours:Number(hours),remaining:Math.max(0,limit-hours),isPartTime:isPartTime(t)};
  return null;
}
function calcNoCheckInStreak(t,today){
  const dates=new Set(); const pg=t.progress||{};
  Object.values(pg).forEach(day=>{
    Object.values(day.items||{}).forEach(it=>{ if(it.checked&&it.checkedAt) dates.add(localDateStr(it.checkedAt)); });
    if(day.completed&&day.completedAt) dates.add(localDateStr(day.completedAt));
    if(Array.isArray(day.restDates)) day.restDates.forEach(d=>dates.add(d));
    else if(day.rest&&day.restAt) dates.add(localDateStr(day.restAt));
  });
  if(dates.size===0){
    if(t.startDate) return {days:Math.max(1,daysBetween(t.startDate,today)),label:'连续'+Math.max(1,daysBetween(t.startDate,today))+'天未打卡'};
    return {days:9999,label:'从未打卡'};
  }
  const sorted=[...dates].sort();
  if(sorted[sorted.length-1]>=today) return {days:0,label:'今日已打卡'};
  const days=daysBetween(sorted[sorted.length-1],today);
  return {days,label:'连续'+days+'天未打卡'};
}
function rowToTrainee(row){
  let subRoute = row.sub_route || row.progress?._meta?.subRoute || '';
  if(!subRoute && row.route==='part_time' && row.progress){
    const keys=Object.keys(row.progress).filter(k=>k.startsWith('part_time_'));
    if(keys.length){ const m=keys[0].match(/^part_time_(.+?)_\d+-\d+-\d+$/); if(m) subRoute=m[1]; }
  }
  return {
    id:row.id,name:row.name||'',store:row.store||'',route:row.route,subRoute:subRoute||'',
    startDate:row.start_date||'',master:row.master||'',area:row.area||'000',note:row.note||'',
    empId:row.emp_id||'',progress:row.progress||{},_updatedAt:row.updated_at||0
  };
}

/* ---------- 演示数据（无登录态时兜底） ---------- */
function makeDemoData(){
  const stores=['太原01店','太原02店','太原03店','太原05店','太原08店','太原13店','太原19店','长治02店'];
  const masters=['王师傅','李师傅','张师傅','赵师傅','刘师傅'];
  const routes=['front_to_back','back_to_front','part_time'];
  const list=[];
  for(let i=0;i<64;i++){
    const route=routes[i%3];
    const allDays=getAllDaysSafe(route,'');
    const total=allDays.length;
    const completed=Math.floor(Math.random()*(total+1));
    const pg={};
    const startDaysAgo=Math.floor(Math.random()*90)+5;
    const sd=new Date(); sd.setDate(sd.getDate()-startDaysAgo);
    allDays.slice(0,completed).forEach((d,idx)=>{
      const done=new Date(sd); done.setDate(done.getDate()+idx*2+1);
      pg[d.key]={completed:true,completedAt:done.toISOString(),items:{},masterSignature:masters[i%5],
        trainingTimes:['09:00-12:00']};
    });
    if(completed<total && Math.random()>0.45){
      const ld=new Date(); ld.setDate(ld.getDate()-Math.floor(Math.random()*6));
      const last=allDays[completed];
      if(last){
        pg[last.key]={...(pg[last.key]||{}),items:{0:{checked:true,checkedAt:ld.toISOString()}}};
      }
    }
    list.push({
      id:'demo-'+i, name:'学员'+(i+1), store:stores[i%stores.length], route,
      subRoute:'', startDate:dateStrOf(sd), master:masters[i%5], area:'000',
      note:'', empId:'D'+(10000+i), progress:pg, _updatedAt:Date.now()
    });
  }
  const wh={};
  list.forEach(t=>{ wh[t.empId]={hours:Math.floor(Math.random()*560)}; });
  return {trainees:list, workHours:wh};
}

/* ---------- 数据加载 ---------- */
let _sb=null;
async function loadData(){
  try{
    if(typeof window.supabase==='undefined') throw new Error('SDK未加载');
    _sb = window.supabase.createClient(SB_URL, SB_KEY);
    const {data:{session}} = await _sb.auth.getSession();
    if(!session) throw new Error('未登录');
    const [{data:tr,error:e1},{data:wh,error:e2}] = await Promise.all([
      _sb.from('trainees').select('*').eq('deleted',false),
      _sb.from('work_hours').select('emp_id,hours')
    ]);
    if(e1||e2) throw new Error('查询失败');
    if(!tr||tr.length===0) throw new Error('无数据');
    const whMap={}; (wh||[]).forEach(r=>{ whMap[r.emp_id]={hours:r.hours}; });
    return {trainees:tr.map(rowToTrainee), workHours:whMap, real:true};
  }catch(err){
    if(String(err.message||'').includes('SDK未加载')) return demoWrap('运行环境未能加载 Supabase SDK（本地 file:// 打开时常发生）');
    return demoWrap(err.message||'未知原因');
  }
}
function demoWrap(reason){
  const d=makeDemoData();
  return {...d, real:false, reason};
}

/* ---------- 模型计算 ---------- */
function buildModel(raw){
  const today=dateStrOf(new Date());
  const yesterday=dateStrOf(new Date(Date.now()-86400000));
  const all=(raw.trainees||[]).filter(t=>!isResigned(t));
  const active=all.filter(t=>!isCertified(t));

  const enriched=all.map(t=>{
    const prog=calcProgress(t);
    const hours=t.empId&&raw.workHours[t.empId]?Number(raw.workHours[t.empId].hours)||0:null;
    const warn=getWorkHoursWarning(t,hours);
    const streak=calcNoCheckInStreak(t,today);
    const cd=getCurrentDay(t);
    return {
      ...t,_prog:prog,_hours:hours,_warn:warn,_streak:streak,_cd:cd,
      _cert:isCertified(t),_certMonth:isCertifiedThisMonth(t),
      _checkedToday:isCheckedOnDate(t,today),_checkedY:isCheckedOnDate(t,yesterday)
    };
  });
  const act=enriched.filter(t=>!t._cert);

  // 近 14 天趋势
  const trend=[];
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=dateStrOf(d);
    const pool=enriched.filter(t=>!t._cert||isCheckedOnDate(t,ds));
    const ok=pool.filter(t=>isCheckedOnDate(t,ds)).length;
    trend.push({ds,label:(d.getMonth()+1)+'/'+d.getDate(),rate:pool.length?Math.round(ok/pool.length*100):0,n:ok,total:pool.length});
  }

  // 待办三类
  const stalled=act.filter(t=>t._streak.days>=3).sort((a,b)=>b._streak.days-a._streak.days);
  const overHours=act.filter(t=>t._warn).sort((a,b)=>b._warn.hours-a._warn.hours);
  const lagging=act.filter(t=>{
    if(!t.startDate) return false;
    return daysBetween(t.startDate,today)>=45 && t._prog.percent<60;
  }).sort((a,b)=>a._prog.percent-b._prog.percent);

  // 门店榜
  const storeMap={};
  enriched.forEach(t=>{
    const k=t.store||'未知门店';
    if(!storeMap[k]) storeMap[k]={store:k,area:t.area,total:0,active:0,cert:0,certMonth:0,checkedToday:0,checkedY:0,progSum:0,warn:0,stalled:0};
    const s=storeMap[k];
    s.total++; s.area=t.area;
    if(!t._cert){ s.active++; s.progSum+=t._prog.percent; if(t._checkedToday) s.checkedToday++; if(t._checkedY) s.checkedY++; if(t._warn) s.warn++; if(t._streak.days>=3) s.stalled++; }
    if(t._cert) s.cert++;
    if(t._certMonth) s.certMonth++;
  });
  const stores=Object.values(storeMap).map(s=>({
    ...s,
    rate:s.active?Math.round(s.checkedToday/s.active*100):100,
    avgProg:s.active?Math.round(s.progSum/s.active):100
  })).sort((a,b)=>a.rate-b.rate);

  return {
    today,yesterday,real:raw.real,reason:raw.reason,
    all:enriched, active:act,
    total:all.length, activeN:act.length,
    todayChecked:act.filter(t=>t._checkedToday).length,
    yChecked:act.filter(t=>t._checkedY).length,
    yUnchecked:act.filter(t=>!t._checkedY).length,
    certMonth:enriched.filter(t=>t._certMonth).length,
    certTotal:enriched.filter(t=>t._cert).length,
    avgProg:act.length?Math.round(act.reduce((s,t)=>s+t._prog.percent,0)/act.length):0,
    trend,stalled,overHours,lagging,stores
  };
}

/* ---------- 渲染 ---------- */
let MODEL=null;
let BASE=null;
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(m){
  MODEL=m;
  const rate=m.activeN?Math.round(m.todayChecked/m.activeN*100):100;
  const rateColor=rate>=90?'--emerald':rate>=70?'--amber':'--red';

  const todayPanel=`
    <div class="sec">
      <div class="sec-h"><h2>今日概况</h2><span class="hint"><span id="viewSum">${m.today}</span> · 数据截至此刻</span></div>
      <div class="grid g4">
        <div class="kpi" style="--accent:var(--indigo)">
          <div class="lb">在训学员</div><div class="vl">${m.activeN}</div>
          <div class="sub">总计 <b>${m.total}</b> 人 · 已认证 <b>${m.certTotal}</b> 人</div>
        </div>
        <div class="kpi" style="--accent:var(--${rate>=90?'emerald':rate>=70?'amber':'red'})">
          <div class="lb">今日打卡率</div><div class="vl" style="color:var(${rateColor})">${rate}%</div>
          <div class="sub">已打卡 <b>${m.todayChecked}</b> / ${m.activeN} 人</div>
        </div>
        <div class="kpi" style="--accent:var(--red)">
          <div class="lb">昨日未打卡</div><div class="vl">${m.yUnchecked}</div>
          <div class="sub">昨日已打卡 <b>${m.yChecked}</b> 人</div>
        </div>
        <div class="kpi" style="--accent:var(--purple)">
          <div class="lb">本月认证晋升</div><div class="vl">${m.certMonth}</div>
          <div class="sub">平均带训进度 <b>${m.avgProg}%</b></div>
        </div>
      </div>
    </div>`;

  const pList=(arr,color,fnEmpty,fnRow)=>{
    if(!arr.length) return `<div class="empty">${fnEmpty}</div>`;
    return `<div class="plist">${arr.slice(0,12).map(fnRow).join('')}</div>`;
  };

  const attention=`
    <div class="sec">
      <div class="sec-h"><h2>今天要盯的人</h2><span class="hint">按紧急度排序，点击名单即可定位到门店</span></div>
      <div class="grid g3">
        <div class="panel">
          <div class="panel-h"><h3 style="color:var(--red)">● 连续未打卡 ≥3 天</h3><span class="cnt">${m.stalled.length} 人</span></div>
          ${pList(m.stalled,'', '全部按时打卡，继续保持', t=>`
            <div class="prow" style="--c:var(--red)">
              <div class="av" style="color:var(--red)">${esc(t.name.slice(0,1))}</div>
              <div class="info"><div class="nm">${esc(t.name)}</div><div class="meta">${esc(t.store)} · ${esc(t.master||'无师傅')}</div></div>
              <div class="tag" style="background:rgba(240,82,82,.15);color:var(--red)">${t._streak.days>=9999?'从未打卡':t._streak.days+'天'}</div>
            </div>`)}
        </div>
        <div class="panel">
          <div class="panel-h"><h3 style="color:var(--amber)">● 工时超标</h3><span class="cnt">${m.overHours.length} 人</span></div>
          ${pList(m.overHours,'', '暂无工时超阈值学员', t=>`
            <div class="prow" style="--c:var(--amber)">
              <div class="av" style="color:var(--amber)">${esc(t.name.slice(0,1))}</div>
              <div class="info"><div class="nm">${esc(t.name)}</div><div class="meta">${esc(t.store)} · 进度 ${t._prog.percent}%</div></div>
              <div class="tag" style="background:rgba(240,169,42,.15);color:var(--amber)">${t._hours}h / ${t._warn.limit}h</div>
            </div>`)}
        </div>
        <div class="panel">
          <div class="panel-h"><h3 style="color:var(--sky)">● 带训进度滞后</h3><span class="cnt">${m.lagging.length} 人</span></div>
          ${pList(m.lagging,'', '无进度滞后学员', t=>`
            <div class="prow" style="--c:var(--sky)">
              <div class="av" style="color:var(--sky)">${esc(t.name.slice(0,1))}</div>
              <div class="info"><div class="nm">${esc(t.name)}</div><div class="meta">${esc(t.store)} · 入职 ${daysBetween(t.startDate,m.today)} 天</div></div>
              <div class="tag" style="background:rgba(56,168,240,.15);color:var(--sky)">${t._prog.percent}%</div>
            </div>`)}
        </div>
      </div>
    </div>`;

  const maxRate=Math.max(100,...m.trend.map(t=>t.rate));
  const trend=`
    <div class="sec">
      <div class="grid g2">
        <div class="panel">
          <div class="panel-h"><h3>近 14 天打卡率</h3><span class="hint" style="font-size:11px;color:var(--txt3)">口径：当日有任一打卡动作即算</span></div>
          <div class="spark">${m.trend.map(t=>`
            <div class="bar ${t.rate===0?'zero':''}" style="height:${Math.max(3,t.rate/maxRate*100)}%;background:${t.rate>=90?'var(--emerald)':t.rate>=70?'var(--amber)':'var(--red)'}" title="${t.ds} ${t.rate}% (${t.n}/${t.total})"></div>`).join('')}</div>
          <div class="axis"><span>${m.trend[0].label}</span><span>${m.trend[13].label}</span></div>
          <div class="legend">
            <span><i class="dot" style="background:var(--emerald)"></i>≥90% 健康</span>
            <span><i class="dot" style="background:var(--amber)"></i>70-89% 需关注</span>
            <span><i class="dot" style="background:var(--red)"></i>&lt;70% 预警</span>
          </div>
        </div>
        <div class="panel">
          <div class="panel-h"><h3>门店今日打卡率榜</h3><span class="cnt">${m.stores.length} 家店</span></div>
          <div style="max-height:165px;overflow-y:auto">
            ${m.stores.length?m.stores.map((s,i)=>`
              <div class="rowe">
                <div class="rank ${i<3?'bot':''}">${i+1}</div>
                <div class="nm">${esc(s.store)}</div>
                <div class="mini"><i style="width:${s.rate}%;background:${s.rate>=90?'var(--emerald)':s.rate>=70?'var(--amber)':'var(--red)'}"></i></div>
                <div class="pc" style="color:${s.rate>=90?'var(--emerald)':s.rate>=70?'var(--amber)':'var(--red)'}">${s.rate}%</div>
                <div class="num">${s.active}人</div>
              </div>`).join(''):'<div class="empty">暂无门店数据</div>'}
          </div>
        </div>
      </div>
    </div>`;

  const bcolor=p=>p>=90?'var(--emerald)':p>=60?'var(--amber)':'var(--red)';
  const storeTbl=`
    <div class="sec">
      <div class="sec-h"><h2>门店对比</h2><span class="hint">按今日打卡率升序，最需要催的在最上面</span></div>
      <div class="panel">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>门店</th><th class="n">在训</th><th>今日打卡</th><th class="n">昨日打卡</th>
              <th>平均进度</th><th class="n">工时超标</th><th class="n">停滞≥3天</th><th class="n">本月晋升</th><th class="n">已认证</th>
            </tr></thead>
            <tbody>
              ${m.stores.map(s=>`
                <tr>
                  <td style="font-weight:500">${esc(s.store)}<div style="font-size:11px;color:var(--txt3)">${esc(areaName(s.area))}</div></td>
                  <td class="n">${s.active}</td>
                  <td><div class="bar-cell"><span style="color:${s.rate>=90?'var(--emerald)':s.rate>=70?'var(--amber)':'var(--red)'};font-variant-numeric:tabular-nums">${s.rate}%</span><div class="bar-sm"><i style="width:${s.rate}%;background:${s.rate>=90?'var(--emerald)':s.rate>=70?'var(--amber)':'var(--red)'}"></i></div></div></td>
                  <td class="n">${s.active?s.checkedY+'/'+s.active:'-'}</td>
                  <td><div class="bar-cell"><span style="font-variant-numeric:tabular-nums">${s.avgProg}%</span><div class="bar-sm"><i style="width:${s.avgProg}%;background:${bcolor(s.avgProg)}"></i></div></div></td>
                  <td class="n" style="color:${s.warn?'var(--amber)':'var(--txt3)'}">${s.warn||'-'}</td>
                  <td class="n" style="color:${s.stalled?'var(--red)':'var(--txt3)'}">${s.stalled||'-'}</td>
                  <td class="n" style="color:${s.certMonth?'var(--emerald)':'var(--txt3)'}">${s.certMonth||'-'}</td>
                  <td class="n">${s.cert||'-'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;

  const warn=m.real?'':`<div class="note no-print">当前为<b>演示数据</b>（原因：${esc(m.reason||'未登录')}）。在生产站点已登录状态下打开本页面，会自动切换成你的真实学员数据。</div>`;

  const el=document.getElementById('root');
  el.innerHTML = warn+todayPanel+attention+trend+storeTbl;
  el.dataset.rendered='1';
}

/* ---------- 筛选 ---------- */
function filteredModel(m){
  const area=document.getElementById('areaSel')?.value||'';
  const store=document.getElementById('storeSel')?.value||'';
  const rows=m.all.filter(t=>{
    if(area&&String(t.area)!==area) return false;
    if(store&&t.store!==store) return false;
    return true;
  });
  const act=rows.filter(t=>!t._cert);
  const today=m.today;
  const storeMap={};
  rows.forEach(t=>{
    const k=t.store||'未知门店';
    if(!storeMap[k]) storeMap[k]={store:k,area:t.area,total:0,active:0,cert:0,certMonth:0,checkedToday:0,checkedY:0,progSum:0,warn:0,stalled:0};
    const s=storeMap[k]; s.total++;
    if(!t._cert){ s.active++; s.progSum+=t._prog.percent; if(t._checkedToday) s.checkedToday++; if(t._checkedY) s.checkedY++; if(t._warn) s.warn++; if(t._streak.days>=3) s.stalled++; }
    if(t._cert) s.cert++;
    if(t._certMonth) s.certMonth++;
  });
  const stores=Object.values(storeMap).map(s=>({
    ...s, rate:s.active?Math.round(s.checkedToday/s.active*100):100, avgProg:s.active?Math.round(s.progSum/s.active):100
  })).sort((a,b)=>a.rate-b.rate);
  const trend=m.trend.map(t0=>{
    const pool=rows.filter(t=>!t._cert||isCheckedOnDate(t,t0.ds));
    const ok=pool.filter(t=>isCheckedOnDate(t,t0.ds)).length;
    return {...t0,rate:pool.length?Math.round(ok/pool.length*100):0,n:ok,total:pool.length};
  });
  return {
    ...m, all:rows, active:act, trend, stores,
    total:rows.length, activeN:act.length,
    todayChecked:act.filter(t=>t._checkedToday).length,
    yChecked:act.filter(t=>t._checkedY).length,
    yUnchecked:act.filter(t=>!t._checkedY).length,
    certMonth:rows.filter(t=>t._certMonth).length,
    certTotal:rows.filter(t=>t._cert).length,
    avgProg:act.length?Math.round(act.reduce((s,t)=>s+t._prog.percent,0)/act.length):0,
    stalled:act.filter(t=>t._streak.days>=3).sort((a,b)=>b._streak.days-a._streak.days),
    overHours:act.filter(t=>t._warn).sort((a,b)=>b._warn.hours-a._warn.hours),
    lagging:act.filter(t=>t.startDate&&daysBetween(t.startDate,today)>=45&&t._prog.percent<60).sort((a,b)=>a._prog.percent-b._prog.percent)
  };
}
function refresh(){
  if(!BASE) return;
  const view=filteredModel(BASE);
  render(view);
  const sum=document.getElementById('viewSum');
  if(sum){
    const parts=[BASE.today];
    const a=document.getElementById('areaSel').value, s=document.getElementById('storeSel').value;
    if(a) parts.push(areaName(a));
    if(s) parts.push(s);
    sum.textContent=parts.join(' · ');
  }
}

/* ---------- 导出 ---------- */
function currentRows(){
  if(!MODEL) return [];
  return MODEL.all;
}
function exportXlsx(){
  if(!MODEL){ alert('数据尚未加载完成'); return; }
  if(typeof XLSX==='undefined'){ alert('导出组件未加载成功，请检查网络'); return; }
  const wb=XLSX.utils.book_new();

  const s1=MODEL.stores.map(s=>({
    '门店':s.store,'区域':areaName(s.area),'在训人数':s.active,'今日打卡率':s.rate+'%',
    '昨日打卡':s.checkedY+'/'+s.active,'平均进度':s.avgProg+'%','工时超标':s.warn,'停滞≥3天':s.stalled,
    '本月晋升':s.certMonth,'累计认证':s.cert
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(s1),'门店汇总');

  const s2=currentRows().map(t=>({
    '姓名':t.name,'门店':t.store,'区域':areaName(t.area),'路线':(typeof getRouteName==='function'?getRouteName(t.route,t.subRoute):t.route),
    '师傅':t.master||'','工号':t.empId||'','入职日期':t.startDate||'','雇佣性质':isPartTime(t)?'兼职':'全职',
    '是否认证':t._cert?'已认证':'带训中','进度':t._prog.percent+'%','完成天数':t._prog.completed+'/'+t._prog.total,
    '当前天数':t._cd?t._cd.day:'','累计工时':t._hours==null?'':t._hours,'工时上限':getWorkHoursLimit(t),
    '今日打卡':t._checkedToday?'是':'否','昨日打卡':t._checkedY?'是':'否','连续未打卡':t._streak.days>=9999?'从未打卡':t._streak.days,
    '备注':t.note||''
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(s2),'学员明细');

  const s3=MODEL.stalled.concat(MODEL.overHours).filter((v,i,a)=>a.findIndex(x=>x.id===v.id)===i)
    .map(t=>({'姓名':t.name,'门店':t.store,'类型':MODEL.stalled.includes(t)?'连续未打卡':'工时超标',
      '详情':MODEL.stalled.includes(t)?(t._streak.days>=9999?'从未打卡':t._streak.days+'天'):(t._hours+'h/上限'+getWorkHoursLimit(t)+'h'),
      '师傅':t.master||'','进度':t._prog.percent+'%'}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(s3),'重点跟进');

  XLSX.writeFile(wb,'带训周报_'+MODEL.today+'.xlsx');
}
function exportImage(){
  const el=document.getElementById('root');
  if(!el){ return; }
  if(typeof html2canvas==='undefined'){ alert('截图组件未加载成功，请检查网络'); return; }
  const btn=document.querySelector('button.pri');
  html2canvas(el,{backgroundColor:'#0a0b0f',scale:2,scrollY:-window.scrollY,windowWidth:document.documentElement.clientWidth})
    .then(cv=>{
      const a=document.createElement('a');
      a.href=cv.toDataURL('image/png');
      a.download='带训周报_'+(MODEL?MODEL.today:'')+'.png';
      a.click();
    }).catch(e=>alert('截图失败：'+e.message));
}
function exportPdf(){
  if(!MODEL){ alert('数据尚未加载完成'); return; }
  window.print();
}

/* ---------- 启动 ---------- */
// 兜底：任何运行时异常都显示出来，避免白屏无从排查
window.addEventListener('error',e=>{
  const r=document.getElementById('root');
  if(r && !r.dataset.rendered){
    r.innerHTML='<div class="loading" style="color:var(--red)">页面出错：'+esc(e.message||'')+
      '<div style="font-size:11px;color:var(--txt3);margin-top:8px">行 '+e.lineno+' · 请把这行信息截图发给开发者</div></div>';
  }
});
window.addEventListener('unhandledrejection',e=>{
  const r=document.getElementById('root');
  if(r && !r.dataset.rendered){
    r.innerHTML='<div class="loading" style="color:var(--red)">数据加载出错：'+esc(String(e.reason&&e.reason.message||e.reason||''))+'</div>';
  }
});

(async function init(){
  const raw=await loadData();
  const model=buildModel(raw);
  document.getElementById('dataBadge').className='badge '+(model.real?'live':'demo');
  document.getElementById('dataBadge').textContent=model.real?'真实数据':'演示数据';
  document.getElementById('brandSub').textContent='新版看板原型 · '+(model.real?'已连接生产库':'离线演示');

  const areas=[...new Set(model.all.map(t=>String(t.area)))].sort();
  const aSel=document.getElementById('areaSel');
  areas.forEach(a=>{ const o=document.createElement('option'); o.value=a; o.textContent=areaName(a); aSel.appendChild(o); });
  const stores=[...new Set(model.all.map(t=>t.store).filter(Boolean))].sort();
  const sSel=document.getElementById('storeSel');
  stores.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sSel.appendChild(o); });

  BASE=model;
  aSel.addEventListener('change',refresh);
  sSel.addEventListener('change',refresh);
  refresh();
})();
</script>
</body>
</html>
