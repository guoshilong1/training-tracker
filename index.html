/* ==================== 界面主题切换器：四套配色（深空紫 / 深海蓝 / 黑金 / 浅色商务） ==================== */
const TT_THEMES = [
  {id:'deep',  name:'深空紫',   hint:'默认 · 夜间久看不累',     sw:['#0a0b0f','#141620','#5b6cff']},
  {id:'ocean', name:'深海蓝',   hint:'对比最稳 · 长时间盯数据', sw:['#061220','#0d1f2f','#2f8fe0']},
  {id:'gold',  name:'黑金',     hint:'层级强 · 认证结业醒目',   sw:['#0c0a07','#1a1610','#d4a437']},
  {id:'light', name:'浅色商务', hint:'投屏 · 打印 · 白天最清',  sw:['#f4f6fa','#ffffff','#4338ca']}
];
const TT_KEY = 'tt_theme_v1';
function ttHasTheme(id) { return TT_THEMES.some(t => t.id === id); }
function ttCurrentTheme() {
  try {
    const dom = document.documentElement.getAttribute('data-theme');
    if (ttHasTheme(dom)) return dom;
    const v = localStorage.getItem(TT_KEY);
    return ttHasTheme(v) ? v : 'deep';
  } catch (e) { return 'deep'; }
}
function ttApplyTheme(id) {
  if (!ttHasTheme(id)) id = 'deep';
  document.documentElement.setAttribute('data-theme', id);
  try { localStorage.setItem(TT_KEY, id); } catch (e) {}
  try {
    Array.prototype.forEach.call(document.querySelectorAll('iframe'), f => {
      try { f.contentWindow.postMessage({ __ttTheme: id }, '*'); } catch (e) {}
    });
  } catch (e) {}
}
function ThemePicker() {
  const [open, setOpen] = React.useState(false);
  const [th, setTh] = React.useState(ttCurrentTheme);
  const box = React.useRef(null);
  React.useEffect(() => {
    const onMsg = ev => { if (ev.data && ev.data.__ttTheme) setTh(ev.data.__ttTheme); };
    const onDown = ev => { if (box.current && !box.current.contains(ev.target)) setOpen(false); };
    const onKey = ev => { if (ev.key === 'Escape') setOpen(false); };
    window.addEventListener('message', onMsg);
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('message', onMsg);
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('keydown', onKey);
    };
  }, []);
  const cur = TT_THEMES.filter(t => t.id === th)[0] || TT_THEMES[0];
  return (
    <div id="tt-theme-host" ref={box} className="relative flex items-center">
      <button onClick={() => setOpen(v => !v)} className="tt-btn" title={'切换界面主题（当前：' + cur.name + '）'}>
        <span className="tt-dot" style={{ background: cur.sw[2] }}></span>
        <span>主题</span>
        <svg width={10} height={6} viewBox="0 0 10 6" fill="none" style={{ opacity: .65 }}>
          <path d="M1 1l4 4 4-4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
        </svg>
      </button>
      {open && (
        <div className="tt-pop on">
          <div className="tt-hd">界面主题 · 四套任选（换设备需重选）</div>
          {TT_THEMES.map(t => (
            <button key={t.id} className={'tt-opt' + (t.id === th ? ' on' : '')}
              onClick={() => { setTh(t.id); ttApplyTheme(t.id); setOpen(false); }}>
              <span className="tt-sw">{t.sw.map((c, i) => <i key={i} style={{ background: c }}></i>)}</span>
              <span className="tt-nm">{t.name}<small>{t.hint}</small></span>
              <span className="tt-ck">{'\u2713'}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [account, setAccount] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const pwdRef = useRef(null);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    const cfg = AREA_MAP[account.trim()];
    if (!cfg) {
      setError('账号或密码错误');
      setPassword('');
      pwdRef.current && pwdRef.current.focus();
      return;
    }
    setLoading(true);
    try {
      // Supabase Auth: sign in with the account's bound email
      const { error } = await supabase.auth.signInWithPassword({
        email: `${cfg.id}@dxtrain.local`,
        password
      });
      if (error) throw error;
      onLogin({ id: cfg.id, name: cfg.name, role: cfg.role });
    } catch(e) {
      console.warn('[Auth] Login error:', e.message);
      setError('账号或密码错误');
      setPassword('');
      pwdRef.current && pwdRef.current.focus();
    }
    setLoading(false);
  };

  return (
    <div className="min-h-screen bg-gray-950 flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl fade-in">
        <div className="flex items-center gap-3 mb-6">
          <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center">
            <Icon.Award width={24} height={24} className="text-white"/>
          </div>
          <div>
            <h1 className="text-lg font-bold text-white">带训追踪系统</h1>
            <p className="text-xs text-gray-500">请输入账号密码登录</p>
          </div>
        </div>
        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">账号</label>
            <input
              type="text"
              value={account}
              onChange={e => setAccount(e.target.value)}
              placeholder="如 000"
              autoFocus
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500"
            />
          </div>
          <div>
            <label className="block text-xs text-gray-500 mb-1.5">密码</label>
            <input
              ref={pwdRef}
              type="password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              placeholder="请输入密码"
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500"
            />
          </div>
          {error && <p className="text-xs text-red-400">{error}</p>}
          <button
            type="submit"
            disabled={loading || !account.trim() || !password}
            className={`w-full py-2.5 rounded-lg text-sm font-medium text-white transition ${loading || !account.trim() || !password ? 'bg-indigo-600/50 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500'}`}
          >
            {loading ? '登录中...' : '登录'}
          </button>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(loadData);
  const [currentUser, setCurrentUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('training_tracker_user') || 'null'); }
    catch(e) { return null; }
  });
  const [view, setView] = useState('tracker');
  const [selectedId, setSelectedId] = useState(null);
  const [dashboardUnlocked, setDashboardUnlocked] = useState(false);
  const [showPwdModal, setShowPwdModal] = useState(false);
  const [showSyncModal, setShowSyncModal] = useState(false);
  const [showBotModal, setShowBotModal] = useState(false);
  const [showHoursModal, setShowHoursModal] = useState(false);
  const [showAdminPwdModal, setShowAdminPwdModal] = useState(false);
  const [pendingAdminAction, setPendingAdminAction] = useState(null); // 'import_hours' | 'export_empids' | 'import_trainees'
  const [showTraineesModal, setShowTraineesModal] = useState(false);
  const [workHours, setWorkHours] = useState(() => loadWorkHoursCache());
  const [syncStatus, setSyncStatus] = useState('connecting');
  const [lastSyncTime, setLastSyncTime] = useState(null);
  const [pushStatus, setPushStatus] = useState({ type: '', msg: '' });
  const isRemoteUpdate = useRef(false);
  const sbReady = useRef(false);
  const prevDataRef = useRef(null);

  // 拉取云端工时表（登录/打开页面时 + 每 5 分钟 + 切回页面时自动刷新）
  const refreshWorkHours = useCallback(async () => {
    try {
      if (!(await _sbHasSession())) return;
      const map = await sbFetchWorkHours();
      setWorkHours(map);
      saveWorkHoursCache(map);
    } catch(e) { /* 工时拉取失败不打扰主流程 */ }
  }, []);

  useEffect(() => {
    refreshWorkHours();
    const t = setInterval(() => {
      if (document.visibilityState === 'visible') refreshWorkHours();
    }, 5 * 60 * 1000);
    const onVis = () => { if (document.visibilityState === 'visible') refreshWorkHours(); };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      clearInterval(t);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [currentUser, refreshWorkHours]);

  // Save to localStorage + push changed rows to Supabase
  useEffect(() => {
    saveData(data);
    if (!isRemoteUpdate.current && sbReady.current && currentUser) {
      const ts = Date.now();
      sbPushData(data, prevDataRef.current || { trainees: [] }, ts);
      setLastSyncTime(ts);
    }
    prevDataRef.current = data;
    isRemoteUpdate.current = false;
  }, [data]);

  // Initialize Supabase sync
  useEffect(() => {
    initSupabaseSync();

    // Validate session on startup — if expired, force re-login
    supabase.auth.getSession().then(({ data: sd }) => {
      if (!sd.session) {
        localStorage.removeItem('training_tracker_user');
        setCurrentUser(null);
      }
    });

    const unsubUpdate = sbOnUpdate((remoteData, remoteTs) => {
      // Merge remote into local — preserves local-only entries (pushed later)
      isRemoteUpdate.current = true;
      setData(prevData => {
        const mergedResult = mergeTrainees(prevData.trainees, remoteData.trainees || [], prevData._deletedIds || [], remoteData._deletedIds || []);
        const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: remoteTs });
        saveData(newData);
        return newData;
      });
      setLastSyncTime(remoteTs || Date.now());
    });

    const unsubStatus = sbOnStatus((status) => {
      setSyncStatus(status);
    });

    const unsubPushStatus = sbOnPushStatus((status, msg) => {
      setPushStatus({ type: status, msg });
      if (status === 'success') {
        setTimeout(() => setPushStatus({ type: '', msg: '' }), 2000);
      }
    });

    // After 1.5s, mark sync ready and push local data if it has content
    // (remote data should have been fetched and merged by now)
    const initTimer = setTimeout(() => {
      sbReady.current = true;
      const localData = loadData();
      // Only push if local has trainees (skip if empty/new device)
      if (localData.trainees && localData.trainees.length > 0) {
        const ts = Date.now();
        sbPushData(localData, prevDataRef.current || { trainees: [] }, ts);
        setLastSyncTime(ts);
      }
    }, 1500);

    // Realtime subscription: pull immediately when cloud data changes
    const unsubRealtime = sbSubscribeRealtime(async () => {
      if (document.visibilityState !== 'visible') return;
      try {
        const remote = await sbFetchAll();
        if (!remote.trainees || remote.trainees.length === 0) return;
        isRemoteUpdate.current = true;
        setData(prevData => {
          const mergedResult = mergeTrainees(prevData.trainees, remote.trainees, prevData._deletedIds || [], remote._deletedIds || []);
          const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: Date.now() });
          saveData(newData);
          return newData;
        });
        setLastSyncTime(Date.now());
      } catch(e) {}
    });

    // Fallback poll every 12s when tab is visible (Realtime is the primary sync;
    // idle auto-close removes unattended pages, so a short poll stays cheap)
    const pollTimer = setInterval(async () => {
      if (document.visibilityState !== 'visible') return; // don't poll in background
      try {
        const remote = await sbFetchAll();
        if (!remote.trainees || remote.trainees.length === 0) return;
        isRemoteUpdate.current = true;
        setData(prevData => {
          const mergedResult = mergeTrainees(prevData.trainees, remote.trainees, prevData._deletedIds || [], []);
          const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: Date.now() });
          saveData(newData);
          return newData;
        });
        setLastSyncTime(Date.now());
      } catch(e) { /* errors surfaced via status listeners */ }
    }, 12000);

    // When tab becomes visible again, sync immediately
    const onVisibility = () => {
      if (document.visibilityState !== 'visible') return;
      (async () => {
        try {
          const remote = await sbFetchAll();
          if (!remote.trainees || remote.trainees.length === 0) return;
          isRemoteUpdate.current = true;
          setData(prevData => {
            const mergedResult = mergeTrainees(prevData.trainees, remote.trainees, prevData._deletedIds || [], []);
            const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: Date.now() });
            saveData(newData);
            return newData;
          });
          setLastSyncTime(Date.now());
        } catch(e) {}
      })();
    };
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      clearTimeout(initTimer);
      clearInterval(pollTimer);
      document.removeEventListener('visibilitychange', onVisibility);
      if (unsubRealtime) unsubRealtime();
      unsubUpdate();
      unsubStatus();
      unsubPushStatus();
    };
  }, []);

  // After login, pull remote data immediately (no 30min wait)
  const lastUserRef = useRef(null);
  useEffect(() => {
    if (!currentUser || currentUser === lastUserRef.current) return;
    lastUserRef.current = currentUser;
    (async () => {
      try {
        const remote = await sbFetchAll();
        if (!remote.trainees || remote.trainees.length === 0) return;
        isRemoteUpdate.current = true;
        setData(prevData => {
          const mergedResult = mergeTrainees(prevData.trainees, remote.trainees, prevData._deletedIds || [], []);
          const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: Date.now() });
          saveData(newData);
          return newData;
        });
        setLastSyncTime(Date.now());
      } catch(e) {}
    })();
  }, [currentUser]);

  const visibleTrainees = useMemo(() => {
    if (!currentUser) return [];
    if (currentUser.role === 'manager') {
      // 大区经理只能看到自己名下小区(subAreas)的学员
      const cfg = AREA_MAP[currentUser.id];
      const subs = (cfg && cfg.subAreas) || [];
      if (subs.length === 0) return [];
      return data.trainees.filter(t => subs.includes(t.area || '000'));
    }
    return data.trainees.filter(t => (t.area || '000') === currentUser.id);
  }, [data.trainees, currentUser]);

  const stores = useMemo(() => {
    const set = new Set(visibleTrainees.map(t => t.store).filter(Boolean));
    return Array.from(set).sort();
  }, [visibleTrainees]);

  // Auto-select first trainee (from visible list)
  useEffect(() => {
    if (!selectedId && visibleTrainees.length > 0) {
      setSelectedId(visibleTrainees[0].id);
    }
  }, [visibleTrainees, selectedId]);

  // Update document title when logged in
  useEffect(() => {
    if (currentUser) {
      document.title = currentUser.name;
    } else {
      document.title = '带训追踪系统 - 登录';
    }
  }, [currentUser]);

  const handleLogin = (user) => {
    localStorage.setItem('training_tracker_user', JSON.stringify(user));
    setCurrentUser(user);
    setView(user.role === 'manager' ? 'region_dashboard' : 'tracker');
    setDashboardUnlocked(user.role === 'manager');
  };

  const handleLogout = () => {
    supabase.auth.signOut().catch(() => {});
    localStorage.removeItem('training_tracker_user');
    setCurrentUser(null);
    setView('tracker');
    setSelectedId(null);
    setDashboardUnlocked(false);
  };

  // 导出所有区域「正在带训」学员的工号表（已认证/已完成全部带训天的不导出）
  const handleExportEmpIds = () => {
    const list = data.trainees
      .filter(t => getCurrentDay(t) !== null)
      .sort((a, b) => {
        const aa = a.area || '000', bb = b.area || '000';
        if (aa !== bb) return aa.localeCompare(bb, undefined, { numeric: true });
        return String(a.store || '').localeCompare(String(b.store || ''), 'zh');
      });
    const aoa = [['工号', '姓名', '门店', '区域', '带训进度', '备注']];
    for (const t of list) {
      const cfg = AREA_MAP[t.area || '000'];
      const areaName = cfg ? cfg.name.replace('区域带训追踪系统', '') : (t.area || '000');
      const prog = calcProgress(t);
      aoa.push([
        t.empId || '',
        t.name || '',
        t.store || '',
        areaName,
        prog.percent + '%',
        t.empId ? '' : '工号未填，请补录'
      ]);
    }
    if (list.length === 0) { alert('当前没有正在带训的学员，无需导出'); return; }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 14 }, { wch: 12 }, { wch: 22 }, { wch: 10 }, { wch: 10 }, { wch: 20 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '带训学员工号');
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    XLSX.writeFile(wb, `带训学员工号表_${stamp}.xlsx`);
  };

  // 批量导入学员（000 账号专用）：一次性灌入多区域学员，自动推送云端
  const handleBatchImportTrainees = (rows) => {
    const now = Date.now();
    const today = new Date().toISOString().slice(0, 10);
    const created = rows.map(r => ({
      id: genId(),
      name: r.name,
      store: r.store,
      route: r.route,
      subRoute: r.subRoute || '',
      startDate: r.startDate || today,
      master: r.master || '',
      empId: r.empId || '',
      area: r.area,
      note: '',
      progress: {},
      createdAt: new Date().toISOString(),
      _updatedAt: now
    }));
    setData(d => ({ ...d, trainees: [...d.trainees, ...created] }));
    return created.length;
  };

  const handleAddTrainee = (trainee) => {
    const newTrainee = {
      id: genId(),
      ...trainee,
      area: currentUser?.role === 'area' ? currentUser.id : (trainee.area || '000'),
      progress: {},
      createdAt: new Date().toISOString(),
      _updatedAt: Date.now()
    };
    setData(d => ({ ...d, trainees: [...d.trainees, newTrainee] }));
    setSelectedId(newTrainee.id);
  };

  const handleEditTrainee = (id, updates) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.map(t => t.id === id ? { ...t, ...updates, area: t.area || '000', _updatedAt: Date.now() } : t)
    }));
  };

  const handleDeleteTrainee = (id) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.filter(t => t.id !== id),
      _deletedIds: [...new Set([...(d._deletedIds || []), id])]
    }));
    if (selectedId === id) setSelectedId(null);
  };

  // 标记离职：写入 progress._meta.resigned（随 progress JSON 同步落库），数据全保留
  const handleResignTrainee = (id) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.map(t => t.id === id ? {
        ...t,
        progress: {
          ...(t.progress || {}),
          _meta: {
            ...((t.progress && t.progress._meta) || {}),
            resigned: true,
            resignedAt: new Date().toISOString()
          }
        },
        _updatedAt: Date.now()
      } : t)
    }));
  };

  // 恢复在职：resigned=false + 刷新 resignedAt（时间戳 last-write-wins，确保恢复操作跨设备生效）
  const handleRestoreTrainee = (id) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.map(t => t.id === id ? {
        ...t,
        progress: {
          ...(t.progress || {}),
          _meta: {
            ...((t.progress && t.progress._meta) || {}),
            resigned: false,
            resignedAt: new Date().toISOString()
          }
        },
        _updatedAt: Date.now()
      } : t)
    }));
  };

  const handleUpdateProgress = (id, progress) => {
    setData(d => ({
      ...d,
      trainees: d.trainees.map(t => t.id === id ? { ...t, progress, _updatedAt: Date.now() } : t)
    }));
  };

  const handleImportData = (imported) => {
    const stamped = normalizeData({
      trainees: (imported.trainees || []).map(t => ({ ...t, _updatedAt: t._updatedAt || Date.now() })),
      _deletedIds: imported._deletedIds || []
    });
    setData(stamped);
    setSelectedId(stamped.trainees.length > 0 ? stamped.trainees[0].id : null);
  };

  const handlePull = (remoteTrainees, remoteDeletedIds) => {
    setData(prevData => {
      const mergedResult = mergeTrainees(prevData.trainees, remoteTrainees, prevData._deletedIds || [], remoteDeletedIds || []);
      const newData = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: Date.now() });
      saveData(newData);
      return newData;
    });
  };

  // Not logged in: show full-screen login
  if (!currentUser) {
    return <LoginScreen onLogin={handleLogin} />;
  }

  const isManager = currentUser.role === 'manager';

  return (
    <div className="min-h-screen bg-gray-950">
      {/* Header */}
      <header className="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-lg border-b border-gray-800">
        <div className="tt-hdr-row flex items-center justify-between px-5">
          <div className="tt-hl flex items-center gap-6">
            <div className="tt-logo flex items-center gap-2.5">
              <div className="tt-logo-ico w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center">
                <Icon.Award width={18} height={18} className="text-white"/>
              </div>
              <div>
                <h1 className="tt-logo-name text-base font-bold text-white leading-tight">{currentUser.name}</h1>
                <p className="tt-logo-sub text-xs text-gray-500 leading-tight">
                  {isManager ? '大区汇总看板 · 全区域数据总览' : '区域带训进度管理'}
                </p>
              </div>
            </div>
          </div>
          <div className="tt-hr flex items-center gap-3">
            <ThemePicker />
            <span className="tt-stat text-xs text-gray-500">{visibleTrainees.length} 名学员</span>
            <span className="tt-stat text-xs text-gray-700">|</span>
            <span className="tt-stat text-xs text-gray-500">{stores.length} 家门店</span>
            <span className="tt-stat text-xs text-gray-700">|</span>
            <button
              onClick={handleLogout}
              className="text-xs text-gray-400 hover:text-white transition flex items-center gap-1"
            >
              <Icon.LogOut width={12} height={12}/> 退出
            </button>
          </div>
          <nav className="tt-nav flex items-center gap-1">
            {!isManager && (
              <button
                onClick={() => setView('tracker')}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'tracker' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
              >
                <Icon.Calendar width={16} height={16}/> 带训追踪
              </button>
            )}
            <button
              onClick={() => {
                if (dashboardUnlocked) {
                  setView(isManager ? 'region_dashboard' : 'dashboard');
                } else {
                  setShowPwdModal(true);
                }
              }}
              className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'dashboard' || view === 'region_dashboard' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
            >
              <Icon.Dashboard width={16} height={16}/> 管理看板
            </button>
            {currentUser.id === '000' && (
              <button
                onClick={() => { setPendingAdminAction('import_trainees'); setShowAdminPwdModal(true); }}
                className="tt-hide-sm flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition text-gray-400 hover:text-white hover:bg-gray-800"
                title="用 Excel 一次性导入所有区域的学员"
              >
                <Icon.User width={16} height={16}/> 导入学员
              </button>
            )}
            {currentUser.id === '000' && (

      {/* 数据同步弹窗 */}
      {showSyncModal && (

          lastSyncTime={lastSyncTime}

      {/* 企微机器人配置弹窗 */}
      {showBotModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" onClick={() => setShowBotModal(false)}>
          <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-3xl max-h-[85vh] overflow-y-auto shadow-2xl fade-in" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between p-5 border-b border-gray-800 sticky top-0 bg-gray-900 z-10">
              <div className="flex items-center gap-3">

                    <rect x="3" y="11" width="18" height="10" rx="2"/>

    </div>
  );
}

  <script>
  // ============ Idle auto-close: 3min no activity -> 10s countdown -> close ============
  (function initIdleAutoClose() {
    var IDLE_MS = 3 * 60 * 1000;
    var COUNTDOWN_MS = 10 * 1000;
    var overlay = document.getElementById('idle-overlay');
    var countdownEl = document.getElementById('idle-countdown');
    var idleTimer = null;
    var countdownTimer = null;
    var lastActivity = 0;

    function clearTimers() {
      if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    }

    function closePage() {
      try { window.location.replace('about:blank'); }
      catch (e) { try { window.location.href = 'about:blank'; } catch (e2) {} }
    }

    function startCountdown() {
      if (!overlay || overlay.style.display === 'flex') return;
      overlay.style.display = 'flex';
      var remain = Math.round(COUNTDOWN_MS / 1000);
      if (countdownEl) countdownEl.textContent = String(remain);
      countdownTimer = setInterval(function () {
        remain -= 1;
        if (countdownEl) countdownEl.textContent = String(remain);
        if (remain <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          closePage();
        }
      }, 1000);
    }

    function resetIdle() {
      if (document.visibilityState !== 'visible') return;
      clearTimers();
      if (overlay) overlay.style.display = 'none';
      idleTimer = setTimeout(startCountdown, IDLE_MS);
    }

    function onActivity() {
      var now = Date.now();
      if (now - lastActivity < 500) return; // throttle mousemove/scroll
      lastActivity = now;
      resetIdle();
    }

    document.addEventListener('mousemove', onActivity, { passive: true });
    document.addEventListener('mousedown', resetIdle, { passive: true });
    document.addEventListener('keydown', resetIdle, { passive: true });
    document.addEventListener('touchstart', resetIdle, { passive: true });
    document.addEventListener('scroll', onActivity, { passive: true });
    document.addEventListener('wheel', onActivity, { passive: true });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') resetIdle();
    });
    if (overlay) overlay.addEventListener('mousedown', resetIdle);

    resetIdle();
  })();
  </script>
<script>
/* 顶栏高度实时测量 → 写入 --tt-hdr：折叠屏展开/收起、横竖屏切换、地址栏收起都能自适应 */
(function () {
  var doc = document.documentElement;
  var el = null;
  var last = -1;

  function pick() {
    if (el && document.body.contains(el)) return el;
    el = document.querySelector('header') || document.querySelector('.topbar');
    return el;
  }

  function sync() {
    var t = pick();
    if (!t) return false;
    var h = Math.round(t.getBoundingClientRect().height);
    if (h > 0 && h !== last) {
      last = h;
      doc.style.setProperty('--tt-hdr', h + 'px');
    }
    return true;
  }

  function bindRO() {
    if (!window.ResizeObserver) return;
    var t = pick();
    if (!t) return;
    try { new ResizeObserver(sync).observe(t); } catch (e) {}
  }

  function boot() {
    sync();
    bindRO();
    // React/Babel 首帧较晚，前 12 秒内轻量重试，直到拿到真实高度
    var n = 0;
    var iv = setInterval(function () {
      if (sync() && n > 2) clearInterval(iv);
      if (++n > 80) clearInterval(iv);
    }, 150);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', function () { setTimeout(sync, 180); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', sync);
})();
</script>
