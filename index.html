            }`}
          >
            {isRest ? '撤销休息' : '休息'}
          </button>
          {unlocked && day.items.length > 0 && (
            <button onClick={() => setExpanded(!expanded)} className="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 transition">
              <span className={`inline-block transition-transform ${expanded ? 'rotate-0' : '-rotate-90'}`}><Icon.ChevronDown/></span>
            </button>
          )}
        </div>
      </div>

      {/* Day Content */}
      {unlocked && expanded && day.items.length > 0 && (
        <div className="px-4 py-3 space-y-2">
          {day.items.map((item, idx) => {
            const itemType = getItemType(item.content);
            const itemStyle = ITEM_STYLES[itemType] || ITEM_STYLES.learn;
            const itemState = checkedItems[idx] || {};
            const isDone = item.choices ? !!itemState.choice : !!itemState.checked;
            return (
              <div key={idx} className={`flex items-start gap-3 p-2.5 rounded-lg ${isDone ? 'bg-gray-800/40' : 'bg-gray-800/20'} border border-gray-800/50`}>
                {!item.choices && (
                  <button
                    disabled={dayLocked}
                    onClick={() => { if (!dayLocked) onToggleItem(day.key, idx, !itemState.checked); }}
                    className={`checkbox-custom mt-0.5 flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center transition ${itemState.checked ? 'bg-indigo-600 border-indigo-600' : 'border-gray-600 hover:border-indigo-500'} ${dayLocked ? 'opacity-40 cursor-not-allowed' : ''}`}
                  >
                    {itemState.checked && <Icon.Check width={12} height={12} className="text-white"/>}
                  </button>
                )}
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={`text-sm ${isDone ? 'text-gray-400 line-through' : 'text-gray-200'}`}>{item.content}</span>
                    <span className={`text-xs px-1.5 py-0.5 rounded ${itemStyle.bg} ${itemStyle.text}`}>
                      {itemType === 'learn' ? '学习' : itemType === 'practice' ? '练习' : itemType === 'cert' ? '认证' : '终审'}
                    </span>
                  </div>
                  {item.choices ? (
                    <div className="mt-2">
                      <div className="flex flex-wrap gap-2">
                        {item.choices.map(choice => (
                          <button
                            key={choice}
                            disabled={dayLocked}
                            onClick={() => { if (!dayLocked) onToggleItem(day.key, idx, true, choice); }}
                            className={`px-3 py-1.5 rounded-lg text-xs border transition ${itemState.choice === choice ? 'bg-indigo-600 border-indigo-500 text-white' : 'border-gray-700 text-gray-400'} ${dayLocked ? 'opacity-40 cursor-not-allowed' : 'hover:border-indigo-500 hover:text-indigo-300'}`}
                          >
                            {choice}
                          </button>
                        ))}
                      </div>
                      <div className="flex items-center gap-3 mt-1.5 text-xs text-gray-500">
                        <span>学员: {item.student_hours || '-'}</span>
                        {item.teacher_hours && <span>师傅: {item.teacher_hours}</span>}
                      </div>
                    </div>
                  ) : (
                    <div className="flex items-center gap-3 mt-1 text-xs text-gray-500">
                      <span>学员: {item.student_hours || '-'}</span>
                      {item.teacher_hours && <span>师傅: {item.teacher_hours}</span>}
                    </div>
                  )}
                  {item.note && <div className="mt-1.5 text-xs text-indigo-300/80 leading-relaxed">{item.note}</div>}
                </div>
              </div>
            );
          })}

          {/* Master Signature + Training Time + Complete Day Button */}
          <div className="pt-2 space-y-2">
            <div className="flex items-center gap-2">
              <span className="text-xs text-gray-500 flex-shrink-0">师傅签名</span>
              <input
                type="text"
                value={masterName}
                onChange={(e) => setMasterName(e.target.value)}
                placeholder="当天负责师傅姓名 *必填"
                disabled={isCompleted}
                className={`flex-1 bg-gray-800 rounded-lg px-3 py-1.5 text-sm text-white placeholder-gray-600 focus:outline-none ${isCompleted ? 'border border-gray-700 opacity-70' : !masterName.trim() ? 'border border-red-500/50' : 'border border-gray-700'}`}
              />
              {dayProgress?.signatureAt && (
                <span className="text-xs text-gray-500 flex-shrink-0">{new Date(dayProgress.signatureAt).toLocaleString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
              )}
            </div>
            {/* 今日带训次数选择 */}
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs text-gray-500 flex-shrink-0">今日带训次数</span>
              <div className="inline-flex rounded-lg overflow-hidden border border-gray-700">
                {[1, 2, 3].map(n => (
                  <button
                    key={n}
                    type="button"
                    disabled={isCompleted}
                    onClick={() => handleSessionCountChange(n)}
                    className={`px-3 py-1 text-xs font-medium transition ${sessionCount === n ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400 hover:text-white'} ${isCompleted ? 'opacity-60 cursor-not-allowed' : ''}`}
                  >{n}次</button>
                ))}
              </div>
              {dayProgress?.trainingTimes && dayProgress.trainingTimes.length > 0 && (
                <span className="text-xs text-gray-500 flex-shrink-0">
                  已填 {dayProgress.trainingTimes.filter(t => t).join(' / ')}
                </span>
              )}
              {!dayProgress?.trainingTimes && dayProgress?.trainingTime && (
                <span className="text-xs text-gray-500 flex-shrink-0">已填 {dayProgress.trainingTime}</span>
              )}
            </div>
            {/* 各次带训时间输入框 */}
            <div className="space-y-1.5">
              {Array.from({ length: sessionCount }).map((_, idx) => (
                <div key={idx} className="flex items-center gap-2">
                  <span className="text-xs text-gray-500 flex-shrink-0 w-12">第{idx + 1}次</span>
                  <input
                    type="time"
                    value={trainingTimes[idx] || ''}
                    onChange={(e) => handleTimeChange(idx, e.target.value)}
                    placeholder="如 09:00"
                    disabled={isCompleted}
                    className={`flex-1 bg-gray-800 rounded-lg px-3 py-1.5 text-sm text-white placeholder-gray-600 focus:outline-none ${isCompleted ? 'border border-gray-700 opacity-70' : !trainingTimes[idx] ? 'border border-red-500/50' : 'border border-gray-700'}`}
                  />
                </div>
              ))}
            </div>
            {!isCompleted ? (
              <button
                onClick={() => {
                  const filled = trainingTimes.filter(t => t && t.trim());
                  onCompleteDay(day.key, masterName, filled);
                }}
                disabled={!allItemsChecked || !masterName.trim() || !anyTimeFilled}
                className={`w-full py-2.5 rounded-lg font-medium text-sm transition ${allItemsChecked && masterName.trim() && anyTimeFilled ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-gray-800 text-gray-500 cursor-not-allowed'}`}
              >
                {allItemsChecked ? (masterName.trim() && anyTimeFilled ? '✓ 确认完成本天带训' : '请填写师傅签名和至少一次带训时间') : `需完成全部 ${day.items.length} 项后才能解锁下一天`}
              </button>
            ) : (
              <div className="w-full py-2.5 rounded-lg font-medium text-sm bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-center flex items-center justify-center gap-1.5">
                <Icon.Check width={14} height={14}/> 本天带训已完成（不可撤回）
              </div>
            )}
          </div>
        </div>
      )}

      {!unlocked && (
        <div className="px-4 py-3 text-sm text-gray-600 flex items-center gap-2">
          <Icon.Lock/> 完成前一天后自动解锁
        </div>
      )}

      {/* 延迟备注弹窗 */}
      {showDelayModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={() => setShowDelayModal(false)}>
          <div className="relative w-full max-w-md bg-gray-900 border border-amber-500/30 rounded-2xl shadow-2xl fade-in" onClick={e => e.stopPropagation()}>
            <div className="px-6 py-4 border-b border-gray-800 flex items-center justify-between">
              <h2 className="text-base font-semibold text-white flex items-center gap-2">
                <Icon.Clock width={16} height={16} className="text-amber-400"/>
                {isDelayed ? '修改延迟备注' : '标记本日延迟'}
              </h2>
              <button onClick={() => setShowDelayModal(false)} className="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400"><Icon.Close/></button>
            </div>
            <div className="p-6 space-y-3">
              <p className="text-sm text-gray-400">
                今日仅打卡未完成学习内容，请填写延迟原因：
              </p>
              {dayProgress?.delayNote && (
                <div className="text-xs text-gray-500 bg-gray-800/40 border border-gray-800 rounded-lg px-3 py-2">
                  当前备注：<span className="text-amber-300">{dayProgress.delayNote}</span>
                </div>
              )}
              <textarea
                value={delayNoteInput}
                onChange={e => setDelayNoteInput(e.target.value)}
                rows={4}
                placeholder="例：店长外出培训、门店未开业、休假、紧急事故、培训师未到、其它..."
                className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 resize-none focus:border-amber-500/50 focus:outline-none"
              />
              <div className="flex justify-between items-center gap-3 pt-1">
                {isDelayed ? (
                  <button
                    onClick={() => { onUndoDelay(day.key); setShowDelayModal(false); }}
                    className="text-xs text-rose-400 hover:text-rose-300"
                  >
                    撤销延迟
                  </button>
                ) : <span/>}
                <div className="flex gap-2">
                  <button onClick={() => setShowDelayModal(false)} className="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition text-sm">取消</button>
                  <button
                    onClick={() => {
                      const v = delayNoteInput.trim();
                      if (!v) { alert('请填写延迟原因'); return; }
                      onDelayDay(day.key, v);
                      setShowDelayModal(false);
                    }}
                    className="px-5 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-medium transition text-sm"
                  >保存</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


// ============ 自由学习路线：阶段聚合卡片（师傅带教 / 门店主管） ============
// 一个阶段一张卡片，阶段内所有项目平铺展示、自由勾选；不显示「第X天」。
// 阶段之间顺序递进：上一阶段全部项目（学习+刻意练习+认证）完成，才解锁下一阶段。
// 进度仍存 day.key + itemIdx，勾完某天全部项目即自动完成该天，证书/时限/结业口径不变。
function FreeStageCard({ phaseIndex, phaseDays, progressMap, trainee, onToggleItem, onDrillCheckin, onDrillUndo, onPhaseSign, onSetRestDays }) {
  const [makeupTarget, setMakeupTarget] = useState(null); // {dayKey, itemIdx, drillIdx, name}
  const [makeupDate, setMakeupDate] = useState('');
  const [makeupReason, setMakeupReason] = useState('');
  const [showRest, setShowRest] = useState(false);
  const [restInput, setRestInput] = useState('');
  const fullDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  const phaseName = phaseDays[0].phaseName || ('阶段 ' + (phaseIndex + 1));
  const pstat = getPhasePracticeStat(trainee, fullDays, phaseIndex);
  const sign = getPhaseSign(trainee, phaseIndex);
  const signed = phaseSigned(trainee, phaseIndex);
  const restDays = getRestDays(trainee);
  const unlocked = isPhaseUnlocked(trainee, fullDays, phaseIndex);
  const prevDays = fullDays.filter(d => d.phaseIndex === phaseIndex - 1 && d.items.length > 0);
  const prevName = prevDays.length ? (prevDays[0].phaseName || ('阶段 ' + phaseIndex)) : '上一阶段';
  const prevTotal = prevDays.reduce((n, d) => n + d.items.length, 0);
  const entries = [];
  phaseDays.forEach(d => d.items.forEach((item, idx) => entries.push({ day: d, item: item, idx: idx, key: d.key + '_' + idx })));
  const stateOf = e => {
    const dp = progressMap[e.day.key] || {};
    const st = (dp.items || {})[e.idx] || {};
    return { st: st, done: e.item.choices ? !!st.choice : !!st.checked, locked: !unlocked || isDelayActiveToday(dp) || isRestActiveToday(dp) };
  };
  const doneCount = entries.filter(e => stateOf(e).done).length;
  const pct = entries.length ? Math.round(doneCount / entries.length * 100) : 0;
  const w = getPhaseWindow(trainee, fullDays, phaseIndex);
  const tone = !unlocked ? 'border-gray-800'
    : (w && !w.notStarted && (w.learnOverdue || w.practiceOverdue))
    ? 'border-red-500/40'
    : (pct === 100 ? 'border-emerald-500/40' : 'border-gray-700');
  return (
    <div className={`rounded-xl border ${tone} bg-gray-900/50 overflow-hidden`}>
      <div className="px-4 py-3 border-b border-gray-800/70 bg-gray-800/30">
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-2">
            <span className={`flex items-center justify-center w-8 h-8 rounded-lg text-sm font-bold ${!unlocked ? 'bg-gray-700/50 text-gray-500' : pct === 100 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-indigo-500/20 text-indigo-300'}`}>
              {!unlocked ? <Icon.Lock width={14} height={14}/> : pct === 100 ? <Icon.Check width={15} height={15}/> : (phaseIndex + 1)}
            </span>
            <div>
              <div className="text-sm font-semibold text-white">{phaseName}</div>
              <div className="text-[11px] text-gray-500">{phaseDays[0].phaseFocus || '按阶段自由学习'}</div>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap justify-end">
            {pstat.total > 0 && (
              <span className={`text-[11px] px-2 py-0.5 rounded ${pstat.broken ? 'bg-amber-500/15 text-amber-400' : pstat.reached === pstat.total ? 'bg-emerald-500/15 text-emerald-400' : 'bg-sky-500/15 text-sky-300'}`}>
                练习 {pstat.reached}/{pstat.total} 动作{pstat.makeup ? ` · 补记${pstat.makeup}` : ''}{pstat.broken ? ` · 断档${pstat.broken}` : ''}
              </span>
            )}
            {signed && <span className="text-[11px] px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400">两级已确认</span>}
            <span className="text-xs text-gray-400 tabular-nums">{doneCount}/{entries.length} 项</span>
            <div className="w-20 h-1.5 bg-gray-800 rounded-full overflow-hidden">
              <div className={`h-full rounded-full ${pct === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}`} style={{width: pct + '%'}}></div>
            </div>
          </div>
        </div>
        {!unlocked ? (
          <div className="mt-2 pt-2 border-t border-gray-800/60 text-[11px] text-amber-400/90">
            完成「{prevName}」全部 {prevTotal} 项（含学习、刻意练习与认证）并办完学员+上级两级确认后解锁本阶段
          </div>
        ) : w && w.notStarted ? (
          <div className="mt-2 pt-2 border-t border-gray-800/60 text-[11px] text-gray-500">
            勾选本阶段第一项后开始计时：{w.rule.learnDays} 天学习 + {w.rule.practiceDays} 天刻意练习（起点按首次勾选日计算）
          </div>
        ) : w ? (
          <div className="mt-2 pt-2 border-t border-gray-800/60 text-[11px] text-gray-400 space-y-0.5">
            <div>{w.rule.learnDays} 天学习 + {w.rule.practiceDays} 天刻意练习 · 起点 {w.start}（首项勾选）· 学习截止 {w.learnEnd} · 练习截止 {w.practiceEnd}</div>
            <div className={(w.learnOverdue || w.practiceOverdue) ? 'text-red-400' : (w.learnLateDays > 0 ? 'text-amber-400' : 'text-gray-500')}>
              {w.done ? '本阶段时限已达标' :
               w.learnOverdue ? `学习已超期 ${w.learnOverdueDays} 天，请补完并标注原因` :
               w.practiceOverdue ? `刻意练习已超期 ${w.practiceOverdueDays} 天，未达标不得进入下一阶段` :
               w.learnLateDays > 0 ? `学习超期 ${w.learnLateDays} 天完成，练习窗口仍截至 ${w.practiceEnd}` :
               (w.learnDone ? `练习剩 ${w.practiceLeft} 天` : `学习剩 ${w.learnLeft} 天`)}
            </div>
          </div>
        ) : null}
        {pstat.total > 0 && (
          <div className="mt-1 text-[10px] text-gray-500">
            {phaseIndex === 0 ? '第一阶段练习允许断档；第二、三阶段练习日期须逐日连续（不按排班表），断档将拦截阶段确认' : '本阶段练习日期须逐日连续（不按排班表豁免休息日），断档会拦截阶段确认'}
          </div>
        )}
      </div>
      <div className={"px-4 py-3 space-y-2" + (!unlocked ? " opacity-60" : "")}>
        {entries.map(e => {
          const s = stateOf(e);
          const itemType = getItemType(e.item.content);
          const itemStyle = ITEM_STYLES[itemType] || ITEM_STYLES.learn;
          const typeLabel = itemType === 'learn' ? '学习' : itemType === 'practice' ? '练习' : itemType === 'cert' ? '认证' : '终审';
          return (
            <div key={e.key} className={`flex items-start gap-3 p-2.5 rounded-lg border border-gray-800/50 ${s.done ? 'bg-gray-800/40' : 'bg-gray-800/20'}`}>
              {!e.item.choices && (
                <button
                  disabled={s.locked}
                  onClick={() => { if (!s.locked) onToggleItem(e.day.key, e.idx, !s.st.checked); }}
                  className={`checkbox-custom mt-0.5 flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center transition ${s.done ? 'bg-indigo-600 border-indigo-600' : 'border-gray-600 hover:border-indigo-500'} ${s.locked ? 'opacity-40 cursor-not-allowed' : ''}`}
                >
                  {s.done && <Icon.Check width={12} height={12} className="text-white"/>}
                </button>
              )}
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className={`text-sm ${s.done ? 'text-gray-400 line-through' : 'text-gray-200'}`}>{e.item.content}</span>
                  <span className={`text-xs px-1.5 py-0.5 rounded ${itemStyle.bg} ${itemStyle.text}`}>{typeLabel}</span>
                  {itemType === 'final_cert' && <span className="text-[10px] px-1.5 py-0.5 rounded bg-red-500/15 text-red-300">岗位认证</span>}
                  {s.done && s.st.checkedAt && <span className="text-[11px] text-gray-500 tabular-nums flex items-center gap-1"><Icon.Clock width={11} height={11}/> {new Date(s.st.checkedAt).toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'})}</span>}
                </div>
                {e.item.choices && (
                  <div className="mt-2 flex flex-wrap gap-2">
                    {e.item.choices.map(ch => (
                      <button key={ch} disabled={s.locked}
                        onClick={() => { if (!s.locked) onToggleItem(e.day.key, e.idx, true, ch); }}
                        className={`px-3 py-1.5 rounded-lg text-xs border transition ${s.st.choice === ch ? 'bg-indigo-600 border-indigo-500 text-white' : 'border-gray-700 text-gray-400'} ${s.locked ? 'opacity-40 cursor-not-allowed' : 'hover:border-indigo-500 hover:text-indigo-300'}`}
                      >{ch}</button>
                    ))}
                  </div>
                )}
                <div className="flex items-center gap-3 mt-1 text-xs text-gray-500">
                  <span>学员: {e.item.student_hours || '-'}</span>
                  {e.item.teacher_hours && <span>带教: {e.item.teacher_hours}</span>}
                </div>
                {e.item.note && <div className="mt-1.5 text-xs text-indigo-300/80 leading-relaxed">{e.item.note}</div>}

                {/* 刻意练习打卡条：勾选本项后才展开，每个动作独立计数，支持补记留痕 */}
                {s.done && e.item.drills && e.item.drills.length > 0 && (
                  <div className="mt-2.5 pt-2.5 border-t border-gray-700/50 space-y-2.5">
                    {e.item.drills.map((dr, di) => {
                      const stt = getDrillStat(trainee, e.day.key, e.idx, di, dr.count, phaseIndex);
                      return (
                        <div key={di} className="rounded-lg bg-gray-950/50 border border-gray-800/60 p-2">
                          <div className="flex items-center justify-between gap-2 flex-wrap mb-1.5">
                            <span className="text-xs text-gray-300">{dr.name}</span>
                            <span className={`text-[11px] tabular-nums ${stt.reached ? 'text-emerald-400' : 'text-sky-300'}`}>{stt.doneCount}/{stt.need} 次</span>
                          </div>
                          <div className="flex flex-wrap gap-1.5">
                            {Array.from({length: stt.need}).map((_, n) => {
                              const rec = stt.records[n];
                              return rec ? (
                                <button key={n} title={`${rec.date}${rec.makeup ? ` · 补记：${rec.reason}（${rec.byName} ${rec.makeupAt ? rec.makeupAt.slice(0,16).replace('T',' ') : ''}）` : ` · ${rec.byName}`}｜点击撤销`}
                                  onClick={() => { if (!s.locked && window.confirm('撤销 ' + rec.date + ' 这次打卡？')) onDrillUndo(e.day.key, e.idx, di, rec.date); }}
                                  className={`px-2 py-1 rounded text-[11px] tabular-nums border ${rec.makeup ? 'bg-amber-500/15 border-amber-500/40 text-amber-300' : 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'} ${s.locked ? 'cursor-not-allowed' : 'hover:border-red-400/60'}`}>
                                  {rec.date.slice(5)}{rec.makeup && <span className="ml-0.5 text-[9px]">补</span>}
                                </button>
                              ) : (
                                <span key={n} className="px-2 py-1 rounded text-[11px] border border-dashed border-gray-700 text-gray-600">{n + 1}</span>
                              );
                            })}
                          </div>
                          {stt.continuity.broken && (
                            <div className="mt-1.5 text-[10px] text-amber-400/90">⚠ 练习中断：{stt.continuity.gaps.map(g => `${g.from.slice(5)}→${g.to.slice(5)} 缺${g.days}天`).join('、')}，请补记缺失日期（休息日不豁免）</div>
                          )}
                          {!s.locked && !stt.reached && (
                            <div className="mt-1.5 flex gap-2">
                              <button onClick={() => onDrillCheckin(e.day.key, e.idx, di)} className="px-2.5 py-1 rounded bg-sky-600/80 hover:bg-sky-500 text-white text-[11px]">记一次（今天）</button>
                              <button onClick={() => { setMakeupTarget({dayKey: e.day.key, itemIdx: e.idx, drillIdx: di, name: dr.name}); setMakeupDate(''); setMakeupReason(''); }} className="px-2.5 py-1 rounded border border-amber-500/40 text-amber-300 hover:bg-amber-500/10 text-[11px]">补记</button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          );
        })}

        {/* 两级账号确认 + 排班休息日备注：仅本阶段有练习动作时显示 */}
        {pstat.total > 0 && (
          <div className="mt-3 pt-3 border-t border-gray-700/60 space-y-3">
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <span className="text-xs font-medium text-gray-300">阶段两级确认</span>
              <button onClick={() => setShowRest(!showRest)} className="text-[11px] text-gray-500 hover:text-gray-300">{showRest ? '收起' : '排班休息日备注'}（{restDays.length}）</button>
            </div>
            {showRest && (
              <div className="rounded-lg bg-gray-950/50 border border-gray-800/60 p-2.5">
                <div className="text-[11px] text-gray-500 mb-2">按门店排班表录入休息日，仅作备注；第二、三阶段连续判定不再豁免休息日（格式 YYYY-MM-DD，可批量粘贴用逗号/空格分隔）</div>
                <div className="flex gap-2">
                  <input type="text" value={restInput} onChange={ev => setRestInput(ev.target.value)} placeholder="2026-11-25, 2026-11-26" className="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200"/>
                  <button onClick={() => {
                    const arr = restInput.split(/[,，\s]+/).map(x => x.trim()).filter(DRILL_DATE_RE.test.bind(DRILL_DATE_RE));
                    if (!arr.length) { alert('请输入有效日期，格式 YYYY-MM-DD'); return; }
                    onSetRestDays(Array.from(new Set(restDays.concat(arr)))); setRestInput('');
                  }} className="px-2.5 py-1 rounded bg-indigo-600/80 hover:bg-indigo-500 text-white text-xs">添加</button>
                </div>
                {restDays.length > 0 && (
                  <div className="flex flex-wrap gap-1.5 mt-2">
                    {restDays.map(dt => (
                      <button key={dt} title="点击删除" onClick={() => onSetRestDays(restDays.filter(x => x !== dt))} className="px-2 py-0.5 rounded bg-gray-800 border border-gray-700 text-[11px] text-gray-400 hover:border-red-400/60 hover:text-red-300">{dt} ×</button>
                    ))}
                  </div>
                )}
              </div>
            )}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div className="rounded-lg border border-gray-800 bg-gray-950/40 p-2.5">
                {sign.student ? (
                  <div className="text-xs text-emerald-400">✓ 学员已确认 · {sign.student.name}（{sign.student.id}）· {sign.student.at ? sign.student.at.slice(0,16).replace('T',' ') : ''}</div>
                ) : (
                  <button disabled={!unlocked || pstat.reached < pstat.total}
                    onClick={() => onPhaseSign(phaseIndex, 'student')}
                    className={`w-full px-3 py-1.5 rounded text-xs ${!unlocked || pstat.reached < pstat.total ? 'bg-gray-800 text-gray-600 cursor-not-allowed' : 'bg-indigo-600/80 hover:bg-indigo-500 text-white'}`}>
                    学员确认{pstat.reached < pstat.total ? `（还差 ${pstat.total - pstat.reached} 个动作）` : ''}
                  </button>
                )}
              </div>
              <div className="rounded-lg border border-gray-800 bg-gray-950/40 p-2.5">
                {sign.manager ? (
                  <div className="text-xs text-emerald-400">✓ 上级已确认 · {sign.manager.name}（{sign.manager.id}）· {sign.manager.at ? sign.manager.at.slice(0,16).replace('T',' ') : ''}</div>
                ) : (
                  <button disabled={!sign.student}
                    onClick={() => onPhaseSign(phaseIndex, 'manager')}
                    className={`w-full px-3 py-1.5 rounded text-xs ${!sign.student ? 'bg-gray-800 text-gray-600 cursor-not-allowed' : 'bg-emerald-600/80 hover:bg-emerald-500 text-white'}`}>
                    上级确认（主管/店长账号）
                  </button>
                )}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* 补记弹窗：fixed 全屏遮罩 + 屏幕居中，点按钮立刻可见（原嵌在卡片底部，项目多时看不见像"没反应"） */}
      {makeupTarget && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4" onClick={() => setMakeupTarget(null)}>
          <div className="w-full max-w-lg rounded-xl border border-amber-500/50 bg-gray-900 shadow-2xl p-4" onClick={ev => ev.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <div className="text-sm font-semibold text-amber-300">补记练习</div>
              <button onClick={() => setMakeupTarget(null)} className="text-gray-500 hover:text-gray-200 text-lg leading-none">×</button>
            </div>
            <div className="text-xs text-gray-400 mb-3">{makeupTarget.name} · 将记录补记人、补记时间与原因</div>
            <div className="space-y-3">
              <label className="block">
                <div className="text-[11px] text-gray-500 mb-1">补记日期（实际练习日）</div>
                <input type="date" value={makeupDate} max={fmtLocalDate(new Date())} onClick={ev => { const el = ev.currentTarget; if (el.showPicker) { try { el.showPicker(); } catch(e) {} } }} onChange={ev => setMakeupDate(ev.target.value)} className="w-full bg-gray-950 border border-gray-700 rounded px-2 py-1.5 text-sm text-gray-200 cursor-pointer"/>
              </label>
              <label className="block">
                <div className="text-[11px] text-gray-500 mb-1">补记原因（必填，如：闭店忘记录入）</div>
                <input type="text" value={makeupReason} onChange={ev => setMakeupReason(ev.target.value)} placeholder="请说明为什么当天没记、现在补记" className="w-full bg-gray-950 border border-gray-700 rounded px-2 py-1.5 text-sm text-gray-200"/>
              </label>
              <div className="flex gap-2 justify-end pt-1">
                <button onClick={() => setMakeupTarget(null)} className="px-3 py-1.5 rounded border border-gray-700 text-gray-400 text-xs">取消</button>
                <button onClick={() => {
                  if (!makeupDate) { alert('请选择补记日期'); return; }
                  if (!makeupReason.trim()) { alert('请填写补记原因'); return; }
                  onDrillCheckin(makeupTarget.dayKey, makeupTarget.itemIdx, makeupTarget.drillIdx, makeupDate, makeupReason);
                  setMakeupTarget(null);
                }} className="px-4 py-1.5 rounded bg-amber-600/80 hover:bg-amber-500 text-white text-xs">确认补记</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============ Trainee Tracker View ============
function TrackerView({ trainees, onSelectTrainee, selectedId, onAddTrainee, onEditTrainee, onResignTrainee, onRestoreTrainee, onUpdateProgress, stores, workHours, currentUser }) {
  const [search, setSearch] = useState('');
  const [filterStore, setFilterStore] = useState('');
  const [filterRoute, setFilterRoute] = useState('');
  const [certFilter, setCertFilter] = useState('incomplete'); // 'incomplete' | 'completed'
  const [expandUnchecked, setExpandUnchecked] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [editingTrainee, setEditingTrainee] = useState(null);
  const [sideOpen, setSideOpen] = useState(false); // 手机端学员列表抽屉

  // Refs for auto-scrolling to "next day to learn" when user switches trainee
  const dayRefs = useRef({});
  const prevSelectedIdRef = useRef(null);

  const selected = trainees.find(t => t.id === selectedId);

  // Auto-scroll to current day when user actively switches trainee (skip initial auto-select)
  useEffect(() => {
    if (selectedId && prevSelectedIdRef.current !== null && selectedId !== prevSelectedIdRef.current) {
      const targetKey = currentDay?.key;
      const el = targetKey ? dayRefs.current[targetKey] : null;
      if (el) {
        setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
      }
    }
    prevSelectedIdRef.current = selectedId;
  }, [selectedId, currentDay]);

  const certCounts = useMemo(() => {
    const active = trainees.filter(t => !isResigned(t));
    const incomplete = active.filter(t => getCurrentDay(t) !== null).length;
    const resigned = trainees.filter(t => isResigned(t)).length;
    return { incomplete, completed: active.length - incomplete, resigned };
  }, [trainees]);

  const filtered = useMemo(() => {
    const list = trainees.filter(t => {
      if (search && !t.name.includes(search) && !t.store.includes(search)) return false;
      if (filterStore && t.store !== filterStore) return false;
      if (filterRoute && t.route !== filterRoute) return false;
      const resigned = isResigned(t);
      // 已离职 tab：只显示离职学员；其他 tab 一律排除离职学员
      if (certFilter === 'resigned') return resigned;
      if (resigned) return false;
      const isCompleted = getCurrentDay(t) === null;
      if (certFilter === 'completed' && !isCompleted) return false;
      if (certFilter === 'incomplete' && isCompleted) return false;
      return true;
    });
    // 工时预警置顶，再按工时降序
    list.sort((a, b) => {
      const hoursA = (a.empId && workHours?.[a.empId]?.hours) || 0;
      const hoursB = (b.empId && workHours?.[b.empId]?.hours) || 0;
      const warningA = !!getWorkHoursWarning(a, hoursA);
      const warningB = !!getWorkHoursWarning(b, hoursB);
      if (warningA && !warningB) return -1;
      if (!warningA && warningB) return 1;
      return hoursB - hoursA;
    });
    return list;
  }, [trainees, search, filterStore, filterRoute, certFilter, workHours]);

  // 今日未打卡学员（不受认证 tab 过滤影响，只看门店/路线/搜索）
  const todayUnchecked = useMemo(() => {
    return trainees.filter(t => {
      if (search && !t.name.includes(search) && !t.store.includes(search)) return false;
      if (filterStore && t.store !== filterStore) return false;
      if (filterRoute && t.route !== filterRoute) return false;
      if (isResigned(t)) return false;
      if (isCertified(t)) return false;
      return !isCheckedToday(t);
    });
  }, [trainees, search, filterStore, filterRoute]);

  const handleSave = (data) => {
    if (editingTrainee) {
      onEditTrainee(editingTrainee.id, data);
    } else {
      onAddTrainee(data);
    }
    setEditingTrainee(null);
  };

  // ------- 刻意练习打卡（写入 progress，随云端自动同步） -------
  const nowISO = () => new Date().toISOString();
  const actor = () => currentUser ? { id: currentUser.id, name: (currentUser.name || '').replace(/区域带训追踪系统|大区带训追踪系统/g, '') } : { id: '', name: '未知' };

  // 记一次练习；date 省略=今天；补记需带 reason + makeup=true
  const handleDrillCheckin = (dayKey, itemIdx, drillIdx, date, reason) => {
    if (!selected) return;
    const d = date || fmtLocalDate(new Date());
    if (!DRILL_DATE_RE.test(d)) { alert('日期格式应为 YYYY-MM-DD'); return; }
    if (d > fmtLocalDate(new Date())) { alert('不能记未来的日期'); return; }
    if (reason !== undefined && !String(reason).trim()) { alert('补记必须填写原因'); return; }
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    if (isDelayActiveToday(dayProg) || isRestActiveToday(dayProg)) return;
    const allDays = getAllDays(selected.route, selected.subRoute).filter(x => x.items.length > 0);
    const fday = allDays.find(x => x.key === dayKey);
    if (fday && !isPhaseUnlocked(selected, allDays, fday.phaseIndex)) { alert('请先完成上一阶段的两级确认'); return; }
    dayProg.items = { ...dayProg.items };
    const st = { ...(dayProg.items[itemIdx] || {}) };
    st.drillRecords = { ...(st.drillRecords || {}) };
    let recs = [...(st.drillRecords[drillIdx] || [])];
    // 只把"有效记录"算作当天已记；墓碑=已撤销，允许重新打卡
    if (recs.some(r => r.date === d && !r.deleted)) { alert('该日期已记过一次，同一天只算 1 次'); return; }
    recs = recs.filter(r => r.date !== d); // 若同日存在旧墓碑，先移除，再用新记录覆盖
    const who = actor();
    const rec = { date: d, at: nowISO(), byId: who.id, byName: who.name };
    if (reason !== undefined) { rec.makeup = true; rec.reason = String(reason).trim(); rec.makeupAt = nowISO(); }
    recs.push(rec); recs.sort((a, b) => a.date < b.date ? -1 : 1);
    st.drillRecords[drillIdx] = recs;
    // 该练习项全部动作达标 → 自动勾选，沿用原完成/时限/证书口径
    if (fday) {
      const item = fday.items[itemIdx];
      if (isPracticeItemReached({ progress: progress }, fday, itemIdx, item)) {
        if (!st.checked) { st.checked = true; st.checkedAt = nowISO(); if (item.choices) st.choice = item.choices[0]; }
      }
    }
    dayProg.items[itemIdx] = st;
    dayProg._updatedAt = Date.now();
    // 勾完本天全部项目即完成本天（与自由路线一致）
    if (isFreeLearnRoute(selected) && fday && fday.items.length > 0) {
      const allChecked = fday.items.every((it, i) => {
        const s = (dayProg.items[i] || {}); return it.choices ? !!s.choice : !!s.checked;
      });
      if (allChecked && !dayProg.completed) { dayProg.completed = true; dayProg.completedAt = nowISO(); }
    }
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  // 撤销某次打卡（补记记录也一并删除，保留其余留痕）
  const handleDrillUndo = (dayKey, itemIdx, drillIdx, date) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    dayProg.items = { ...dayProg.items };
    const st = { ...(dayProg.items[itemIdx] || {}) };
    st.drillRecords = { ...(st.drillRecords || {}) };
    // 撤销用墓碑标记而非物理删除：合并时墓碑保留，避免其他设备的旧打卡"复活"。
    // 同日若已有墓碑则更新墓碑时间，否则新增一条 deleted 记录。
    const recs = [...(st.drillRecords[drillIdx] || [])];
    const existIdx = recs.findIndex(r => r.date === date);
    const tomb = { date: date, deleted: true, at: nowISO(), byId: actor().id, byName: actor().name };
    if (existIdx >= 0) recs[existIdx] = tomb; else recs.push(tomb);
    st.drillRecords[drillIdx] = recs.sort((a, b) => a.date < b.date ? -1 : 1);
    const allDays = getAllDays(selected.route, selected.subRoute).filter(x => x.items.length > 0);
    const fday = allDays.find(x => x.key === dayKey);
    if (fday) {
      const item = fday.items[itemIdx];
      if (!isPracticeItemReached({ progress: progress }, fday, itemIdx, item) && st.checked) {
        st.checked = false; st.checkedAt = nowISO(); delete st.choice;
        if (dayProg.completed) { dayProg.completed = false; delete dayProg.completedAt; }
      }
    }
    dayProg.items[itemIdx] = st;
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  // 两级账号确认：level = 'student' | 'manager'
  const handlePhaseSign = (phaseIndex, level) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const signs = { ...(progress._phaseSign || {}) };
    const cur = { ...(signs[phaseIndex] || {}) };
    const who = actor();
    if (level === 'student') {
      const allDays = getAllDays(selected.route, selected.subRoute).filter(x => x.items.length > 0);
      const phaseDays = allDays.filter(x => x.phaseIndex === phaseIndex);
      let ok = true, brokenCnt = 0;
      phaseDays.forEach(d => d.items.forEach((it, i) => {
        if (!isPracticeItemReached(selected, d, i, it)) ok = false;
        if (isContinuityRequired(phaseIndex) && it.drills) it.drills.forEach((dr, di) => {
          if (getDrillStat(selected, d.key, i, di, dr.count, phaseIndex).continuity.broken) brokenCnt++;
        });
      }));
      if (!ok) { alert('本阶段全部练习动作达标后，学员才能确认'); return; }
      if (brokenCnt) { alert('第二、三阶段练习日期必须逐日连续（不按排班表豁免），当前有 ' + brokenCnt + ' 处断档。请补记缺失日期后再确认'); return; }
      cur.student = { id: who.id, name: who.name, at: nowISO() };
    } else {
      if (!cur.student) { alert('请先由学员确认'); return; }
      cur.manager = { id: who.id, name: who.name, at: nowISO() };
    }
    signs[phaseIndex] = cur;
    progress._phaseSign = signs;
    onUpdateProgress(selected.id, progress);
  };

  // 休息日备注（按门店排班表录入，仅作备注；连续判定不再豁免休息日）
  const handleSetRestDays = (dates) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    progress._restDays = dates.filter(DRILL_DATE_RE.test.bind(DRILL_DATE_RE)).sort();
    onUpdateProgress(selected.id, progress);
  };

  const handleToggleItem = (dayKey, itemIdx, checked, choice) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    // 延迟/休息期间禁止勾选（双保险：UI 已禁用；只看"今天生效"的状态，昨天标记的已自动重置）
    if (isDelayActiveToday(dayProg) || isRestActiveToday(dayProg)) return;
    dayProg.items = { ...dayProg.items };
    const prev = { ...(dayProg.items[itemIdx] || {}) };
    if (checked) {
      prev.checked = true;
      prev.checkedAt = new Date().toISOString();
      if (choice) prev.choice = choice;
    } else {
      // 取消勾选时保留"已取消"痕迹（checked:false + 最新时间戳），
      // 这样取消操作才能同步到其他设备（否则合并时会被旧勾选数据"复活"）
      prev.checked = false;
      prev.checkedAt = new Date().toISOString();
      delete prev.choice;
    }
    dayProg.items[itemIdx] = prev;
    // 自由学习路线：勾完本天全部项目即自动完成；取消任一项即撤销完成
    if (isFreeLearnRoute(selected)) {
      const fall = getAllDays(selected.route, selected.subRoute).filter(d => d.items.length > 0);
      const fday = fall.find(d => d.key === dayKey);
      // 双保险：阶段未解锁时即使绕过界面按钮也不写入进度
      if (fday && !isPhaseUnlocked(selected, fall, fday.phaseIndex)) return;
      if (fday && fday.items.length > 0) {
        const allChecked = fday.items.every((it, i) => {
          const st = (dayProg.items[i] || {});
          return it.choices ? !!st.choice : !!st.checked;
        });
        if (allChecked && !dayProg.completed) {
          dayProg.completed = true;
          dayProg.completedAt = new Date().toISOString();
        } else if (!allChecked && dayProg.completed) {
          dayProg.completed = false;
          delete dayProg.completedAt;
        }
      }
    }
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  const handleCompleteDay = (dayKey, masterSignature, trainingTimesInput) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    if (dayProg.completed) return; // cannot undo
    const sig = (masterSignature || selected.master || '').trim();
    // trainingTimesInput 可能是数组（多次带训）或字符串（兼容旧数据）
    const times = Array.isArray(trainingTimesInput)
      ? trainingTimesInput.filter(t => t && t.trim()).map(t => t.trim())
      : (trainingTimesInput ? [trainingTimesInput.trim()] : []);
    if (!sig || times.length === 0) {
      alert('请填写师傅签名和至少一次带训时间后再确认完成');
      return;
    }
    dayProg.completed = true;
    dayProg.completedAt = new Date().toISOString();
    dayProg.masterSignature = sig;
    dayProg.signatureAt = new Date().toISOString();
    dayProg.trainingTimes = times;
    // 兼容旧数据：保留单个 trainingTime 字段（取最早一次）
    dayProg.trainingTime = times[0];
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  // ============ 延迟标记 ============
  // 语义：今天仅来打卡但未完成学习内容；点"延迟"必填备注，跨设备同步；
  // 撤销时打上更新 timestamp（lastWriteWins），确保合并时被采纳。
  const handleDelayDay = (dayKey, note) => {
    if (!selected) return;
    const trimmed = (note || '').trim();
    if (!trimmed) {
      alert('请填写延迟原因');
      return;
    }
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    // 互斥：休息未撤销前不允许标延迟（双保险：UI 已 disabled 拦截；仅当天生效状态）
    if (isRestActiveToday(dayProg)) return;
    const today = localDateStr(new Date().toISOString());
    dayProg.delayed = true;
    dayProg.delayAt = new Date().toISOString();
    dayProg.delayDates = addDateToList(dayProg.delayDates, today); // 保留历史：每个日历日一条记录
    dayProg.delayNote = trimmed;
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  const handleUndoDelay = (dayKey) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    if (!dayProg.delayed) return;
    if (!confirm('确认撤销本天延迟标记？\n（已填的备注将一并清除）')) return;
    const today = localDateStr(new Date().toISOString());
    dayProg.delayed = false;
    dayProg.delayAt = new Date().toISOString(); // 打上最新 ts，让跨设备合并时采纳
    dayProg.delayDates = removeDateFromList(dayProg.delayDates, today); // 撤销今天的记录（历史日期保留）
    dayProg.delayNote = '';
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  // ============ 休息标记 ============
  // 语义：今日学员休息，视同已打卡；不计入连续未打卡。每天重置，跨天需重新标记。
  const handleRestDay = (dayKey) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    // 互斥：延迟未撤销前不允许标休息（双保险；仅当天生效状态）
    if (isDelayActiveToday(dayProg)) return;
    const today = localDateStr(new Date().toISOString());
    dayProg.rest = true;
    dayProg.restAt = new Date().toISOString();
    dayProg.restDates = addDateToList(dayProg.restDates, today); // 保留历史：每个日历日一条记录
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  const handleUndoRest = (dayKey) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    if (!dayProg.rest) return;
    if (!confirm('确认撤销本天休息标记？')) return;
    const today = localDateStr(new Date().toISOString());
    dayProg.rest = false;
    dayProg.restAt = new Date().toISOString();
    dayProg.restDates = removeDateFromList(dayProg.restDates, today); // 撤销今天的记录（历史日期保留）
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  const allDays = selected ? getAllDays(selected.route, selected.subRoute).filter(d => d.items.length > 0) : [];
  const currentDay = selected ? getCurrentDay(selected) : null;
  const progressInfo = selected ? calcProgress(selected) : null;

  return (
    <div className="tt-h-app flex">
      {/* 窄屏：列表抽屉的遮罩 */}
      {sideOpen && <div className="tt-side-mask" onClick={() => setSideOpen(false)}></div>}
      {/* Sidebar - Trainee List */}
      <div className={`tt-side w-72 flex-shrink-0 border-r border-gray-800 bg-gray-900/30 flex flex-col${sideOpen ? ' tt-open' : ''}`}>
        <div className="p-3 border-b border-gray-800 space-y-2">
          <button
            onClick={() => { setEditingTrainee(null); setShowModal(true); }}
            className="w-full flex items-center justify-center gap-2 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition"
          >
            <Icon.Plus width={16} height={16}/> 新增学员
          </button>
          <div className="relative">
            <Icon.Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" />
            <input
              type="text" value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="搜索姓名/门店..."
              className="w-full bg-gray-800 border border-gray-700 rounded-lg pl-9 pr-3 py-2 text-sm text-white placeholder-gray-500"
            />
          </div>
          <div className="flex gap-2">
            <div className="relative flex-1">
              <select value={filterStore} onChange={e=>setFilterStore(e.target.value)}
                className="w-full h-9 appearance-none bg-gray-800 border border-gray-700 hover:border-gray-600 rounded-lg pl-3 pr-8 text-xs text-gray-300 transition cursor-pointer">
                <option value="">全部门店</option>
                {stores.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <Icon.ChevronDown className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none" width={14} height={14}/>
            </div>
            <div className="relative flex-1">
              <select value={filterRoute} onChange={e=>setFilterRoute(e.target.value)}
                className="w-full h-9 appearance-none bg-gray-800 border border-gray-700 hover:border-gray-600 rounded-lg pl-3 pr-8 text-xs text-gray-300 transition cursor-pointer">
                <option value="">全部路线</option>
                {TRAINING_DATA.routes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
              </select>
              <Icon.ChevronDown className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none" width={14} height={14}/>
            </div>
          </div>
        </div>

        {/* Certification filter tabs */}
        <div className="px-3 pb-2 border-b border-gray-800">
          <div className="flex bg-gray-800/50 rounded-lg p-1 gap-1">
            <button
              onClick={() => setCertFilter('incomplete')}
              className={`flex-1 py-1.5 text-xs font-medium rounded-md transition flex items-center justify-center gap-1 ${
                certFilter === 'incomplete' ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-400 hover:text-white hover:bg-gray-800'
              }`}
            >
              未认证
              <span className={`text-[10px] px-1 py-0.5 rounded-full ${certFilter === 'incomplete' ? 'bg-white/20' : 'bg-gray-700 text-gray-400'}`}>
                {certCounts.incomplete}
              </span>
            </button>
            <button
              onClick={() => setCertFilter('completed')}
              className={`flex-1 py-1.5 text-xs font-medium rounded-md transition flex items-center justify-center gap-1 ${
                certFilter === 'completed' ? 'bg-emerald-600 text-white shadow-sm' : 'text-gray-400 hover:text-white hover:bg-gray-800'
              }`}
            >
              已认证
              <span className={`text-[10px] px-1 py-0.5 rounded-full ${certFilter === 'completed' ? 'bg-white/20' : 'bg-gray-700 text-gray-400'}`}>
                {certCounts.completed}
              </span>
            </button>
            <button
              onClick={() => setCertFilter('resigned')}
              className={`flex-1 py-1.5 text-xs font-medium rounded-md transition flex items-center justify-center gap-1 ${
                certFilter === 'resigned' ? 'bg-gray-600 text-white shadow-sm' : 'text-gray-500 hover:text-gray-300 hover:bg-gray-800'
              }`}
            >
              已离职
              <span className={`text-[10px] px-1 py-0.5 rounded-full ${certFilter === 'resigned' ? 'bg-white/20' : 'bg-gray-700 text-gray-400'}`}>
                {certCounts.resigned}
              </span>
            </button>
          </div>
        </div>

        {/* 今日未打卡面板 */}
        <div className="px-3 py-2 border-b border-gray-800 bg-gray-900/30">
          <button
            onClick={() => setExpandUnchecked(v => !v)}
            className="w-full flex items-center justify-between text-xs text-gray-300 hover:text-white transition"
          >
            <div className="flex items-center gap-2">
              <span className="font-medium">今日未打卡</span>
              {todayUnchecked.length > 0 ? (
                <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-red-500/20 text-red-300 border border-red-500/30">
                  {todayUnchecked.length}人
                </span>
              ) : (
                <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/25">
                  全部已打卡
                </span>
              )}
            </div>
            <span className={`transition-transform ${expandUnchecked ? 'rotate-0' : '-rotate-90'}`}>
              <Icon.ChevronDown width={14} height={14}/>
            </span>
          </button>
          {expandUnchecked && (
            <div className="mt-2 space-y-1">
              {todayUnchecked.length === 0 ? (
                <div className="text-[11px] text-gray-500 py-1">当前筛选范围内，所有未认证学员今日均已打卡。</div>
              ) : (
                todayUnchecked.map(t => (
                  <button
                    key={t.id}
                    onClick={() => { onSelectTrainee(t.id); setSideOpen(false); }}
                    className={`w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-left transition ${t.id === selectedId ? 'bg-red-500/20 border border-red-500/40' : 'bg-red-500/10 border border-red-500/20 hover:bg-red-500/15'}`}
                  >
                    <div className="w-6 h-6 rounded-full bg-red-500/20 text-red-300 flex items-center justify-center text-[10px] font-medium flex-shrink-0">
                      {t.name.slice(0,1)}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-xs text-white truncate">{t.name}</div>
                      <div className="text-[10px] text-gray-500 truncate">{t.store}{t.master ? ` · ${t.master}` : ''}</div>
                    </div>
                    <Icon.ChevronRight width={12} height={12} className="text-gray-600"/>
                  </button>
                ))
              )}
            </div>
          )}
        </div>

        <div className="flex-1 overflow-y-auto scrollbar-thin p-2 space-y-1">
          {filtered.length === 0 ? (
            <div className="text-center text-gray-500 text-sm py-8">暂无学员数据</div>
          )           : filtered.map(t => {
            const prog = calcProgress(t);
            const certified = isCertified(t);
            const displayPercent = certified ? 100 : prog.percent;
            const displayCompleted = certified ? prog.total : prog.completed;
            const route = TRAINING_DATA.routes.find(r => r.id === t.route);
            const isSelected = t.id === selectedId;
            const warning = getWorkHoursWarning(t, workHours?.[t.empId]?.hours);
            const notCheckedToday = !isCertified(t) && !isCheckedToday(t);
            const resigned = isResigned(t);
            const cardClass = resigned
              ? 'bg-gray-800/40 opacity-70 border border-gray-700/50 hover:bg-gray-800/60'
              : isSelected
                ? 'bg-indigo-600/20 border border-indigo-500/40'
                : notCheckedToday
                  ? 'bg-red-500/15 border border-red-500/40 hover:bg-red-500/25'
                  : warning
                    ? 'bg-yellow-500/25 border border-yellow-500/50 hover:bg-yellow-500/35'
                    : 'hover:bg-gray-800/50 border border-transparent';
            return (
              <button
                key={t.id}
                onClick={() => { onSelectTrainee(t.id); setSideOpen(false); }}
                className={`group w-full text-left p-3 rounded-lg transition ${cardClass}`}
              >
                  <div className="flex items-center justify-between">
                  <span className="text-sm font-medium text-white">{t.name}</span>
                  <div className="flex items-center gap-1">
                    <span className="text-xs text-gray-500">{getRouteName(t.route, t.subRoute)}</span>
                    {resigned ? (
                      <>
                        <span className="text-[10px] px-1.5 py-0.5 rounded bg-gray-600/40 text-gray-300 border border-gray-600">已离职</span>
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            if (confirm(`确认恢复学员「${t.name}」为在职在训状态？`)) {
                              onRestoreTrainee(t.id);
                            }
                          }}
                          className="px-1.5 py-0.5 rounded-md text-[10px] text-emerald-300 hover:bg-emerald-500/15 border border-emerald-500/30 transition"
                          title="恢复为在职在训"
                        >
                          恢复
                        </button>
                      </>
                    ) : (
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          if (confirm(`确认将学员「${t.name}」标记为离职？\n· 移出在训名单，打卡/工时/进度数据全部保留\n· 可在「已离职」分组中随时恢复`)) {
                            onResignTrainee(t.id);
                          }
                        }}
                        className="px-1.5 py-0.5 rounded-md text-[10px] text-gray-500 hover:text-red-300 hover:bg-red-500/10 border border-gray-700 hover:border-red-500/40 transition"
                        title="标记离职（数据保留，可恢复）"
                      >
                        离职
                      </button>
                    )}
                  </div>
                </div>
                <div className="flex items-center gap-2 mt-1 text-xs text-gray-500">
                  <Icon.Store/> {t.store}
                  {t.master && <><span className="text-gray-700">·</span><Icon.User/> {t.master}</>}
                  {t.empId && !certified && workHours?.[t.empId] != null && (
                    <span className={`ml-auto text-[10px] px-1.5 py-0.5 rounded border tabular-nums whitespace-nowrap ${notCheckedToday ? 'bg-red-500/20 text-red-200 border-red-500/40' : warning ? 'bg-yellow-500/25 text-yellow-200 border-yellow-500/50' : 'bg-amber-500/10 text-amber-300 border-amber-500/20'}`}>⏱ {workHours[t.empId].hours}工时</span>
                  )}
                </div>
                <div className="mt-2 flex items-center gap-2">
                  <div className="flex-1 h-5 bg-gray-800 rounded-full overflow-hidden relative">
                    <div className={`h-full progress-bar-fill rounded-full flex items-center justify-end pr-2 ${displayPercent === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}`} style={{width: `${Math.max(displayPercent, 6)}%`}}>
                      {displayPercent >= 35 && prog.total > 0 && (
                        <span className="text-[10px] font-medium text-white/90 tabular-nums">{displayCompleted}/{prog.total}</span>
                      )}
                      {displayPercent === 100 && prog.total === 0 && (
                        <span className="text-[10px] font-medium text-white/90 tabular-nums">已认证</span>
                      )}
                    </div>
                    {displayPercent < 35 && prog.total > 0 && (
                      <span className="absolute inset-y-0 right-2 flex items-center text-[10px] text-gray-500 tabular-nums">{displayCompleted}/{prog.total}</span>
                    )}
                  </div>
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Main Content - Training Calendar */}
      <div className="flex-1 min-w-0 overflow-y-auto scrollbar-thin">
        {/* 窄屏：学员列表入口 */}
        <div className="tt-mbar">
          <button onClick={() => setSideOpen(true)} className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-gray-800 border border-gray-700 text-xs text-gray-200 active:bg-gray-700">
            <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            学员列表
            <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">{filtered.length}</span>
          </button>
          <div className="flex-1 min-w-0 text-xs text-gray-400 truncate">
            {selected ? <span className="font-medium text-white">{selected.name}</span> : '未选择学员'}
            {selected && <span className="text-gray-500"> · {selected.store}</span>}
          </div>
        </div>
        {!selected ? (
          <div className="flex items-center justify-center h-full text-gray-500">
            <div className="text-center">
              <Icon.Calendar width={48} height={48} className="mx-auto mb-3 opacity-30"/>
              <p className="text-lg">请从「学员列表」选择学员</p>
              <p className="text-sm mt-1">或点击「新增学员」开始带训追踪</p>
            </div>
          </div>
        ) : (
          <div className="tt-detail max-w-3xl mx-auto p-6">
            {/* Trainee Info Header */}
            <div className="bg-gray-900/50 border border-gray-800 rounded-2xl p-5 mb-5">
              <div className="tt-detail-head flex items-start justify-between">
                <div>
                  <div className="flex items-center gap-3">
                    <h2 className="text-xl font-bold text-white">{selected.name}</h2>
                    {isResigned(selected) && (
                      <span className="text-xs px-2 py-0.5 rounded-full bg-gray-600/40 text-gray-300 border border-gray-600">已离职</span>
                    )}
                    <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-400 border border-indigo-500/30">
                      {getRouteName(selected.route, selected.subRoute)}
                    </span>
                  </div>
                  <div className="tt-meta flex items-center gap-4 mt-2 text-sm text-gray-400">
                    <span className="flex items-center gap-1"><Icon.Store/> {selected.store}</span>
                    {selected.master && <span className="flex items-center gap-1"><Icon.User/> 师傅: {selected.master}</span>}
                    {selected.startDate && <span className="flex items-center gap-1"><Icon.Calendar width={14} height={14}/> 入职: {selected.startDate}</span>}
                    {selected.empId && <span className="flex items-center gap-1 tabular-nums"><Icon.IdCard width={14} height={14}/> 工号: {selected.empId}</span>}
                    {selected.empId && !isCertified(selected) && workHours?.[selected.empId] != null && (
                      <span className="flex items-center gap-1 px-2 py-0.5 rounded-md bg-amber-500/10 border border-amber-500/25 text-amber-300 tabular-nums">
                        <Icon.Clock width={14} height={14}/> 累计工时: <span className="font-semibold">{workHours[selected.empId].hours}</span>
                      </span>
                    )}
                  </div>
                </div>
                <div className="tt-actions flex items-center gap-2">
                  <button onClick={() => { setEditingTrainee(selected); setShowModal(true); }} className="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white transition">
                    <Icon.Edit/>
                  </button>
                  {isResigned(selected) ? (
                    <button onClick={() => {
                      if (confirm(`确认恢复学员「${selected.name}」为在职在训状态？`)) {
                        onRestoreTrainee(selected.id);
                      }
                    }} className="px-3 py-2 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 text-sm font-medium transition">
                      恢复在职
                    </button>
                  ) : (
                    <button onClick={() => {
                      if (confirm(`确认将学员「${selected.name}」标记为离职？\n· 移出在训名单，打卡/工时/进度数据全部保留\n· 可在「已离职」分组中随时恢复`)) {
                        onResignTrainee(selected.id);
                      }
                    }} className="px-3 py-2 rounded-lg bg-gray-800 hover:bg-red-500/20 text-gray-400 hover:text-red-400 text-sm font-medium transition">
                      离职
                    </button>
                  )}
                </div>
              </div>

              {/* Progress Summary */}
              {progressInfo && (
                <div className="mt-4 grid grid-cols-4 gap-3">
                  <div className="bg-gray-800/40 rounded-lg p-3">
                    <div className="text-xs text-gray-500">总进度</div>
                    <div className="text-2xl font-bold text-white mt-1">{progressInfo.percent}%</div>
                  </div>
                  <div className="bg-gray-800/40 rounded-lg p-3">
                    <div className="text-xs text-gray-500">已完成</div>
                    <div className="text-2xl font-bold text-emerald-400 mt-1">{progressInfo.completed}<span className="text-sm text-gray-600">/{progressInfo.total}</span></div>
                  </div>
                  <div className="bg-gray-800/40 rounded-lg p-3">
                    <div className="text-xs text-gray-500">当前阶段</div>
                    <div className="text-sm font-medium text-amber-400 mt-1.5">
                      {currentDay ? `${currentDay.monthName} · ${currentDay.phaseName}` : '全部完成'}
                    </div>
                  </div>
                  <div className="bg-gray-800/40 rounded-lg p-3">
                    <div className="text-xs text-gray-500">剩余天数</div>
                    <div className="text-2xl font-bold text-indigo-400 mt-1">{Math.max(0, progressInfo.total - progressInfo.completed)}</div>
                  </div>
                </div>
              )}
            </div>

            {/* Day Cards */}
            <div className="space-y-3">
              {isFreeLearnRoute(selected) ? (
                <div className="space-y-4">
                  {Array.from(new Set(allDays.map(d => d.phaseIndex))).map(pi => (
                    <FreeStageCard
                      key={selected.id + '_phase_' + pi}
                      phaseIndex={pi}
                      phaseDays={allDays.filter(d => d.phaseIndex === pi)}
                      progressMap={selected.progress || {}}
                      trainee={selected}
                      onToggleItem={handleToggleItem}
                      onDrillCheckin={handleDrillCheckin}
                      onDrillUndo={handleDrillUndo}
                      onPhaseSign={handlePhaseSign}
                      onSetRestDays={handleSetRestDays}
                    />
                  ))}
                </div>
              ) : allDays.map((day, idx) => {
                const unlocked = isDayUnlocked(selected, day.key);
                const dayProgress = selected.progress?.[day.key];
                const isCurrent = currentDay?.key === day.key;
                const showPhaseHeader = idx === 0 || allDays[idx - 1].phaseName !== day.phaseName;
                return (
                  <div
                    key={selected.id + '_' + day.key}
                    ref={(el) => { dayRefs.current[day.key] = el; }}
                  >
                    {showPhaseHeader && (() => {
                      const w = getPhaseWindow(selected, allDays, day.phaseIndex);
                      if (!w || w.notStarted) return null;
                      const tone = (w.learnOverdue || w.practiceOverdue)
                        ? 'bg-red-500/10 border-red-500/30 text-red-300'
                        : (w.learnLateDays > 0 ? 'bg-amber-500/10 border-amber-500/30 text-amber-300'
                        : 'bg-gray-800/50 border-gray-700 text-gray-300');
                      return (
                        <div className={`mb-3 rounded-lg border px-3 py-2 ${tone}`}>
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <div className="text-sm font-medium">{day.phaseName} · {w.rule.learnDays} 天学习 + {w.rule.practiceDays} 天刻意练习</div>
                            <div className="text-xs opacity-80">起点 {w.start} · 学习截止 {w.learnEnd} · 练习截止 {w.practiceEnd}</div>
                          </div>
                          <div className="mt-1 text-xs opacity-90">
                            {w.done ? '本阶段时限已达标' :
                             w.learnOverdue ? `学习已超期 ${w.learnOverdueDays} 天，请补完并标注原因` :
                             w.practiceOverdue ? `刻意练习已超期 ${w.practiceOverdueDays} 天，未达标不得进入下一阶段` :
                             w.learnLateDays > 0 ? `学习超期 ${w.learnLateDays} 天完成，练习窗口仍截至 ${w.practiceEnd}` :
                             (w.learnDone ? `练习剩 ${w.practiceLeft} 天` : `学习剩 ${w.learnLeft} 天`)}
                          </div>
                        </div>
                      );
                    })()}
                    {isCurrent && (
                      <div className="flex items-center gap-2 px-1 mb-2 text-xs text-amber-400">
                        <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                        当前带训进度
                      </div>
                    )}
                    <DayCard
                      key={selected.id + '_' + day.key}
                      day={day}
                      dayProgress={dayProgress}
                      unlocked={unlocked}
                      onToggleItem={handleToggleItem}
                      onCompleteDay={handleCompleteDay}
                      onDelayDay={handleDelayDay}
                      onUndoDelay={handleUndoDelay}
                      onRestDay={handleRestDay}
                      onUndoRest={handleUndoRest}
                      trainee={selected}
                    />
                  </div>
                );
              })}

              {!currentDay && progressInfo?.percent === 100 && (

// ============ Dashboard View ============
function localDateStr(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// ===== 延迟/休息的"日历日"语义 =====
// 每天重置：只有当天标记的延迟/休息才处于生效状态，跨天后自动失效（需重新标记）
// 历史保留：restDates/delayDates 记录标记过的每个日历日，供"昨日已打卡/累计N次"等统计使用
// 兼容旧数据：没有 restDates/delayDates 数组时，退回单一 restAt/delayAt 时间戳判断
function restOnDate(day, ds) {
  if (!day) return false;
  if (Array.isArray(day.restDates)) return day.restDates.includes(ds);
  return !!day.rest && !!day.restAt && localDateStr(day.restAt) === ds;
}
function delayedOnDate(day, ds) {
  if (!day) return false;
  if (Array.isArray(day.delayDates)) return day.delayDates.includes(ds);
  return !!day.delayed && !!day.delayAt && localDateStr(day.delayAt) === ds;
}
function isRestActiveToday(day) {
  return restOnDate(day, localDateStr(new Date().toISOString()));
}
function isDelayActiveToday(day) {
  return delayedOnDate(day, localDateStr(new Date().toISOString()));
}
function addDateToList(list, ds) {
  const a = Array.isArray(list) ? [...new Set(list)] : [];
  if (!a.includes(ds)) a.push(ds);
  return a.sort();
}
function removeDateFromList(list, ds) {
  return (Array.isArray(list) ? [...new Set(list)] : []).filter(d => d !== ds);
}
// 历史天数（用于重置后在天卡上显示"已休N天/已延迟N次"的灰色提示）
function restHistoryCount(day) {
  if (!day) return 0;
  if (Array.isArray(day.restDates)) return day.restDates.length;
  return (day.rest && day.restAt) ? 1 : 0;
}
function delayHistoryCount(day) {
  if (!day) return 0;
  if (Array.isArray(day.delayDates)) return day.delayDates.length;
  return (day.delayed && day.delayAt) ? 1 : 0;
}

function timeStr(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function daysBetween(dateStrA, dateStrB) {
  const a = new Date(dateStrA + 'T00:00:00');
  const b = new Date(dateStrB + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function calcNoCheckInStreak(t, today) {
  const dates = new Set();
  const progress = t.progress || {};
  Object.values(progress).forEach(day => {
    Object.values(day.items || {}).forEach(item => {
      if (item.checked && item.checkedAt) dates.add(localDateStr(item.checkedAt));
    });
    if (day.completed && day.completedAt) dates.add(localDateStr(day.completedAt));
    // 休息视同打卡，不计入连续未打卡（含每天重置前的历史休息日期）
    if (Array.isArray(day.restDates)) day.restDates.forEach(d => dates.add(d));
    else if (day.rest && day.restAt) dates.add(localDateStr(day.restAt));
  });

  if (dates.size === 0) {
    if (t.startDate) {
      const days = Math.max(1, daysBetween(t.startDate, today));
      return { days, label: `连续${days}天未打卡` };
    }
    return { days: 9999, label: '从未打卡' };
  }

  const sorted = [...dates].sort();
  const lastDate = sorted[sorted.length - 1];
  if (lastDate >= today) return { days: 0, label: '今日已打卡' };
  const days = daysBetween(lastDate, today);
  return { days, label: `连续${days}天未打卡` };
}

// 今天是否打过卡（与推送/大区看板共用同一口径：勾选/休息/延迟 任一即算，不认 completedAt）
// 这是老 API 的薄壳，内部直接调 isCheckedOnDate(trainee, todayStr)，保证店长端"今日未打卡学员列表"/学员卡片红卡与推送/大区看板数字完全一致。
function isCheckedToday(trainee) {
  const todayStr = localDateStr(new Date().toISOString());
  return isCheckedOnDate(trainee, todayStr);
}

// 延迟统计：累计延迟过的天数（用于看板显示"累计延迟 N 次"），按历史日期数组统计
function calcDelayTotalDays(t) {
  const dates = new Set();
  const progress = t.progress || {};
  Object.values(progress).forEach(day => {
    if (Array.isArray(day.delayDates)) day.delayDates.forEach(d => dates.add(d));
    else if (day.delayed && day.delayAt) dates.add(localDateStr(day.delayAt));
  });
  return { days: dates.size, label: dates.size > 0 ? `累计延迟 ${dates.size} 次` : '未延迟' };
}

// 连续延迟统计：从今天往前数，连续有延迟记录的天数（包含今天）
function calcDelayStreakDays(t) {
  const delayDates = new Set();
  const progress = t.progress || {};
  Object.values(progress).forEach(day => {
    if (Array.isArray(day.delayDates)) day.delayDates.forEach(d => delayDates.add(d));
    else if (day.delayed && day.delayAt) delayDates.add(localDateStr(day.delayAt));
  });
  let streak = 0;
  const d = new Date();
  while (delayDates.has(localDateStr(d.toISOString()))) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return { days: streak, label: streak > 0 ? `连续延迟 ${streak} 天` : '未延迟' };
}

// 休息统计：本月累计休息天数（按历史日期数组统计，重置/撤销不影响历史）
function calcRestTotalDays(t) {
  const now = new Date();
  const yearMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const progress = t.progress || {};
  let count = 0;
  Object.values(progress).forEach(day => {
    const list = Array.isArray(day.restDates) ? day.restDates : (day.rest && day.restAt ? [localDateStr(day.restAt)] : []);
    list.forEach(ds => { if (ds.startsWith(yearMonth)) count++; });
  });
  return { days: count, label: count > 0 ? `本月累计休息 ${count} 次` : '本月未休息' };
}

function DashboardView({ trainees: allTrainees, stores, workHours, onUpdateNote }) {
  // 已离职学员不进入店长看板统计（数据保留，仅排除展示与分析）
  const trainees = useMemo(() => (allTrainees || []).filter(t => !isResigned(t)), [allTrainees]);
  const [filterStore, setFilterStore] = useState('');
  const [filterRoute, setFilterRoute] = useState('');
  const [sortBy, setSortBy] = useState('progress');
  const [expandedRow, setExpandedRow] = useState(null);

  const filtered = useMemo(() => {
    let list = trainees.filter(t => {
      if (filterStore && t.store !== filterStore) return false;
      if (filterRoute && t.route !== filterRoute) return false;
      return true;

    list = list
      .filter(t => !isCertified(t)) // 看板明细只显示未完成（未认证）学员
      .map(t => ({ ...t, _progress: calcProgress(t), _currentDay: getCurrentDay(t) }));
    if (sortBy === 'progress') list.sort((a, b) => b._progress.percent - a._progress.percent);
    else if (sortBy === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
    else if (sortBy === 'store') list.sort((a, b) => a.store.localeCompare(b.store));

  const stats = useMemo(() => {

    const completed = trainees.filter(t => isCertified(t)).length;
    const notStarted = trainees.filter(t => !isCertified(t) && calcProgress(t).completed === 0).length;
    const avgProgress = total > 0 ? Math.round(trainees.reduce((sum, t) => sum + calcProgress(t).percent, 0) / total) : 0;
    const incompleteTotal = inProgress + notStarted; // 未带训完总人数（不含已认证）
    return { total, inProgress, completed, notStarted, avgProgress, incompleteTotal };

  // Group by store (total includes certified trainees; completion rate = certified / total)
  const storeStats = useMemo(() => {
    const map = {};

            }

      }
