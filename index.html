// ============ Region Manager Dashboard ============
function RegionDashboardView({ trainees: allTrainees, stores, config, workHours, subAreas }) {
  // 已离职学员不进入大区看板统计（数据保留，仅排除展示与分析）
  const trainees = useMemo(() => (allTrainees || []).filter(t => !isResigned(t)), [allTrainees]);
  const today = localDateStr(new Date().toISOString());
  const yesterday = yesterdayStr();
  const [filterArea, setFilterArea] = useState('');
  const [showAllIncomplete, setShowAllIncomplete] = useState(false);
  const [drillArea, setDrillArea] = useState(''); // 下钻：非空表示进入某小区看板

  const visibleTrainees = useMemo(() => {
    // 下钻（小区看板）与各小区进度对比保持一致的本月口径：仅保留本月在训 + 本月已晋升
    if (drillArea) return trainees.filter(t => (t.area || '000') === drillArea && (!isCertified(t) || isCertifiedThisMonth(t)));
    if (!filterArea) return trainees;
    return trainees.filter(t => (t.area || '000') === filterArea);
  }, [trainees, filterArea, drillArea]);

  // 下钻小区看板的学员进度列表：未认证按工时从高到低排，已认证置底
  const drillProgressList = useMemo(() => {
    const list = visibleTrainees.map(t => ({ ...t, _progress: calcProgress(t), _hours: workHours?.[t.empId]?.hours ?? null }));
    const byHours = (a, b) => (b._hours ?? -1) - (a._hours ?? -1);
    const uncertified = list.filter(t => !isCertified(t)).sort(byHours);
    const certified = list.filter(t => isCertified(t)).sort(byHours);
    return [...uncertified, ...certified];
  }, [visibleTrainees, workHours]);

  const stats = useMemo(() => {
    const total = visibleTrainees.length;
    const progressList = visibleTrainees.map(t => calcProgress(t));
    const inProgress = progressList.filter(p => p.percent > 0 && p.percent < 100).length;
    const completed = visibleTrainees.filter(t => isCertified(t)).length;
    const notStarted = visibleTrainees.filter(t => !isCertified(t) && calcProgress(t).percent === 0).length;
    const avgProgress = total > 0 ? Math.round(progressList.reduce((s, p) => s + p.percent, 0) / total) : 0;
    const incompleteTotal = inProgress + notStarted; // 未带训完总人数（不含已认证）
    // 顶部卡片与下方列表统一口径：仅统计在训（未认证）人员，用共享判定函数（只看昨日动作，不用 completedAt、不做跨天补登）
    const checkedYesterday = visibleTrainees.filter(t => !isCertified(t) && isYesterdayCheckedTrainee(t, yesterday)).length;
    return { total, inProgress, completed, notStarted, avgProgress, incompleteTotal, checkedYesterday, uncheckedYesterday: incompleteTotal - checkedYesterday };
  }, [visibleTrainees, yesterday, today]);

  const areaStats = useMemo(() => {
    return config.filter(c => c.role === 'area' && (!subAreas || subAreas.includes(c.id))).map(c => {
      const list = trainees.filter(t => (t.area || '000') === c.id && (!isCertified(t) || isCertifiedThisMonth(t)));
      const total = list.length;
      const completed = list.filter(t => isCertified(t)).length; // 本月已认证（晋升）
      const inProgress = list.filter(t => !isCertified(t) && calcProgress(t).percent > 0).length;
      const completionRate = total > 0 ? Math.round((completed / total) * 100) : 0;
      return { ...c, total, avg: completionRate, completed, inProgress };
    });
  }, [trainees, config, subAreas]);

  const incompleteList = useMemo(() => {
    return visibleTrainees
      .filter(t => calcProgress(t).percent < 100 && getCurrentDay(t) !== null) // 已完成/已认证人员不显示
      .map(t => ({ ...t, _progress: calcProgress(t), _streak: calcNoCheckInStreak(t, today), _certs: countCerts(t) }))
      .filter(t => t._streak.days > 0) // 排除今日已打卡人员，避免影响分析
      .sort((a, b) => {
        // 优先按连续未打卡天数从大到小排；天数相同再按区域排序
        const daysDiff = b._streak.days - a._streak.days;
        if (daysDiff !== 0) return daysDiff;
        const areaA = a.area || '000';
        const areaB = b.area || '000';
        if (areaA !== areaB) return areaA.localeCompare(areaB, undefined, { numeric: true });
        return a._progress.percent - b._progress.percent;
      });
  }, [visibleTrainees, today]);

  const storeRanking = useMemo(() => {
    const map = {};
    visibleTrainees.forEach(t => { if (t.store) map[t.store] = (map[t.store] || 0) + 1; });
    return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 10);
  }, [visibleTrainees]);

  const phaseDist = useMemo(() => {
    const phases = { '第一阶段': 0, '第二阶段': 0, '第三阶段': 0, '第四阶段': 0, '已完成': 0 };
    visibleTrainees.forEach(t => {
      const prog = calcProgress(t);
      if (prog.percent === 100) { phases['已完成']++; return; }
      const cd = getCurrentDay(t);
      if (cd && phases[cd.phaseName] !== undefined) phases[cd.phaseName]++;
      else phases['已完成']++;
    });
    return Object.entries(phases).filter(([k, v]) => v > 0);
  }, [visibleTrainees]);

  const hourWarnings = useMemo(() => {
    return visibleTrainees
      .filter(t => !isCertified(t))
      .map(t => {
        const h = workHours?.[t.empId]?.hours;
        const w = getWorkHoursWarning(t, h);
        return w ? { ...t, _warning: w, _progress: calcProgress(t) } : null;
      })
      .filter(Boolean)
      .sort((a, b) => b._warning.hours - a._warning.hours);
  }, [visibleTrainees, workHours]);


  const yesterdayAndTodayStats = useMemo(() => {
    const yesterdayChecked = [];
    const yesterdayUnchecked = [];
    const todayChecked = [];
    const todayDelayed = [];
    visibleTrainees.forEach(t => {
      if (isCertified(t)) return; // 与顶部卡片一致：仅统计在训（未认证）人员，避免"昨日已打卡/未打卡"两处口径不一致
      const areaCfg = config.find(c => c.id === (t.area || '000'));
      const areaName = areaCfg?.name?.replace('区域带训追踪系统', '') || (t.area || '000');
      let yHas = false; let yLast = ''; let tHas = false; let tLast = '';
      let dCount = 0; let dLast = ''; let dNote = '';
      let rCount = 0; let rLast = '';
      // 昨日延迟/休息也算"已打卡"（只要店长有操作就算）
      let ydCount = 0; let ydLast = '';
      let yrCount = 0; let yrLast = '';
      const progress = t.progress || {};
      Object.values(progress).forEach(day => {
        Object.values(day.items || {}).forEach(item => {
          if (item.checked && item.checkedAt) {
            const d = localDateStr(item.checkedAt);
            if (d === yesterday) { yHas = true; if (item.checkedAt > yLast) yLast = item.checkedAt; }
            else if (d === today) { tHas = true; if (item.checkedAt > tLast) tLast = item.checkedAt; }
          }
        });
        // 仅确认完成但没有勾选项的不算打卡，因此 completedAt 不再作为打卡依据
        if (delayedOnDate(day, today)) {
          dCount++;
          if (day.delayAt && day.delayAt > dLast) { dLast = day.delayAt; dNote = day.delayNote || ''; }
        } else if (delayedOnDate(day, yesterday)) {
          ydCount++;
          if (day.delayAt && day.delayAt > ydLast) ydLast = day.delayAt;
        }
        if (restOnDate(day, today)) {
          rCount++;
          if (day.restAt && day.restAt > rLast) rLast = day.restAt;
        } else if (restOnDate(day, yesterday)) {
          yrCount++;
          if (day.restAt && day.restAt > yrLast) yrLast = day.restAt;
        }
      });
      const baseEntry = { ...t, areaName };
      // 昨日"已打卡"判定：统一挂到共享 isCheckedOnDate（与推送机器人/顶部卡片严格一致，含 completedAt）
      // 不再做"今天仍处于延迟/休息"跨天补登——昨日判定只看昨日动作
      if (isCheckedOnDate(t, yesterday)) {
        const restoredTime = yHas ? yLast : (ydLast || yrLast);
        yesterdayChecked.push({
          ...baseEntry,
          lastTime: restoredTime,
          isDelayed: ydCount > 0,
          isRest: yrCount > 0
        });
      } else {
        // 已完成全部带训的人员不再出现在未打卡列表中
        if (getCurrentDay(t) === null) {
          if (dCount > 0) {
            const total = calcDelayTotalDays(t);
            const streak = calcDelayStreakDays(t);
            todayDelayed.push({ ...baseEntry, delayCount: dCount, delayLastTime: dLast, delayNote: dNote, delayTotalDays: total.days, delayTotalLabel: total.label, delayStreakDays: streak.days, delayStreakLabel: streak.label });
          }
          if (rCount > 0) todayChecked.push({ ...baseEntry, lastTime: rLast, isRest: true });
          return;
        }
        const streak = calcNoCheckInStreak(t, today);
        yesterdayUnchecked.push({ ...baseEntry, streakDays: streak.days, streakLabel: streak.label });
      }
      if (tHas || dCount > 0 || rCount > 0) todayChecked.push({ ...baseEntry, lastTime: tLast || rLast, isDelayed: dCount > 0, isRest: rCount > 0 });
      if (dCount > 0) {
        const total = calcDelayTotalDays(t);
        const streak = calcDelayStreakDays(t);
        todayDelayed.push({ ...baseEntry, delayCount: dCount, delayLastTime: dLast, delayNote: dNote, delayTotalDays: total.days, delayTotalLabel: total.label, delayStreakDays: streak.days, delayStreakLabel: streak.label });
      }
    });
    yesterdayChecked.sort((a, b) => (b.lastTime || '').localeCompare(a.lastTime || ''));
    yesterdayUnchecked.sort((a, b) => b.streakDays - a.streakDays);
    todayChecked.sort((a, b) => (b.lastTime || '').localeCompare(a.lastTime || ''));
    todayDelayed.sort((a, b) => (b.delayTotalDays || 0) - (a.delayTotalDays || 0));
    return { yesterdayChecked, yesterdayUnchecked, todayChecked, todayDelayed };
  }, [visibleTrainees, yesterday, today, config]);

                      </td>

            <div className="max-h-64 overflow-y-auto pr-1">

                  <thead>
                    <tr className="text-xs text-gray-500 border-b border-gray-800">
                      <th className="text-left px-3 py-2 font-medium">学员/门店/区域</th>
                      <th className="text-left px-3 py-2 font-medium w-16">工时</th>
                      <th className="text-left px-3 py-2 font-medium w-14">证书</th>
                      <th className="text-left px-3 py-2 font-medium">备注</th>
                      <th className="text-left px-3 py-2 font-medium w-24">未打卡</th>

                  </thead>
                  <tbody>

                      <tr key={t.id} className="border-b border-gray-800/50">
                        <td className="px-3 py-2">
                          <div className="flex items-center gap-2 min-w-0">
                            <span className="text-sm text-gray-300 font-medium">{t.name}</span>
                            <span className="text-xs text-gray-600 truncate">{t.store}</span>
                            <span className="text-xs text-indigo-400/80">{t.areaName}</span>

                        <td className="px-3 py-2 text-xs text-amber-300/80">{countCerts(t)}证</td>
                        <td className="px-3 py-2 text-xs text-amber-300/80 truncate max-w-[260px]" title={t.note || ''}>{t.note || '—'}</td>
                        <td className="px-3 py-2"><span className="text-xs px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300">{t.streakLabel}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>

            </div>
          </div>
          <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
            <h3 className="text-sm font-medium text-gray-300 mb-3 flex items-center gap-2"><Icon.Clock className="text-amber-400"/> 今日已延迟 ({yesterdayAndTodayStats.todayDelayed.length})</h3>
            <div className="max-h-64 overflow-y-auto pr-1">
              {yesterdayAndTodayStats.todayDelayed.length === 0 ? (
                <p className="text-sm text-gray-500 text-center py-4">今天没有人延迟打卡</p>
              ) : (
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-xs text-gray-500 border-b border-gray-800">
                      <th className="text-left px-3 py-2 font-medium">学员/门店/区域</th>
                      <th className="text-left px-3 py-2 font-medium">延迟备注</th>
                      <th className="text-left px-3 py-2 font-medium w-28">连续延迟</th>
                      <th className="text-left px-3 py-2 font-medium w-28">累计延迟</th>
                    </tr>
                  </thead>
                  <tbody>
                    {yesterdayAndTodayStats.todayDelayed.slice(0, 20).map(t => (
                      <tr key={t.id} className="border-b border-gray-800/50">
                        <td className="px-3 py-2">
                          <div className="flex items-center gap-2 min-w-0">
                            <span className="text-sm text-gray-300 font-medium">{t.name}</span>
                            <span className="text-xs text-gray-600 truncate">{t.store}</span>
                            <span className="text-xs text-indigo-400/80">{t.areaName}</span>
                          </div>
                        </td>
                        <td className="px-3 py-2 text-xs text-amber-300/80 max-w-[260px]" title={t.delayNote || ''}>
                          {t.delayNote || '—'}
                        </td>
                        <td className="px-3 py-2"><span className="text-xs px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-300">{t.delayStreakLabel}</span></td>
                        <td className="px-3 py-2"><span className="text-xs px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300">{t.delayTotalLabel}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>
        </div>
        </div>

        {/* Area Comparison Table */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 lg:col-span-2">
          <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2"><Icon.Dashboard/> 区域完成率对比表</h3>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs text-gray-500 border-b border-gray-800">
                  <th className="text-left px-3 py-2 font-medium">区域</th>
                  <th className="text-left px-3 py-2 font-medium">学员数</th>
                  <th className="text-left px-3 py-2 font-medium">已完成</th>
                  <th className="text-left px-3 py-2 font-medium">带训中</th>
                  <th className="text-left px-3 py-2 font-medium">未开始</th>
                  <th className="text-left px-3 py-2 font-medium">完成率</th>
                  <th className="text-left px-3 py-2 font-medium">昨日打卡</th>
                </tr>
              </thead>
              <tbody>
                {areaStats.map(a => {
                  const list = trainees.filter(t => (t.area || '000') === a.id);
                  let checkedYesterday = 0;
                  list.forEach(t => {
                    if (isCertified(t)) return; // 已认证人员不计入昨日打卡统计
                    const progress = t.progress || {};
                    let hasYesterday = false;
                    let todayStillActive = false;
                    Object.values(progress).forEach(day => {
                      Object.values(day.items || {}).forEach(item => {
                        if (item.checked && item.checkedAt && localDateStr(item.checkedAt) === yesterday) hasYesterday = true;
                        if (item.checked && item.checkedAt && localDateStr(item.checkedAt) === today) todayStillActive = true;
                      });
                      if (day.completed && day.completedAt && localDateStr(day.completedAt) === yesterday) hasYesterday = true;
                      if (day.completed && day.completedAt && localDateStr(day.completedAt) === today) todayStillActive = true;
                      // 昨日被标延迟/休息也算"已打卡"
                      if (delayedOnDate(day, yesterday) || restOnDate(day, yesterday)) hasYesterday = true;
                      // 跨天补登：今天还在标延迟/休息（昨天也通常处于休息/延迟），昨日也算打过卡
                      if (delayedOnDate(day, today) || restOnDate(day, today)) {
                        todayStillActive = true;
                        if (!hasYesterday) hasYesterday = true;
                      }
                    });
                    if (hasYesterday) checkedYesterday++;
                    // 抑制未使用变量警告（todayStillActive 当前仅用于标记诊断，可进一步扩展）
                    void todayStillActive;
                  });
                  return (
                    <tr key={a.id} className="border-b border-gray-800/50 hover:bg-gray-800/20 cursor-pointer" onClick={() => setFilterArea(filterArea === a.id ? '' : a.id)}>
                      <td className="px-3 py-2 text-white font-medium">{a.name.replace('区域带训追踪系统', '')}</td>
                      <td className="px-3 py-2 text-gray-400">{a.total}</td>
                      <td className="px-3 py-2 text-emerald-400">{a.completed}</td>
                      <td className="px-3 py-2 text-amber-400">{a.inProgress}</td>
                      <td className="px-3 py-2 text-gray-500">{a.total - a.completed - a.inProgress}</td>
                      <td className="px-3 py-2">
                        <div className="flex items-center gap-2">
                          <div className="w-20 h-1.5 bg-gray-800 rounded-full overflow-hidden">
                            <div className="h-full progress-bar-fill rounded-full bg-indigo-500" style={{width: `${a.avg}%`}}></div>
                          </div>
                          <span className="text-xs text-gray-400">{a.avg}%</span>
                        </div>
                      </td>
                      <td className="px-3 py-2 text-gray-400">{checkedYesterday}/{a.total}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <p className="text-xs text-gray-600 mt-2">点击表格行可筛选上方所有模块为单个区域</p>
        </div>
      </div>
    </div>
  );
}

// ============ 企微机器人推送配置卡片（每小区独立机器人） ============
function BotSettingsCard({ currentUser, config }) {
  const AREA_MAP = useMemo(() => Object.fromEntries(config.map(c => [c.id, c])), [config]);
  const isAdmin = currentUser?.id === '000';
  const isManager = currentUser?.role === 'manager';
  const ownerArea = currentUser?.id || '000';

  // 可用推送范围
  const scopeOptions = useMemo(() => {
    if (isAdmin) {
      const areas = config.filter(c => c.role === 'area').map(c => ({ id: c.id, name: c.name.replace('区域带训追踪系统', '') }));
      return [{ id: 'all', name: '全部区域' }, ...areas];
    }
    if (isManager) {
      const subs = (AREA_MAP[currentUser.id]?.subAreas || []).map(id => ({ id, name: AREA_MAP[id]?.name?.replace('区域带训追踪系统', '') || id }));
      return [{ id: 'all', name: '全部区域' }, ...subs];
    }
    return [{ id: currentUser.id, name: currentUser.name?.replace('区域带训追踪系统', '') || currentUser.id }];
  }, [currentUser, config, AREA_MAP, isAdmin, isManager]);

  const defaultScope = scopeOptions[0]?.id || ownerArea;
  const defaultTargets = useMemo(() => {
    if (isAdmin && defaultScope === 'all') return ['all'];
    if (isManager && defaultScope === 'all') return AREA_MAP[currentUser.id]?.subAreas || [currentUser.id];
    return [defaultScope];
  }, [isAdmin, isManager, defaultScope, AREA_MAP, currentUser.id]);

  const [settings, setSettings] = useState({
    enabled: false,
    webhook_url: '',
    push_times: ['22:00'],
    push_scope: defaultScope,
    push_content: { unchecked: true, allChecked: true, hourWarning: false, dailyBrief: false }
  });

  // 兼容旧版单字符串 '22:00' 和 JSON 数组 ["09:00","21:00"]
  const parsePushTimes = (pt) => {
    if (!pt) return ['22:00'];
    if (Array.isArray(pt)) return pt.filter(Boolean);
    try {
      const arr = JSON.parse(pt);
      if (Array.isArray(arr) && arr.length) return arr.filter(Boolean);
    } catch (e) {}
    return [pt];
  };
  const [record, setRecord] = useState(null);
  const [tableMissing, setTableMissing] = useState(false);
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [testing, setTesting] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = (text, ok) => {
    setToast({ text, ok });
    setTimeout(() => setToast(null), 5000);
  };

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const { data, error } = await supabase.from('bot_settings').select('*').eq('area', ownerArea).single();
      if (error && error.code !== 'PGRST116') { setTableMissing(true); setLoading(false); return; }
      setTableMissing(false);
      const savedTargets = Array.isArray(data?.target_areas) && data.target_areas.length ? data.target_areas : defaultTargets;
      // 大区(manager)保存"全部区域"时，target_areas 会被展开成全部子区数组，
      // 需要把它还原为 'all'，否则下拉框会回退到第一个小区（如"郭士龙区域"），看起来像没保存。
      let savedScope;
      if (savedTargets[0] === 'all') {
        savedScope = 'all';
      } else if (isManager) {
        const fullSubs = AREA_MAP[currentUser.id]?.subAreas || [];
        savedScope = (fullSubs.length && fullSubs.length === savedTargets.length && fullSubs.every((v, i) => v === savedTargets[i])) ? 'all' : (savedTargets[0] || defaultScope);
      } else {
        savedScope = savedTargets[0] || defaultScope;
      }
      setSettings({
        enabled: !!data?.enabled,
        webhook_url: data?.webhook_url || '',
        push_times: parsePushTimes(data?.push_time),
        push_scope: scopeOptions.find(o => o.id === savedScope) ? savedScope : defaultScope,
        push_content: { unchecked: true, allChecked: true, hourWarning: false, dailyBrief: false, ...(data?.push_content || {}) }
      });
      setRecord(data ? { last_push_at: data.last_push_at, last_push_status: data.last_push_status, last_push_summary: data.last_push_summary } : null);
    } catch (err) {
      setTableMissing(true);
    } finally {
      setLoading(false);
    }
  }, [ownerArea, defaultScope, defaultTargets, scopeOptions]);

  useEffect(() => { load(); }, [load]);

  const patch = (p) => setSettings(prev => ({ ...prev, ...p }));
  const patchContent = (key, val) => setSettings(prev => ({ ...prev, push_content: { ...prev.push_content, [key]: val } }));

  const computeTargets = (scope) => {
    if (isAdmin && scope === 'all') return ['all'];
    if (isManager && scope === 'all') return AREA_MAP[currentUser.id]?.subAreas || [currentUser.id];
    return [scope];
  };

  const handleSave = async () => {
    if (!settings.webhook_url.trim()) { showToast('请填写 Webhook 地址', false); return; }
    setSaving(true);
    try {
      const targetAreas = computeTargets(settings.push_scope);
      const { error } = await supabase.from('bot_settings').upsert({
        area: ownerArea,
        enabled: settings.enabled,
        webhook_url: settings.webhook_url.trim(),
        push_time: JSON.stringify(settings.push_times.filter(Boolean)),
        target_areas: targetAreas,
        push_content: settings.push_content,
        updated_at: new Date().toISOString(),
      }, { onConflict: 'area' });
      if (error) throw error;
      showToast('保存成功 ✓', true);
      await load();
    } catch (err) {
      showToast('保存失败：' + (err.message || '未知错误'), false);
    }
    setSaving(false);
  };

  const handleTest = async () => {
    if (!settings.webhook_url.trim()) { showToast('请填写 Webhook 地址', false); return; }
    setTesting(true);
    try {
      // 先保存当前设置，确保服务端用最新 webhook
      const targetAreas = computeTargets(settings.push_scope);
      const { error: saveErr } = await supabase.from('bot_settings').upsert({
        area: ownerArea,
        enabled: settings.enabled,
        webhook_url: settings.webhook_url.trim(),
        push_time: JSON.stringify(settings.push_times.filter(Boolean)),
        target_areas: targetAreas,
        push_content: settings.push_content,
        updated_at: new Date().toISOString(),
      }, { onConflict: 'area' });
      if (saveErr) throw saveErr;

      // 提交测试推送
      const { data, error } = await supabase.rpc('push_test', { area_code: ownerArea });
      if (error) throw error;
      if (!data || !data.ok) {
        showToast((data && data.errmsg) || '测试推送失败', false);
        setTesting(false);
        return;
      }

      // 轮询结果
      const requestId = data.request_id;
      const maxPolls = 15;
      let lastStatus = null;
      for (let i = 0; i < maxPolls; i++) {
        await new Promise(r => setTimeout(r, 1500));
        const { data: status, error: statusErr } = await supabase.rpc('push_test_status', { request_id: requestId });
        if (statusErr) continue;
        lastStatus = status;
        if (status && status.ready) {
          showToast(status.errmsg, status.ok);
          setTesting(false);
          return;
        }
      }
      // 轮询结束仍未拿到结果，给出“已提交”提示
      showToast(lastStatus && lastStatus.errmsg ? lastStatus.errmsg : '测试消息已提交，请查看企业微信群确认', true);
    } catch (err) {
      showToast('测试推送失败：' + (err.message || '未知错误'), false);
    }
    setTesting(false);
  };

  const recText = record?.last_push_at
    ? (record.last_push_status === 'ok' ? '成功' : record.last_push_status === 'skip' ? '静默' : record.last_push_status === 'error' ? '失败' : record.last_push_status)
    : '';

  return (
    <div>
      {tableMissing && (
        <div className="text-xs text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-lg p-3 mb-4">
          数据库还没有 bot_settings 表或缺少 target_areas 字段，请先在 Supabase 控制台 SQL Editor 执行 bot-settings.sql，然后点"刷新"。
        </div>
      )}

      <div className="bg-gray-800/30 border border-gray-700 rounded-xl p-5">
        {/* Header */}
        <div className="flex items-center justify-between mb-6">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-green-500/15 flex items-center justify-center">
              <svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="#4ade80" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="11" width="18" height="10" rx="2"/>
                <circle cx="12" cy="5" r="2"/>
                <path d="M12 7v4"/>
                <path d="M8 16h.01M16 16h.01"/>
              </svg>
            </div>
            <div>
              <h3 className="text-base font-bold text-white flex items-center gap-2">
                企微机器人推送
                {settings.enabled && <span className="text-xs px-2 py-0.5 rounded-full bg-green-500/20 text-green-300 border border-green-500/30">已启用</span>}
              </h3>
              <p className="text-xs text-gray-500">到点自动推送 · 仅本账号可见</p>
            </div>
          </div>
          <label className="flex items-center gap-2 text-sm text-gray-300 cursor-pointer">
            启用自动推送
            <input type="checkbox" checked={settings.enabled} onChange={ev => patch({ enabled: ev.target.checked })} className="accent-green-500 w-5 h-5"/>
          </label>
        </div>

        {loading ? (
          <div className="text-sm text-gray-500 text-center py-8">加载配置中…</div>
        ) : (
          <div className="space-y-5">
            {/* Webhook */}
            <div>
              <label className="block text-xs text-gray-500 mb-1.5">Webhook 地址</label>
              <input
                type="text" value={settings.webhook_url}
                placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=..."
                onChange={ev => patch({ webhook_url: ev.target.value })}
                className="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-gray-300 placeholder-gray-600 focus:border-green-500 outline-none"
              />
            </div>

            {/* Push time & scope */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs text-gray-500 mb-1.5">推送时间（每天，最多 3 个）</label>
                <div className="space-y-2">
                  {settings.push_times.map((t, idx) => (
                    <div key={idx} className="flex items-center gap-2">
                      <input
                        type="time" value={t}
                        onChange={ev => {
                          const next = [...settings.push_times];
                          next[idx] = ev.target.value;
                          patch({ push_times: next });
                        }}
                        className="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-gray-300 focus:border-green-500 outline-none"
                      />
                      {settings.push_times.length > 1 && (
                        <button
                          type="button"
                          onClick={() => patch({ push_times: settings.push_times.filter((_, i) => i !== idx) })}
                          className="px-2 py-2 text-xs text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-lg transition"
                        >删除</button>
                      )}
                    </div>
                  ))}
                  {settings.push_times.length < 3 && (
                    <button
                      type="button"
                      onClick={() => patch({ push_times: [...settings.push_times, '09:00'] })}
                      className="text-xs text-green-400 hover:text-green-300 hover:bg-green-500/10 px-3 py-2 rounded-lg border border-dashed border-gray-600 transition"
                    >+ 添加推送时间</button>
                  )}
                </div>
              </div>
              <div>
                <label className="block text-xs text-gray-500 mb-1.5">推送区域</label>
                <select value={settings.push_scope} onChange={ev => patch({ push_scope: ev.target.value })}
                  disabled={!isAdmin && !isManager}
                  className="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-gray-300 focus:border-green-500 outline-none disabled:opacity-70">
                  {scopeOptions.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                </select>
              </div>
            </div>

            {/* Push content */}
            <div>
              <label className="block text-xs text-gray-500 mb-2">推送内容</label>
              <div className="grid grid-cols-2 gap-3">
                <label className="flex items-center gap-2 text-sm text-gray-300 cursor-pointer bg-gray-800/50 border border-gray-700/50 rounded-lg px-3 py-2.5 hover:bg-gray-800 transition">
                  <input type="checkbox" checked={!!settings.push_content.unchecked} onChange={ev => patchContent('unchecked', ev.target.checked)} className="accent-green-500 w-4 h-4"/>
                  <span>今日未打卡名单</span>
                </label>
                <label className="flex items-center gap-2 text-sm text-gray-300 cursor-pointer bg-gray-800/50 border border-gray-700/50 rounded-lg px-3 py-2.5 hover:bg-gray-800 transition">
                  <input type="checkbox" checked={!!settings.push_content.allChecked} onChange={ev => patchContent('allChecked', ev.target.checked)} className="accent-green-500 w-4 h-4"/>
                  <span>全员打卡报平安</span>
                </label>
                <label className="flex items-center gap-2 text-sm text-gray-300 cursor-pointer bg-gray-800/50 border border-gray-700/50 rounded-lg px-3 py-2.5 hover:bg-gray-800 transition">
                  <input type="checkbox" checked={!!settings.push_content.hourWarning} onChange={ev => patchContent('hourWarning', ev.target.checked)} className="accent-amber-500 w-4 h-4"/>
                  <span>工时预警</span>
                </label>
                <label className="flex items-center gap-2 text-sm text-gray-300 cursor-pointer bg-gray-800/50 border border-gray-700/50 rounded-lg px-3 py-2.5 hover:bg-gray-800 transition">
                  <input type="checkbox" checked={!!settings.push_content.dailyBrief} onChange={ev => patchContent('dailyBrief', ev.target.checked)} className="accent-indigo-500 w-4 h-4"/>
                  <span>每日数据简报</span>
                </label>
              </div>
            </div>

            {/* Buttons */}
            <div className="grid grid-cols-2 gap-3 pt-2">
              <button onClick={handleSave} disabled={saving}
                className="py-2.5 rounded-lg text-sm font-medium bg-gray-800 border border-gray-700 text-white hover:bg-gray-700 disabled:opacity-50 transition">
                {saving ? '保存中…' : '保存设置'}
              </button>
              <button onClick={handleTest} disabled={testing}
                className="py-2.5 rounded-lg text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-500 disabled:opacity-50 transition">
                {testing ? '发送中…' : '立即测试推送'}
              </button>
            </div>

            {toast && (
              <div className={`text-xs rounded-lg px-3 py-2 ${toast.ok ? 'bg-green-500/10 text-green-300 border border-green-500/20' : 'bg-red-500/10 text-red-300 border border-red-500/20'}`}>
                {toast.text}
              </div>
            )}

            {/* Recent push record */}
            {record?.last_push_at && (
              <div className="text-xs text-gray-500 border-t border-gray-700/50 pt-4">
                最近推送：{localDateStr(record.last_push_at)} {new Date(record.last_push_at).getHours().toString().padStart(2,'0')}:{new Date(record.last_push_at).getMinutes().toString().padStart(2,'0')} · {record.last_push_summary || recText} · {recText}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

const DASHBOARD_PASSWORD = '415';
const ADMIN_PASSWORD = '1216';

function PasswordModal({ password = DASHBOARD_PASSWORD, title = '管理看板验证', description = '请输入密码进入后台', onSuccess, onClose }) {
  const [pwd, setPwd] = useState('');
  const [error, setError] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    inputRef.current && inputRef.current.focus();
  }, []);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (pwd === password) {
      onSuccess();
    } else {
      setError(true);
      setPwd('');
      setTimeout(() => setError(false), 1500);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" onClick={onClose}>
      <form onSubmit={handleSubmit} onClick={e => e.stopPropagation()} className="bg-gray-900 border border-gray-700 rounded-2xl p-6 w-80 shadow-2xl fade-in">
        <div className="flex items-center gap-3 mb-4">
          <div className="w-10 h-10 rounded-xl bg-indigo-500/15 flex items-center justify-center">
            <Icon.Lock width={20} height={20} className="text-indigo-400"/>
          </div>
          <div>
            <h3 className="text-base font-bold text-white">{title}</h3>
            <p className="text-xs text-gray-500">{description}</p>
          </div>
        </div>
        <input
          ref={inputRef}
          type="password"
          value={pwd}
          onChange={e => setPwd(e.target.value)}
          placeholder="输入密码"
          className={`w-full bg-gray-800 border rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600 ${error ? 'border-red-500 animate-pulse' : 'border-gray-700'}`}
        />
        {error && <p className="text-xs text-red-400 mt-2">密码错误，请重试</p>}
        <div className="flex gap-2 mt-4">
          <button type="button" onClick={onClose} className="flex-1 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-gray-800 transition">取消</button>
          <button type="submit" className="flex-1 py-2 rounded-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 transition">确认</button>
        </div>
      </form>
    </div>
  );
}

// ============ Sync Modal (Real-time) ============
// ============ 工时导入弹窗（仅 000 账号可见） ============
// ============ 学员批量导入（仅 000 账号） ============
const ROUTE_LABELS = { front_to_back: '前厅→后厨', back_to_front: '后厨→前厅', master: '师傅带教', supervisor: '门店主管' };

function TraineesImportModal({ existingTrainees, onClose, onImport }) {
  const [parseResult, setParseResult] = useState(null); // {valid, invalid, total}
  const [importDone, setImportDone] = useState(0);
  const [errMsg, setErrMsg] = useState('');
  const [fileName, setFileName] = useState('');

  // 区域账号 → 配置（仅小区/区域账号，大区经理账号不能作为学员归属）
  const AREA_MAP = useMemo(() => {
    const m = {};
    for (const c of AREA_CONFIG) if (c.role === 'area') m[c.id] = c;
    return m;
  }, []);
  // 小区账号 → 所属大区经理名（模板对照表用）
  const AREA_MANAGER = useMemo(() => {
    const m = {};
    for (const c of AREA_CONFIG) {
      if (c.role === 'manager' && Array.isArray(c.subAreas)) {
        const mgrName = (c.name || '').replace('大区带训追踪系统', '');
        for (const sub of c.subAreas) m[sub] = mgrName;
      }
    }
    return m;
  }, []);

  const downloadTemplate = () => {
    const aoa = [
      ['区域账号', '学员姓名', '门店', '工号', '带训路线', '兼职岗位', '入职日期', '带训师傅'],
      ['0026', '王小明（示例，可删）', '太原万达店', '10086', '前厅→后厨', '', '2026/8/25', '张师傅'],
      ['0105', '李小红（示例，可删）', '长治八一店', '10087', '兼职', '后厨兼职', '2026/8/25', '王师傅'],
      ['0026', '赵师傅（示例，可删）', '太原万达店', '10088', '师傅带教', '', '2026/8/25', '孙主管'],
      ['0105', '钱主管（示例，可删）', '长治八一店', '10089', '门店主管', '', '2026/8/25', '周店长']
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 10 }, { wch: 20 }, { wch: 16 }, { wch: 10 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 10 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '学员名单');

    const tips = [
      ['填写说明'],
      ['1. 带训路线只能填：前厅→后厨 / 后厨→前厅 / 兼职 / 师傅带教 / 门店主管'],
      ['2. 路线填「兼职」时，请在「兼职岗位」填：前厅兼职 或 后厨兼职（不填默认前厅兼职）'],
      ['3. 区域账号必填（0001-0147 新体系小区，或老区域 000-007），完整对照见「区域账号对照」sheet'],
      ['4. 学员姓名、门店必填；同一区域同名学员会自动跳过（视为重复）'],
      ['5. 工号必填（用于工时匹配），且不能与已有学员重复'],
      ['6. 入职日期格式：2026/8/25 或 2026-08-25，不填默认今天'],
      ['7. 带训师傅选填'],
      ['8. “带训师傅”列：师傅带教填门店主管姓名；门店主管填店长姓名（主管缺岗/饱和时师傅路线由店长替补）']
    ];
    const ws2 = XLSX.utils.aoa_to_sheet(tips);
    ws2['!cols'] = [{ wch: 80 }];
    XLSX.utils.book_append_sheet(wb, ws2, '填写说明');

    const ref = [['区域账号', '负责人', '所属大区']];
    const ids = Object.keys(AREA_MAP).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    for (const id of ids) {
      ref.push([id, (AREA_MAP[id].name || '').replace('区域带训追踪系统', ''), AREA_MANAGER[id] || '—']);
    }
    const ws3 = XLSX.utils.aoa_to_sheet(ref);
    ws3['!cols'] = [{ wch: 10 }, { wch: 12 }, { wch: 12 }];
    XLSX.utils.book_append_sheet(wb, ws3, '区域账号对照');
    XLSX.writeFile(wb, '学员批量导入模板.xlsx');
  };

  const normKey = (k) => String(k || '').replace(/[\s:：（）()]/g, '');
  const pad2 = (n) => String(n).padStart(2, '0');
  const fmtDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

  // 解析入职日期：兼容 Excel 日期序列号 / Date / 2026-8-25 / 2026/8/25 / 2026年8月25日
  const parseImportDate = (v) => {
    if (v === null || v === undefined || v === '') return '';
    if (v instanceof Date && !isNaN(v)) return fmtDate(v);
    if (typeof v === 'number' && isFinite(v) && v > 20000 && v < 80000) {
      const d = new Date(Math.round((v - 25569) * 86400000));
      if (!isNaN(d)) return fmtDate(d);
      return '';
    }
    const s = String(v).trim();
    const m = s.match(/^(\d{4})[.\-\/年](\d{1,2})[.\-\/月](\d{1,2})日?$/);
    if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
    const d = new Date(s);
    return isNaN(d) ? '' : fmtDate(d);
  };

  // 区域账号归一化：数字 26 → '0026'，文本原样；找不到就返回原值交校验报错
  const normArea = (v) => {
    let s = String(v ?? '').trim();
    if (!s) return '';
    if (AREA_MAP[s]) return s;
    const digits = s.replace(/[^0-9]/g, '');
    if (digits && /^\d+$/.test(digits)) {
      const p4 = digits.padStart(4, '0');
      if (AREA_MAP[p4]) return p4;
      const p3 = digits.padStart(3, '0');
      if (AREA_MAP[p3]) return p3;
    }
    return s;
  };

  // 带训路线识别：前厅→后厨 / 后厨→前厅 / 兼职（含子路线）/ 师傅带教 / 门店主管
  const resolveRoute = (rawRoute, rawSub) => {
    const s = String(rawRoute || '').replace(/[\s\-—→\/]/g, '');
    if (s.indexOf('兼职') >= 0) {
      const sub = String(rawSub || '');
      const subRoute = (sub.indexOf('后厨') >= 0 && sub.indexOf('前厅') < 0) ? 'back_part_time' : 'front_part_time';
      return { route: 'part_time', subRoute };
    }
    if (s.indexOf('前厅') >= 0 && s.indexOf('后厨') >= 0) {
      return { route: s.indexOf('前厅') < s.indexOf('后厨') ? 'front_to_back' : 'back_to_front', subRoute: '' };
    }
    if (s.indexOf('师傅') >= 0) return { route: 'master', subRoute: '' };
    if (s.indexOf('主管') >= 0) return { route: 'supervisor', subRoute: '' };
    return { route: '', subRoute: '' };
  };

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setErrMsg(''); setImportDone(0); setParseResult(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { defval: '' });

        // 模糊找列（兼容「学员姓名」「所属区域」等表头写法）
        let areaKey = null, nameKey = null, storeKey = null, empKey = null, routeKey = null, subKey = null, dateKey = null, masterKey = null;
        if (json.length > 0) {
          for (const k of Object.keys(json[0])) {
            const nk = normKey(k);
            if (!areaKey && /账号|所属区域/.test(nk)) areaKey = k;
            else if (!routeKey && /路线/.test(nk)) routeKey = k;
            else if (!subKey && /岗位/.test(nk)) subKey = k;
            else if (!nameKey && /姓名|学员/.test(nk)) nameKey = k;
            else if (!storeKey && /门店/.test(nk)) storeKey = k;
            else if (!empKey && /工号/.test(nk)) empKey = k;
            else if (!dateKey && /日期|入职|开始/.test(nk)) dateKey = k;
            else if (!masterKey && /师傅/.test(nk)) masterKey = k;
          }
        }
        if (!areaKey || !nameKey || !storeKey || !routeKey) {
          setErrMsg('表格缺少必需列（区域账号、学员姓名、门店、带训路线），请用「下载模板」的格式填写');
          return;
        }

        // 已有学员索引（用于查重）
        const existingByName = new Set();
        const existingByEmp = new Map();
        for (const t of existingTrainees) {
          existingByName.add(`${t.area || '000'}|${(t.name || '').trim()}`);
          const emp = String(t.empId || '').trim();
          if (emp) existingByEmp.set(emp, t);
        }

        const seen = new Set();
        const valid = [], invalid = [];
        for (let i = 0; i < json.length; i++) {
          const r = json[i];
          const name = String(r[nameKey] ?? '').trim();
          const rawArea = String(r[areaKey] ?? '').trim();
          const store = String(r[storeKey] ?? '').trim();
          if (!rawArea && !name && !store) continue; // 空行
          if (name.indexOf('示例') >= 0 && name.indexOf('删') >= 0) continue; // 模板示例行
          const line = i + 2; // Excel 实际行号（第1行是表头）
          const area = normArea(rawArea);
          const areaCfg = AREA_MAP[area];
          if (!areaCfg) { invalid.push({ line, name: name || '(空)', area: rawArea, reason: '区域账号不存在（对照模板里的「区域账号对照」sheet）' }); continue; }
          if (!name) { invalid.push({ line, area, name: '(空)', reason: '学员姓名为空' }); continue; }
          if (!store) { invalid.push({ line, area, name, reason: '门店为空' }); continue; }
          const routeRaw = routeKey ? String(r[routeKey] ?? '').trim() : '';
          const subRaw = subKey ? String(r[subKey] ?? '').trim() : '';
          const { route, subRoute } = resolveRoute(routeRaw, subRaw);
          if (!route) { invalid.push({ line, area, name, reason: `带训路线「${routeRaw}」无法识别，只能填：前厅→后厨 / 后厨→前厅 / 兼职 / 师傅带教 / 门店主管` }); continue; }
          const empId = empKey ? String(r[empKey] ?? '').trim() : '';
          if (empId && existingByEmp.has(empId)) {
            const dup = existingByEmp.get(empId);
            invalid.push({ line, area, name, reason: `工号 ${empId} 已被「${dup.name}」使用` }); continue;
          }
          const dupKey = `${area}|${name}`;
          if (existingByName.has(dupKey) || seen.has(dupKey)) {
            invalid.push({ line, area, name, reason: '该区域已存在同名学员，自动跳过' }); continue;
          }
          seen.add(dupKey);
          valid.push({
            area, areaName: (areaCfg.name || '').replace('区域带训追踪系统', ''),
            name, store, empId, route, subRoute,
            startDate: parseImportDate(dateKey ? r[dateKey] : ''),
            master: masterKey ? String(r[masterKey] ?? '').trim() : '',
            routeLabel: route === 'part_time' ? (subRoute === 'back_part_time' ? '兼职·后厨' : '兼职·前厅') : ROUTE_LABELS[route]
          });
        }
        if (valid.length === 0 && invalid.length === 0) {
          setErrMsg('表格里没有识别到任何数据行，请检查内容');
          return;
        }
        setFileName(file.name);
        setParseResult({ valid, invalid, total: valid.length + invalid.length });
      } catch (err) {
        setErrMsg('文件解析失败：' + (err.message || '请确认是 .xlsx / .xls / .csv 文件'));
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  const doImport = () => {
    if (!parseResult || parseResult.valid.length === 0) return;
    const n = onImport(parseResult.valid);
    setImportDone(n);
  };

  return (
    <Modal open={true} onClose={onClose} title="批量导入学员">
      <div className="space-y-4">
        {importDone > 0 ? (
          <div className="text-center py-8 space-y-3">
            <div className="w-14 h-14 mx-auto rounded-full bg-emerald-500/15 border border-emerald-500/40 flex items-center justify-center">
              <Icon.Check width={26} height={26} className="text-emerald-400"/>
            </div>
            <div className="text-lg font-bold text-white">成功导入 {importDone} 名学员</div>
            <p className="text-xs text-gray-500">数据已自动推送到云端，各区域账号刷新后即可看到自己的学员</p>
            <button onClick={onClose}
              className="mt-2 px-6 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition">完成</button>
          </div>
        ) : (
          <>
            <div className="bg-gray-800/50 border border-gray-700 rounded-lg p-3 text-xs text-gray-400 leading-relaxed">
              <p><span className="text-indigo-300 font-medium">①</span> 下载模板，按格式填写（含全部区域账号对照表）</p>
              <p className="mt-1"><span className="text-indigo-300 font-medium">②</span> 上传表格，系统自动校验区域账号、路线、重复学员</p>
              <p className="mt-1"><span className="text-indigo-300 font-medium">③</span> 确认无误后一键导入，自动同步到所有区域</p>
            </div>

            <div className="flex gap-3">
              <button onClick={downloadTemplate}
                className="flex items-center gap-2 px-4 py-2.5 rounded-lg border border-gray-600 text-gray-300 hover:text-white hover:border-gray-400 text-sm font-medium transition">
                <Icon.Download width={15} height={15}/> 下载模板
              </button>
              <label className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition cursor-pointer">
                <Icon.Upload width={15} height={15}/> 选择学员表格
                <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} className="hidden"/>
              </label>
            </div>

            {errMsg && (
              <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300">{errMsg}</div>
            )}

            {parseResult && (
              <div className="border border-gray-700 rounded-lg overflow-hidden">
                <div className="bg-gray-800/70 px-4 py-2.5 text-xs text-gray-400 flex items-center justify-between">
                  <span className="truncate">📄 {fileName}</span>
                  <span>共识别 {parseResult.total} 行</span>
                </div>
                <div className="p-4 space-y-3">
                  <div className="flex items-center gap-4 flex-wrap text-sm">
                    <span className="text-emerald-300">✓ 可导入：{parseResult.valid.length} 人</span>
                    {parseResult.invalid.length > 0 && <span className="text-red-300">✗ 有问题：{parseResult.invalid.length} 行</span>}
                  </div>

                  {parseResult.valid.length > 0 && (
                    <div className="max-h-56 overflow-auto border border-gray-700/60 rounded-lg">
                      <table className="w-full text-xs">
                        <thead className="bg-gray-800/80 sticky top-0">
                          <tr className="text-gray-400 text-left">
                            <th className="px-2 py-1.5">区域</th>
                            <th className="px-2 py-1.5">姓名</th>
                            <th className="px-2 py-1.5">门店</th>
                            <th className="px-2 py-1.5">路线</th>
                            <th className="px-2 py-1.5">师傅</th>
                            <th className="px-2 py-1.5">入职</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-800">
                          {parseResult.valid.map((t, i) => (
                            <tr key={i} className="text-gray-300">
                              <td className="px-2 py-1.5 whitespace-nowrap">{t.areaName}</td>
                              <td className="px-2 py-1.5 whitespace-nowrap text-white">{t.name}</td>
                              <td className="px-2 py-1.5 whitespace-nowrap">{t.store}</td>
                              <td className="px-2 py-1.5 whitespace-nowrap">{t.routeLabel}</td>
                              <td className="px-2 py-1.5 whitespace-nowrap">{t.master || '—'}</td>
                              <td className="px-2 py-1.5 whitespace-nowrap">{t.startDate || '今天'}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {parseResult.invalid.length > 0 && (
                    <div className="max-h-40 overflow-auto bg-red-500/5 border border-red-500/20 rounded-lg p-2 space-y-1">
                      {parseResult.invalid.map((v, i) => (
                        <div key={i} className="text-xs text-red-300/90">
                          第{v.line}行 · {v.name}{v.area ? `（${v.area}）` : ''}：{v.reason}
                        </div>
                      ))}
                    </div>
                  )}

                  <div className="flex justify-end gap-3 pt-1">
                    <button onClick={onClose} className="px-4 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition text-sm">取消</button>
                    <button onClick={doImport} disabled={parseResult.valid.length === 0}
                      className={`px-5 py-2.5 rounded-lg text-sm font-medium transition ${parseResult.valid.length === 0 ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}>
                      导入 {parseResult.valid.length} 名学员
                    </button>
                  </div>
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </Modal>
  );
}

function WorkHoursImportModal({ trainees, onClose, onImported }) {
  const [parseResult, setParseResult] = useState(null); // {rows, matched, unmatched, invalid, total}
  const [importing, setImporting] = useState(false);
  const [importDone, setImportDone] = useState(false);
  const [errMsg, setErrMsg] = useState('');
  const [fileName, setFileName] = useState('');

  const downloadTemplate = () => {
    const ws = XLSX.utils.aoa_to_sheet([
      ['姓名', '工号', '工时'],
      ['张三（示例，可删）', '10086', 120],
      ['李四（示例，可删）', '10087', 96.5]
    ]);
    ws['!cols'] = [{ wch: 22 }, { wch: 14 }, { wch: 10 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '工时表');
    XLSX.writeFile(wb, '工时导入模板.xlsx');
  };

  const normKey = (k) => String(k || '').replace(/[\s:：()（）]/g, '');

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setErrMsg(''); setImportDone(false); setParseResult(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { defval: '' });

        // 找到工号/工时列（兼容"员工工号""累计工时(h)"等表头写法）
        let idKey = null, nameKey = null, hoursKey = null;
        if (json.length > 0) {
          for (const k of Object.keys(json[0])) {
            const nk = normKey(k);
            if (!idKey && /工号|员工号|empid/i.test(nk)) idKey = k;
            else if (!hoursKey && /工时/.test(nk)) hoursKey = k;
            else if (!nameKey && /姓名|名字/.test(nk)) nameKey = k;
          }
        }
        if (!idKey || !hoursKey) {
          setErrMsg('表格里找不到「工号」和「工时」列，请按模板格式填写（表头必须是：姓名、工号、工时）');
          return;
        }

        // 学员工号索引（去重：同工号多行取最后一行）
        const byEmp = new Map(trainees.filter(t => (t.empId || '').trim()).map(t => [String(t.empId).trim(), t]));
        const rowsMap = new Map(); // emp_id -> row（已扣减过往工时）
        const unmatched = [], invalid = [];
        for (const r of json) {
          const empId = String(r[idKey] ?? '').trim();
          const nameRaw = nameKey ? String(r[nameKey] ?? '').trim() : '';
          const hoursRaw = String(r[hoursKey] ?? '').trim();
          if (!empId && !hoursRaw) continue; // 空行跳过
          const hours = parseFloat(hoursRaw);
          if (!empId) { invalid.push({ empId: '(空)', name: nameRaw, hours: hoursRaw, reason: '工号为空' }); continue; }
          if (isNaN(hours) || hours < 0) { invalid.push({ empId, name: nameRaw, hours: hoursRaw, reason: '工时不是有效数字' }); continue; }
          if (!byEmp.has(empId)) { unmatched.push({ empId, name: nameRaw, hours: hoursRaw }); continue; }
          // 该学员若有"过往累计工时"（二次入职/雇佣类型转换），导入时自动扣减，只计本次带训部分
          const trainee = byEmp.get(empId);
          const pastHours = Number(trainee.pastHours) || 0;
          const effHours = pastHours > 0 ? Math.max(0, hours - pastHours) : hours;
          rowsMap.set(empId, { emp_id: empId, hours: effHours, pastHours, origHours: hours, name: trainee.name, updated_at: Date.now() });
        }
        setFileName(file.name);
        setParseResult({
          rows: [...rowsMap.values()],
          matched: rowsMap.size,
          unmatched, invalid,
          total: rowsMap.size + unmatched.length + invalid.length
        });
      } catch (err) {
        setErrMsg('文件解析失败：' + (err.message || '请确认是 .xlsx / .xls / .csv 文件'));
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  const doImport = async () => {
    if (!parseResult || parseResult.rows.length === 0) return;
    setImporting(true); setErrMsg('');
    try {
      // 只保留 work_hours 表合法列（emp_id / hours / updated_at），过滤掉 pastHours/origHours/name 等辅助字段
      const cleanRows = parseResult.rows.map(r => ({ emp_id: r.emp_id, hours: r.hours, updated_at: r.updated_at }));
      await sbUpsertWorkHours(cleanRows);
      setImportDone(true);
      if (onImported) onImported();
    } catch (err) {
      setErrMsg('导入失败：' + (err.message || '请检查网络后重试'));
    } finally {
      setImporting(false);
    }
  };

  return (
    <Modal open={true} onClose={onClose} title="导入工时数据">
      <div className="space-y-4">
        {/* 步骤说明 */}
        <div className="bg-gray-800/50 border border-gray-700 rounded-lg p-3 text-xs text-gray-400 leading-relaxed">
          <p><span className="text-indigo-300 font-medium">①</span> 下载模板，按格式填写（或用你自己的表，表头含 <span className="text-white">姓名、工号、工时</span> 即可，姓名列仅作核对）</p>
          <p className="mt-1"><span className="text-indigo-300 font-medium">②</span> 上传表格，系统按工号自动匹配学员；若该学员档案里填了「过往累计工时」，导入时会<span className="text-sky-300">自动扣减</span>，只计本次带训部分</p>
          <p className="mt-1"><span className="text-indigo-300 font-medium">③</span> 确认无误后导入，工时为<span className="text-white">覆盖更新</span>，导入后全员可见</p>
        </div>

        {/* 操作区 */}
        <div className="flex gap-3">
          <button onClick={downloadTemplate}
            className="flex items-center gap-2 px-4 py-2.5 rounded-lg border border-gray-600 text-gray-300 hover:text-white hover:border-gray-400 text-sm font-medium transition">
            <Icon.Download width={15} height={15}/> 下载模板
          </button>
          <label className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition cursor-pointer">
            <Icon.Upload width={15} height={15}/> 选择工时表格
            <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} className="hidden"/>
          </label>
        </div>

        {errMsg && (
          <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300">{errMsg}</div>
        )}

        {/* 解析结果 */}
        {parseResult && !importDone && (
          <div className="border border-gray-700 rounded-lg overflow-hidden">
            <div className="bg-gray-800/70 px-4 py-2.5 text-xs text-gray-400 flex items-center justify-between">
              <span className="truncate">📄 {fileName}</span>
              <span>共识别 {parseResult.total} 行</span>
            </div>
            <div className="p-4 space-y-3 text-sm">
              <div className="flex items-center gap-4">
                <span className="text-emerald-300">✓ 可导入：{parseResult.matched} 人</span>
                {parseResult.unmatched.length > 0 && <span className="text-amber-300">⚠ 未匹配：{parseResult.unmatched.length} 人</span>}
                {parseResult.invalid.length > 0 && <span className="text-red-300">✗ 格式错误：{parseResult.invalid.length} 行</span>}
              </div>

              {(() => {
                const deducted = parseResult.rows.filter(r => Number(r.pastHours) > 0);
                if (deducted.length === 0) return null;
                return (
                  <div className="bg-sky-500/5 border border-sky-500/20 rounded-lg p-3 text-xs text-sky-300 space-y-1">
                    <p className="font-medium mb-1">⚡ 已自动抵扣过往累计工时（{deducted.length} 人）：</p>
                    <div className="max-h-24 overflow-y-auto scrollbar-thin text-gray-400 space-y-0.5">
                      {deducted.map(r => (
                        <div key={r.emp_id} className="flex justify-between gap-2">
                          <span>{r.name}（工号 {r.emp_id}）</span>
                          <span className="tabular-nums">原 {r.origHours}h − 过往 {r.pastHours}h = <span className="text-emerald-300">{r.hours}h</span></span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })()}

              {parseResult.unmatched.length > 0 && (
                <div className="bg-amber-500/5 border border-amber-500/20 rounded-lg p-3">
                  <p className="text-xs text-amber-300 font-medium mb-2">以下工号在系统里没找到对应学员（已跳过）：</p>
                  <div className="max-h-32 overflow-y-auto scrollbar-thin text-xs text-gray-400 space-y-1">
                    {parseResult.unmatched.map((u, i) => (
                      <div key={i} className="flex justify-between">
                        <span>工号 {u.empId} {u.name && <span className="text-gray-600">（{u.name}）</span>}</span>
                        <span>工时 {u.hours}</span>
                      </div>
                    ))}
                  </div>
                  <p className="text-[11px] text-gray-500 mt-2">提示：可能是工号填错，或该学员档案里没录工号</p>
                </div>
              )}

              {parseResult.invalid.length > 0 && (
                <div className="bg-red-500/5 border border-red-500/20 rounded-lg p-3">
                  <p className="text-xs text-red-300 font-medium mb-2">以下行格式有误（已跳过）：</p>
                  <div className="max-h-24 overflow-y-auto scrollbar-thin text-xs text-gray-400 space-y-1">
                    {parseResult.invalid.map((u, i) => (
                      <div key={i}>工号 {u.empId} — {u.reason}</div>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex justify-end gap-3 pt-1">
                <button onClick={onClose} className="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 text-sm transition">取消</button>
                <button onClick={doImport} disabled={importing || parseResult.matched === 0}
                  className="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium transition">
                  {importing ? '导入中...' : `确认导入 ${parseResult.matched} 人的工时`}
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 导入成功 */}
        {importDone && (
          <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-lg p-4 text-center">
            <p className="text-emerald-300 font-medium">🎉 导入成功！已更新 {parseResult.matched} 名学员的工时</p>
            <p className="text-xs text-gray-400 mt-1">各门店登录后即可看到最新工时数据</p>
            <button onClick={onClose} className="mt-3 px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium transition">完成</button>
          </div>
        )}
      </div>
    </Modal>
  );
}

function SyncModal({ data, syncStatus, lastSyncTime, setLastSyncTime, onClose, onImport, onPull, isRemoteUpdate }) {
  const [status, setStatus] = useState({ type: '', msg: '' });
  const [busy, setBusy] = useState(false);
  const fileInputRef = useRef(null);

  const showStatus = (type, msg) => {
    setStatus({ type, msg });
    setTimeout(() => setStatus({ type: '', msg: '' }), 3000);
  };

  // Export to file (backup)
  const handleExport = () => {
    try {
      const jsonStr = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const date = new Date().toISOString().slice(0, 10);
      a.download = `带训数据_${date}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showStatus('success', '数据已导出为文件');
    } catch(e) {
      showStatus('error', '导出失败：' + e.message);
    }
  };

  // Import from file (backup)
  const handleFileImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setBusy(true);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.trainees || !Array.isArray(parsed.trainees)) {
          showStatus('error', '文件格式不正确');
          setBusy(false);
          return;
        }
        onImport(parsed);
        showStatus('success', `导入成功！已导入 ${parsed.trainees.length} 名学员数据`);
      } catch(err) {
        showStatus('error', '文件解析失败：' + err.message);
      }
      setBusy(false);
      e.target.value = '';
    };
    reader.onerror = () => {
      showStatus('error', '文件读取失败');
      setBusy(false);
    };
    reader.readAsText(file);
  };

  // Force push to cloud
  const handleForceSync = async () => {
    setBusy(true);
    try {
      const ts = Date.now();
      const ok = await sbForcePush(data, ts);
      if (ok) {
        showStatus('success', '数据已推送到云端');
        setLastSyncTime(ts);
      } else {
        showStatus('error', _lastPushErrorMsg || '推送失败，请稍后重试');
      }
    } catch(e) {
      showStatus('error', '推送失败：' + e.message);
    }
    setBusy(false);
  };

  // Force pull from cloud
  const handleForcePull = async () => {
    setBusy(true);
    try {
      const remote = await sbFetchAll();
      if (remote && remote.trainees && remote.trainees.length > 0) {
        isRemoteUpdate.current = true;
        if (typeof onPull === 'function') {
          onPull(remote.trainees, remote._deletedIds || []);
        }
        showStatus('success', `已从云端拉取 ${remote.trainees.length} 名学员数据`);
      } else {
        showStatus('success', '当前已是最新数据，无需更新');
      }
      setLastSyncTime(Date.now());
    } catch(e) {
      showStatus('error', '拉取失败：' + e.message);
    }
    setBusy(false);
  };

  const statusConfig = {
    connected: { color: 'bg-emerald-400', text: '已连接', textColor: 'text-emerald-300', bgColor: 'bg-emerald-500/10', borderColor: 'border-emerald-500/20' },
    connecting: { color: 'bg-amber-400', text: '连接中...', textColor: 'text-amber-300', bgColor: 'bg-amber-500/10', borderColor: 'border-amber-500/20' },
    error: { color: 'bg-red-400', text: '连接失败', textColor: 'text-red-300', bgColor: 'bg-red-500/10', borderColor: 'border-red-500/20' },
  };
  const sc = statusConfig[syncStatus] || statusConfig.connecting;

  const lastSyncText = lastSyncTime
    ? new Date(lastSyncTime).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    : '等待同步...';

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className="bg-gray-900 border border-gray-700 rounded-2xl w-[480px] max-w-[92vw] max-h-[88vh] overflow-y-auto scrollbar-thin shadow-2xl fade-in">
        {/* Header */}
        <div className="flex items-center justify-between px-5 py-4 border-b border-gray-800">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl bg-indigo-500/15 flex items-center justify-center">
              <Icon.Cloud width={18} height={18} className="text-indigo-400"/>
            </div>
            <div>
              <h3 className="text-base font-bold text-white">实时数据同步</h3>
              <p className="text-xs text-gray-500">所有打开此网页的用户自动同步</p>
            </div>
          </div>
          <button onClick={onClose} className="text-gray-500 hover:text-white transition p-1">
            <Icon.Close width={18} height={18}/>
          </button>
        </div>

        {/* Status */}
        {status.msg && (
          <div className={`mx-5 mt-3 px-4 py-2.5 rounded-lg text-sm flex items-center gap-2 ${
            status.type === 'success' ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-red-500/10 text-red-300 border border-red-500/20'
          }`}>
            {status.type === 'success' ? <Icon.Check width={14} height={14}/> : <Icon.Close width={14} height={14}/>}
            {status.msg}
          </div>
        )}

        <div className="p-5 space-y-5">
          {/* Sync Status Card */}
          <div className={`rounded-xl p-4 border ${sc.bgColor} ${sc.borderColor}`}>
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2.5">
                <span className={`w-3 h-3 rounded-full ${sc.color} ${syncStatus === 'connecting' ? 'animate-pulse' : ''}`}></span>
                <span className={`text-sm font-medium ${sc.textColor}`}>{sc.text}</span>
              </div>
              <span className="text-xs text-gray-500">{data.trainees.length} 名学员</span>
            </div>
            <div className="text-xs text-gray-500">
              上次同步：{lastSyncText}
            </div>
          </div>

          {/* Feature List */}
          <div className="space-y-2.5">
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>店长打勾后，数据<span className="text-emerald-300">自动上传</span>到云端</span>
            </div>
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>老大这边<span className="text-emerald-300">自动刷新</span>看到最新数据</span>
            </div>
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>无需手动操作，打开网页即<span className="text-emerald-300">自动同步</span></span>
            </div>
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>每个学员数据<span className="text-emerald-300">独立合并</span>，不会互相覆盖</span>
            </div>
          </div>

          {/* Force Sync Buttons */}
          <div className="flex gap-2">
            <button
              onClick={handleForcePull}
              disabled={busy}
              className="flex-1 py-2.5 rounded-lg text-sm font-medium text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 disabled:opacity-50 transition flex items-center justify-center gap-2"
            >
              <Icon.Download width={14} height={14}/> 从云端拉取
            </button>
            <button
              onClick={handleForceSync}
              disabled={busy || syncStatus !== 'connected'}
              className="flex-1 py-2.5 rounded-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 transition flex items-center justify-center gap-2"
            >
              <Icon.RefreshCw width={14} height={14}/> 推送到云端
            </button>
          </div>

          {/* Divider */}
          <div className="border-t border-gray-800"></div>

          {/* File Backup */}
          <div>
            <div className="flex items-center gap-2 mb-2">
              <Icon.Download width={14} height={14} className="text-amber-400"/>
              <h4 className="text-sm font-semibold text-white">文件备份</h4>
            </div>
            <p className="text-xs text-gray-500 mb-3">导出数据文件作为备份，或从备份恢复</p>
            <div className="flex gap-2">
              <button
                onClick={handleExport}
                className="flex-1 py-2.5 rounded-lg text-xs font-medium text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 transition flex items-center justify-center gap-1.5"
              >
                <Icon.Download width={12} height={12}/> 导出备份
              </button>
              <button
                onClick={() => fileInputRef.current?.click()}
                disabled={busy}
                className="flex-1 py-2.5 rounded-lg text-xs font-medium text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 transition flex items-center justify-center gap-1.5"
              >
                <Icon.Upload width={12} height={12}/> 导入恢复
              </button>
              <input
                ref={fileInputRef}
                type="file"
                accept=".json,application/json"
                onChange={handleFileImport}
                className="hidden"
              />
            </div>
          </div>

          {/* Info */}
          <div className="bg-gray-800/50 rounded-lg p-3 text-xs text-gray-500 leading-relaxed">
            <p className="text-gray-400 font-medium mb-1">使用说明</p>
            <p>1. 所有打开此网页的用户自动进入同一个同步房间</p>
            <p>2. 任何人修改数据后，自动推送云端，其他人2秒内收到</p>
            <p>3. 推送前自动合并云端数据，不会覆盖别人的修改</p>
            <p>4. 如果同步不及时，点击「从云端拉取」手动刷新</p>
          </div>
        </div>
      </div>
    </div>
  );
}
