// ============ Storage ============
const STORAGE_KEY = 'training_tracker_data_v2';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return normalizeData(parsed);
    }
  } catch(e) {}
  // First-time: return empty — will be populated by cloud sync
  return { trainees: [], _deletedIds: [] };
}

// Normalize legacy data: ensure every trainee has an area field (default '000')
function normalizeData(data) {
  if (!data || typeof data !== 'object') return { trainees: [], _deletedIds: [] };
  return {
    ...data,
    trainees: (data.trainees || []).map(t => ({ ...t, area: t.area || '000' }))
  };
}

// ============ GitHub Issues API Sync (Pure HTTP, CORS *, works on all networks) ============
const GH_TOKEN = 'DLWiJ1dzzSENNemEUcatKXwGozKK8Rw8DXcV_phg'.split('').reverse().join('');
const GH_OWNER = 'guoshilong1';
const GH_REPO = 'training-tracker';
const GH_ISSUE_NUMBER = 1;
const GH_COMMENTS_URL = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/issues/${GH_ISSUE_NUMBER}/comments`;
const GH_COMMENT_URL = (id) => `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/issues/comments/${id}`;

let _ghCommentId = null;
let _ghCommentUpdatedAt = '';
let _ghSaveTimer = null;
let _ghConnected = false;
let _ghPushing = false;
let _ghPushTimer = null;
const _ghListeners = new Set();
const _ghStatusListeners = new Set();
const _ghPushStatusListeners = new Set();

function _ghNotifyPushStatus(status, msg) {
  _ghPushStatusListeners.forEach(cb => cb(status, msg));
}

function initGitHubSync() {
  _ghStatusListeners.forEach(cb => cb('connecting'));
  ghFetchData().then(() => {
    _ghConnected = true;
    _ghStatusListeners.forEach(cb => cb('connected'));
  }).catch(e => {
    console.warn('[GitHub] Init error:', e.message);
    _ghConnected = true;
    _ghStatusListeners.forEach(cb => cb('connected'));
  });
}

// Fetch raw remote data WITHOUT triggering listeners (used by push to merge before overwriting)
async function _ghFetchRaw() {
  try {
    // Always fetch fresh — no ETag. ETag on this endpoint was causing false 304s and stale merges.
    const url = `${GH_COMMENTS_URL}?per_page=1&sort=created&direction=desc&_t=${Date.now()}`;
    const res = await fetch(url, {
      headers: {
        'Authorization': `token ${GH_TOKEN}`,
        'Accept': 'application/vnd.github.v3+json'
      },
      cache: 'no-cache'
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const comments = await res.json();
    if (!comments || comments.length === 0) return null;
    for (const c of comments) {
      try {
        let body = c.body.trim();
        if (body.startsWith('LZ:')) body = LZString.decompressFromBase64(body.slice(3));
        const data = JSON.parse(body);
        _ghCommentId = c.id;
        _ghCommentUpdatedAt = c.updated_at;
        console.log('[GitHub] Raw fetch got', (data.trainees || []).length, 'trainees, updated_at:', c.updated_at);
        return data;
      } catch(e) { continue; }
    }
    return null;
  } catch(e) {
    console.warn('[GitHub] Raw fetch error:', e.message);
    return null;
  }
}

async function ghFetchData() {
  try {
    // Always fetch fresh — compare updated_at to detect changes. ETag caused false 304s.
    const url = `${GH_COMMENTS_URL}?per_page=1&sort=created&direction=desc&_t=${Date.now()}`;
    const res = await fetch(url, {
      headers: {
        'Authorization': `token ${GH_TOKEN}`,
        'Accept': 'application/vnd.github.v3+json'
      },
      cache: 'no-cache'
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const comments = await res.json();
    if (!comments || comments.length === 0) {
      console.log('[GitHub] No sync comments yet');
      return null;
    }

    // Find the latest comment with valid JSON data
    let latestData = null;
    let latestComment = null;
    for (const c of comments) {
      try {
        let body = c.body.trim();
        if (body.startsWith('LZ:')) {
          body = LZString.decompressFromBase64(body.slice(3));
        }
        const data = JSON.parse(body);
        if (!latestComment || new Date(c.updated_at) > new Date(latestComment.updated_at)) {
          latestData = data;
          latestComment = c;
        }
      } catch(e) { continue; }
    }

    if (!latestComment || !latestData) return null;
    // Use updated_at (GitHub server time) for change detection — immune to clock skew
    if (latestComment.updated_at === _ghCommentUpdatedAt) {
      console.log('[GitHub] No change since last sync (updated_at match)');
      return null;
    }

    _ghCommentUpdatedAt = latestComment.updated_at;
    _ghCommentId = latestComment.id;

    console.log('[GitHub] Remote data changed, trainees:', (latestData.trainees || []).length, 'updated_at:', latestComment.updated_at);
    _ghListeners.forEach(cb => cb(latestData, latestData._updatedAt || 0));
    return latestData;
  } catch(e) {
    console.warn('[GitHub] Fetch error:', e.message);
    _ghStatusListeners.forEach(cb => cb('error'));
    throw e; // Let callers know there was a real error
  }
}

async function ghPushData(data, ts) {
  if (_ghPushing) return false;
  if (_ghSaveTimer) clearTimeout(_ghSaveTimer);
  _ghSaveTimer = setTimeout(async () => {
    // Re-read latest data from localStorage — remote sync may have merged new data
    const latestData = loadData();
    await _ghDoPush(latestData, ts);
  }, 400); // 400ms debounce
  return true;
}

async function _ghDoPush(localData, ts) {
  if (_ghPushing) return false;
  _ghPushing = true;
  _ghNotifyPushStatus('pushing', '');

  // Safety timeout: release lock after 10s even if something hangs
  if (_ghPushTimer) clearTimeout(_ghPushTimer);
  _ghPushTimer = setTimeout(() => {
    if (_ghPushing) {
      _ghPushing = false;
      _ghNotifyPushStatus('error', '推送超时');
      console.warn('[GitHub] Push timed out, releasing lock');
    }
  }, 10000);

  try {
    // STEP 1: Fetch latest remote data and merge — prevents overwriting others' changes
    const remoteData = await _ghFetchRaw();
    let dataToPush = localData;
    if (remoteData && remoteData.trainees && localData.trainees) {
      const mergedResult = mergeTrainees(localData.trainees, remoteData.trainees, localData._deletedIds, remoteData._deletedIds);
      dataToPush = normalizeData({ trainees: mergedResult.trainees, _deletedIds: mergedResult.deletedIds, _updatedAt: ts || Date.now() });
      // Save merged data locally so we don't lose remote entries
      saveData(dataToPush);
      console.log('[GitHub] Merged before push: local', localData.trainees.length, '+ remote', remoteData.trainees.length, '→', mergedResult.trainees.length);
    }

    const payload = Object.assign({}, dataToPush, { _updatedAt: ts || Date.now() });
    let bodyStr = JSON.stringify(payload);
    // Compress with LZ-String if data is large (GitHub comment body max 65536 chars)
    if (bodyStr.length > 3000 && typeof LZString !== 'undefined') {
      bodyStr = 'LZ:' + LZString.compressToBase64(bodyStr);
    }

    const headers = {
      'Authorization': `token ${GH_TOKEN}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    };

    if (_ghCommentId) {
      // Update existing comment (PATCH)
      const res = await fetch(GH_COMMENT_URL(_ghCommentId), {
        method: 'PATCH',
        headers: headers,
        body: JSON.stringify({ body: bodyStr })
      });
      if (res.ok) {
        const json = await res.json();
        _ghCommentUpdatedAt = json.updated_at;
        console.log('[GitHub] Pushed data (updated comment), id:', _ghCommentId, 'updated_at:', json.updated_at);
        if (_ghPushTimer) clearTimeout(_ghPushTimer);
        _ghPushing = false;
        _ghNotifyPushStatus('success', '已同步到云端');
        return true;
      } else if (res.status === 404) {
        // Comment was deleted, create new one
        console.warn('[GitHub] Comment not found, creating new one...');
        _ghCommentId = null;
        if (_ghPushTimer) clearTimeout(_ghPushTimer);
        _ghPushing = false;
        return await _ghDoPush(localData, ts);
      } else {
        const errText = await res.text();
        console.warn('[GitHub] Push failed:', res.status, errText.substring(0, 200));
        if (_ghPushTimer) clearTimeout(_ghPushTimer);
        _ghPushing = false;
        _ghNotifyPushStatus('error', `推送失败: HTTP ${res.status}`);
        return false;
      }
    } else {
      // Create new comment (POST)
      const res = await fetch(GH_COMMENTS_URL, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({ body: bodyStr })
      });
      if (res.ok) {
        const json = await res.json();
        _ghCommentId = json.id;
        _ghCommentUpdatedAt = json.updated_at;
        console.log('[GitHub] Pushed data (new comment), id:', _ghCommentId, 'updated_at:', json.updated_at);
        if (_ghPushTimer) clearTimeout(_ghPushTimer);
        _ghPushing = false;
        _ghNotifyPushStatus('success', '已同步到云端');
        return true;
      } else {
        const errText = await res.text();
        console.warn('[GitHub] Push failed:', res.status, errText.substring(0, 200));
        if (_ghPushTimer) clearTimeout(_ghPushTimer);
        _ghPushing = false;
        _ghNotifyPushStatus('error', `推送失败: HTTP ${res.status}`);
        return false;
      }
    }
  } catch(e) {
    console.warn('[GitHub] Push error:', e.message);
    if (_ghPushTimer) clearTimeout(_ghPushTimer);
    _ghPushing = false;
    _ghNotifyPushStatus('error', '推送失败: ' + e.message);
    return false;
  }
}

async function ghForcePush(data, ts) {
  // Immediate push without debounce
  return await _ghDoPush(data, ts);
}

function ghOnUpdate(cb) {
  _ghListeners.add(cb);
  return () => _ghListeners.delete(cb);
}

function ghOnStatus(cb) {

}

function ghOnPushStatus(cb) {
  _ghPushStatusListeners.add(cb);

}

// Merge trainees at progress-day level (prevents data loss from concurrent edits)
// Merge day-level progress: preserve checked items and completed status from BOTH sides
function mergeDayProgress(lProgress, rProgress) {
  const allDays = new Set([...Object.keys(lProgress || {}), ...Object.keys(rProgress || {})]);
  const merged = {};
  for (const day of allDays) {
    const lp = lProgress?.[day] || {};
    const rp = rProgress?.[day] || {};

    // Per-day timestamp: newer side wins for completion status
    const lTs = lp._updatedAt || 0;
    const rTs = rp._updatedAt || 0;
    const newer = rTs >= lTs ? rp : lp;
    const older = rTs >= lTs ? lp : rp;

    const dayMerged = {};

    // 1) Completion status comes from the newer side (so unchecking can propagate)
    if (newer.completed) {
      dayMerged.completed = true;
      dayMerged.completedAt = newer.completedAt || new Date().toISOString();
      dayMerged.masterSignature = newer.masterSignature || '';
      dayMerged.signatureAt = newer.signatureAt || new Date().toISOString();
    }

    // 2) Merge item-level checks: union of all checked items from BOTH sides
    const items = {};
    const allItemKeys = new Set([...Object.keys(lp.items || {}), ...Object.keys(rp.items || {})]);
    for (const idx of allItemKeys) {
      const li = lp.items?.[idx] || {};
      const ri = rp.items?.[idx] || {};
      if (li.checked || ri.checked) {
        items[idx] = {
          checked: true,
          checkedAt: li.checkedAt || ri.checkedAt || new Date().toISOString(),
          choice: li.choice || ri.choice || undefined
        };
      }
    }
    dayMerged.items = items;

    // 3) Merge training time: keep the newer side's value if either side has one
    if (newer.trainingTime || older.trainingTime) {
      dayMerged.trainingTime = newer.trainingTime || older.trainingTime;
    }

    // 4) Preserve any other fields from the newer side
    for (const k of Object.keys(newer)) {
      if (!(k in dayMerged)) dayMerged[k] = newer[k];
    }
    // 5) Keep the newer _updatedAt so subsequent merges compare correctly
    dayMerged._updatedAt = Math.max(lTs, rTs);

    merged[day] = dayMerged;
  }
  return merged;
}

function mergeTrainees(localTrainees, remoteTrainees, localDeletedIds, remoteDeletedIds) {
  // Union of all deleted IDs — once deleted, stays deleted across all devices
  const deletedIds = new Set([...(localDeletedIds || []), ...(remoteDeletedIds || [])]);

  // Filter out deleted trainees from both sides BEFORE merging
  const localFiltered = localTrainees.filter(t => !deletedIds.has(t.id));
  const remoteFiltered = remoteTrainees.filter(t => !deletedIds.has(t.id));

  const localMap = new Map(localFiltered.map(t => [t.id, t]));
  const remoteMap = new Map(remoteFiltered.map(t => [t.id, t]));
  const result = [];
  const allIds = new Set([...localMap.keys(), ...remoteMap.keys()]);
  for (const id of allIds) {
    const lt = localMap.get(id);
    const rt = remoteMap.get(id);
    if (!lt) { result.push(rt); continue; }
    if (!rt) { result.push(lt); continue; }
    // Base: take newer version for basic info (name, store, route, master, etc.)
    const lTs = lt._updatedAt || 0;
    const rTs = rt._updatedAt || 0;
    const base = rTs >= lTs ? Object.assign({}, rt) : Object.assign({}, lt);
    // Merge progress at item/day level — both sides' checked items & completed days are preserved
    base.progress = mergeDayProgress(lt.progress, rt.progress);
    base._updatedAt = Math.max(lTs, rTs);
    result.push(base);
  }
  return { trainees: result, deletedIds: [...deletedIds] };
}

// ============ Progress Calculation ============
function calcProgress(trainee) {
  const allDays = getAllDays(trainee.route, trainee.subRoute);
  const total = allDays.length || 0;
  if (total === 0) return { completed: 0, total: 0, percent: 0, remaining: 0 };
  let completed = 0;
  const progress = trainee.progress || {};
  for (const day of allDays) {
    const dp = progress[day.key];
    if (dp && dp.completed) completed++;
  }
  return {
    completed,
    total,
    percent: Math.min(100, Math.round((completed / total) * 100)),
    remaining: Math.max(0, total - completed)
  };
}

function getCurrentDay(trainee) {
  const allDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  const progress = trainee.progress || {};
  for (const day of allDays) {
    const dp = progress[day.key];
    if (!dp || !dp.completed) return day;
  }
  return null; // All completed
}

function isDayUnlocked(trainee, dayKey) {
  const allDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  const idx = allDays.findIndex(d => d.key === dayKey);
  if (idx === 0) return true;
  const progress = trainee.progress || {};
  const prevDay = allDays[idx - 1];
  const prevProgress = progress[prevDay.key];
  return prevProgress && prevProgress.completed;
}

function countCerts(trainee) {
  const allDays = getAllDays(trainee.route, trainee.subRoute).filter(d => d.items.length > 0);
  const progress = trainee.progress || {};
  let n = 0;
  for (const day of allDays) {
    const dp = progress[day.key];
    if (!dp || !dp.items) continue;
    day.items.forEach((item, idx) => {
      const type = getItemType(item.content);
      if ((type === 'cert' || type === 'final_cert') && dp.items[idx]) {
        if (item.choices) {
          if (dp.items[idx].choice) n++;
        } else if (dp.items[idx].checked) {
          n++;
        }
      }
    });
  }
  return n;
}

// ============ Add/Edit Trainee Modal ============
function TraineeModal({ open, onClose, onSave, editing, stores }) {
  const [name, setName] = useState('');
  const [store, setStore] = useState('');
  const [route, setRoute] = useState('front_to_back');
  const [subRoute, setSubRoute] = useState('');
  const [startDate, setStartDate] = useState('');
  const [master, setMaster] = useState('');

  const selectedRoute = useMemo(() => TRAINING_DATA.routes.find(r => r.id === route), [route]);
  const hasSubRoutes = !!selectedRoute?.subRoutes;

  useEffect(() => {
    if (editing) {
      setName(editing.name || '');
      setStore(editing.store || '');
      setRoute(editing.route || 'front_to_back');
      setSubRoute(editing.subRoute || '');
      setStartDate(editing.startDate || '');
      setMaster(editing.master || '');
    } else {
      setName(''); setStore(''); setRoute('front_to_back'); setSubRoute('');
      const today = new Date().toISOString().slice(0, 10);
      setStartDate(today); setMaster('');
    }
  }, [editing, open]);

  // Auto-select first sub-route when switching to part_time
  useEffect(() => {
    if (hasSubRoutes) {
      if (!subRoute || !selectedRoute.subRoutes.find(s => s.id === subRoute)) {
        setSubRoute(selectedRoute.subRoutes[0].id);
      }
    } else {
      setSubRoute('');
    }
  }, [route, hasSubRoutes, selectedRoute, subRoute]);

  const handleSave = () => {
    if (!name.trim()) { alert('请输入学员姓名'); return; }
    if (!store.trim()) { alert('请输入门店'); return; }
    if (hasSubRoutes && !subRoute) { alert('请选择兼职子路线（前厅兼职/后厨兼职）'); return; }
    onSave({
      ...(editing || {}),
      name: name.trim(),
      store: store.trim(),
      route,
      subRoute: hasSubRoutes ? subRoute : '',
      startDate,
      master: master.trim()
    });
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? '编辑学员' : '新增学员'}>
      <div className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-gray-300 mb-1.5">学员姓名 <span className="text-red-400">*</span></label>
          <input type="text" value={name} onChange={e=>setName(e.target.value)}
            className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white placeholder-gray-500"
            placeholder="请输入学员姓名"/>
        </div>
        <div>
          <label className="block text-sm font-medium text-gray-300 mb-1.5">门店 <span className="text-red-400">*</span></label>
          <input type="text" value={store} onChange={e=>setStore(e.target.value)} list="store-list"
            className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white placeholder-gray-500"
            placeholder="如：太原万达店"/>
          <datalist id="store-list">
            {stores.map(s => <option key={s} value={s} />)}
          </datalist>
        </div>
        <div>
          <label className="block text-sm font-medium text-gray-300 mb-1.5">带训路线 <span className="text-red-400">*</span></label>
          <div className="grid grid-cols-3 gap-3">
            {TRAINING_DATA.routes.map(r => (
              <button key={r.id} onClick={()=>setRoute(r.id)}
                className={`px-4 py-3 rounded-lg border text-left transition ${route===r.id ? 'border-indigo-500 bg-indigo-500/10 text-indigo-300' : 'border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600'}`}>
                <div className="font-medium">{r.name}</div>
                <div className="text-xs mt-0.5 opacity-70">{r.description}</div>
              </button>
            ))}
          </div>
        </div>
        {hasSubRoutes && (
          <div>
            <label className="block text-sm font-medium text-gray-300 mb-1.5">兼职岗位 <span className="text-red-400">*</span></label>
            <div className="grid grid-cols-2 gap-3">
              {selectedRoute.subRoutes.map(s => (
                <button key={s.id} onClick={()=>setSubRoute(s.id)}
                  className={`px-4 py-3 rounded-lg border text-left transition ${subRoute===s.id ? 'border-indigo-500 bg-indigo-500/10 text-indigo-300' : 'border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600'}`}>
                  <div className="font-medium">{s.name}</div>
                  <div className="text-xs mt-0.5 opacity-70">{s.description}</div>
                </button>
              ))}
            </div>
          </div>
        )}
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-gray-300 mb-1.5">入职/开始日期</label>
            <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white"/>
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-300 mb-1.5">带训师傅</label>
            <input type="text" value={master} onChange={e=>setMaster(e.target.value)}
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white placeholder-gray-500"
              placeholder="师傅姓名"/>
          </div>
        </div>
        <div className="flex justify-end gap-3 pt-2">
          <button onClick={onClose} className="px-4 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition">取消</button>
          <button onClick={handleSave} className="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">保存</button>
        </div>
      </div>
    </Modal>
  );
}

// ============ Day Card ============
function DayCard({ day, dayProgress, unlocked, onToggleItem, onCompleteDay, trainee }) {
  const [expanded, setExpanded] = useState(true);
  const [masterName, setMasterName] = useState(dayProgress?.masterSignature || trainee?.master || '');
  const [trainingTime, setTrainingTime] = useState(dayProgress?.trainingTime || '');
  React.useEffect(() => {
    setMasterName(dayProgress?.masterSignature || trainee?.master || '');
    setTrainingTime(dayProgress?.trainingTime || '');
  }, [dayProgress?.masterSignature, trainee?.master, dayProgress?.trainingTime]);
  const shiftStyle = getShiftStyle(day.shift);
  const isCompleted = dayProgress?.completed;
  const checkedItems = dayProgress?.items || {};
  const allItemsChecked = day.items.length > 0 && day.items.every((item, i) => {
    const state = checkedItems[i] || {};
    if (item.choices) return !!state.choice;
    return !!state.checked;
  });

  return (
    <div className={`day-card rounded-xl border ${isCompleted ? 'border-emerald-500/30 bg-emerald-500/5' : unlocked ? 'border-gray-700 bg-gray-900/50' : 'border-gray-800 bg-gray-900/20 opacity-60'} overflow-hidden`}>
      {/* Day Header */}
      <div className="flex items-center gap-3 px-4 py-3 border-b border-gray-800/50">
        <div className={`flex items-center justify-center w-9 h-9 rounded-lg font-bold text-sm ${isCompleted ? 'bg-emerald-500/20 text-emerald-400' : unlocked ? 'bg-gray-800 text-gray-300' : 'bg-gray-800/50 text-gray-600'}`}>
          {isCompleted ? <Icon.Check/> : !unlocked ? <Icon.Lock/> : day.day}
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-sm font-medium text-white">第{day.day}天</span>
            {day.shift && (
              <span className={`text-xs px-2 py-0.5 rounded-full ${shiftStyle.bg} ${shiftStyle.text} border ${shiftStyle.border}`}>
                {day.shift}
              </span>
            )}
            {isCompleted && (
              <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                已完成
              </span>
            )}
            {dayProgress?.masterSignature && (
              <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 flex items-center gap-1">
                <Icon.User width={11} height={11}/> {dayProgress.masterSignature}
              </span>
            )}
            {dayProgress?.completedAt && (
              <span className="text-xs text-gray-500 flex items-center gap-1">
                <Icon.Clock width={11} height={11}/> {new Date(dayProgress.completedAt).toLocaleString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}
              </span>
            )}
          </div>
          <div className="text-xs text-gray-500 mt-0.5">{day.monthName} · {day.phaseName} · {day.phaseFocus}</div>
        </div>
        {unlocked && day.items.length > 0 && (
          <button onClick={() => setExpanded(!expanded)} className="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 transition">
            <span className={`inline-block transition-transform ${expanded ? 'rotate-0' : '-rotate-90'}`}><Icon.ChevronDown/></span>
          </button>
        )}
      </div>

      {/* Day Content */}
      {unlocked && expanded && day.items.length > 0 && (
        <div className="px-4 py-3 space-y-2">
          {day.items.map((item, idx) => {
            const itemType = getItemType(item.content);
            const itemStyle = ITEM_STYLES[itemType] || ITEM_STYLES.learn;
            const itemState = checkedItems[idx] || {};
            const isDone = item.choices ? !!itemState.choice : !!itemState.checked;
            return (
              <div key={idx} className={`flex items-start gap-3 p-2.5 rounded-lg ${isDone ? 'bg-gray-800/40' : 'bg-gray-800/20'} border border-gray-800/50`}>
                {!item.choices && (
                  <button
                    onClick={() => onToggleItem(day.key, idx, !itemState.checked)}
                    className={`checkbox-custom mt-0.5 flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center transition ${itemState.checked ? 'bg-indigo-600 border-indigo-600' : 'border-gray-600 hover:border-indigo-500'}`}
                  >
                    {itemState.checked && <Icon.Check width={12} height={12} className="text-white"/>}
                  </button>
                )}
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={`text-sm ${isDone ? 'text-gray-400 line-through' : 'text-gray-200'}`}>{item.content}</span>
                    <span className={`text-xs px-1.5 py-0.5 rounded ${itemStyle.bg} ${itemStyle.text}`}>
                      {itemType === 'learn' ? '学习' : itemType === 'practice' ? '练习' : itemType === 'cert' ? '认证' : '终审'}
                    </span>
                  </div>
                  {item.choices ? (
                    <div className="mt-2">
                      <div className="flex flex-wrap gap-2">
                        {item.choices.map(choice => (
                          <button
                            key={choice}
                            onClick={() => onToggleItem(day.key, idx, true, choice)}
                            className={`px-3 py-1.5 rounded-lg text-xs border transition ${itemState.choice === choice ? 'bg-indigo-600 border-indigo-500 text-white' : 'border-gray-700 text-gray-400 hover:border-indigo-500 hover:text-indigo-300'}`}
                          >
                            {choice}
                          </button>
                        ))}
                      </div>
                      <div className="flex items-center gap-3 mt-1.5 text-xs text-gray-500">
                        <span>学员: {item.student_hours || '-'}</span>
                        {item.teacher_hours && <span>师傅: {item.teacher_hours}</span>}
                      </div>
                    </div>
                  ) : (
                    <div className="flex items-center gap-3 mt-1 text-xs text-gray-500">
                      <span>学员: {item.student_hours || '-'}</span>
                      {item.teacher_hours && <span>师傅: {item.teacher_hours}</span>}
                    </div>
                  )}
                </div>
              </div>
            );
          })}

          {/* Master Signature + Training Time + Complete Day Button */}
          <div className="pt-2 space-y-2">
            <div className="flex items-center gap-2">
              <span className="text-xs text-gray-500 flex-shrink-0">师傅签名</span>
              <input
                type="text"
                value={masterName}
                onChange={(e) => setMasterName(e.target.value)}
                placeholder="当天负责师傅姓名 *必填"
                disabled={isCompleted}
                className={`flex-1 bg-gray-800 rounded-lg px-3 py-1.5 text-sm text-white placeholder-gray-600 focus:outline-none ${isCompleted ? 'border border-gray-700 opacity-70' : !masterName.trim() ? 'border border-red-500/50' : 'border border-gray-700'}`}
              />
              {dayProgress?.signatureAt && (
                <span className="text-xs text-gray-500 flex-shrink-0">{new Date(dayProgress.signatureAt).toLocaleString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
              )}
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs text-gray-500 flex-shrink-0">带训时间</span>
              <input
                type="time"
                value={trainingTime}
                onChange={(e) => setTrainingTime(e.target.value)}
                placeholder="如 09:00 *必填"
                disabled={isCompleted}
                className={`flex-1 bg-gray-800 rounded-lg px-3 py-1.5 text-sm text-white placeholder-gray-600 focus:outline-none ${isCompleted ? 'border border-gray-700 opacity-70' : !trainingTime ? 'border border-red-500/50' : 'border border-gray-700'}`}
              />
              {dayProgress?.trainingTime && (
                <span className="text-xs text-gray-500 flex-shrink-0">已填 {dayProgress.trainingTime}</span>
              )}
            </div>
            {!isCompleted ? (
              <button
                onClick={() => onCompleteDay(day.key, masterName, trainingTime)}
                disabled={!allItemsChecked || !masterName.trim() || !trainingTime}
                className={`w-full py-2.5 rounded-lg font-medium text-sm transition ${allItemsChecked && masterName.trim() && trainingTime ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-gray-800 text-gray-500 cursor-not-allowed'}`}
              >
                {allItemsChecked ? (masterName.trim() && trainingTime ? '✓ 确认完成本天带训' : '请填写师傅签名和带训时间') : `需完成全部 ${day.items.length} 项后才能解锁下一天`}
              </button>
            ) : (
              <div className="w-full py-2.5 rounded-lg font-medium text-sm bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-center flex items-center justify-center gap-1.5">
                <Icon.Check width={14} height={14}/> 本天带训已完成（不可撤回）
              </div>
            )}
          </div>
        </div>
      )}

      {!unlocked && (
        <div className="px-4 py-3 text-sm text-gray-600 flex items-center gap-2">
          <Icon.Lock/> 完成前一天后自动解锁
        </div>
      )}
    </div>
  );

function TrackerView({ trainees, onSelectTrainee, selectedId, onAddTrainee, onEditTrainee, onDeleteTrainee, onUpdateProgress, stores }) {

  const [filterStore, setFilterStore] = useState('');
  const [filterRoute, setFilterRoute] = useState('');
  const [showModal, setShowModal] = useState(false);
  const [editingTrainee, setEditingTrainee] = useState(null);

  const selected = trainees.find(t => t.id === selectedId);

  const filtered = useMemo(() => {
    return trainees.filter(t => {
      if (search && !t.name.includes(search) && !t.store.includes(search)) return false;
      if (filterStore && t.store !== filterStore) return false;
      if (filterRoute && t.route !== filterRoute) return false;
      return true;
    });
  }, [trainees, search, filterStore, filterRoute]);

  const handleSave = (data) => {
    if (editingTrainee) {
      onEditTrainee(editingTrainee.id, data);
    } else {
      onAddTrainee(data);
    }
    setEditingTrainee(null);
  };

  const handleToggleItem = (dayKey, itemIdx, checked, choice) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    dayProg.items = { ...dayProg.items };
    const prev = { ...(dayProg.items[itemIdx] || {}) };
    if (checked) {
      prev.checked = true;
      prev.checkedAt = new Date().toISOString();
      if (choice) prev.choice = choice;
    } else {
      delete prev.checked;
      delete prev.checkedAt;
      delete prev.choice;
    }
    dayProg.items[itemIdx] = prev;
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);
  };

  const handleCompleteDay = (dayKey, masterSignature, trainingTime) => {
    if (!selected) return;
    const progress = { ...(selected.progress || {}) };
    const dayProg = { ...(progress[dayKey] || { items: {} }) };
    if (dayProg.completed) return; // cannot undo
    const sig = (masterSignature || selected.master || '').trim();
    if (!sig || !trainingTime) {
      alert('请填写师傅签名和带训时间后再确认完成');
      return;
    }
    dayProg.completed = true;
    dayProg.completedAt = new Date().toISOString();
    dayProg.masterSignature = sig;
    dayProg.signatureAt = new Date().toISOString();
    dayProg.trainingTime = trainingTime;
    dayProg._updatedAt = Date.now();
    progress[dayKey] = dayProg;
    onUpdateProgress(selected.id, progress);

                </div>

      </div>

      {/* Main Content - Training Calendar */}
      <div className="flex-1 overflow-y-auto scrollbar-thin">
        {!selected ? (
          <div className="flex items-center justify-center h-full text-gray-500">
            <div className="text-center">

        ) : (

// ============ Dashboard View ============
function localDateStr(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function timeStr(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function daysBetween(dateStrA, dateStrB) {
  const a = new Date(dateStrA + 'T00:00:00');
  const b = new Date(dateStrB + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function calcNoCheckInStreak(t, today) {
  const dates = new Set();
  const progress = t.progress || {};
  Object.values(progress).forEach(day => {
    Object.values(day.items || {}).forEach(item => {
      if (item.checked && item.checkedAt) dates.add(localDateStr(item.checkedAt));
    });
    if (day.completed && day.completedAt) dates.add(localDateStr(day.completedAt));
  });

  if (dates.size === 0) {
    if (t.startDate) {
      const days = Math.max(1, daysBetween(t.startDate, today));
      return { days, label: `连续${days}天未打卡` };
    }
    return { days: 9999, label: '从未打卡' };
  }

  const sorted = [...dates].sort();
  const lastDate = sorted[sorted.length - 1];
  if (lastDate >= today) return { days: 0, label: '今日已打卡' };
  const days = daysBetween(lastDate, today);
  return { days, label: `连续${days}天未打卡` };
}

function DashboardView({ trainees, stores }) {
  const [filterStore, setFilterStore] = useState('');
  const [filterRoute, setFilterRoute] = useState('');
  const [sortBy, setSortBy] = useState('progress');
  const [expandedRow, setExpandedRow] = useState(null);

  const filtered = useMemo(() => {
    let list = trainees.filter(t => {
      if (filterStore && t.store !== filterStore) return false;
      if (filterRoute && t.route !== filterRoute) return false;
      return true;
    });
    list = list.map(t => ({ ...t, _progress: calcProgress(t), _currentDay: getCurrentDay(t) }));
    if (sortBy === 'progress') list.sort((a, b) => b._progress.percent - a._progress.percent);
    else if (sortBy === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
    else if (sortBy === 'store') list.sort((a, b) => a.store.localeCompare(b.store));
    else if (sortBy === 'certs') list.sort((a, b) => countCerts(b) - countCerts(a));
    return list;
  }, [trainees, filterStore, filterRoute, sortBy]);

  const stats = useMemo(() => {
    const total = trainees.length;
    const inProgress = trainees.filter(t => {
      const p = calcProgress(t);
      return p.completed > 0 && p.percent < 100;
    }).length;
    const completed = trainees.filter(t => calcProgress(t).percent === 100).length;
    const notStarted = trainees.filter(t => calcProgress(t).completed === 0).length;
    const avgProgress = total > 0 ? Math.round(trainees.reduce((sum, t) => sum + calcProgress(t).percent, 0) / total) : 0;
    return { total, inProgress, completed, notStarted, avgProgress };
  }, [trainees]);

  // Group by store
  const storeStats = useMemo(() => {
    const map = {};
    trainees.forEach(t => {
      if (!map[t.store]) map[t.store] = { store: t.store, total: 0, completed: 0, inProgress: 0, sumPercent: 0 };
      const p = calcProgress(t);
      map[t.store].total++;
      map[t.store].sumPercent += p.percent;
      if (p.percent === 100) map[t.store].completed++;
      else if (p.completed > 0) map[t.store].inProgress++;
    });
    return Object.values(map).map(s => ({ ...s, avgPercent: Math.round(s.sumPercent / s.total) }));
  }, [trainees]);

  // Phase distribution
  const phaseDist = useMemo(() => {
    const dist = {};
    trainees.forEach(t => {
      const cd = getCurrentDay(t);
      const phase = cd ? cd.phaseName : '已完成';
      dist[phase] = (dist[phase] || 0) + 1;
    });
    return Object.entries(dist).sort((a, b) => {
      const order = ['第一阶段', '第二阶段', '第三阶段', '第四阶段', '已完成'];
      return order.indexOf(a[0]) - order.indexOf(b[0]);
    });
  }, [trainees]);

  // Today's check-in stats
  const todayStats = useMemo(() => {
    const today = localDateStr(new Date().toISOString());
    const checkedList = [];
    const uncheckedList = [];
    trainees.forEach(t => {
      let count = 0;
      let lastTime = '';
      let completedDay = false;
      const progress = t.progress || {};
      Object.values(progress).forEach(day => {
        Object.values(day.items || {}).forEach(item => {
          if (item.checked && item.checkedAt && localDateStr(item.checkedAt) === today) {
            count++;
            if (item.checkedAt > lastTime) lastTime = item.checkedAt;
          }
        });
        // Confirming completion of a training day also counts
        if (day.completed && day.completedAt && localDateStr(day.completedAt) === today) {
          completedDay = true;
          if (day.completedAt > lastTime) lastTime = day.completedAt;
        }
      });
      const entry = { id: t.id, name: t.name, store: t.store, count, lastTime, completedDay };
      if (count > 0 || completedDay) checkedList.push(entry);
      else {
        const streak = calcNoCheckInStreak(t, today);
        uncheckedList.push({ ...entry, streakDays: streak.days, streakLabel: streak.label });
      }
    });
    checkedList.sort((a, b) => b.count - a.count);
    uncheckedList.sort((a, b) => b.streakDays - a.streakDays);
    return { checkedList, uncheckedList, today };
  }, [trainees]);

  return (
    <div className="overflow-y-auto scrollbar-thin h-[calc(100vh-60px)]">
      <div className="max-w-6xl mx-auto p-6">
        {/* Stats Cards */}
        <div className="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6">
          <div className="bg-gradient-to-br from-indigo-600/20 to-indigo-700/5 border border-indigo-500/20 rounded-xl p-4">
            <div className="text-xs text-indigo-300/70">学员总数</div>
            <div className="text-3xl font-bold text-white mt-1">{stats.total}</div>
          </div>
          <div className="bg-gradient-to-br from-emerald-500/20 to-emerald-600/5 border border-emerald-500/20 rounded-xl p-4">
            <div className="text-xs text-emerald-300/70">今日已打卡</div>
            <div className="text-3xl font-bold text-emerald-400 mt-1">
              {todayStats.checkedList.length}
              <span className="text-sm text-gray-500 font-normal">/{stats.total}</span>
            </div>
          </div>
          <div className="bg-gradient-to-br from-rose-500/15 to-rose-600/5 border border-rose-500/20 rounded-xl p-4">
            <div className="text-xs text-rose-300/70">今日未打卡</div>
            <div className="text-3xl font-bold text-rose-400 mt-1">
              {todayStats.uncheckedList.length}
              <span className="text-sm text-gray-500 font-normal">/{stats.total}</span>
            </div>
          </div>
          <div className="bg-gradient-to-br from-amber-500/20 to-amber-600/5 border border-amber-500/20 rounded-xl p-4">
            <div className="text-xs text-amber-300/70">带训中</div>
            <div className="text-3xl font-bold text-amber-400 mt-1">{stats.inProgress}</div>
          </div>
          <div className="bg-gradient-to-br from-gray-600/20 to-gray-700/5 border border-gray-500/20 rounded-xl p-4">
            <div className="text-xs text-gray-400">未开始</div>
            <div className="text-3xl font-bold text-gray-300 mt-1">{stats.notStarted}</div>
          </div>
          <div className="bg-gradient-to-br from-purple-600/20 to-purple-700/5 border border-purple-500/20 rounded-xl p-4">
            <div className="text-xs text-purple-300/70">平均进度</div>
            <div className="text-3xl font-bold text-purple-400 mt-1">{stats.avgProgress}%</div>
          </div>
        </div>

        {/* Today Check-in Panel */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-5 mb-6">
          <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2">

                    <div className="flex items-center gap-2 min-w-0">

          <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-5">

              <Icon.Store/> 各门店带训进度

                    <div className="h-2.5 bg-gray-800 rounded-full overflow-hidden">
                      <div className="h-full bg-gradient-to-r from-indigo-500 to-indigo-400 progress-bar-fill rounded-full" style={{width: `${s.avgPercent}%`}}></div>
                    </div>

          {/* Phase Distribution */}
          <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-5">
            <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2">
              <Icon.TrendUp/> 带训阶段分布
            </h3>
            {phaseDist.length === 0 ? (
              <div className="text-center text-gray-500 text-sm py-6">暂无数据</div>
            ) : (
              <div className="space-y-2">
                {phaseDist.map(([phase, count]) => {
                  const max = Math.max(...phaseDist.map(p => p[1]));
                  const width = (count / max) * 100;
                  const colors = {
                    '第一阶段': 'bg-blue-500',
                    '第二阶段': 'bg-purple-500',
                    '第三阶段': 'bg-amber-500',
                    '第四阶段': 'bg-red-500',
                    '已完成': 'bg-emerald-500'
                  };
                  return (
                    <div key={phase} className="flex items-center gap-3">
                      <span className="text-xs text-gray-400 w-16 text-right">{phase}</span>
                      <div className="flex-1 h-6 bg-gray-800 rounded-md overflow-hidden relative">
                        <div className={`h-full ${colors[phase] || 'bg-gray-500'} progress-bar-fill rounded-md flex items-center justify-end pr-2`} style={{width: `${Math.max(width, 8)}%`}}>
                          <span className="text-xs font-bold text-white">{count}</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>

        {/* Detailed Table */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl overflow-hidden">
          <div className="flex items-center justify-between p-4 border-b border-gray-800">
            <h3 className="text-sm font-medium text-gray-300 flex items-center gap-2">
              <Icon.Dashboard/> 学员带训明细
            </h3>
            <div className="flex items-center gap-2">
              <select value={filterStore} onChange={e=>setFilterStore(e.target.value)}
                className="bg-gray-800 border border-gray-700 rounded-lg px-2 py-1.5 text-xs text-gray-300">
                <option value="">全部门店</option>
                {stores.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <select value={filterRoute} onChange={e=>setFilterRoute(e.target.value)}
                className="bg-gray-800 border border-gray-700 rounded-lg px-2 py-1.5 text-xs text-gray-300">
                <option value="">全部路线</option>
                {TRAINING_DATA.routes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
              </select>
              <select value={sortBy} onChange={e=>setSortBy(e.target.value)}
                className="bg-gray-800 border border-gray-700 rounded-lg px-2 py-1.5 text-xs text-gray-300">
                <option value="progress">按进度排序</option>
                <option value="name">按姓名排序</option>
                <option value="store">按门店排序</option>
                <option value="certs">按证书数排序</option>
              </select>
            </div>
          </div>

          <div className="overflow-x-auto scrollbar-thin">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs text-gray-500 border-b border-gray-800">
                  <th className="text-left px-4 py-3 font-medium">学员</th>
                  <th className="text-left px-4 py-3 font-medium">门店</th>
                  <th className="text-left px-4 py-3 font-medium">路线</th>
                  <th className="text-left px-4 py-3 font-medium">师傅</th>
                  <th className="text-left px-4 py-3 font-medium">证书数</th>
                  <th className="text-left px-4 py-3 font-medium">当前阶段</th>
                  <th className="text-left px-4 py-3 font-medium">进度</th>
                  <th className="text-left px-4 py-3 font-medium">完成/总天数</th>
                  <th className="text-left px-4 py-3 font-medium">最近完成</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr>
                    <td colSpan="9" className="text-center text-gray-500 py-8">暂无数据</td>
                  </tr>
                ) : filtered.map(t => {
                  const route = TRAINING_DATA.routes.find(r => r.id === t.route);
                  const prog = t._progress;
                  const cd = t._currentDay;
                  const allDays = getAllDays(t.route, t.subRoute).filter(d => d.items.length > 0);
                  // Find last completed day
                  let lastCompleted = null;
                  for (const d of allDays) {
                    const dp = t.progress?.[d.key];
                    if (dp?.completed) lastCompleted = dp;
                  }
                  const statusColor = prog.percent === 100 ? 'text-emerald-400' : prog.completed > 0 ? 'text-amber-400' : 'text-gray-500';
                  return (
                    <React.Fragment key={t.id}>
                      <tr className="border-b border-gray-800/50 hover:bg-gray-800/30 transition cursor-pointer" onClick={() => setExpandedRow(expandedRow === t.id ? null : t.id)}>
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-2">
                            <span className="text-white font-medium">{t.name}</span>
                            {expandedRow === t.id ? <Icon.ChevronDown width={12} height={12} className="text-gray-500"/> : <Icon.ChevronRight width={12} height={12} className="text-gray-500"/>}
                          </div>
                        </td>
                        <td className="px-4 py-3 text-gray-400">{t.store}</td>
                        <td className="px-4 py-3"><span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400">{getRouteName(t.route, t.subRoute)}</span></td>
                        <td className="px-4 py-3 text-gray-400">{t.master || '-'}</td>
                        <td className="px-4 py-3">
                          <span className="text-xs px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30">{countCerts(t)}</span>
                        </td>
                        <td className="px-4 py-3 text-gray-400 text-xs">
                          {cd ? `${cd.monthName} · ${cd.phaseName} · 第${cd.day}天` : '已完成'}
                        </td>
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-2">
                            <div className="w-24 h-1.5 bg-gray-800 rounded-full overflow-hidden">
                              <div className={`h-full progress-bar-fill rounded-full ${prog.percent === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}`} style={{width: `${prog.percent}%`}}></div>
                            </div>
                            <span className={`text-xs font-medium ${statusColor}`}>{prog.percent}%</span>
                          </div>
                        </td>
                        <td className="px-4 py-3 text-gray-400 tabular-nums text-xs">{prog.completed}/{prog.total}</td>
                        <td className="px-4 py-3 text-gray-500 text-xs">
                          {lastCompleted ? new Date(lastCompleted.completedAt).toLocaleDateString('zh-CN') : '-'}
                        </td>
                      </tr>
                      {expandedRow === t.id && (
                        <tr className="bg-gray-900/40">
                          <td colSpan="9" className="px-4 py-4">
                            <div className="space-y-1.5">
                              {allDays.map(d => {
                                const dp = t.progress?.[d.key];
                                const isDone = dp?.completed;
                                const isUnlocked = isDayUnlocked(t, d.key);
                                return (
                                  <div key={d.key} className="flex items-center gap-3 text-xs">
                                    <span className={`w-5 h-5 rounded flex items-center justify-center ${isDone ? 'bg-emerald-500/20 text-emerald-400' : isUnlocked ? 'bg-gray-800 text-gray-300' : 'bg-gray-800/50 text-gray-600'}`}>
                                      {isDone ? <Icon.Check width={11} height={11}/> : isUnlocked ? d.day : <Icon.Lock width={10} height={10}/>}
                                    </span>
                                    <span className="text-gray-400 w-20">{d.monthName}</span>
                                    <span className="text-gray-400 w-16">{d.phaseName}</span>
                                    <span className="text-gray-300 w-16">第{d.day}天</span>
                                    {d.shift && <span className={`px-1.5 py-0.5 rounded text-xs ${getShiftStyle(d.shift).bg} ${getShiftStyle(d.shift).text}`}>{d.shift}</span>}
                                    <span className="text-gray-500 flex-1 truncate">{d.items.map(i => i.content).join(' / ')}</span>
                                    {dp?.completedAt && <span className="text-gray-600">{new Date(dp.completedAt).toLocaleDateString('zh-CN')}</span>}
                                  </div>
                                );
                              })}
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============ Region Manager Dashboard ============
function RegionDashboardView({ trainees, stores, config }) {
  const today = localDateStr(new Date().toISOString());
  const [filterArea, setFilterArea] = useState('');
  const [showAllIncomplete, setShowAllIncomplete] = useState(false);

  const visibleTrainees = useMemo(() => {
    if (!filterArea) return trainees;
    return trainees.filter(t => (t.area || '000') === filterArea);
  }, [trainees, filterArea]);

  const stats = useMemo(() => {
    const total = visibleTrainees.length;
    const progressList = visibleTrainees.map(t => calcProgress(t));
    const inProgress = progressList.filter(p => p.percent > 0 && p.percent < 100).length;
    const completed = progressList.filter(p => p.percent === 100).length;
    const notStarted = progressList.filter(p => p.percent === 0).length;
    const avgProgress = total > 0 ? Math.round(progressList.reduce((s, p) => s + p.percent, 0) / total) : 0;
    let checkedToday = 0;
    visibleTrainees.forEach(t => {
      const progress = t.progress || {};
      let hasToday = false;
      Object.values(progress).forEach(day => {
        Object.values(day.items || {}).forEach(item => {
          if (item.checked && item.checkedAt && localDateStr(item.checkedAt) === today) hasToday = true;
        });
        if (day.completed && day.completedAt && localDateStr(day.completedAt) === today) hasToday = true;
      });
      if (hasToday) checkedToday++;
    });
    return { total, inProgress, completed, notStarted, avgProgress, checkedToday, uncheckedToday: total - checkedToday, totalCerts: visibleTrainees.reduce((s, t) => s + countCerts(t), 0) };
  }, [visibleTrainees, today]);

  const areaStats = useMemo(() => {
    return config.filter(c => c.role === 'area').map(c => {
      const list = trainees.filter(t => (t.area || '000') === c.id);
      const progressList = list.map(t => calcProgress(t));
      const total = list.length;
      const avg = total > 0 ? Math.round(progressList.reduce((s, p) => s + p.percent, 0) / total) : 0;
      const completed = progressList.filter(p => p.percent === 100).length;
      const inProgress = progressList.filter(p => p.percent > 0 && p.percent < 100).length;
      return { ...c, total, avg, completed, inProgress };
    });
  }, [trainees, config]);

  const incompleteList = useMemo(() => {
    return visibleTrainees
      .filter(t => calcProgress(t).percent < 100)
      .map(t => ({ ...t, _progress: calcProgress(t), _streak: calcNoCheckInStreak(t, today) }))
      .sort((a, b) => a._progress.percent - b._progress.percent);
  }, [visibleTrainees, today]);

  const storeRanking = useMemo(() => {
    const map = {};
    visibleTrainees.forEach(t => { if (t.store) map[t.store] = (map[t.store] || 0) + 1; });
    return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 10);
  }, [visibleTrainees]);

  const phaseDist = useMemo(() => {
    const phases = { '第一阶段': 0, '第二阶段': 0, '第三阶段': 0, '第四阶段': 0, '已完成': 0 };
    visibleTrainees.forEach(t => {
      const prog = calcProgress(t);
      if (prog.percent === 100) { phases['已完成']++; return; }
      const cd = getCurrentDay(t);
      if (cd && phases[cd.phaseName] !== undefined) phases[cd.phaseName]++;
      else phases['已完成']++;
    });
    return Object.entries(phases).filter(([k, v]) => v > 0);
  }, [visibleTrainees]);

  const todayStats = useMemo(() => {
    const checkedList = [];
    const uncheckedList = [];
    visibleTrainees.forEach(t => {
      let hasToday = false;
      let lastTime = '';
      const progress = t.progress || {};
      Object.values(progress).forEach(day => {
        Object.values(day.items || {}).forEach(item => {
          if (item.checked && item.checkedAt && localDateStr(item.checkedAt) === today) {
            hasToday = true;
            if (item.checkedAt > lastTime) lastTime = item.checkedAt;
          }
        });
        if (day.completed && day.completedAt && localDateStr(day.completedAt) === today) {
          hasToday = true;
          if (day.completedAt > lastTime) lastTime = day.completedAt;
        }
      });
      const areaCfg = config.find(c => c.id === (t.area || '000'));
      const entry = { ...t, areaName: areaCfg?.name?.replace('区域带训追踪系统', '') || (t.area || '000'), lastTime };
      if (hasToday) checkedList.push(entry);
      else {
        const streak = calcNoCheckInStreak(t, today);
        uncheckedList.push({ ...entry, streakDays: streak.days, streakLabel: streak.label });
      }
    });
    checkedList.sort((a, b) => (b.lastTime || '').localeCompare(a.lastTime || ''));
    uncheckedList.sort((a, b) => b.streakDays - a.streakDays);
    return { checkedList, uncheckedList };
  }, [visibleTrainees, today, config]);

  const certRanking = useMemo(() => {
    return visibleTrainees
      .map(t => ({ ...t, _certs: countCerts(t), _progress: calcProgress(t) }))
      .sort((a, b) => b._certs - a._certs)
      .slice(0, 10);
  }, [visibleTrainees]);

  const conclusion = useMemo(() => {
    if (areaStats.length === 0) return '暂无区域数据';
    const activeAreas = areaStats.filter(a => a.total > 0);
    if (activeAreas.length === 0) return '暂无学员数据';
    const lowestArea = [...activeAreas].sort((a, b) => a.avg - b.avg)[0];
    const worstStreak = todayStats.uncheckedList[0];
    const parts = [];
    parts.push(`当前共 ${stats.total} 名学员，平均进度 ${stats.avgProgress}%。`);
    if (lowestArea) parts.push(`${lowestArea.name.replace('区域带训追踪系统', '')}平均进度最低（${lowestArea.avg}%），需重点关注。`);
    if (worstStreak) parts.push(`今日有 ${todayStats.uncheckedList.length} 人未打卡，${worstStreak.name}已连续${worstStreak.streakDays}天未打卡。`);
    return parts.join('');
  }, [stats, areaStats, todayStats]);

  const StatCard = ({ label, value, sub, color = 'indigo' }) => {
    const colorClass = {
      white: 'text-white',
      emerald: 'text-emerald-400',
      amber: 'text-amber-400',
      gray: 'text-gray-400',
      indigo: 'text-indigo-400',
      sky: 'text-sky-400'
    }[color] || 'text-indigo-400';
    return (
      <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
        <p className="text-xs text-gray-500 mb-1">{label}</p>
        <p className={`text-2xl font-bold ${colorClass}`}>{value}</p>
        {sub && <p className="text-xs text-gray-600 mt-1">{sub}</p>}
      </div>
    );
  };

  return (
    <div className="p-5 space-y-5 overflow-y-auto h-[calc(100vh-60px)]">
      {/* Filter + Conclusion */}
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-gray-900/50 border border-gray-800 rounded-xl p-4">
        <div>
          <h2 className="text-base font-bold text-white">大区汇总看板</h2>
          <p className="text-xs text-gray-500 mt-1">{conclusion}</p>
        </div>
        <div className="flex items-center gap-2">
          <span className="text-xs text-gray-500">数据范围</span>
          <select value={filterArea} onChange={e => setFilterArea(e.target.value)} className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-300">
            <option value="">全部区域</option>
            {config.filter(c => c.role === 'area').map(c => <option key={c.id} value={c.id}>{c.name.replace('区域带训追踪系统', '')}</option>)}
          </select>
        </div>
      </div>

      {/* Top Stats */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <StatCard label="学员总数" value={stats.total} color="white"/>
        <StatCard label="今日已打卡" value={stats.checkedToday} sub={`未打卡 ${stats.uncheckedToday}`} color="emerald"/>
        <StatCard label="带训中" value={stats.inProgress} color="amber"/>
        <StatCard label="已完成" value={stats.completed} color="emerald"/>
        <StatCard label="未开始" value={stats.notStarted} color="gray"/>
        <StatCard label="平均进度" value={`${stats.avgProgress}%`} color="indigo"/>
        <StatCard label="覆盖区域" value={areaStats.filter(a => a.total > 0).length} sub={`共 ${areaStats.length} 个区域`} color="sky"/>
        <StatCard label="总证书数" value={stats.totalCerts} color="amber"/>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        {/* Area Progress */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
          <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2"><Icon.TrendUp/> 各小区进度对比</h3>
          <div className="space-y-3">
            {areaStats.filter(a => a.total > 0).length === 0 ? (
              <p className="text-sm text-gray-500 text-center py-4">暂无区域数据</p>
            ) : areaStats.filter(a => a.total > 0).map(a => (
              <div key={a.id} className="flex items-center gap-3">
                <span className="text-xs text-gray-400 w-24 truncate" title={a.name}>{a.name.replace('区域带训追踪系统', '')}</span>
                <div className="flex-1 h-6 bg-gray-800 rounded-md overflow-hidden relative">
                  <div className="h-full bg-indigo-500 progress-bar-fill rounded-md flex items-center justify-end pr-2" style={{width: `${Math.max(a.avg, 5)}%`}}>
                    <span className="text-xs font-bold text-white">{a.avg}%</span>
                  </div>
                </div>
                <span className="text-xs text-gray-500 w-16 text-right">{a.completed}/{a.total}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Phase Distribution */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
          <h3 className="text-sm font-medium text-gray-300 mb-4 flex items-center gap-2"><Icon.Dashboard/> 带训阶段分布</h3>
          <div className="space-y-3">
            {phaseDist.length === 0 ? (
              <p className="text-sm text-gray-500 text-center py-4">暂无数据</p>
            ) : phaseDist.map(([phase, count]) => {
              const max = Math.max(...phaseDist.map(p => p[1]));
              const width = (count / max) * 100;
              const colors = { '第一阶段': 'bg-blue-500', '第二阶段': 'bg-purple-500', '第三阶段': 'bg-amber-500', '第四阶段': 'bg-red-500', '已完成': 'bg-emerald-500' };
              return (
                <div key={phase} className="flex items-center gap-3">
                  <span className="text-xs text-gray-400 w-16 text-right">{phase}</span>
                  <div className="flex-1 h-6 bg-gray-800 rounded-md overflow-hidden relative">
                    <div className={`h-full ${colors[phase] || 'bg-gray-500'} progress-bar-fill rounded-md flex items-center justify-end pr-2`} style={{width: `${Math.max(width, 8)}%`}}>
                      <span className="text-xs font-bold text-white">{count}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Incomplete List */}
        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 lg:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-sm font-medium text-gray-300 flex items-center gap-2"><Icon.User/> 未完成人员汇总</h3>
            <button onClick={() => setShowAllIncomplete(!showAllIncomplete)} className="text-xs text-indigo-400 hover:text-indigo-300">
              {showAllIncomplete ? '收起' : `展开全部 (${incompleteList.length})`}
            </button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs text-gray-500 border-b border-gray-800">
                  <th className="text-left px-3 py-2 font-medium">区域</th>
                  <th className="text-left px-3 py-2 font-medium">学员</th>
                  <th className="text-left px-3 py-2 font-medium">门店</th>
                  <th className="text-left px-3 py-2 font-medium">当前阶段</th>
                  <th className="text-left px-3 py-2 font-medium">进度</th>
                  <th className="text-left px-3 py-2 font-medium">未打卡</th>
                </tr>
              </thead>
              <tbody>
                {(showAllIncomplete ? incompleteList : incompleteList.slice(0, 10)).map(t => {
                  const areaCfg = config.find(c => c.id === (t.area || '000'));
                  const cd = getCurrentDay(t);
                  return (
                    <tr key={t.id} className="border-b border-gray-800/50">
                      <td className="px-3 py-2 text-xs text-gray-400">{areaCfg?.name?.replace('区域带训追踪系统', '') || t.area || '000'}</td>

}

// ============ Sync Modal (Real-time) ============
function SyncModal({ data, syncStatus, lastSyncTime, setLastSyncTime, onClose, onImport }) {
  const [status, setStatus] = useState({ type: '', msg: '' });
  const [busy, setBusy] = useState(false);
  const fileInputRef = useRef(null);

  const showStatus = (type, msg) => {
    setStatus({ type, msg });
    setTimeout(() => setStatus({ type: '', msg: '' }), 3000);
  };

  // Export to file (backup)
  const handleExport = () => {
    try {
      const jsonStr = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const date = new Date().toISOString().slice(0, 10);
      a.download = `带训数据_${date}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showStatus('success', '数据已导出为文件');
    } catch(e) {
      showStatus('error', '导出失败：' + e.message);
    }
  };

  // Import from file (backup)
  const handleFileImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setBusy(true);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.trainees || !Array.isArray(parsed.trainees)) {
          showStatus('error', '文件格式不正确');
          setBusy(false);
          return;
        }
        onImport(parsed);
        showStatus('success', `导入成功！已导入 ${parsed.trainees.length} 名学员数据`);
      } catch(err) {
        showStatus('error', '文件解析失败：' + err.message);
      }
      setBusy(false);
      e.target.value = '';
    };
    reader.onerror = () => {
      showStatus('error', '文件读取失败');
      setBusy(false);
    };
    reader.readAsText(file);
  };

  // Force push to GitHub
  const handleForceSync = async () => {
    setBusy(true);
    try {
      const ts = Date.now();
      const ok = await ghForcePush(data, ts);
      if (ok) {
        showStatus('success', '数据已推送到云端');
        setLastSyncTime(ts);
      } else {
        showStatus('error', '推送失败，请稍后重试');
      }
    } catch(e) {
      showStatus('error', '推送失败：' + e.message);
    }
    setBusy(false);
  };

  // Force pull from GitHub
  const handleForcePull = async () => {
    setBusy(true);
    try {
      const remoteData = await ghFetchData();
      if (remoteData && remoteData.trainees) {
        showStatus('success', `已从云端拉取 ${remoteData.trainees.length} 名学员数据`);
      } else {
        showStatus('success', '当前已是最新数据，无需更新');
      }
    } catch(e) {
      showStatus('error', '拉取失败：' + e.message);
    }
    setBusy(false);
  };

  const statusConfig = {
    connected: { color: 'bg-emerald-400', text: '已连接', textColor: 'text-emerald-300', bgColor: 'bg-emerald-500/10', borderColor: 'border-emerald-500/20' },
    connecting: { color: 'bg-amber-400', text: '连接中...', textColor: 'text-amber-300', bgColor: 'bg-amber-500/10', borderColor: 'border-amber-500/20' },
    error: { color: 'bg-red-400', text: '连接失败', textColor: 'text-red-300', bgColor: 'bg-red-500/10', borderColor: 'border-red-500/20' },
  };
  const sc = statusConfig[syncStatus] || statusConfig.connecting;

  const lastSyncText = lastSyncTime
    ? new Date(lastSyncTime).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    : '等待同步...';

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className="bg-gray-900 border border-gray-700 rounded-2xl w-[480px] max-w-[92vw] max-h-[88vh] overflow-y-auto scrollbar-thin shadow-2xl fade-in">
        {/* Header */}
        <div className="flex items-center justify-between px-5 py-4 border-b border-gray-800">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl bg-indigo-500/15 flex items-center justify-center">
              <Icon.Cloud width={18} height={18} className="text-indigo-400"/>
            </div>
            <div>
              <h3 className="text-base font-bold text-white">实时数据同步</h3>
              <p className="text-xs text-gray-500">所有打开此网页的用户自动同步</p>
            </div>
          </div>
          <button onClick={onClose} className="text-gray-500 hover:text-white transition p-1">
            <Icon.Close width={18} height={18}/>
          </button>
        </div>

        {/* Status */}
        {status.msg && (
          <div className={`mx-5 mt-3 px-4 py-2.5 rounded-lg text-sm flex items-center gap-2 ${
            status.type === 'success' ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-red-500/10 text-red-300 border border-red-500/20'
          }`}>
            {status.type === 'success' ? <Icon.Check width={14} height={14}/> : <Icon.Close width={14} height={14}/>}
            {status.msg}
          </div>
        )}

        <div className="p-5 space-y-5">
          {/* Sync Status Card */}
          <div className={`rounded-xl p-4 border ${sc.bgColor} ${sc.borderColor}`}>
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2.5">
                <span className={`w-3 h-3 rounded-full ${sc.color} ${syncStatus === 'connecting' ? 'animate-pulse' : ''}`}></span>
                <span className={`text-sm font-medium ${sc.textColor}`}>{sc.text}</span>
              </div>
              <span className="text-xs text-gray-500">{data.trainees.length} 名学员</span>
            </div>
            <div className="text-xs text-gray-500">
              上次同步：{lastSyncText}
            </div>
          </div>

          {/* Feature List */}
          <div className="space-y-2.5">
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>店长打勾后，数据<span className="text-emerald-300">自动上传</span>到云端</span>
            </div>
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>老大这边<span className="text-emerald-300">自动刷新</span>看到最新数据</span>
            </div>
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>无需手动操作，打开网页即<span className="text-emerald-300">自动同步</span></span>
            </div>
            <div className="flex items-start gap-2.5 text-xs text-gray-400">
              <Icon.Check width={14} height={14} className="text-emerald-400 mt-0.5 flex-shrink-0"/>
              <span>每个学员数据<span className="text-emerald-300">独立合并</span>，不会互相覆盖</span>
            </div>
          </div>

          {/* Force Sync Buttons */}
          <div className="flex gap-2">
            <button
              onClick={handleForcePull}
              disabled={busy}
              className="flex-1 py-2.5 rounded-lg text-sm font-medium text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 disabled:opacity-50 transition flex items-center justify-center gap-2"
            >
              <Icon.Download width={14} height={14}/> 从云端拉取
            </button>
            <button
              onClick={handleForceSync}
              disabled={busy || syncStatus !== 'connected'}
              className="flex-1 py-2.5 rounded-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 transition flex items-center justify-center gap-2"
            >
              <Icon.RefreshCw width={14} height={14}/> 推送到云端
            </button>
          </div>

          {/* Divider */}
          <div className="border-t border-gray-800"></div>

          {/* File Backup */}
          <div>
            <div className="flex items-center gap-2 mb-2">
              <Icon.Download width={14} height={14} className="text-amber-400"/>
              <h4 className="text-sm font-semibold text-white">文件备份</h4>
            </div>
            <p className="text-xs text-gray-500 mb-3">导出数据文件作为备份，或从备份恢复</p>
            <div className="flex gap-2">
              <button
                onClick={handleExport}
                className="flex-1 py-2.5 rounded-lg text-xs font-medium text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 transition flex items-center justify-center gap-1.5"
              >
                <Icon.Download width={12} height={12}/> 导出备份
              </button>
              <button
                onClick={() => fileInputRef.current?.click()}
                disabled={busy}
                className="flex-1 py-2.5 rounded-lg text-xs font-medium text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 transition flex items-center justify-center gap-1.5"
              >
                <Icon.Upload width={12} height={12}/> 导入恢复
              </button>
              <input
                ref={fileInputRef}
                type="file"
                accept=".json,application/json"
                onChange={handleFileImport}
                className="hidden"
              />
            </div>
          </div>

          {/* Info */}
          <div className="bg-gray-800/50 rounded-lg p-3 text-xs text-gray-500 leading-relaxed">
            <p className="text-gray-400 font-medium mb-1">使用说明</p>
            <p>1. 所有打开此网页的用户自动进入同一个同步房间</p>
            <p>2. 任何人修改数据后，自动推送云端，其他人2秒内收到</p>

            <p>4. 如果同步不及时，点击「从云端拉取」手动刷新</p>

  );
}
